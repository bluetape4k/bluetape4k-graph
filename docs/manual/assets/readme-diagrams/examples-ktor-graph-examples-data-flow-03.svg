<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Ktor Graph Data Flow</title>
  <desc id="desc">Reset the demo graph, then query count and shortest path</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5f6f82"/>
    </marker>
    <style>
      .canvas { fill: #fbfcfe; }
      .frame { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 30px; fill: #243142; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #5c6b7d; }
      .box-title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 18px; fill: #233044; }
      .box-text { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 13px; fill: #435266; }
      .label { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 12px; fill: #4f5e70; }
      .edge { fill: none; stroke: #5f6f82; stroke-width: 2.4; marker-end: url(#arrow); }
      .pill { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1; }
    </style>
  </defs>
  <rect class="canvas" width="1120" height="520"/>
  <rect class="frame" x="24" y="24" width="1072" height="472" rx="18"/>
  <text class="title" x="560" y="68" text-anchor="middle">Ktor Graph Data Flow</text>
  <text class="subtitle" x="560" y="94" text-anchor="middle">Reset the demo graph, then query count and shortest path</text>

      <path class="edge" d="M 300 225 H 365 V 225 H 430"/>
      <rect class="pill" x="336" y="201" width="53" height="22" rx="11"/>
      <text class="label" x="362.5" y="216" text-anchor="middle">write</text>

      <path class="edge" d="M 650 225 H 720 V 152.5 H 790"/>
      <rect class="pill" x="698.5" y="164.75" width="48" height="22" rx="11"/>
      <text class="label" x="722.5" y="179.75" text-anchor="middle">read</text>

      <path class="edge" d="M 650 225 H 720 V 317.5 H 790"/>
      <rect class="pill" x="685.5" y="247.25" width="74" height="22" rx="11"/>
      <text class="label" x="722.5" y="262.25" text-anchor="middle">traverse</text>

      <g>
        <rect x="70" y="150" width="230" height="150" rx="14" fill="#e8f4ff" stroke="#98c1df" stroke-width="2"/>
        <text class="box-title" x="185" y="184" text-anchor="middle">POST /demo/reset</text>
        <text class="box-text" x="185" y="212" text-anchor="middle">drop + create graph</text>
<text class="box-text" x="185" y="233" text-anchor="middle">Seoul -&gt; Daejeon -&gt; Busan</text>
      </g>

      <g>
        <rect x="430" y="165" width="220" height="120" rx="14" fill="#eaf7ef" stroke="#9ccdad" stroke-width="2"/>
        <text class="box-title" x="540" y="199" text-anchor="middle">Graph Backend</text>
        <text class="box-text" x="540" y="227" text-anchor="middle">City vertices</text>
<text class="box-text" x="540" y="248" text-anchor="middle">ROUTE_TO edges</text>
      </g>

      <g>
        <rect x="790" y="105" width="230" height="95" rx="14" fill="#fff4d8" stroke="#e3c46f" stroke-width="2"/>
        <text class="box-title" x="905" y="139" text-anchor="middle">GET /cities/count</text>
        <text class="box-text" x="905" y="167" text-anchor="middle">count City vertices</text>
      </g>

      <g>
        <rect x="790" y="265" width="230" height="105" rx="14" fill="#fdecef" stroke="#d8a6b0" stroke-width="2"/>
        <text class="box-title" x="905" y="299" text-anchor="middle">GET /cities/path</text>
        <text class="box-text" x="905" y="327" text-anchor="middle">shortestPath</text>
<text class="box-text" x="905" y="348" text-anchor="middle">Seoul -&gt; Busan</text>
      </g>
</svg>

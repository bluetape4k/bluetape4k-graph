<text class="title" x="56" y="72">Graph Operations: Sync vs Virtual Thread</text><text class="subtitle" x="58" y="104" font-size="18">TinkerGraph in-memory benchmark</text><rect x="56" y="116" width="18" height="18" rx="5" fill="#8ecae6"/><text class="legend" x="82" y="131">Sync</text><rect x="146" y="116" width="18" height="18" rx="5" fill="#ffb3c7"/><text class="legend" x="172" y="131">VirtualThread</text><text class="label" x="56" y="173">findById</text><rect x="285" y="142" width="37.949822742794595" height="18" rx="7" fill="#8ecae6"/><text class="value" x="332.9498227427946" y="157" font-size="16">1.76 us/op</text><rect x="285" y="166" width="173.8827202464223" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="468.8827202464223" y="181" font-size="16">8.05 us/op</text><text class="label" x="56" y="247">findByLabel</text><rect x="285" y="216" width="53.643520771242606" height="18" rx="7" fill="#8ecae6"/><text class="value" x="348.6435207712426" y="231" font-size="16">2.48 us/op</text><rect x="285" y="240" width="187.35296449642442" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="482.3529644964244" y="255" font-size="16">8.68 us/op</text><text class="label" x="56" y="321">neighbors</text><rect x="285" y="290" width="64.4369857151546" height="18" rx="7" fill="#8ecae6"/><text class="value" x="359.4369857151546" y="305" font-size="16">2.98 us/op</text><rect x="285" y="314" width="228.71352216149523" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="523.7135221614952" y="329" font-size="16">10.6 us/op</text><text class="label" x="56" y="395">bfs</text><rect x="285" y="364" width="91.01049640706594" height="18" rx="7" fill="#8ecae6"/><text class="value" x="386.01049640706594" y="379" font-size="16">4.22 us/op</text><rect x="285" y="388" width="271.7362734279284" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="566.7362734279284" y="403" font-size="16">12.6 us/op</text><text class="label" x="56" y="469">dfs</text><rect x="285" y="438" width="92.3272991302232" height="18" rx="7" fill="#8ecae6"/><text class="value" x="387.3272991302232" y="453" font-size="16">4.28 us/op</text><rect x="285" y="462" width="261.52565559098764" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="556.5256555909876" y="477" font-size="16">12.1 us/op</text><text class="label" x="56" y="543">pageRank</text><rect x="285" y="512" width="156.93698028448046" height="18" rx="7" fill="#8ecae6"/><text class="value" x="451.93698028448046" y="527" font-size="16">7.27 us/op</text><rect x="285" y="536" width="329.35178929853066" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="624.3517892985307" y="551" font-size="16">15.3 us/op</text><text class="label" x="56" y="617">shortestPath</text><rect x="285" y="586" width="475.58165235865044" height="18" rx="7" fill="#8ecae6"/><text class="value" x="770.5816523586504" y="601" font-size="16">22.0 us/op</text><rect x="285" y="610" width="680.8517686619687" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="975.8517686619687" y="625" font-size="16">31.5 us/op</text><text class="label" x="56" y="691">allPaths</text><rect x="285" y="660" width="454.2969394892559" height="18" rx="7" fill="#8ecae6"/><text class="value" x="749.2969394892559" y="675" font-size="16">21.0 us/op</text><rect x="285" y="684" width="709.8214285714286" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="1004.8214285714286" y="699" font-size="16">32.9 us/op</text><text class="note" x="56" y="720">Lower is better; VT wrapping adds fixed scheduling overhead for in-memory work.</text></svg>

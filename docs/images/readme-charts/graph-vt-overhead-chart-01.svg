<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
<style>
.title{font-family:'Architects Daughter','Comic Sans MS','Comic Neue',cursive;font-size:34px;font-weight:400;fill:#273043}
.subtitle,.axis,.legend,.note{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#6b7280;font-weight:400}
.label{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#273043;font-weight:400}
.value{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#273043;font-weight:400;font-size:18px}
.axis{font-size:16px}.legend{font-size:18px}.note{font-size:17px}.label{font-size:18px}
</style>
<rect width="1280" height="600" rx="0" fill="#f6f8fb"/>
<rect x="24" y="24" width="1232" height="552" rx="18" fill="#ffffff" stroke="#d7e3ee" stroke-width="2"/>
<text class="title" x="56" y="72">Virtual Thread Fixed Overhead</text><text class="subtitle" x="58" y="104" font-size="18">Estimated VT - Sync latency</text><line x1="260" y1="118" x2="1120" y2="118" stroke="#dbe7f0" stroke-width="2"/><text class="label" x="56" y="155">allPaths</text><rect x="260" y="136" width="767.8571428571427" height="24" rx="8" fill="#8ecae6"/><text class="value" x="1039.8571428571427" y="154">11.8 us</text><text class="label" x="56" y="197">shortestPath</text><rect x="260" y="178" width="616.8415621718823" height="24" rx="8" fill="#ffb3c7"/><text class="value" x="888.8415621718823" y="196">9.51 us</text><text class="label" x="56" y="239">bfs</text><rect x="260" y="220" width="543.0852411928698" height="24" rx="8" fill="#b8e0d2"/><text class="value" x="815.0852411928698" y="238">8.37 us</text><text class="label" x="56" y="281">pageRank</text><rect x="260" y="262" width="518.110585452395" height="24" rx="8" fill="#ffd166"/><text class="value" x="790.110585452395" y="280">7.99 us</text><text class="label" x="56" y="323">dfs</text><rect x="260" y="304" width="508.44506933465277" height="24" rx="8" fill="#cdb4db"/><text class="value" x="780.4450693346528" y="322">7.84 us</text><text class="label" x="56" y="365">neighbors</text><rect x="260" y="346" width="493.65488359743665" height="24" rx="8" fill="#f4a261"/><text class="value" x="765.6548835974367" y="364">7.61 us</text><text class="label" x="56" y="407">findById</text><rect x="260" y="388" width="408.48157713706405" height="24" rx="8" fill="#a8dadc"/><text class="value" x="680.481577137064" y="406">6.30 us</text><text class="label" x="56" y="449">findByLabel</text><rect x="260" y="430" width="401.800045861041" height="24" rx="8" fill="#f7a072"/><text class="value" x="673.800045861041" y="448">6.19 us</text><text class="note" x="56" y="560">Lower is better. Overhead matters most when the real operation is only a few microseconds.</text></svg>

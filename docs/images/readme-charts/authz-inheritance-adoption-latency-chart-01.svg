<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Authorization Inheritance Adoption Latency</title>
  <desc id="desc">Large authorization inheritance benchmark latency. Lower milliseconds per operation is better.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Comic Neue", sans-serif; font-size: 30px; fill: #263238; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Comic Neue", monospace; font-size: 15px; fill: #546e7a; }
      .label { font-family: "Comic Mono", "Comic Sans MS", "Comic Neue", monospace; font-size: 15px; fill: #263238; }
      .small { font-family: "Comic Mono", "Comic Sans MS", "Comic Neue", monospace; font-size: 13px; fill: #546e7a; }
      .value { font-family: "Comic Mono", "Comic Sans MS", "Comic Neue", monospace; font-size: 14px; fill: #263238; font-weight: 700; }
      .panel-title { font-family: "Architects Daughter", "Comic Sans MS", "Comic Neue", sans-serif; font-size: 22px; fill: #263238; }
      .axis { stroke: #b0bec5; stroke-width: 1; }
    </style>
  </defs>
  <rect x="18" y="18" width="944" height="524" rx="18" fill="#fbfdff" stroke="#d6e2ea" stroke-width="2"/>
  <text class="title" x="48" y="64">Authorization Inheritance Adoption Latency</text>
  <text class="subtitle" x="48" y="92">large fixture, resolveResources, ms/op, lower is better</text>

  <g transform="translate(48 128)">
    <rect x="0" y="0" width="420" height="348" rx="12" fill="#ffffff" stroke="#d6e2ea"/>
    <text class="panel-title" x="24" y="40">long-chain (10 hops)</text>
    <text class="small" x="24" y="64">Winner: Neo4j Cypher</text>
    <line class="axis" x1="150" y1="288" x2="388" y2="288"/>

    <text class="label" x="24" y="112">Neo4j Cypher</text>
    <rect x="150" y="94" width="51" height="28" rx="5" fill="#90caf9"/>
    <text class="value" x="216" y="113">12.731</text>

    <text class="label" x="24" y="172">PostgreSQL CTE</text>
    <rect x="150" y="154" width="220" height="28" rx="5" fill="#a5d6a7"/>
    <text class="value" x="384" y="173">55.364</text>

    <text class="label" x="24" y="232">PG iterative</text>
    <rect x="150" y="214" width="189" height="28" rx="5" fill="#ffcc80"/>
    <text class="value" x="353" y="233">47.568</text>
  </g>

  <g transform="translate(512 128)">
    <rect x="0" y="0" width="420" height="348" rx="12" fill="#ffffff" stroke="#d6e2ea"/>
    <text class="panel-title" x="24" y="40">deep-wide (12 hops)</text>
    <text class="small" x="24" y="64">Winner: PostgreSQL CTE</text>
    <line class="axis" x1="150" y1="288" x2="388" y2="288"/>

    <text class="label" x="24" y="112">Neo4j Cypher</text>
    <rect x="150" y="94" width="220" height="28" rx="5" fill="#90caf9"/>
    <text class="value" x="384" y="113">56.467</text>

    <text class="label" x="24" y="172">PostgreSQL CTE</text>
    <rect x="150" y="154" width="45" height="28" rx="5" fill="#a5d6a7"/>
    <text class="value" x="210" y="173">11.596</text>

    <text class="label" x="24" y="232">PG iterative</text>
    <rect x="150" y="214" width="108" height="28" rx="5" fill="#ffcc80"/>
    <text class="value" x="272" y="233">27.836</text>
  </g>

  <g transform="translate(48 506)">
    <rect x="0" y="-16" width="18" height="12" rx="3" fill="#90caf9"/>
    <text class="small" x="28" y="-6">Neo4j Cypher</text>
    <rect x="150" y="-16" width="18" height="12" rx="3" fill="#a5d6a7"/>
    <text class="small" x="178" y="-6">PostgreSQL CTE</text>
    <rect x="330" y="-16" width="18" height="12" rx="3" fill="#ffcc80"/>
    <text class="small" x="358" y="-6">PostgreSQL iterative</text>
    <text class="small" x="570" y="-6">AGE timeout; Memgraph load failed locally.</text>
  </g>
</svg>

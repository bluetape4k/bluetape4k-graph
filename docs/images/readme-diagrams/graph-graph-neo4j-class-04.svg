<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">Neo4jCoroutineSession class diagram</title>
  <desc id="desc">UML class diagram showing Neo4jCoroutineSession as an AutoCloseable wrapper that owns no Driver lifecycle and uses ReactiveSession plus coroutine reactive adapters.</desc>
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="hollowTriangle" viewBox="0 0 16 14" refX="14" refY="7" markerWidth="18" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 7 L 2 12 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    marker path, marker polygon, marker polyline { stroke-dasharray: none !important; }
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .className { font-family: 'Architects Daughter', cursive; font-size: 29px; fill: #111827; }
    .classNameSmall { font-family: 'Architects Daughter', cursive; font-size: 25px; fill: #111827; }
    .stereo { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #64748B; font-weight: 700; }
    .member { font-family: 'Comic Mono', monospace; font-size: 16px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #475569; }
    .label { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; font-weight: 700; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .realize { fill: none; stroke: #64748B; stroke-width: 1.9; stroke-dasharray: 8 7; stroke-linecap: round; stroke-linejoin: round;  }
    .use { fill: none; stroke: #64748B; stroke-width: 1.9; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round;  }
    .assoc { fill: none; stroke: #64748B; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openArrow); }
  </style>

  <rect width="1680" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1624" height="1024" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1608" cy="66" r="14" fill="#FED7AA"/>
  <circle cx="1570" cy="66" r="14" fill="#DCFCE7"/>
  <circle cx="1532" cy="66" r="14" fill="#EDE9FE"/>

  <text x="72" y="84" class="title">Neo4jCoroutineSession class model</text>
  <text x="74" y="122" class="subtitle">Coroutine facade over Neo4j ReactiveSession; each call creates and closes a reactive session, but never closes the Driver.</text>

  <rect x="70" y="160" width="1540" height="780" rx="20" class="panel"/>

  <rect x="640" y="208" width="400" height="132" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" class="card"/>
  <text x="840" y="246" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="840" y="284" text-anchor="middle" class="className">AutoCloseable</text>
  <line x1="680" y1="306" x2="1000" y2="306" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="682" y="330" class="small">close()</text>

  <rect x="430" y="392" width="820" height="298" rx="16" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.9" class="card"/>
  <text x="840" y="430" text-anchor="middle" class="stereo">&lt;&lt;class&gt;&gt;</text>
  <text x="840" y="468" text-anchor="middle" class="className">Neo4jCoroutineSession</text>
  <line x1="474" y1="490" x2="1206" y2="490" stroke="#C4B5FD" stroke-width="1.3"/>
  <text x="478" y="520" class="member">- driver: Driver</text>
  <text x="478" y="547" class="member">- database: String = "neo4j"</text>
  <text x="478" y="574" class="member">- sessionConfig(): SessionConfig</text>
  <line x1="474" y1="596" x2="1206" y2="596" stroke="#C4B5FD" stroke-width="1.3"/>
  <text x="478" y="626" class="member">+ read(block: suspend (ReactiveSession) -&gt; Flow&lt;T&gt;): List&lt;T&gt;</text>
  <text x="478" y="653" class="member">+ write(block: suspend (ReactiveSession) -&gt; Flow&lt;T&gt;): List&lt;T&gt;</text>
  <text x="478" y="680" class="member">+ runReadQuery(cypher, params): List&lt;Record&gt;</text>

  <rect x="112" y="462" width="278" height="158" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.8" class="card"/>
  <text x="251" y="500" text-anchor="middle" class="stereo">&lt;&lt;Neo4j driver&gt;&gt;</text>
  <text x="251" y="538" text-anchor="middle" class="classNameSmall">Driver</text>
  <line x1="142" y1="560" x2="360" y2="560" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="144" y="590" class="small">external lifecycle</text>

  <rect x="1290" y="442" width="278" height="178" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8" class="card"/>
  <text x="1429" y="480" text-anchor="middle" class="stereo">&lt;&lt;Neo4j reactive API&gt;&gt;</text>
  <text x="1429" y="518" text-anchor="middle" class="classNameSmall">ReactiveSession</text>
  <line x1="1320" y1="540" x2="1538" y2="540" stroke="#BBF7D0" stroke-width="1.3"/>
  <text x="1322" y="570" class="small">run(Query)</text>
  <text x="1322" y="596" class="small">close&lt;Void&gt;()</text>

  <rect x="112" y="768" width="360" height="132" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="1.8" class="card"/>
  <text x="292" y="806" text-anchor="middle" class="stereo">&lt;&lt;input/output&gt;&gt;</text>
  <text x="292" y="844" text-anchor="middle" class="classNameSmall">Query / Record</text>
  <line x1="142" y1="866" x2="442" y2="866" stroke="#FDE68A" stroke-width="1.3"/>
  <text x="144" y="894" class="small">Query(cypher, params) to List&lt;Record&gt;</text>

  <rect x="660" y="768" width="360" height="132" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.8" class="card"/>
  <text x="840" y="806" text-anchor="middle" class="stereo">&lt;&lt;adapter dependency&gt;&gt;</text>
  <text x="840" y="844" text-anchor="middle" class="classNameSmall">Coroutine Reactive</text>
  <line x1="690" y1="866" x2="990" y2="866" stroke="#99F6E4" stroke-width="1.3"/>
  <text x="692" y="894" class="small">asFlow / awaitSingle / awaitFirstOrNull</text>

  <rect x="1208" y="768" width="360" height="132" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.8" class="card"/>
  <text x="1388" y="806" text-anchor="middle" class="stereo">&lt;&lt;resource contract&gt;&gt;</text>
  <text x="1388" y="844" text-anchor="middle" class="classNameSmall">Session Cleanup</text>
  <line x1="1238" y1="866" x2="1538" y2="866" stroke="#FECACA" stroke-width="1.3"/>
  <text x="1240" y="894" class="small">finally closes ReactiveSession</text>

  <path d="M 840 392 L 840 340" class="realize" style="marker-end:none"/>
  <polygon points="846,355 840,340 834,355" fill="#FFFFFF" stroke="#64748B" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 430 548 L 390 548" class="assoc"/>
  <path d="M 1250 548 L 1290 548" class="use" style="marker-end:none"/>
  <polyline points="1279,553 1290,548 1279,543" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 690 690 L 690 711 Q 690 729 672 729 L 332 729 Q 314 729 314 747 L 314 768" class="use" style="marker-end:none"/>
  <polyline points="309,757 314,768 319,757" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 840 690 L 840 768" class="use" style="marker-end:none"/>
  <polyline points="835,757 840,768 845,757" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 990 690 L 990 711 Q 990 729 1008 729 L 1370 729 Q 1388 729 1388 747 L 1388 768" class="use" style="marker-end:none"/>
  <polyline points="1383,757 1388,768 1393,757" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <rect x="472" y="724" width="112" height="28" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="528" y="743" text-anchor="middle" class="label">materializes</text>
  <rect x="1056" y="724" width="108" height="28" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="1110" y="743" text-anchor="middle" class="label">closes</text>

  <rect x="160" y="968" width="1360" height="54" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="840" y="1001" text-anchor="middle" class="small">The wrapper closes each ReactiveSession in finally; close() does not close the caller-owned Driver.</text>
</svg>

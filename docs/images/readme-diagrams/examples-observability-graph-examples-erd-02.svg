<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1057" viewBox="0 0 1800 1057" role="img" aria-labelledby="title desc">
  <title id="title">Observability graph examples ERD</title>
  <desc id="desc">Vertex labels, key properties, and relationships for the observability incident graph model.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L10,4 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L10,4 z" fill="#94A3B8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #F8FAFC; }
      .outer { fill: none; stroke: #60A5FA; stroke-width: 4; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; filter: url(#shadow); }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 48px; fill: #111827; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 22px; fill: #4B5563; }
      .label { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 30px; fill: #111827; }
      .small { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 18px; fill: #374151; }
      .tiny { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #4B5563; }
      .edge { fill: none; stroke: #2563EB; stroke-width: 4; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #94A3B8; stroke-width: 3; marker-end: url(#arrowSoft); }
      .pill { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .card { filter: url(#shadow); }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1057"/>
  <rect class="outer" x="24" y="24" width="1752" height="1009" rx="22"/>
  <text x="74" y="82" class="title">Observability Graph ERD</text>
  <text x="74" y="123" class="subtitle">Five vertex labels and four edge labels model dependency blast radius, alerts, root cause, and ownership.</text>
  <circle cx="1660" cy="78" r="15" fill="#EDE9FE"/>
  <circle cx="1700" cy="78" r="15" fill="#DCFCE7"/>
  <circle cx="1740" cy="78" r="15" fill="#FED7AA"/>

  <rect x="72" y="160" width="1656" height="760" rx="18" class="panel"/>

  <rect x="720" y="360" width="360" height="245" rx="16" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="900" y="414" text-anchor="middle" class="label">Service</text>
  <text x="770" y="462" class="small">serviceId</text>
  <text x="770" y="496" class="small">name</text>
  <text x="770" y="530" class="small">tier</text>
  <text x="770" y="564" class="small">status</text>

  <rect x="160" y="255" width="330" height="195" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="325" y="309" text-anchor="middle" class="label">Api</text>
  <text x="205" y="357" class="small">apiId</text>
  <text x="205" y="391" class="small">name</text>
  <text x="205" y="425" class="small">tier, status</text>

  <rect x="160" y="560" width="330" height="195" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="325" y="614" text-anchor="middle" class="label">Alert</text>
  <text x="205" y="662" class="small">alertId</text>
  <text x="205" y="696" class="small">name</text>
  <text x="205" y="730" class="small">severity, status</text>

  <rect x="1310" y="250" width="330" height="195" rx="16" fill="#F3E8FF" stroke="#A855F7" stroke-width="3" class="card"/>
  <text x="1475" y="304" text-anchor="middle" class="label">Team</text>
  <text x="1355" y="352" class="small">teamId</text>
  <text x="1355" y="386" class="small">name</text>
  <text x="1355" y="420" class="small">status</text>

  <rect x="1310" y="560" width="330" height="195" rx="16" fill="#FFEDD5" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1475" y="614" text-anchor="middle" class="label">Incident</text>
  <text x="1355" y="662" class="small">incidentId</text>
  <text x="1355" y="696" class="small">name</text>
  <text x="1355" y="730" class="small">severity, status</text>

  <path d="M 490 352 L 710 430" class="soft"/>
  <rect x="520" y="356" width="170" height="34" rx="17" class="pill"/>
  <text x="605" y="379" text-anchor="middle" class="tiny">DEPENDS_ON path</text>

  <path d="M 490 657 L 710 545" class="edge"/>
  <rect x="530" y="590" width="135" height="34" rx="17" class="pill"/>
  <text x="598" y="613" text-anchor="middle" class="tiny">ALERTS_ON</text>

  <path d="M 1080 440 L 1300 347" class="edge"/>
  <rect x="1142" y="361" width="125" height="34" rx="17" class="pill"/>
  <text x="1205" y="384" text-anchor="middle" class="tiny">OWNED_BY</text>

  <path d="M 1310 657 L 1090 545" class="edge"/>
  <rect x="1134" y="590" width="145" height="34" rx="17" class="pill"/>
  <text x="1207" y="613" text-anchor="middle" class="tiny">ROOT_CAUSE</text>

  <path d="M 900 360 C 790 260 1010 260 900 360" class="edge"/>
  <rect x="808" y="245" width="184" height="34" rx="17" class="pill"/>
  <text x="900" y="268" text-anchor="middle" class="tiny">DEPENDS_ON</text>

  <rect x="250" y="822" width="1300" height="70" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="900" y="854" text-anchor="middle" class="small">Traversal starts from service IDs or public API paths, then follows typed edge labels through the portable operations API.</text>

  <text x="900" y="1000" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: observability-graph-examples / ERD</text>
</svg>

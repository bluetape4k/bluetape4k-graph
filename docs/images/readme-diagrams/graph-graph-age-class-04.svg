<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1120" viewBox="0 0 1840 1120">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #4B5563; }
    .micro { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #64748B; }
    .card { filter: url(#softShadow); }
    .arrow { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
    .softArrow { stroke: #64748B; stroke-width: 2.4; fill: none; marker-end: url(#arrowSlate); }
  </style>

  <rect x="0" y="0" width="1840" height="1120" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1072" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">AgeSql Class Model</text>
  <text x="74" y="118" class="subtitle">AgeSql groups AGE setup, Cypher wrapping, CRUD factories, batch rows, traversal helpers, and property serialization.</text>

  <rect x="70" y="150" width="1700" height="820" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="125" y="225" width="340" height="165" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="295" y="260" text-anchor="middle" class="tiny">&lt;&lt;setup&gt;&gt;</text>
  <text x="295" y="298" text-anchor="middle" class="section">AGE Setup</text>
  <line x1="125" y1="318" x2="465" y2="318" stroke="#3B82F6" stroke-width="2"/>
  <text x="155" y="350" class="small">loadAge / setSearchPath</text>
  <text x="155" y="378" class="small">createExtension / graph DDL</text>

  <rect x="575" y="225" width="690" height="220" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="920" y="260" text-anchor="middle" class="tiny">&lt;&lt;object&gt;&gt;</text>
  <text x="920" y="298" text-anchor="middle" class="section">AgeSql</text>
  <line x1="575" y1="320" x2="1265" y2="320" stroke="#8B5CF6" stroke-width="2"/>
  <text x="605" y="355" class="small">+ cypher(graphName, cypherQuery, columns)</text>
  <text x="605" y="384" class="small">+ vertex and edge CRUD factories</text>
  <text x="605" y="413" class="small">+ batch rows, traversal helpers, graph reads</text>

  <rect x="1375" y="225" width="340" height="165" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="3" class="card"/>
  <text x="1545" y="260" text-anchor="middle" class="tiny">&lt;&lt;SQL shape&gt;&gt;</text>
  <text x="1545" y="298" text-anchor="middle" class="section">Cypher Wrapper</text>
  <line x1="1375" y1="318" x2="1715" y2="318" stroke="#16A34A" stroke-width="2"/>
  <text x="1405" y="350" class="small">SELECT * FROM ag_catalog.cypher</text>
  <text x="1405" y="378" class="small">typed agtype result columns</text>

  <rect x="125" y="530" width="365" height="175" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="3" class="card"/>
  <text x="308" y="565" text-anchor="middle" class="tiny">&lt;&lt;factory group&gt;&gt;</text>
  <text x="308" y="603" text-anchor="middle" class="section">Vertex SQL</text>
  <line x1="125" y1="625" x2="490" y2="625" stroke="#D97706" stroke-width="2"/>
  <text x="155" y="659" class="small">createVertex / createVerticesBatch</text>
  <text x="155" y="688" class="small">match, update, delete, count</text>

  <rect x="555" y="530" width="365" height="175" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="738" y="565" text-anchor="middle" class="tiny">&lt;&lt;factory group&gt;&gt;</text>
  <text x="738" y="603" text-anchor="middle" class="section">Edge SQL</text>
  <line x1="555" y1="625" x2="920" y2="625" stroke="#EF4444" stroke-width="2"/>
  <text x="585" y="659" class="small">createEdge / createEdgesBatch</text>
  <text x="585" y="688" class="small">match by label, endpoints, id</text>

  <rect x="985" y="530" width="365" height="175" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="1168" y="565" text-anchor="middle" class="tiny">&lt;&lt;factory group&gt;&gt;</text>
  <text x="1168" y="603" text-anchor="middle" class="section">Traversal SQL</text>
  <line x1="985" y1="625" x2="1350" y2="625" stroke="#14B8A6" stroke-width="2"/>
  <text x="1015" y="659" class="small">neighbors / shortestPath</text>
  <text x="1015" y="688" class="small">allPaths / degreeCentrality</text>

  <rect x="1415" y="530" width="270" height="175" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="3" class="card"/>
  <text x="1550" y="565" text-anchor="middle" class="tiny">&lt;&lt;read helpers&gt;&gt;</text>
  <text x="1550" y="603" text-anchor="middle" class="section">Graph Reads</text>
  <line x1="1415" y1="625" x2="1685" y2="625" stroke="#64748B" stroke-width="2"/>
  <text x="1445" y="659" class="small">matchAllVertices</text>
  <text x="1445" y="688" class="small">matchAllEdges</text>

  <rect x="285" y="790" width="390" height="140" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="480" y="825" text-anchor="middle" class="tiny">&lt;&lt;data classes&gt;&gt;</text>
  <text x="480" y="862" text-anchor="middle" class="section">Batch Rows</text>
  <line x1="285" y1="882" x2="675" y2="882" stroke="#3B82F6" stroke-width="2"/>
  <text x="315" y="916" class="small">BatchVertexRow / BatchEdgeRow</text>

  <rect x="800" y="790" width="455" height="160" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1028" y="825" text-anchor="middle" class="tiny">&lt;&lt;dependency&gt;&gt;</text>
  <text x="1028" y="862" text-anchor="middle" class="section">AgePropertySerializer</text>
  <line x1="800" y1="882" x2="1255" y2="882" stroke="#F97316" stroke-width="2"/>
  <text x="830" y="910" class="small">safe keys + escaped literals</text>
  <text x="830" y="936" class="small">Cypher property maps and assignments</text>
  <text x="920" y="1072" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: graph-age / AgeSql class model</text>

  <path d="M 465 308 L 573 330" class="softArrow"/>
  <path d="M 1265 330 L 1373 308" class="arrow"/>
  <path d="M 740 445 L 308 528" class="softArrow"/>
  <path d="M 840 445 L 738 528" class="softArrow"/>
  <path d="M 1000 445 L 1168 528" class="softArrow"/>
  <path d="M 1140 445 L 1550 528" class="softArrow"/>
  <path d="M 690 705 L 505 788" class="softArrow"/>
  <path d="M 920 705 L 1028 788" class="softArrow"/>
</svg>

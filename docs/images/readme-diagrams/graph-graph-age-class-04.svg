<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">AgeSql class model</title>
  <desc id="desc">UML-style dependency diagram for the AgeSql query builder, showing public Cypher-over-SQL function groups, batch row value types, property serialization, identifier validation, and the generated ag_catalog.cypher SQL output.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="openArrow" viewBox="0 0 15.4286 13.7143" refX="10" refY="6" markerWidth="18" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse" data-role="uml-hollow" data-tip-direction="positive-x">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
  </defs>

  <style>
    marker path, marker polygon, marker polyline { stroke-dasharray: none !important; }
    .title { font-family: 'Architects Daughter', cursive; font-size: 52px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .className { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .classNameSmall { font-family: 'Architects Daughter', cursive; font-size: 24px; fill: #111827; }
    .stereo { font-family: 'Comic Mono', monospace; font-size: 14px; font-weight: 700; fill: #64748B; }
    .member { font-family: 'Comic Mono', monospace; font-size: 16px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; }
    .label { font-family: 'Comic Mono', monospace; font-size: 13px; font-weight: 700; fill: #475569; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .main { fill: #FFE4E6; stroke: #FB7185; stroke-width: 1.9; }
    .blue { fill: #DBEAFE; stroke: #3B82F6; stroke-width: 1.8; }
    .green { fill: #DCFCE7; stroke: #22C55E; stroke-width: 1.8; }
    .amber { fill: #FEF3C7; stroke: #EAB308; stroke-width: 1.8; }
    .gray { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.7; }
    .use { fill: none; stroke: #64748B; stroke-width: 1.9; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round;  }
    .assoc { fill: none; stroke: #64748B; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openArrow); }

    .syntax-keyword{fill:#7E22CE}.syntax-type{fill:#0F766E}.syntax-function{fill:#1D4ED8}.syntax-string{fill:#B45309}.syntax-number{fill:#C2410C}.syntax-comment{fill:#64748B}.syntax-operator{fill:#BE123C}</style>

  <rect width="1680" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1624" height="1024" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1608" cy="66" r="14" fill="#FED7AA"/>
  <circle cx="1570" cy="66" r="14" fill="#DCFCE7"/>
  <circle cx="1532" cy="66" r="14" fill="#EDE9FE"/>

  <text x="72" y="84" class="title">AgeSql class model</text>
  <text x="74" y="122" class="subtitle">AgeSql is a string builder boundary: graph operations become safe Cypher fragments wrapped as PostgreSQL AGE SQL.</text>

  <rect x="70" y="160" width="1540" height="790" rx="20" class="panel"/>

  <rect x="510" y="218" width="660" height="358" rx="18" class="main card"/>
  <text x="840" y="258" text-anchor="middle" class="stereo">&lt;&lt;object&gt;&gt;</text>
  <text x="840" y="300" text-anchor="middle" class="className">AgeSql</text>
  <line x1="570" y1="326" x2="1110" y2="326" stroke="#FECDD3" stroke-width="1.3"/>
  <text x="576" y="358" class="member">+ cypher(graphName, cypherQuery, columns): String</text>
  <text x="576" y="386" class="member">+ createVertex / createEdge / batch create</text>
  <text x="576" y="414" class="member">+ match / update / delete / count queries</text>
  <text x="576" y="442" class="member">+ neighbors / shortestPath / allPaths</text>
  <text x="576" y="470" class="member">+ degreeCentrality / matchAllVertices / matchAllEdges</text>
  <line x1="570" y1="492" x2="1110" y2="492" stroke="#FECDD3" stroke-width="1.3"/>
  <text x="576" y="524" class="member">- commonSortedPropertyKeys(rows)</text>
  <text x="576" y="552" class="member">- propertyMapFromRow(keys)</text>

  <rect x="120" y="246" width="300" height="118" rx="14" class="blue card"/>
  <text x="270" y="282" text-anchor="middle" class="stereo">&lt;&lt;data class&gt;&gt;</text>
  <text x="270" y="318" text-anchor="middle" class="classNameSmall">BatchVertexRow</text>
  <line x1="150" y1="338" x2="390" y2="338" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="152" y="358" class="small">index, properties</text>

  <rect x="120" y="466" width="300" height="152" rx="14" class="blue card"/>
  <text x="270" y="502" text-anchor="middle" class="stereo">&lt;&lt;data class&gt;&gt;</text>
  <text x="270" y="538" text-anchor="middle" class="classNameSmall">BatchEdgeRow</text>
  <line x1="150" y1="558" x2="390" y2="558" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="152" y="580" class="small">index, fromId, toId</text>
  <text x="152" y="600" class="small">properties</text>

  <rect x="1260" y="246" width="300" height="156" rx="14" class="green card"/>
  <text x="1410" y="282" text-anchor="middle" class="stereo">&lt;&lt;object&gt;&gt;</text>
  <text x="1410" y="318" text-anchor="middle" class="classNameSmall">Property Serializer</text>
  <line x1="1290" y1="340" x2="1530" y2="340" stroke="#BBF7D0" stroke-width="1.3"/>
  <text x="1292" y="364" class="small">toCypherProps()</text>
  <text x="1292" y="386" class="small">toCypherAssignments()</text>

  <rect x="1260" y="486" width="300" height="132" rx="14" class="amber card"/>
  <text x="1410" y="522" text-anchor="middle" class="stereo">&lt;&lt;validation&gt;&gt;</text>
  <text x="1410" y="558" text-anchor="middle" class="classNameSmall">Safe Identifiers</text>
  <line x1="1290" y1="578" x2="1530" y2="578" stroke="#FDE68A" stroke-width="1.3"/>
  <text x="1292" y="598" class="small">graph / label / property keys</text>

  <rect x="190" y="720" width="1300" height="150" rx="16" class="gray card"/>
  <text x="840" y="758" text-anchor="middle" class="stereo">&lt;&lt;output&gt;&gt;</text>
  <text x="840" y="796" text-anchor="middle" class="classNameSmall">Cypher-over-SQL String</text>
  <line x1="250" y1="812" x2="1430" y2="812" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="840" y="838" text-anchor="middle" class="member" data-code-snippet="sql"><tspan class="syntax-keyword">SELECT</tspan> <tspan class="syntax-operator">*</tspan> <tspan class="syntax-keyword">FROM</tspan> ag_catalog.<tspan class="syntax-function">cypher</tspan>(<tspan class="syntax-string">'graph'</tspan>, $$ <tspan class="syntax-keyword">MATCH</tspan> ... <tspan class="syntax-keyword">RETURN</tspan> ... $$) <tspan class="syntax-keyword">AS</tspan> (v agtype)</text>

  <path d="M 420 305 L 447 305 Q 465 305 465 323 L 465 340 Q 465 358 483 358 L 510 358" class="assoc"/>
  <path d="M 420 534 L 447 534 Q 465 534 465 516 L 465 432 Q 465 414 483 414 L 510 414" class="assoc"/>
  <path d="M 1170 360 L 1197 360 Q 1215 360 1215 342 L 1215 336 Q 1215 318 1233 318 L 1260 318" class="use" style="marker-end:none"/>
  <polyline points="1249,323 1260,318 1249,313" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 1170 508 L 1197 508 Q 1215 508 1215 526 L 1215 526 Q 1215 544 1233 544 L 1260 544" class="use" style="marker-end:none"/>
  <polyline points="1249,549 1260,544 1249,539" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 840 576 L 840 720" class="assoc"/>

  <rect x="398" y="307" width="116" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="456" y="324" text-anchor="middle" class="label">batch vertices</text>
  <rect x="406" y="467" width="100" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="456" y="484" text-anchor="middle" class="label">batch edges</text>
  <rect x="1170" y="303" width="88" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="1214" y="320" text-anchor="middle" class="label">serializes</text>
  <rect x="1174" y="525" width="88" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="1218" y="542" text-anchor="middle" class="label">validates</text>
  <rect x="828" y="635" width="88" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="872" y="652" text-anchor="middle" class="label">generates</text>

  <rect x="220" y="976" width="1240" height="46" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="840" y="1005" text-anchor="middle" class="small">Dashed open arrows show helper dependencies; solid arrows show values consumed or SQL emitted.</text>
</svg>

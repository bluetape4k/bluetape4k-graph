<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13" /></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB" /></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748B" /></marker>
  </defs>
  <style>
    .title{font-family:'Architects Daughter',cursive;font-size:48px;fill:#111827}.subtitle{font-family:'Comic Mono',monospace;font-size:20px;fill:#4B5563}.section{font-family:'Architects Daughter',cursive;font-size:30px;fill:#111827}.label{font-family:'Architects Daughter',cursive;font-size:28px;fill:#111827}.small{font-family:'Comic Mono',monospace;font-size:17px;fill:#374151}.tiny{font-family:'Comic Mono',monospace;font-size:15px;fill:#4B5563}.card{filter:url(#softShadow)}.flow{stroke:#2563EB;stroke-width:3.2;fill:none;marker-end:url(#arrow)}.use{stroke:#64748B;stroke-width:2.6;fill:none;marker-end:url(#arrowGray)}
  </style>
  <rect width="1840" height="1080" fill="#F8FAFC" />
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4" />
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" /><circle cx="1736" cy="64" r="15" fill="#DCFCE7" /><circle cx="1696" cy="64" r="15" fill="#EDE9FE" />
  <text x="72" y="82" class="title">Security Attack Path Example Architecture</text>
  <text x="74" y="118" class="subtitle">Educational graph traversal explains attack paths, privilege escalation, ranking, and remediation impact.</text>
  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)" />

  <text x="250" y="220" text-anchor="middle" class="section">Fixture Scope</text>
  <text x="690" y="220" text-anchor="middle" class="section">Attack Graph</text>
  <text x="1150" y="220" text-anchor="middle" class="section">Analysis Service</text>
  <text x="1560" y="220" text-anchor="middle" class="section">Security Questions</text>

  <rect x="130" y="300" width="340" height="165" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" class="card" />
  <text x="170" y="348" class="label">Reachable Chain</text>
  <text x="170" y="388" class="small">internet -&gt; web-edge</text>
  <text x="170" y="416" class="small">web RCE -&gt; web-service</text>
  <text x="170" y="444" class="small">CI token -&gt; domain-admin</text>

  <rect x="130" y="600" width="340" height="145" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2" class="card" />
  <text x="170" y="648" class="label">Boundary Case</text>
  <text x="170" y="686" class="small">customer-db is reachable</text>
  <text x="170" y="714" class="small">backup-vault is unreachable</text>

  <rect x="570" y="270" width="380" height="230" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="2" class="card" />
  <text x="610" y="318" class="label">Active Path</text>
  <text x="610" y="358" class="small">EntryAsset -&gt; Host</text>
  <text x="610" y="386" class="small">Host -&gt; Vulnerability</text>
  <text x="610" y="414" class="small">Vulnerability -&gt; Principal</text>
  <text x="610" y="442" class="small">Principal -&gt; Credential</text>
  <text x="610" y="470" class="small">Credential -&gt; Admin -&gt; DB</text>

  <rect x="570" y="610" width="380" height="130" rx="14" fill="#FCE7F3" stroke="#EC4899" stroke-width="2" class="card" />
  <text x="610" y="658" class="label">Remediation Cut</text>
  <text x="610" y="696" class="small">block edge-credential-admin</text>
  <text x="610" y="724" class="small">customer-db becomes unreachable</text>

  <rect x="1040" y="285" width="370" height="245" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2" class="card" />
  <text x="1080" y="333" class="label">SecurityAttackPathService</text>
  <text x="1080" y="373" class="small">shortestAttackPath</text>
  <text x="1080" y="401" class="small">rankedAttackPaths</text>
  <text x="1080" y="429" class="small">privilegeEscalationPaths</text>
  <text x="1080" y="457" class="small">unreachableCrownJewels</text>
  <text x="1080" y="485" class="small">remediationImpact</text>

  <rect x="1040" y="635" width="370" height="110" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" class="card" />
  <text x="1080" y="683" class="label">Non-Scanner Contract</text>
  <text x="1080" y="721" class="small">no probes, feeds, or exploit checks</text>

  <rect x="1450" y="285" width="280" height="135" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="2" class="card" />
  <text x="1485" y="332" class="label">Shortest Path</text>
  <text x="1485" y="370" class="small">internet reaches</text>
  <text x="1485" y="398" class="small">customer-db</text>

  <rect x="1450" y="500" width="280" height="130" rx="14" fill="#FFEDD5" stroke="#F97316" stroke-width="2" class="card" />
  <text x="1485" y="547" class="label">Escalation</text>
  <text x="1485" y="585" class="small">web-service -&gt; token</text>
  <text x="1485" y="613" class="small">token -&gt; domain-admin</text>

  <rect x="1450" y="700" width="280" height="125" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" class="card" />
  <text x="1485" y="747" class="label">Remediation</text>
  <text x="1485" y="785" class="small">cut admin-token edge</text>

  <path d="M 470 385 L 570 385" class="flow" />
  <path d="M 470 675 L 570 675" class="flow" />
  <path d="M 950 405 L 1040 405" class="flow" />
  <path d="M 950 690 L 1040 690" class="use" />
  <path d="M 1410 390 L 1412 390 Q 1430 390 1430 372 L 1430 370 Q 1430 352 1448 352 L 1450 352" class="flow" />
  <path d="M 1410 445 L 1412 445 Q 1430 445 1430 463 L 1430 547 Q 1430 565 1448 565 L 1450 565" class="flow" />
  <path d="M 1410 490 L 1412 490 Q 1430 490 1430 508 L 1430 747 Q 1430 765 1448 765 L 1450 765" class="flow" />
  <path d="M 1220 530 L 1220 635" class="use" />

  <rect x="310" y="850" width="1220" height="52" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
  <text x="920" y="883" text-anchor="middle" class="small">The example ranks and explains source-backed graph paths; it deliberately avoids scanner or production-decision semantics.</text>
  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: security-attack-path-examples / architecture</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Ktor Graph Example Architecture</text>
  <text x="74" y="118" class="subtitle">A runnable Ktor app exposes a city graph through GraphPlugin-backed route handlers.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="290" y="214" text-anchor="middle" class="section">HTTP Surface</text>
  <text x="720" y="214" text-anchor="middle" class="section">Ktor Module</text>
  <text x="1150" y="214" text-anchor="middle" class="section">Graph Facade</text>
  <text x="1530" y="214" text-anchor="middle" class="section">Runtime</text>

  <rect x="125" y="270" width="340" height="155" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="160" y="318" class="label">Standard Routes</text>
  <text x="160" y="354" class="small">GET /health</text>
  <text x="160" y="382" class="small">GET /readyz</text>
  <text x="160" y="410" class="small">Bluetape4kKtorCore defaults</text>

  <rect x="125" y="535" width="340" height="155" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="160" y="583" class="label">Demo Routes</text>
  <text x="160" y="619" class="small">POST /demo/reset</text>
  <text x="160" y="647" class="small">GET /cities/count</text>
  <text x="160" y="675" class="small">GET /cities/path</text>

  <rect x="565" y="260" width="360" height="165" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="600" y="308" class="label">Application.module()</text>
  <text x="600" y="344" class="small">installs Ktor core health routes</text>
  <text x="600" y="372" class="small">installs GraphPlugin</text>
  <text x="600" y="400" class="small">registers graphDemoRoutes()</text>

  <rect x="565" y="535" width="360" height="155" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="600" y="583" class="label">FalkorDB Module</text>
  <text x="600" y="619" class="small">caller-owned Driver</text>
  <text x="600" y="647" class="small">falkorDB(driver, graphName=demo)</text>
  <text x="600" y="675" class="small">same route surface</text>

  <rect x="1010" y="260" width="330" height="165" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="1045" y="308" class="label">GraphPlugin Access</text>
  <text x="1045" y="344" class="small">call.graphOperations()</text>
  <text x="1045" y="372" class="small">call.graphSuspendOperations()</text>
  <text x="1045" y="400" class="small">route handlers stay backend-free</text>

  <rect x="1010" y="535" width="330" height="155" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1045" y="583" class="label">DemoCityGraph</text>
  <text x="1045" y="619" class="small">creates Seoul, Daejeon, Busan</text>
  <text x="1045" y="647" class="small">writes ROUTE_TO edges</text>
  <text x="1045" y="675" class="small">shortestPath over ROUTE_TO</text>

  <g class="card">
    <ellipse cx="1535" cy="385" rx="180" ry="44" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <rect x="1355" y="385" width="360" height="260" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <ellipse cx="1535" cy="645" rx="180" ry="44" fill="#FDBA74" stroke="#F59E0B" stroke-width="3"/>
  </g>
  <text x="1535" y="408" text-anchor="middle" class="label">Graph Runtime</text>
  <text x="1535" y="462" text-anchor="middle" class="small">TinkerGraph default app</text>
  <text x="1535" y="496" text-anchor="middle" class="small">FalkorDB optional module</text>
  <text x="1535" y="530" text-anchor="middle" class="small">graph name: demo</text>
  <text x="1535" y="564" text-anchor="middle" class="small">no Docker for default run</text>

  <path d="M 465 348 L 565 342" class="line"/>
  <path d="M 465 612 L 565 612" class="line"/>
  <path d="M 925 342 L 1010 342" class="line"/>
  <path d="M 925 612 L 1010 612" class="line"/>
  <path d="M 1340 342 L 1355 430" class="line"/>
  <path d="M 1340 612 L 1355 585" class="line"/>

  <rect x="180" y="815" width="1480" height="62" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="920" y="843" text-anchor="middle" class="small">The example demonstrates plugin access from Ktor routes, not a separate service layer.</text>

  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: ktor-graph-examples / architecture</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Ktor Graph Example Architecture</title>
  <desc id="desc">GraphPlugin facade access from HTTP routes</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5f6f82"/>
    </marker>
    <style>
      .canvas { fill: #fbfcfe; }
      .frame { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 30px; fill: #243142; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #5c6b7d; }
      .box-title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 18px; fill: #233044; }
      .box-text { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 13px; fill: #435266; }
      .label { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 12px; fill: #4f5e70; }
      .edge { fill: none; stroke: #5f6f82; stroke-width: 2.4; marker-end: url(#arrow); }
      .pill { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1; }
    </style>
  </defs>
  <rect class="canvas" width="1120" height="520"/>
  <rect class="frame" x="24" y="24" width="1072" height="472" rx="18"/>
  <text class="title" x="560" y="68" text-anchor="middle">Ktor Graph Example Architecture</text>
  <text class="subtitle" x="560" y="94" text-anchor="middle">GraphPlugin facade access from HTTP routes</text>

      <path class="edge" d="M 240 237.5 H 275 V 235 H 310"/>
      <rect class="pill" x="251.5" y="212.25" width="67" height="22" rx="11"/>
      <text class="label" x="285" y="227.25" text-anchor="middle">request</text>

      <path class="edge" d="M 520 235 H 560 V 235 H 600"/>
      <rect class="pill" x="535" y="211" width="60" height="22" rx="11"/>
      <text class="label" x="565" y="226" text-anchor="middle">facade</text>

      <path class="edge" d="M 830 235 H 870 V 167.5 H 910"/>
      <rect class="pill" x="819" y="177.25" width="67" height="22" rx="11"/>
      <text class="label" x="852.5" y="192.25" text-anchor="middle">default</text>

      <path class="edge" d="M 830 235 H 870 V 327.5 H 910"/>
      <rect class="pill" x="815.5" y="257.25" width="74" height="22" rx="11"/>
      <text class="label" x="852.5" y="272.25" text-anchor="middle">optional</text>

      <g>
        <rect x="70" y="190" width="170" height="95" rx="14" fill="#e8f4ff" stroke="#98c1df" stroke-width="2"/>
        <text class="box-title" x="155" y="224" text-anchor="middle">HTTP Client</text>
        <text class="box-text" x="155" y="252" text-anchor="middle">curl / tests</text>
      </g>

      <g>
        <rect x="310" y="160" width="210" height="150" rx="14" fill="#eaf7ef" stroke="#9ccdad" stroke-width="2"/>
        <text class="box-title" x="415" y="194" text-anchor="middle">Ktor Routes</text>
        <text class="box-text" x="415" y="222" text-anchor="middle">/demo/reset</text>
<text class="box-text" x="415" y="243" text-anchor="middle">/cities/count</text>
<text class="box-text" x="415" y="264" text-anchor="middle">/cities/path</text>
      </g>

      <g>
        <rect x="600" y="160" width="230" height="150" rx="14" fill="#f2eefc" stroke="#b7a7dc" stroke-width="2"/>
        <text class="box-title" x="715" y="194" text-anchor="middle">GraphPlugin</text>
        <text class="box-text" x="715" y="222" text-anchor="middle">graphOperations()</text>
<text class="box-text" x="715" y="243" text-anchor="middle">graphSuspendOperations()</text>
      </g>

      <g>
        <rect x="910" y="120" width="160" height="95" rx="14" fill="#fff4d8" stroke="#e3c46f" stroke-width="2"/>
        <text class="box-title" x="990" y="154" text-anchor="middle">TinkerGraph</text>
        <text class="box-text" x="990" y="182" text-anchor="middle">in-memory default</text>
      </g>

      <g>
        <rect x="910" y="275" width="160" height="105" rx="14" fill="#fdecef" stroke="#d8a6b0" stroke-width="2"/>
        <text class="box-title" x="990" y="309" text-anchor="middle">FalkorDB</text>
        <text class="box-text" x="990" y="337" text-anchor="middle">caller-owned driver</text>
<text class="box-text" x="990" y="358" text-anchor="middle">demo graph</text>
      </g>
</svg>

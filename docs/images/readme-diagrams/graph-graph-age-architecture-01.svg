<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">graph-age architecture</title>
  <desc id="desc">Architecture diagram for the graph-age module showing graph-core contracts, AGE operations adapters, SQL execution through Exposed and HikariCP, agtype parsing, PostgreSQL AGE storage, and JVM algorithm fallbacks.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowSlate" viewBox="0 0 18 14" refX="16" refY="7" markerWidth="18" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 16 7 L 2 12 Z" fill="#64748B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 18 14" refX="16" refY="7" markerWidth="18" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 16 7 L 2 12 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 18 14" refX="16" refY="7" markerWidth="18" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 16 7 L 2 12 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 18 14" refX="16" refY="7" markerWidth="18" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 16 7 L 2 12 Z" fill="#B45309"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 52px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .layerTitle { font-family: 'Comic Mono', monospace; font-size: 16px; font-weight: 700; fill: #334155; letter-spacing: 0; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .cardTitleSmall { font-family: 'Architects Daughter', cursive; font-size: 23px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; }
    .label { font-family: 'Comic Mono', monospace; font-size: 13px; font-weight: 700; fill: #475569; }
    .layer { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .blue { fill: #DBEAFE; stroke: #3B82F6; stroke-width: 1.8; }
    .violet { fill: #EDE9FE; stroke: #8B5CF6; stroke-width: 1.8; }
    .teal { fill: #CCFBF1; stroke: #14B8A6; stroke-width: 1.8; }
    .amber { fill: #FEF3C7; stroke: #EAB308; stroke-width: 1.8; }
    .rose { fill: #FFE4E6; stroke: #FB7185; stroke-width: 1.8; }
    .green { fill: #DCFCE7; stroke: #22C55E; stroke-width: 1.8; }
    .gray { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.7; }
    .lineSlate { fill: none; stroke: #64748B; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSlate); }
    .lineBlue { fill: none; stroke: #2563EB; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
    .lineTeal { fill: none; stroke: #0F766E; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowTeal); }
    .lineAmber { fill: none; stroke: #B45309; stroke-width: 2.3; stroke-dasharray: 8 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowAmber); }
    .dashSlate { fill: none; stroke: #64748B; stroke-width: 2.2; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSlate); }
  </style>

  <rect width="1680" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1624" height="1024" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1608" cy="66" r="14" fill="#FED7AA"/>
  <circle cx="1570" cy="66" r="14" fill="#DCFCE7"/>
  <circle cx="1532" cy="66" r="14" fill="#EDE9FE"/>

  <text x="72" y="84" class="title">graph-age architecture</text>
  <text x="74" y="122" class="subtitle">Apache AGE adapter: graph-core contracts become Cypher-over-SQL, Exposed JDBC transactions, and agtype model mapping.</text>

  <rect x="70" y="160" width="1540" height="160" rx="20" class="layer"/>
  <text x="96" y="194" class="layerTitle">graph-core API contracts</text>

  <rect x="180" y="218" width="300" height="72" rx="14" class="blue card"/>
  <text x="330" y="250" text-anchor="middle" class="cardTitleSmall">GraphOperations</text>
  <text x="330" y="275" text-anchor="middle" class="small">CRUD / traversal / merge</text>

  <rect x="690" y="218" width="300" height="72" rx="14" class="blue card"/>
  <text x="840" y="250" text-anchor="middle" class="cardTitleSmall">GraphSuspendOperations</text>
  <text x="840" y="275" text-anchor="middle" class="small">suspend + Flow API</text>

  <rect x="1200" y="218" width="300" height="72" rx="14" class="blue card"/>
  <text x="1350" y="250" text-anchor="middle" class="cardTitleSmall">Algorithm Repository</text>
  <text x="1350" y="275" text-anchor="middle" class="small">degree, paths, BFS/DFS</text>

  <rect x="70" y="352" width="1540" height="230" rx="20" class="layer"/>
  <text x="96" y="386" class="layerTitle">graph-age adapters</text>

  <rect x="140" y="424" width="380" height="112" rx="16" class="violet card"/>
  <text x="330" y="462" text-anchor="middle" class="cardTitle">AgeGraphOperations</text>
  <text x="166" y="493" class="body">- Exposed transaction per call</text>
  <text x="166" y="518" class="body">- merge + transaction scopes</text>

  <rect x="650" y="424" width="380" height="112" rx="16" class="teal card"/>
  <text x="840" y="462" text-anchor="middle" class="cardTitle">AgeGraphSuspendOperations</text>
  <text x="676" y="493" class="body">- newSuspendedTransaction</text>
  <text x="676" y="518" class="body">- sync delegate for fallbacks</text>

  <rect x="1160" y="424" width="380" height="112" rx="16" class="amber card"/>
  <text x="1350" y="462" text-anchor="middle" class="cardTitle">CachingAgeGraphOperations</text>
  <text x="1186" y="493" class="body">- read caches: ConcurrentHashMap</text>
  <text x="1186" y="518" class="body">- writes invalidate cached reads</text>

  <rect x="70" y="614" width="1540" height="194" rx="20" class="layer"/>
  <text x="96" y="648" class="layerTitle">Cypher-over-SQL execution</text>

  <rect x="130" y="686" width="280" height="84" rx="14" class="rose card"/>
  <text x="270" y="718" text-anchor="middle" class="cardTitleSmall">AgeSql</text>
  <text x="156" y="744" class="small">builds ag_catalog.cypher SQL</text>

  <rect x="480" y="686" width="280" height="84" rx="14" class="rose card"/>
  <text x="620" y="718" text-anchor="middle" class="cardTitleSmall">Property Serializer</text>
  <text x="506" y="744" class="small">Kotlin values -> Cypher literals</text>

  <rect x="830" y="686" width="280" height="84" rx="14" class="green card"/>
  <text x="970" y="718" text-anchor="middle" class="cardTitleSmall">AgeTypeParser</text>
  <text x="856" y="744" class="small">agtype -> vertex / edge / path</text>

  <rect x="1180" y="686" width="280" height="84" rx="14" class="gray card"/>
  <text x="1320" y="718" text-anchor="middle" class="cardTitleSmall">JVM Fallbacks</text>
  <text x="1206" y="744" class="small">BFS, DFS, PageRank, A* path</text>

  <rect x="70" y="840" width="1540" height="128" rx="20" class="layer"/>
  <text x="96" y="874" class="layerTitle">PostgreSQL runtime</text>

  <rect x="142" y="898" width="284" height="48" rx="14" class="gray card"/>
  <text x="284" y="928" text-anchor="middle" class="cardTitleSmall">HikariCP DataSource</text>

  <path d="M 650 900
           C 650 884, 1000 884, 1000 900
           L 1000 938
           C 1000 954, 650 954, 650 938 Z" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8" class="card"/>
  <ellipse cx="825" cy="900" rx="175" ry="22" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.8"/>
  <text x="825" y="918" text-anchor="middle" class="cardTitleSmall">PostgreSQL + Apache AGE</text>
  <text x="825" y="946" text-anchor="middle" class="small">LOAD age; search_path = ag_catalog</text>

  <path d="M 1230 900
           C 1230 884, 1510 884, 1510 900
           L 1510 938
           C 1510 954, 1230 954, 1230 938 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8" class="card"/>
  <ellipse cx="1370" cy="900" rx="140" ry="21" fill="#FDE68A" stroke="#D97706" stroke-width="1.8"/>
  <text x="1370" y="918" text-anchor="middle" class="cardTitleSmall">AGE graph tables</text>
  <text x="1370" y="946" text-anchor="middle" class="small">vertices, edges, agtype values</text>

  <path d="M 330 290 L 330 424" class="lineBlue"/>
  <path d="M 840 290 L 840 424" class="lineBlue"/>
  <path d="M 1350 290 L 1350 424" class="lineBlue"/>

  <path d="M 650 480 L 520 480" class="lineTeal"/>
  <path d="M 1160 452 L 1080 452 L 1080 404 L 330 404 L 330 424" class="lineAmber"/>

  <path d="M 330 536 L 270 686" class="lineSlate"/>
  <path d="M 472 536 L 620 686" class="dashSlate"/>
  <path d="M 840 536 L 970 686" class="lineTeal"/>
  <path d="M 1350 536 L 1320 686" class="lineAmber"/>

  <path d="M 270 770 L 284 898" class="lineSlate"/>
  <path d="M 620 770 L 650 900" class="dashSlate"/>
  <path d="M 825 884 L 825 820 L 970 820 L 970 770" class="lineTeal"/>
  <path d="M 426 922 L 650 922" class="lineSlate"/>
  <path d="M 1000 922 L 1230 922" class="lineAmber"/>

  <text x="574" y="466" text-anchor="middle" class="label">delegates</text>
  <text x="706" y="392" text-anchor="middle" class="label">wraps sync operations</text>
  <text x="228" y="674" text-anchor="middle" class="label">builds SQL</text>
  <text x="548" y="674" text-anchor="middle" class="label">serializes</text>
  <text x="914" y="674" text-anchor="middle" class="label">parses results</text>
  <text x="1300" y="674" text-anchor="middle" class="label">loads graph</text>
  <text x="535" y="908" text-anchor="middle" class="label">JDBC pool</text>
  <text x="1118" y="908" text-anchor="middle" class="label">stores</text>

  <rect x="220" y="992" width="1240" height="34" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="840" y="1015" text-anchor="middle" class="small">AGE schema DDL is intentionally unsupported here; createIndex fails explicitly instead of pretending to be portable.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13" />
    </filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 8.75 8.75" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB" stroke-dasharray="none"/>
    </marker>
  </defs>

  <style>
    marker path, marker polygon, marker polyline { stroke-dasharray: none !important; }
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .rel { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #1E40AF; }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC" />
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4" />
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95" />
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95" />
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95" />

  <text x="72" y="82" class="title">Fraud Detection Domain UML</text>
  <text x="74" y="118" class="subtitle">A compact property graph model: accounts are vertices, directed transfers are edges, services run analytics.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)" />

  <text x="470" y="214" text-anchor="middle" class="section">Property Graph Schema</text>
  <text x="1280" y="214" text-anchor="middle" class="section">Service Facade</text>

  <rect x="160" y="300" width="430" height="220" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card" />
  <text x="200" y="350" class="label">AccountLabel</text>
  <text x="200" y="390" class="small">label: Account</text>
  <text x="200" y="418" class="small">accountId: string</text>
  <text x="200" y="446" class="small">ownerName: string</text>
  <text x="200" y="474" class="small">riskTier: string</text>

  <rect x="760" y="300" width="430" height="220" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card" />
  <text x="800" y="350" class="label">TransferredToLabel</text>
  <text x="800" y="390" class="small">label: TRANSFERRED_TO</text>
  <text x="800" y="418" class="small">from: Account</text>
  <text x="800" y="446" class="small">to: Account</text>
  <text x="800" y="474" class="small">amount: long, occurredAt: string</text>

  <path d="M 590 410 L 760 410" class="line" />
  <text x="675" y="374" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round">TRANSFERRED_TO</text>
  <text x="675" y="374" text-anchor="middle" class="rel">TRANSFERRED_TO</text>

  <rect x="160" y="625" width="430" height="150" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card" />
  <text x="200" y="673" class="label">Sample Dataset</text>
  <text x="200" y="709" class="small">Alice, Bob, Carol accounts</text>
  <text x="200" y="737" class="small">three TRANSFERRED_TO edges</text>
  <text x="200" y="765" class="small">cycle: Alice to Bob to Carol</text>

  <rect x="760" y="625" width="430" height="150" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card" />
  <text x="800" y="673" class="label">Dataset Loader</text>
  <text x="800" y="709" class="small">FraudDetectionSampleDatasetLoader</text>
  <text x="800" y="737" class="small">CsvGraphBulkImporter path</text>
  <text x="800" y="765" class="small">returns GraphImportReport</text>

  <rect x="1320" y="275" width="400" height="230" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card" />
  <text x="1360" y="325" class="label">FraudDetectionService</text>
  <text x="1360" y="365" class="small">initialize()</text>
  <text x="1360" y="393" class="small">addAccount(accountId, ownerName)</text>
  <text x="1360" y="421" class="small">recordTransfer(from, to, amount)</text>
  <text x="1360" y="449" class="small">detectCircularTransfers()</text>
  <text x="1360" y="477" class="small">connectedComponents(), pageRank()</text>

  <rect x="1320" y="610" width="400" height="170" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card" />
  <text x="1360" y="658" class="label">Suspend Service</text>
  <text x="1360" y="694" class="small">same model with suspend functions</text>
  <text x="1360" y="722" class="small">GraphSuspendOperations contract</text>
  <text x="1360" y="750" class="small">Flow lists for async consumers</text>

  <path d="M 590 700 L 760 700" class="line" />
  <path d="M 1190 390 L 1320 390" class="line" />
  <path d="M 1190 695 L 1320 695" class="line" />

  <rect x="185" y="845" width="1470" height="45" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
  <text x="920" y="873" text-anchor="middle" class="small">Account and TRANSFERRED_TO labels are the only persisted schema; services translate them into cycle, cluster, and PageRank queries.</text>
  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: fraud-detection-examples / domain UML</text>
</svg>
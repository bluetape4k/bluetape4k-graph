<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .rel { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #1E40AF; }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Knowledge Graph Domain UML</text>
  <text x="74" y="118" class="subtitle">Documents mention entities, entities relate to other entities, and concepts normalize domain vocabulary.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>
  <text x="615" y="214" text-anchor="middle" class="section">Property Graph Schema</text>
  <text x="1410" y="214" text-anchor="middle" class="section">Service API</text>

  <rect x="130" y="300" width="350" height="200" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="165" y="348" class="label">Document</text>
  <text x="165" y="388" class="small">documentId: string</text>
  <text x="165" y="416" class="small">title: string</text>
  <text x="165" y="444" class="small">source: string</text>

  <rect x="610" y="270" width="350" height="220" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="645" y="318" class="label">Entity</text>
  <text x="645" y="358" class="small">entityId: string</text>
  <text x="645" y="386" class="small">name: string</text>
  <text x="645" y="414" class="small">entityType: string</text>
  <text x="645" y="452" class="small">self edge: RELATED_TO</text>

  <rect x="610" y="615" width="350" height="190" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="645" y="663" class="label">Concept</text>
  <text x="645" y="703" class="small">conceptId: string</text>
  <text x="645" y="731" class="small">name: string</text>
  <text x="645" y="759" class="small">domain: string</text>

  <path d="M 480 390 L 610 382" class="line"/>
  <text x="545" y="362" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">MENTIONS</text>
  <text x="545" y="362" text-anchor="middle" class="rel">MENTIONS</text>

  <path d="M 785 490 L 785 615" class="line"/>
  <text x="840" y="558" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">IS_A</text>
  <text x="840" y="558" text-anchor="middle" class="rel">IS_A</text>

  <path d="M 960 380 L 1085 380 L 1085 270 L 860 270" class="line"/>
  <text x="1050" y="355" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">RELATED_TO</text>
  <text x="1050" y="355" text-anchor="middle" class="rel">RELATED_TO</text>

  <rect x="1200" y="285" width="480" height="240" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="3" class="card"/>
  <text x="1240" y="335" class="label">KnowledgeGraphService</text>
  <text x="1240" y="375" class="small">addDocument(), addEntity(), addConcept()</text>
  <text x="1240" y="403" class="small">mention(), relateEntities(), classify()</text>
  <text x="1240" y="431" class="small">findMentionedEntities(document)</text>
  <text x="1240" y="459" class="small">findRelatedEntities(entity, depth)</text>
  <text x="1240" y="487" class="small">inferRelationshipPaths(from, to)</text>

  <rect x="1200" y="625" width="480" height="145" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="1240" y="673" class="label">Dataset Loader</text>
  <text x="1240" y="709" class="small">KnowledgeGraphSampleDatasetLoader</text>
  <text x="1240" y="737" class="small">imports vertices.csv and edges.csv</text>

  <path d="M 960 390 L 1200 390" class="line"/>
  <path d="M 960 710 L 1200 700" class="line"/>

  <rect x="185" y="860" width="1470" height="45" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: knowledge-graph-examples / domain UML</text>
</svg>

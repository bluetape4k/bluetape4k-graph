<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1000" viewBox="0 0 1640 1000">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#334155" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #475569; }
    .stepTitle { font-family: 'Architects Daughter', cursive; font-size: 29px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #64748B; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.7; }
    .card { filter: url(#shadow); }
    .line { stroke: #2563EB; stroke-width: 3.6; fill: none; marker-end: url(#arrow); }
    .soft { stroke: #64748B; stroke-width: 2.8; stroke-dasharray: 8 8; fill: none; marker-end: url(#softArrow); }
  </style>

  <rect x="0" y="0" width="1640" height="1000" fill="#F8FAFC"/>
  <rect x="26" y="26" width="1588" height="948" rx="24" fill="none" stroke="#93C5FD" stroke-width="4"/>
  <circle cx="1544" cy="68" r="15" fill="#DBEAFE"/>
  <circle cx="1504" cy="68" r="15" fill="#D1FAE5"/>
  <circle cx="1464" cy="68" r="15" fill="#FDE68A"/>

  <text x="72" y="82" class="title">Schema DSL definition flow</text>
  <text x="74" y="120" class="subtitle">Label declarations collect typed properties, then schema managers apply or reject backend DDL.</text>

  <rect x="72" y="158" width="1496" height="704" rx="20" class="panel"/>

  <rect x="128" y="228" width="286" height="184" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="271" y="272" text-anchor="middle" class="stepTitle">Declare labels</text>
  <line x1="166" y1="296" x2="376" y2="296" stroke="#3B82F6" stroke-width="2"/>
  <text x="271" y="330" text-anchor="middle" class="body">VertexLabel</text>
  <text x="271" y="360" text-anchor="middle" class="body">EdgeLabel</text>
  <text x="271" y="390" text-anchor="middle" class="small">label, from, to</text>

  <rect x="502" y="228" width="286" height="184" rx="18" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="645" y="272" text-anchor="middle" class="stepTitle">Collect props</text>
  <line x1="540" y1="296" x2="750" y2="296" stroke="#22C55E" stroke-width="2"/>
  <text x="645" y="330" text-anchor="middle" class="body">PropertyHolder</text>
  <text x="645" y="360" text-anchor="middle" class="body">PropertyDef&lt;T&gt;</text>
  <text x="645" y="390" text-anchor="middle" class="small">immutable snapshot</text>

  <rect x="876" y="228" width="286" height="184" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" class="card"/>
  <text x="1019" y="272" text-anchor="middle" class="stepTitle">Request schema</text>
  <line x1="914" y1="296" x2="1124" y2="296" stroke="#F59E0B" stroke-width="2"/>
  <text x="1019" y="330" text-anchor="middle" class="body">createIndex</text>
  <text x="1019" y="360" text-anchor="middle" class="body">createUniqueConstraint</text>
  <text x="1019" y="390" text-anchor="middle" class="small">label + property names</text>

  <rect x="1250" y="228" width="286" height="184" rx="18" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="1393" y="272" text-anchor="middle" class="stepTitle">Capability gate</text>
  <line x1="1288" y1="296" x2="1498" y2="296" stroke="#8B5CF6" stroke-width="2"/>
  <text x="1393" y="330" text-anchor="middle" class="body">GraphSchemaManager</text>
  <text x="1393" y="360" text-anchor="middle" class="body">GraphSuspendSchemaManager</text>
  <text x="1393" y="390" text-anchor="middle" class="small">backend-specific DDL</text>

  <path d="M 414 320 L 500 320" class="line"/>
  <path d="M 788 320 L 874 320" class="line"/>
  <path d="M 1162 320 L 1248 320" class="line"/>

  <rect x="322" y="556" width="360" height="124" rx="16" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2.4" class="card"/>
  <text x="502" y="596" text-anchor="middle" class="stepTitle">Operation use</text>
  <text x="502" y="632" text-anchor="middle" class="body">label values and property names</text>
  <text x="502" y="660" text-anchor="middle" class="small">feed create/query/filter APIs</text>

  <rect x="958" y="536" width="360" height="164" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.4" class="card"/>
  <text x="1138" y="576" text-anchor="middle" class="stepTitle">Explicit outcome</text>
  <text x="1138" y="612" text-anchor="middle" class="body">metadata returned</text>
  <text x="1138" y="642" text-anchor="middle" class="body">or UnsupportedOperationException</text>
  <text x="1138" y="672" text-anchor="middle" class="small">no silent no-op for DDL gaps</text>

  <path d="M 645 412 L 645 466 Q 645 484 627 484 L 520 484 Q 502 484 502 502 L 502 556" class="soft"/>
  <path d="M 1393 412 L 1393 456 Q 1393 474 1375 474 L 1156 474 Q 1138 474 1138 492 L 1138 536" class="soft"/>

  <rect x="220" y="746" width="1200" height="42" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="820" y="773" text-anchor="middle" class="small">Blocking schema managers can be bridged to suspend APIs through Dispatchers.IO.</text>

</svg>

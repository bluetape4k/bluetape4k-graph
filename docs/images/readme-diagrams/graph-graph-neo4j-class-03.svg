<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">Neo4jGraphOperations class diagram</title>
  <desc id="desc">UML class diagram showing graph-core contracts implemented by Neo4jGraphOperations and the Neo4j driver, schema, mapper, and transaction dependencies it uses.</desc>
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="hollowTriangle" viewBox="0 0 16 14" refX="14" refY="7" markerWidth="16" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 7 L 2 12 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .className { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .classNameSmall { font-family: 'Architects Daughter', cursive; font-size: 25px; fill: #111827; }
    .stereo { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #64748B; font-weight: 700; }
    .member { font-family: 'Comic Mono', monospace; font-size: 16px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #475569; }
    .label { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; font-weight: 700; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .realize { fill: none; stroke: #64748B; stroke-width: 1.9; stroke-dasharray: 8 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#hollowTriangle); }
    .use { fill: none; stroke: #64748B; stroke-width: 1.9; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openArrow); }
    .assoc { fill: none; stroke: #64748B; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openArrow); }
  </style>

  <rect width="1680" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1624" height="1024" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1608" cy="66" r="14" fill="#FED7AA"/>
  <circle cx="1570" cy="66" r="14" fill="#DCFCE7"/>
  <circle cx="1532" cy="66" r="14" fill="#EDE9FE"/>

  <text x="72" y="84" class="title">Neo4jGraphOperations class model</text>
  <text x="74" y="122" class="subtitle">Implements graph-core contracts, keeps Driver lifecycle external, and delegates schema/mapping details.</text>

  <rect x="70" y="160" width="1540" height="780" rx="20" class="panel"/>

  <rect x="112" y="208" width="308" height="148" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" class="card"/>
  <text x="266" y="246" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="266" y="284" text-anchor="middle" class="classNameSmall">GraphOperations</text>
  <line x1="142" y1="306" x2="390" y2="306" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="144" y="336" class="small">GraphSession + repositories</text>

  <rect x="488" y="208" width="308" height="148" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" class="card"/>
  <text x="642" y="246" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="642" y="278" text-anchor="middle" class="classNameSmall">GraphTransactional</text>
  <text x="642" y="306" text-anchor="middle" class="classNameSmall">Operations</text>
  <line x1="518" y1="324" x2="766" y2="324" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="520" y="346" class="small">transaction { ... }</text>

  <rect x="864" y="208" width="308" height="148" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" class="card"/>
  <text x="1018" y="246" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="1018" y="278" text-anchor="middle" class="classNameSmall">GraphSchema</text>
  <text x="1018" y="306" text-anchor="middle" class="classNameSmall">Management</text>
  <line x1="894" y1="324" x2="1142" y2="324" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="896" y="346" class="small">schemaManager()</text>

  <rect x="1240" y="208" width="308" height="148" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" class="card"/>
  <text x="1394" y="246" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="1394" y="278" text-anchor="middle" class="classNameSmall">GraphMerge</text>
  <text x="1394" y="306" text-anchor="middle" class="classNameSmall">Operations</text>
  <line x1="1270" y1="324" x2="1518" y2="324" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="1272" y="346" class="small">mergeVertex / mergeEdge</text>

  <rect x="500" y="404" width="680" height="286" rx="16" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.9" class="card"/>
  <text x="840" y="442" text-anchor="middle" class="stereo">&lt;&lt;class&gt;&gt;</text>
  <text x="840" y="480" text-anchor="middle" class="className">Neo4jGraphOperations</text>
  <line x1="540" y1="502" x2="1140" y2="502" stroke="#C4B5FD" stroke-width="1.3"/>
  <text x="544" y="532" class="member">- driver: Driver</text>
  <text x="544" y="559" class="member">- database: String = "neo4j"</text>
  <text x="544" y="586" class="member">- session(): Session</text>
  <line x1="540" y1="610" x2="1140" y2="610" stroke="#C4B5FD" stroke-width="1.3"/>
  <text x="544" y="640" class="member">+ schemaManager(): GraphSchemaManager</text>
  <text x="544" y="668" class="member">+ transaction(block): T</text>

  <rect x="112" y="790" width="308" height="132" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.8" class="card"/>
  <text x="266" y="828" text-anchor="middle" class="stereo">&lt;&lt;Neo4j driver&gt;&gt;</text>
  <text x="266" y="866" text-anchor="middle" class="classNameSmall">Driver / Session</text>
  <line x1="142" y1="886" x2="390" y2="886" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="144" y="912" class="small">caller-owned Driver</text>

  <rect x="488" y="790" width="308" height="132" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8" class="card"/>
  <text x="642" y="828" text-anchor="middle" class="stereo">&lt;&lt;class&gt;&gt;</text>
  <text x="642" y="862" text-anchor="middle" class="classNameSmall">Neo4jGraph</text>
  <text x="642" y="890" text-anchor="middle" class="classNameSmall">SchemaManager</text>
  <text x="520" y="916" class="small">CREATE INDEX / CONSTRAINT</text>

  <rect x="864" y="790" width="308" height="132" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="1.8" class="card"/>
  <text x="1018" y="828" text-anchor="middle" class="stereo">&lt;&lt;object&gt;&gt;</text>
  <text x="1018" y="866" text-anchor="middle" class="classNameSmall">Neo4jRecordMapper</text>
  <line x1="894" y1="886" x2="1142" y2="886" stroke="#FDE68A" stroke-width="1.3"/>
  <text x="896" y="912" class="small">Record to graph-core models</text>

  <rect x="1240" y="790" width="308" height="132" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.8" class="card"/>
  <text x="1394" y="828" text-anchor="middle" class="stereo">&lt;&lt;private class&gt;&gt;</text>
  <text x="1394" y="862" text-anchor="middle" class="classNameSmall">Neo4jGraph</text>
  <text x="1394" y="890" text-anchor="middle" class="classNameSmall">TransactionScope</text>
  <text x="1272" y="916" class="small">wraps Transaction</text>

  <path d="M 666 404 L 296 356" class="realize"/>
  <path d="M 752 404 L 642 356" class="realize"/>
  <path d="M 928 404 L 1018 356" class="realize"/>
  <path d="M 1014 404 L 1394 356" class="realize"/>

  <path d="M 640 690 L 296 790" class="assoc"/>
  <path d="M 756 690 L 642 790" class="use"/>
  <path d="M 930 690 L 1018 790" class="use"/>
  <path d="M 1042 690 L 1394 790" class="use"/>

  <rect x="402" y="738" width="116" height="28" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="460" y="757" text-anchor="middle" class="label">has session</text>
  <rect x="650" y="738" width="94" height="28" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="697" y="757" text-anchor="middle" class="label">creates</text>
  <rect x="930" y="738" width="82" height="28" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="971" y="757" text-anchor="middle" class="label">maps</text>
  <rect x="1140" y="738" width="126" height="28" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="1203" y="757" text-anchor="middle" class="label">transaction</text>

  <rect x="160" y="968" width="1360" height="54" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="840" y="1001" text-anchor="middle" class="small">Dashed hollow triangles mean implementation. Dashed open arrows mean use/dependency, not inheritance.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1180" viewBox="0 0 1840 1180">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #64748B; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1180" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1132" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Neo4jGraphOperations Class Model</text>
  <text x="74" y="118" class="subtitle">Synchronous graph-core implementation groups driver sessions, Cypher CRUD, traversal algorithms, schema, and transaction scope.</text>

  <rect x="70" y="155" width="1700" height="880" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <line x1="510" y1="380" x2="640" y2="380" class="line"/>
  <line x1="1200" y1="380" x2="1330" y2="380" class="line"/>
  <line x1="760" y1="600" x2="365" y2="705" class="line"/>
  <line x1="880" y1="600" x2="725" y2="705" class="line"/>
  <line x1="1020" y1="600" x2="1115" y2="705" class="line"/>
  <line x1="1115" y1="600" x2="1480" y2="705" class="line"/>

  <rect x="140" y="260" width="370" height="255" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="325" y="298" text-anchor="middle" class="tiny">&lt;&lt;constructor dependency&gt;&gt;</text>
  <text x="325" y="337" text-anchor="middle" class="section">Neo4j Driver</text>
  <line x1="140" y1="361" x2="510" y2="361" stroke="#3B82F6" stroke-width="2"/>
  <text x="170" y="398" class="small">driver: Driver</text>
  <text x="170" y="427" class="small">database = "neo4j"</text>
  <text x="170" y="456" class="small">session(): Session</text>
  <text x="170" y="485" class="small">driver remains caller-owned</text>

  <rect x="640" y="230" width="560" height="370" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="920" y="268" text-anchor="middle" class="tiny">&lt;&lt;class : GraphOperations&gt;&gt;</text>
  <text x="920" y="307" text-anchor="middle" class="section">Neo4jGraphOperations</text>
  <line x1="640" y1="331" x2="1200" y2="331" stroke="#8B5CF6" stroke-width="2"/>
  <text x="675" y="368" class="small">+ createGraph / dropGraph / graphExists</text>
  <text x="675" y="397" class="small">+ schemaManager(): Neo4jGraphSchemaManager</text>
  <text x="675" y="426" class="small">+ transaction(block): GraphTransactionScope</text>
  <text x="675" y="455" class="small">+ vertex and edge CRUD plus batch writes</text>
  <text x="675" y="484" class="small">+ mergeVertex / mergeEdge native Cypher MERGE</text>
  <text x="675" y="513" class="small">+ neighbors, paths, centrality, graph algorithms</text>
  <text x="675" y="542" class="small">- runQuery wraps session.executeRead / executeWrite</text>
  <text x="675" y="571" class="small">- fallback BFS/DFS/cycle/component/PageRank helpers</text>

  <rect x="1330" y="260" width="370" height="255" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="1515" y="298" text-anchor="middle" class="tiny">&lt;&lt;mapping dependency&gt;&gt;</text>
  <text x="1515" y="337" text-anchor="middle" class="section">Neo4jRecordMapper</text>
  <line x1="1330" y1="361" x2="1700" y2="361" stroke="#22C55E" stroke-width="2"/>
  <text x="1360" y="398" class="small">recordToVertex</text>
  <text x="1360" y="427" class="small">recordToEdge</text>
  <text x="1360" y="456" class="small">recordToPath</text>
  <text x="1360" y="485" class="small">elementId maps to GraphElementId</text>

  <rect x="160" y="705" width="410" height="190" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="365" y="743" text-anchor="middle" class="tiny">&lt;&lt;node operations&gt;&gt;</text>
  <text x="365" y="782" text-anchor="middle" class="section">Vertex API</text>
  <line x1="160" y1="806" x2="570" y2="806" stroke="#EAB308" stroke-width="2"/>
  <text x="190" y="843" class="small">create, batch, find, update/delete</text>
  <text x="190" y="872" class="small">count, merge, label filters</text>

  <rect x="620" y="705" width="410" height="190" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="825" y="743" text-anchor="middle" class="tiny">&lt;&lt;relationship operations&gt;&gt;</text>
  <text x="825" y="782" text-anchor="middle" class="section">Edge API</text>
  <line x1="620" y1="806" x2="1030" y2="806" stroke="#F97316" stroke-width="2"/>
  <text x="650" y="843" class="small">create, batch create, find, delete</text>
  <text x="650" y="872" class="small">start/end endpoint lookup and merge</text>

  <rect x="1080" y="705" width="410" height="190" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="1285" y="743" text-anchor="middle" class="tiny">&lt;&lt;traversal and algorithms&gt;&gt;</text>
  <text x="1285" y="782" text-anchor="middle" class="section">Traversal API</text>
  <line x1="1080" y1="806" x2="1490" y2="806" stroke="#14B8A6" stroke-width="2"/>
  <text x="1110" y="843" class="small">neighbors, shortestPath, allPaths</text>
  <text x="1110" y="872" class="small">centrality, BFS/DFS, cycles</text>

  <rect x="1515" y="705" width="190" height="190" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="1610" y="743" text-anchor="middle" class="tiny">&lt;&lt;schema&gt;&gt;</text>
  <text x="1610" y="782" text-anchor="middle" class="section">DDL</text>
  <line x1="1515" y1="806" x2="1705" y2="806" stroke="#EF4444" stroke-width="2"/>
  <text x="1545" y="843" class="small">indexes</text>
  <text x="1545" y="872" class="small">constraints</text>
  <text x="920" y="1088" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: graph-neo4j / Neo4jGraphOperations class model</text>
</svg>

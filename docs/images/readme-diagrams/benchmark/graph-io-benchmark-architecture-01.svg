<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .thin { stroke: #64748B; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">graph-io Benchmark Architecture</text>
  <text x="74" y="118" class="subtitle">JMH measures graph bulk import, export, and round-trip paths over a TinkerGraph fixture and trial-scoped temporary files.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="280" y="215" text-anchor="middle" class="section">Dataset State</text>
  <text x="835" y="215" text-anchor="middle" class="section">I/O Benchmarks</text>
  <text x="1430" y="215" text-anchor="middle" class="section">Files and Reports</text>

  <rect x="130" y="270" width="360" height="160" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="165" y="318" class="label">Benchmark State</text>
  <text x="165" y="354" class="small">sizeName: smoke / small / medium</text>
  <text x="165" y="382" class="small">temp directory per trial</text>
  <text x="165" y="410" class="small">teardown removes all files</text>

  <rect x="130" y="545" width="360" height="150" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="165" y="593" class="label">TinkerGraph Fixture</text>
  <text x="165" y="629" class="small">Person vertices: 1k / 10k</text>
  <text x="165" y="657" class="small">KNOWS edges: 2k / 20k</text>
  <text x="165" y="685" class="small">Random(42) deterministic topology</text>

  <rect x="615" y="245" width="450" height="150" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="650" y="293" class="label">java.io Bulk Paths</text>
  <text x="650" y="329" class="small">CSV, Jackson2 NDJSON, Jackson3 NDJSON</text>
  <text x="650" y="357" class="small">GraphML import, export, round-trip</text>
  <text x="650" y="385" class="small">sync, virtual-thread, suspend adapters</text>

  <rect x="615" y="470" width="450" height="150" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="650" y="518" class="label">OkIO Bulk Paths</text>
  <text x="650" y="554" class="small">OkioGraphBulkExporter / Importer</text>
  <text x="650" y="582" class="small">Jackson3 NDJSON and GraphML</text>
  <text x="650" y="610" class="small">GZIP NDJSON and virtual-thread adapter</text>

  <rect x="615" y="715" width="450" height="120" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="650" y="763" class="label">Smoke Benchmark</text>
  <text x="650" y="799" class="small">csvSyncRoundTrip</text>
  <text x="650" y="827" class="small">Jackson3 OkIO and GraphML OkIO round trips</text>

  <rect x="1200" y="260" width="450" height="145" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="1235" y="308" class="label">Temporary Files</text>
  <text x="1235" y="344" class="small">v.csv / e.csv pairs</text>
  <text x="1235" y="372" class="small">g2.ndjson, g3.ndjson, g.graphml</text>
  <text x="1235" y="400" class="small">OkIO path sinks and sources</text>

  <rect x="1200" y="500" width="450" height="135" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="1235" y="548" class="label">Measurement Focus</text>
  <text x="1235" y="584" class="small">file I/O plus in-memory graph creation</text>
  <text x="1235" y="612" class="small">no external database containers</text>

  <rect x="1200" y="715" width="450" height="120" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="1235" y="763" class="label">JMH JSON</text>
  <text x="1235" y="799" class="small">build/reports/benchmarks/**/main.json</text>
  <text x="1235" y="827" class="small">charts derive from raw benchmark reports</text>

  <path d="M 490 350 L 615 320" class="line"/>
  <path d="M 490 620 L 615 545" class="line"/>
  <path d="M 1065 320 L 1200 332" class="line"/>
  <path d="M 1065 545 L 1200 332" class="thin"/>
  <path d="M 1065 775 L 1200 775" class="line"/>
  <path d="M 1425 405 L 1425 500" class="line"/>
  <path d="M 1425 635 L 1425 715" class="line"/>

  <text x="545" y="324" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">graph data</text>
  <text x="545" y="324" text-anchor="middle" class="tiny">graph data</text>
  <text x="1125" y="306" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">writes/reads</text>
  <text x="1125" y="306" text-anchor="middle" class="tiny">writes/reads</text>
  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: graph-io-benchmark / architecture</text>
</svg>

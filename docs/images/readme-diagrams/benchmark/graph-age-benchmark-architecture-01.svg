<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="980" viewBox="0 0 1760 980">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#EA580C"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 24px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .lane { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.4; }
    .card { filter: url(#shadow); }
    .flow { fill: none; stroke: #2563EB; stroke-width: 3.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
    .measure { fill: none; stroke: #059669; stroke-width: 3.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
    .lifecycle { fill: none; stroke: #EA580C; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
  </style>

  <rect x="0" y="0" width="1760" height="980" fill="#F8FAFC"/>
  <rect x="30" y="30" width="1700" height="920" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.0"/>

  <text x="72" y="84" class="title">graph-age-benchmark architecture</text>
  <text x="74" y="120" class="subtitle">JMH measures Apache AGE operations over one containerized PostgreSQL AGE fixture and a benchmark-only cache wrapper.</text>

  <rect x="72" y="160" width="1616" height="708" rx="20" class="panel"/>

  <rect x="112" y="212" width="344" height="536" rx="18" class="lane"/>
  <text x="142" y="262" class="section">1. Benchmark harness</text>
  <text x="144" y="294" class="small">kotlinx-benchmark runs JMH states.</text>

  <rect x="144" y="344" width="280" height="108" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" class="card"/>
  <text x="284" y="379" text-anchor="middle" class="cardTitle">Gradle benchmark</text>
  <text x="284" y="408" text-anchor="middle" class="body">:graph-age-benchmark</text>
  <text x="284" y="431" text-anchor="middle" class="small">JSON report format</text>

  <rect x="144" y="532" width="280" height="108" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.8" class="card"/>
  <text x="284" y="567" text-anchor="middle" class="cardTitle">JMH state</text>
  <text x="284" y="596" text-anchor="middle" class="body">AgeBenchmarkState</text>
  <text x="284" y="619" text-anchor="middle" class="small">setup and teardown own fixture</text>

  <rect x="536" y="212" width="366" height="536" rx="18" class="lane"/>
  <text x="566" y="262" class="section">2. AGE runtime</text>
  <text x="568" y="294" class="small">One database stack is created per benchmark state.</text>

  <rect x="570" y="270" width="298" height="170" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8" class="card"/>
  <image data-bluetape4k-icon="postgresql" href="data:image/svg+xml;base64," x="668" y="286" width="42" height="42" preserveAspectRatio="xMidYMid meet"/>
      <text x="719" y="365" text-anchor="middle" class="cardTitle">PostgreSQL AGE</text>
  <text x="719" y="395" text-anchor="middle" class="body">Testcontainers singleton</text>
  <text x="719" y="418" text-anchor="middle" class="small">LOAD 'age'; search_path set</text>

  <rect x="570" y="496" width="298" height="112" rx="16" fill="#E0F2FE" stroke="#06B6D4" stroke-width="1.8" class="card"/>
  <text x="719" y="533" text-anchor="middle" class="cardTitle">JDBC bridge</text>
  <text x="719" y="563" text-anchor="middle" class="body">HikariCP + Exposed</text>
  <text x="719" y="586" text-anchor="middle" class="small">Database.connect(dataSource)</text>

  <rect x="570" y="664" width="298" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="719" y="695" text-anchor="middle" class="cardTitle">bench_graph</text>
  <text x="719" y="721" text-anchor="middle" class="small">4 Person vertices, 4 edges</text>

  <rect x="982" y="212" width="336" height="536" rx="18" class="lane"/>
  <text x="1012" y="262" class="section">3. Measured surface</text>
  <text x="1014" y="294" class="small">The wrapper removes repeated lookup overhead.</text>

  <rect x="1018" y="328" width="264" height="108" rx="16" fill="#DCFCE7" stroke="#10B981" stroke-width="1.8" class="card"/>
  <text x="1150" y="364" text-anchor="middle" class="cardTitle">AgeGraphOperations</text>
  <text x="1150" y="394" text-anchor="middle" class="small">create, find, neighbors</text>
  <text x="1150" y="416" text-anchor="middle" class="small">shortestPath, allPaths</text>

  <rect x="1018" y="494" width="264" height="108" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8" class="card"/>
  <text x="1150" y="530" text-anchor="middle" class="cardTitle">Benchmark cache</text>
  <text x="1150" y="560" text-anchor="middle" class="small">single-threaded HashMap caches</text>
  <text x="1150" y="582" text-anchor="middle" class="small">not production code</text>

  <rect x="1018" y="660" width="264" height="76" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8" class="card"/>
  <text x="1150" y="692" text-anchor="middle" class="cardTitle">10k batch paths</text>
  <text x="1150" y="718" text-anchor="middle" class="small">loop writes vs batch APIs</text>

  <rect x="1400" y="212" width="220" height="536" rx="18" class="lane"/>
  <text x="1430" y="262" class="section">4. Results</text>
  <text x="1432" y="294" class="small">Operation latency rows.</text>

  <rect x="1422" y="382" width="176" height="104" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6" class="card"/>
  <text x="1510" y="417" text-anchor="middle" class="cardTitle">JMH JSON</text>
  <text x="1510" y="447" text-anchor="middle" class="small">benchmark reports</text>

  <rect x="1422" y="572" width="176" height="104" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6" class="card"/>
  <text x="1510" y="607" text-anchor="middle" class="cardTitle">README chart</text>
  <text x="1510" y="637" text-anchor="middle" class="small">cross-backend context</text>

  <path d="M 424 384 L 570 384" class="flow"/>
  <path d="M 424 552 L 570 552" class="flow"/>
  <path d="M 719 440 L 719 496" class="lifecycle"/>
  <path d="M 719 608 L 719 664" class="lifecycle"/>
  <path d="M 868 552 L 925 552 Q 943 552 943 534 L 943 400 Q 943 382 961 382 L 1018 382" class="measure"/>
  <path d="M 868 700 L 943 700 Q 961 700 961 682 L 961 566 Q 961 548 979 548 L 1018 548" class="measure"/>
  <path d="M 1282 382 L 1334 382 Q 1352 382 1352 400 L 1352 416 Q 1352 434 1370 434 L 1422 434" class="measure"/>
  <path d="M 1282 698 L 1334 698 Q 1352 698 1352 680 L 1352 642 Q 1352 624 1370 624 L 1422 624" class="measure"/>

  <rect x="316" y="800" width="1128" height="48" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="880" y="831" text-anchor="middle" class="small">This module is AGE-specific; use graph-benchmark for cross-backend adoption comparisons.</text>
</svg>

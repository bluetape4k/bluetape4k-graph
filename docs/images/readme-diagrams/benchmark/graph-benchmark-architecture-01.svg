<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#EA580C"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 24px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .lane { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.4; }
    .card { filter: url(#shadow); }
    .flow { fill: none; stroke: #2563EB; stroke-width: 3.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
    .track { fill: none; stroke: #059669; stroke-width: 3.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
    .data { fill: none; stroke: #EA580C; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
    .report { fill: none; stroke: #64748B; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-gray); }
  </style>

  <rect x="0" y="0" width="1760" height="1080" fill="#F8FAFC"/>
  <rect x="30" y="30" width="1700" height="1020" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.0"/>

  <text x="72" y="84" class="title">graph-benchmark architecture</text>
  <text x="74" y="120" class="subtitle">kotlinx-benchmark drives source-backed graph tracks over deterministic fixtures, backend matrices, and JMH JSON reports.</text>

  <rect x="72" y="160" width="1616" height="840" rx="20" class="panel"/>

  <rect x="112" y="212" width="312" height="600" rx="18" class="lane"/>
  <text x="142" y="262" class="section">1. Run target</text>
  <text x="144" y="294" class="small">Gradle config selects one benchmark matrix.</text>

  <rect x="142" y="342" width="252" height="118" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" class="card"/>
  <text x="268" y="378" text-anchor="middle" class="cardTitle">Gradle tasks</text>
  <text x="268" y="408" text-anchor="middle" class="body">:graph-benchmark:...</text>
  <text x="268" y="432" text-anchor="middle" class="small">main, graphDb, domain, write</text>

  <rect x="142" y="528" width="252" height="118" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.8" class="card"/>
  <text x="268" y="564" text-anchor="middle" class="cardTitle">JMH runtime</text>
  <text x="268" y="594" text-anchor="middle" class="body">warmup / iteration</text>
  <text x="268" y="618" text-anchor="middle" class="small">params define matrix scope</text>

  <rect x="500" y="212" width="444" height="680" rx="18" class="lane"/>
  <text x="530" y="262" class="section">2. Benchmark tracks</text>
  <text x="532" y="294" class="small">Each class answers a different performance question.</text>

  <rect x="536" y="320" width="372" height="94" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8" class="card"/>
  <text x="722" y="354" text-anchor="middle" class="cardTitle">API model</text>
  <text x="722" y="384" text-anchor="middle" class="small">sync vs virtual-thread vs coroutine on TinkerGraph</text>

  <rect x="536" y="452" width="372" height="94" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8" class="card"/>
  <text x="722" y="486" text-anchor="middle" class="cardTitle">Backend contract</text>
  <text x="722" y="516" text-anchor="middle" class="small">GraphDbComparison and write ingestion</text>

  <rect x="536" y="584" width="372" height="94" rx="16" fill="#E0F2FE" stroke="#06B6D4" stroke-width="1.8" class="card"/>
  <text x="722" y="618" text-anchor="middle" class="cardTitle">Domain workload</text>
  <text x="722" y="648" text-anchor="middle" class="small">social, IAM, fraud, and code graph queries</text>

  <rect x="536" y="700" width="372" height="94" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8" class="card"/>
  <text x="722" y="734" text-anchor="middle" class="cardTitle">Decision tracks</text>
  <text x="722" y="764" text-anchor="middle" class="small">authz inheritance, abuser detection, graph-io</text>

  <rect x="1018" y="212" width="356" height="680" rx="18" class="lane"/>
  <text x="1048" y="262" class="section">3. Fixtures and runtimes</text>
  <text x="1050" y="294" class="small">Data is rebuilt for measured iterations.</text>

  <rect x="1052" y="336" width="286" height="110" rx="16" fill="#DCFCE7" stroke="#10B981" stroke-width="1.8" class="card"/>
  <text x="1195" y="372" text-anchor="middle" class="cardTitle">GraphOperations</text>
  <text x="1195" y="402" text-anchor="middle" class="small">TinkerGraph, Neo4j, Memgraph</text>
  <text x="1195" y="424" text-anchor="middle" class="small">AGE and FalkorDB; containers serial</text>

  <rect x="1052" y="500" width="286" height="110" rx="16" fill="#E0F2FE" stroke="#06B6D4" stroke-width="1.8" class="card"/>
  <text x="1195" y="536" text-anchor="middle" class="cardTitle">Deterministic data</text>
  <text x="1195" y="566" text-anchor="middle" class="small">fixed social, IAM, fraud, code fixtures</text>
  <text x="1195" y="588" text-anchor="middle" class="small">small, medium, large scopes</text>

  <rect x="1052" y="664" width="286" height="110" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.8" class="card"/>
  <text x="1195" y="700" text-anchor="middle" class="cardTitle">PostgreSQL engines</text>
  <text x="1195" y="730" text-anchor="middle" class="small">AGE/Cypher, recursive CTE, iterative</text>
  <text x="1195" y="752" text-anchor="middle" class="small">Exposed and JPA variants</text>

  <rect x="1450" y="212" width="198" height="680" rx="18" class="lane"/>
  <text x="1480" y="262" class="section">4. Output</text>
  <text x="1482" y="294" class="small">Charts come from JSON.</text>

  <rect x="1470" y="380" width="158" height="102" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6" class="card"/>
  <text x="1549" y="414" text-anchor="middle" class="cardTitle">JMH JSON</text>
  <text x="1549" y="444" text-anchor="middle" class="small">main.json</text>

  <rect x="1470" y="560" width="158" height="102" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6" class="card"/>
  <text x="1549" y="594" text-anchor="middle" class="cardTitle">Docs charts</text>
  <text x="1549" y="624" text-anchor="middle" class="small">PNG summaries</text>

  <path d="M 394 401 L 536 367" class="flow"/>
  <path d="M 394 587 C 448 582 484 524 536 499" class="flow"/>
  <path d="M 394 587 C 448 610 484 626 536 631" class="flow"/>
  <path d="M 394 587 C 446 664 480 728 536 747" class="flow"/>

  <path d="M 908 367 L 1052 391" class="track"/>
  <path d="M 908 499 L 1052 391" class="track"/>
  <path d="M 908 631 L 1052 555" class="data"/>
  <path d="M 908 747 L 1052 719" class="data"/>

  <path d="M 1338 391 C 1382 398 1428 418 1470 431" class="report"/>
  <path d="M 1338 555 C 1392 560 1428 598 1470 611" class="report"/>
  <path d="M 1338 719 C 1400 700 1426 648 1470 611" class="report"/>

  <rect x="306" y="916" width="1148" height="58" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="880" y="952" text-anchor="middle" class="small">The architecture separates benchmark harness decisions from chart interpretation; rerun raw JSON before release-grade claims.</text>
</svg>

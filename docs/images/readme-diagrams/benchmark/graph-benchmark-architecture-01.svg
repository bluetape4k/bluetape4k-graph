<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .thin { stroke: #64748B; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">graph-benchmark Architecture</text>
  <text x="74" y="118" class="subtitle">kotlinx-benchmark drives focused graph tracks over deterministic fixtures and backend matrices, then writes JMH JSON reports.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="280" y="215" text-anchor="middle" class="section">Benchmark Entrypoints</text>
  <text x="835" y="215" text-anchor="middle" class="section">Measured Tracks</text>
  <text x="1430" y="215" text-anchor="middle" class="section">Fixtures and Output</text>

  <rect x="135" y="275" width="350" height="150" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="170" y="323" class="label">Gradle Tasks</text>
  <text x="170" y="359" class="small">:graph-benchmark:benchmark</text>
  <text x="170" y="387" class="small">mainGraphDbSmallBenchmark</text>
  <text x="170" y="415" class="small">domain, write, authz, abuser tasks</text>

  <rect x="135" y="545" width="350" height="145" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="170" y="593" class="label">kotlinx-benchmark</text>
  <text x="170" y="629" class="small">JMH runtime</text>
  <text x="170" y="657" class="small">warmups / iterations / params</text>
  <text x="170" y="685" class="small">JSON report format</text>

  <rect x="615" y="235" width="450" height="135" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="650" y="283" class="label">Graph API Tracks</text>
  <text x="650" y="319" class="small">sync, virtual-thread, coroutine API model</text>
  <text x="650" y="347" class="small">legacy vertex, neighbor, path, traversal ops</text>

  <rect x="615" y="415" width="450" height="145" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="650" y="463" class="label">Backend and Domain Tracks</text>
  <text x="650" y="499" class="small">GraphDbComparisonBenchmark</text>
  <text x="650" y="527" class="small">DomainWorkload and WriteIngestion</text>
  <text x="650" y="555" class="small">tinkergraph, neo4j, memgraph, age, falkordb</text>

  <rect x="615" y="605" width="450" height="145" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="650" y="653" class="label">PostgreSQL Decision Tracks</text>
  <text x="650" y="689" class="small">AuthzInheritanceBenchmark</text>
  <text x="650" y="717" class="small">AbuserDetectionBenchmark</text>
  <text x="650" y="745" class="small">AGE/Cypher, CTE, iterative, JPA</text>

  <rect x="615" y="795" width="450" height="95" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="650" y="835" class="label">graph-io Track</text>
  <text x="650" y="867" class="small">csv, graphml, jackson2/3, okio formats</text>

  <rect x="1200" y="270" width="455" height="150" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="1235" y="318" class="label">Deterministic Fixtures</text>
  <text x="1235" y="354" class="small">social, IAM, fraud, code graph shapes</text>
  <text x="1235" y="382" class="small">user/group/role/resource authz graph</text>
  <text x="1235" y="410" class="small">account-transfer abuser data</text>

  <rect x="1200" y="500" width="455" height="135" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="1235" y="548" class="label">Runtime Backends</text>
  <text x="1235" y="584" class="small">TinkerGraph for in-memory tracks</text>
  <text x="1235" y="612" class="small">Testcontainers for graph DB and PostgreSQL</text>

  <rect x="1200" y="715" width="455" height="135" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="1235" y="763" class="label">Reports</text>
  <text x="1235" y="799" class="small">build/reports/benchmarks/**/main.json</text>
  <text x="1235" y="827" class="small">charts are generated from raw JMH JSON</text>

  <path d="M 485 350 L 615 302" class="line"/>
  <path d="M 485 618 L 615 488" class="line"/>
  <path d="M 1065 302 L 1200 345" class="line"/>
  <path d="M 1065 488 L 1200 568" class="line"/>
  <path d="M 1065 678 L 1200 568" class="thin"/>
  <path d="M 1065 842 L 1200 782" class="line"/>
  <path d="M 1427 635 L 1427 715" class="line"/>

  <text x="545" y="318" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">runs</text>
  <text x="545" y="318" text-anchor="middle" class="tiny">runs</text>
  <text x="1130" y="325" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">loads data</text>
  <text x="1130" y="325" text-anchor="middle" class="tiny">loads data</text>
  <text x="1130" y="545" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">measures</text>
  <text x="1130" y="545" text-anchor="middle" class="tiny">measures</text>
  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: graph-benchmark / architecture</text>
</svg>

<path class="line" d="M235.0 566.0 L535.0 566.0"/>
<rect x="546.0" y="612.0" width="278.0" height="30" rx="10" fill="#ffffff" opacity="0.96"/>
<text class="strong" x="556.0" y="632.0">6. allPaths(PathOptions(edgeLabel = RELATED_TO))</text>
<path class="line" d="M535.0 642.0 L835.0 642.0"/>
<rect x="895.8" y="688.0" width="178.4" height="30" rx="10" fill="#ffffff" opacity="0.96"/>
<text class="strong" x="905.8" y="708.0">7. bounded path traversal</text>
<path class="line" d="M835.0 718.0 L1135.0 718.0"/>
<rect x="567.0" y="764.0" width="236.0" height="30" rx="10" fill="#ffffff" opacity="0.96"/>
<text class="strong" x="577.0" y="784.0">8. explainable relationship paths</text>
<path class="dashed" d="M1135.0 794.0 L235.0 794.0"/>
</svg>

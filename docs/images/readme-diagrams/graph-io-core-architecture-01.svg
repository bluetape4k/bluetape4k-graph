<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 2 2 L 16 9 L 2 16 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 22 22" refX="20" refY="11" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 20 11 L 3 19 Z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 52px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 19px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 26px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .rel { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #475569; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #64748B; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .lane { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .flowBlue { fill: none; stroke: #2563EB; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
    .flowGreen { fill: none; stroke: #059669; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-emerald); }
    .line { fill: none; stroke: #64748B; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-slate); }
  </style>

  <rect x="0" y="0" width="1760" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1704" height="1024" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2"/>

  <text x="72" y="86" class="title">graph-io-core architecture</text>
  <text x="74" y="124" class="subtitle">Shared contracts and helpers let every graph-io format import/export through the same graph-core APIs.</text>

  <rect x="74" y="166" width="1612" height="850" rx="20" class="panel"/>

  <text x="112" y="212" class="section">Layer relationships</text>
  <rect x="424" y="184" width="384" height="52" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="616" y="205" text-anchor="middle" class="rel">Every format module implements</text>
  <text x="616" y="226" text-anchor="middle" class="rel">sync / suspend / virtual-thread contracts.</text>

  <path d="M 820 210 L 840 210" class="line"/>
  <rect x="852" y="184" width="366" height="52" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
  <text x="1035" y="205" text-anchor="middle" class="rel">Contracts exchange shared graph-io</text>
  <text x="1035" y="226" text-anchor="middle" class="rel">sources, sinks, records, options, reports.</text>

  <path d="M 1228 210 L 1240 210" class="line"/>
  <rect x="1250" y="184" width="384" height="52" rx="16" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.6"/>
  <text x="1442" y="205" text-anchor="middle" class="rel">Core helpers call graph-core APIs</text>
  <text x="1442" y="226" text-anchor="middle" class="rel">to read, batch-write, and map backend IDs.</text>

  <g transform="translate(0 72)">
  <rect x="112" y="206" width="340" height="604" rx="18" class="lane"/>
  <text x="142" y="258" class="section">1. Format modules</text>
  <text x="144" y="290" class="small">CSV, NDJSON, and GraphML own</text>
  <text x="144" y="314" class="small">format-specific parsing and writing.</text>

  <rect x="150" y="332" width="264" height="78" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.9" class="card"/>
  <text x="282" y="364" text-anchor="middle" class="cardTitle">CSV</text>
  <text x="282" y="390" text-anchor="middle" class="body">vertices + edges files</text>

  <rect x="150" y="444" width="264" height="78" rx="16" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.9" class="card"/>
  <text x="282" y="476" text-anchor="middle" class="cardTitle">Jackson NDJSON</text>
  <text x="282" y="502" text-anchor="middle" class="body">jackson2 / jackson3</text>

  <rect x="150" y="556" width="264" height="78" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.9" class="card"/>
  <text x="282" y="588" text-anchor="middle" class="cardTitle">GraphML</text>
  <text x="282" y="614" text-anchor="middle" class="body">StAX graph document</text>

  <rect x="150" y="690" width="264" height="66" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="282" y="718" text-anchor="middle" class="small">Format modules depend on core,</text>
  <text x="282" y="742" text-anchor="middle" class="small">not on a graph backend.</text>

  <rect x="520" y="206" width="360" height="604" rx="18" class="lane"/>
  <text x="552" y="258" class="section">2. Shared contracts</text>
  <text x="554" y="290" class="small">One API shape across three execution models.</text>

  <rect x="558" y="332" width="284" height="86" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.9" class="card"/>
  <text x="700" y="366" text-anchor="middle" class="cardTitle">Sync contracts</text>
  <text x="700" y="394" text-anchor="middle" class="body">GraphBulkImporter / Exporter</text>

  <rect x="558" y="454" width="284" height="86" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.9" class="card"/>
  <text x="700" y="488" text-anchor="middle" class="cardTitle">Coroutine contracts</text>
  <text x="700" y="516" text-anchor="middle" class="body">suspend importer / exporter</text>

  <rect x="558" y="576" width="284" height="86" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="1.9" class="card"/>
  <text x="700" y="610" text-anchor="middle" class="cardTitle">Virtual Thread API</text>
  <text x="700" y="638" text-anchor="middle" class="body">CompletableFuture wrapper</text>

  <rect x="558" y="698" width="284" height="76" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.9" class="card"/>
  <text x="700" y="728" text-anchor="middle" class="cardTitle">Record Flow reader</text>
  <text x="700" y="754" text-anchor="middle" class="body">Flow&lt;Vertex / Edge&gt;</text>

  <rect x="948" y="206" width="372" height="604" rx="18" class="lane"/>
  <text x="980" y="258" class="section">3. Core data + support</text>
  <text x="982" y="290" class="small">Format-neutral types enforce</text>
  <text x="982" y="314" class="small">import/export semantics.</text>

  <rect x="986" y="330" width="146" height="88" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" class="card"/>
  <text x="1059" y="362" text-anchor="middle" class="cardTitle">Sources</text>
  <text x="1059" y="389" text-anchor="middle" class="small">Path / stream</text>

  <rect x="1150" y="330" width="146" height="88" rx="16" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.8" class="card"/>
  <text x="1223" y="362" text-anchor="middle" class="cardTitle">Sinks</text>
  <text x="1223" y="389" text-anchor="middle" class="small">Path / stream</text>

  <rect x="986" y="454" width="298" height="92" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.8" class="card"/>
  <text x="1135" y="488" text-anchor="middle" class="cardTitle">GraphIo records</text>
  <text x="1135" y="516" text-anchor="middle" class="body">external ids before backend IDs</text>

  <rect x="986" y="572" width="298" height="104" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.8" class="card"/>
  <text x="1135" y="606" text-anchor="middle" class="cardTitle">Import options</text>
  <text x="1135" y="633" text-anchor="middle" class="small">batchSize + duplicate policy</text>
  <text x="1135" y="657" text-anchor="middle" class="small">missing endpoint policy</text>

  <rect x="986" y="710" width="298" height="88" rx="16" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.8" class="card"/>
  <text x="1135" y="740" text-anchor="middle" class="cardTitle">Id map + batch writer</text>
  <text x="1135" y="766" text-anchor="middle" class="small">external id -> backend id</text>
  <text x="1135" y="788" text-anchor="middle" class="small">label grouped flush</text>

  <rect x="1364" y="206" width="282" height="604" rx="18" class="lane"/>
  <text x="1394" y="258" class="section">4. graph-core</text>
  <text x="1396" y="290" class="small">Backends stay behind graph-core.</text>

  <rect x="1394" y="340" width="222" height="92" rx="16" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.9" class="card"/>
  <text x="1505" y="374" text-anchor="middle" class="cardTitle">GraphOperations</text>
  <text x="1505" y="402" text-anchor="middle" class="body">sync graph API</text>

  <rect x="1394" y="476" width="222" height="92" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.9" class="card"/>
  <text x="1505" y="510" text-anchor="middle" class="cardTitle">Suspend ops</text>
  <text x="1505" y="538" text-anchor="middle" class="body">coroutine graph API</text>

  <rect x="1394" y="626" width="222" height="104" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="1505" y="658" text-anchor="middle" class="body">createVertices</text>
  <text x="1505" y="684" text-anchor="middle" class="body">createEdges</text>
  <text x="1505" y="710" text-anchor="middle" class="body">find by labels</text>
  </g>

  <rect x="210" y="930" width="1340" height="62" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="880" y="956" text-anchor="middle" class="small">Import: parsers emit external-id records, core helpers resolve IDs and flush label-grouped batches into graph-core operations.</text>
  <text x="880" y="980" text-anchor="middle" class="small">Export: format modules read through graph-core operations, apply label filters, write to sinks, and return status/failure reports.</text>
</svg>

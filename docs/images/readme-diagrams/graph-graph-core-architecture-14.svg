<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="980" viewBox="0 0 1760 980">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10" />
    </filter>
    <marker id="arrow" viewBox="0 0 8.75 8.75" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB" stroke-dasharray="none"/>
    </marker>
    <marker id="smallArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748B" stroke-dasharray="none"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 19px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 29px; fill: #111827; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .card { filter: url(#shadow); }
    .mainLine { fill: none; stroke: #2563EB; stroke-width: 5.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #64748B; stroke-width: 1.9; stroke-dasharray: 8 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#smallArrow); }
  </style>

  <rect x="0" y="0" width="1760" height="980" fill="#F8FAFC" />
  <rect x="28" y="28" width="1704" height="924" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2" />

  <text x="72" y="84" class="title">weighted path fallback</text>
  <text x="74" y="122" class="subtitle">Weighted shortest path and A* delegate to graph-core JVM runners while backends provide graph reads.</text>

  <rect x="76" y="160" width="1608" height="732" rx="20" class="panel" />

  <text x="120" y="224" class="section">1. Traversal API</text>
  <rect x="120" y="258" width="330" height="170" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.2" class="card" />
  <text x="285" y="300" text-anchor="middle" class="cardTitle">GraphOperations</text>
  <text x="156" y="340" class="body">shortestPath(...)</text>
  <text x="156" y="371" class="body">aStarPath(...)</text>
  <text x="156" y="400" class="small">same API across backends</text>

  <path d="M 450 344 L 528 344" class="mainLine" />

  <text x="560" y="224" class="section">2. Execution choice</text>
  <rect x="560" y="258" width="360" height="170" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.2" class="card" />
  <text x="740" y="300" text-anchor="middle" class="cardTitle">PathOptions</text>
  <text x="598" y="340" class="body">weightProperty == null</text>
  <text x="598" y="371" class="body">weightProperty != null</text>
  <text x="598" y="400" class="small">edgeLabel, direction, maxVisited</text>

  <path d="M 920 318 L 950.9 318 Q 960 318 960 308.9 L 960 303.1 Q 960 294 969.1 294 L 1000 294" class="dash" />
  <rect x="1016" y="258" width="296" height="90" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.8" />
  <text x="1046" y="294" class="cardTitle">Native path</text>
  <text x="1046" y="323" class="body">unweighted backend query</text>

  <path d="M 920 388 L 1000 388" class="mainLine" />

  <text x="1036" y="388" class="section">3. Weighted pipeline</text>

  <rect x="1036" y="422" width="500" height="136" rx="18" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2.2" class="card" />
  <text x="1286" y="462" text-anchor="middle" class="cardTitle">ShortestPathFallback</text>
  <text x="1074" y="500" class="body">fetchIncident(edgeLabel, direction)</text>
  <text x="1074" y="529" class="body">fetchVertex(id)</text>
  <text x="1074" y="550" class="small">backend reads are injected into graph-core runners</text>

  <path d="M 1286 558 L 1286 594" class="mainLine" />

  <rect x="1036" y="594" width="500" height="126" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.8" class="card" />
  <text x="1286" y="636" text-anchor="middle" class="cardTitle">Runner selection</text>
  <text x="1074" y="676" class="body">DijkstraRunner: cost priority queue</text>
  <text x="1074" y="704" class="body">AStarRunner: f = g + heuristic</text>

  <path d="M 1286 720 L 1286 766" class="mainLine" />

  <rect x="1036" y="766" width="500" height="102" rx="18" fill="#ECFEFF" stroke="#0891B2" stroke-width="2.2" class="card" />
  <text x="1286" y="804" text-anchor="middle" class="cardTitle">Shared helpers -&gt; GraphPath?</text>
  <text x="1074" y="834" class="body">validate cost, apply missing-weight policy</text>
  <text x="1074" y="858" class="small">reconstructPath turns cameFrom into steps + totalWeight</text>

  <rect x="118" y="598" width="700" height="150" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8" />
  <text x="154" y="640" class="cardTitle">Result contract</text>
  <text x="154" y="681" class="body">maxVisited bounds expansion; no path returns null.</text>
  <text x="154" y="712" class="body">Successful search returns GraphPath(steps, totalWeight).</text>

  <rect x="118" y="792" width="700" height="54" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" />
  <text x="468" y="826" text-anchor="middle" class="body">Missing weights follow Fail, Skip, or UseDefault policy.</text>

</svg>
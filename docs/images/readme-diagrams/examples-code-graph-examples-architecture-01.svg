<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .thin { stroke: #64748B; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Code Graph Examples Architecture</text>
  <text x="74" y="118" class="subtitle">Backend-independent code dependency modeling with shared sync and suspend test scenarios.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="300" y="214" text-anchor="middle" class="section">Domain Schema</text>
  <text x="920" y="214" text-anchor="middle" class="section">Example Services</text>
  <text x="1500" y="214" text-anchor="middle" class="section">Backend Test Matrix</text>

  <rect x="130" y="260" width="390" height="155" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="165" y="308" class="label">Vertex Labels</text>
  <text x="165" y="344" class="small">Module: name, path, version, language</text>
  <text x="165" y="372" class="small">Class: qualifiedName, module, type flags</text>
  <text x="165" y="400" class="small">Function: signature, className, lineCount</text>

  <rect x="130" y="520" width="390" height="170" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="165" y="568" class="label">Edge Labels</text>
  <text x="165" y="604" class="small">DEPENDS_ON and BELONGS_TO</text>
  <text x="165" y="632" class="small">EXTENDS, IMPLEMENTS, IMPORTS</text>
  <text x="165" y="660" class="small">CALLS with count and recursive flag</text>

  <rect x="700" y="245" width="440" height="170" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="735" y="293" class="label">CodeGraphService</text>
  <text x="735" y="329" class="small">GraphOperations based synchronous API</text>
  <text x="735" y="357" class="small">creates modules, classes, functions</text>
  <text x="735" y="385" class="small">queries paths, impact, inheritance, calls</text>

  <rect x="700" y="520" width="440" height="170" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="735" y="568" class="label">CodeGraphSuspendService</text>
  <text x="735" y="604" class="small">GraphSuspendOperations with Flow results</text>
  <text x="735" y="632" class="small">same graph commands, suspend writes</text>
  <text x="735" y="660" class="small">runSuspendIO test execution path</text>

  <rect x="1290" y="235" width="430" height="165" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="1325" y="283" class="label">Abstract Test Scenarios</text>
  <text x="1325" y="319" class="small">dependency path: top to middle to core</text>
  <text x="1325" y="347" class="small">impact radius via incoming traversal</text>
  <text x="1325" y="375" class="small">inheritance and function call chains</text>

  <g class="card">
    <ellipse cx="1505" cy="585" rx="220" ry="44" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <rect x="1285" y="585" width="440" height="150" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <ellipse cx="1505" cy="735" rx="220" ry="44" fill="#FDBA74" stroke="#F59E0B" stroke-width="3"/>
  </g>
  <text x="1505" y="608" text-anchor="middle" class="label">Graph Backends</text>
  <text x="1505" y="658" text-anchor="middle" class="small">Neo4j, Memgraph, Apache AGE</text>
  <text x="1505" y="692" text-anchor="middle" class="small">TinkerGraph in-memory</text>
  <text x="1505" y="726" text-anchor="middle" class="small">same service contract per backend</text>

  <path d="M 520 337 L 700 330" class="line"/>
  <path d="M 520 605 L 700 605" class="line"/>
  <path d="M 1140 330 L 1290 317" class="line"/>
  <path d="M 1140 605 L 1285 650" class="line"/>
  <path d="M 1505 400 L 1505 540" class="thin"/>

  <text x="610" y="312" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">typed labels</text>
  <text x="610" y="312" text-anchor="middle" class="tiny">typed labels</text>
  <text x="1215" y="300" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">shared assertions</text>
  <text x="1215" y="300" text-anchor="middle" class="tiny">shared assertions</text>
  <text x="1215" y="640" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">backend factories</text>
  <text x="1215" y="640" text-anchor="middle" class="tiny">backend factories</text>

  <rect x="185" y="810" width="1470" height="74" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="920" y="842" text-anchor="middle" class="small">Purpose: prove that code dependency graph logic is portable across graph database implementations.</text>

  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: code-graph-examples / architecture</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#334155" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 8.75 8.75" refX="8.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB" stroke-dasharray="none"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #475569; }
    .stateTitle { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #64748B; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.7; }
    .card { filter: url(#shadow); }
    .line { stroke: #2563EB; stroke-width: 3.6; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1600" height="980" fill="#F8FAFC"/>
  <rect x="26" y="26" width="1548" height="928" rx="24" fill="none" stroke="#93C5FD" stroke-width="4"/>
  <circle cx="1504" cy="68" r="15" fill="#DBEAFE"/>
  <circle cx="1464" cy="68" r="15" fill="#D1FAE5"/>
  <circle cx="1424" cy="68" r="15" fill="#FDE68A"/>

  <text x="72" y="82" class="title">GraphPath lifecycle</text>
  <text x="74" y="120" class="subtitle">Path values are created once; derived views are computed from immutable steps.</text>

  <rect x="72" y="158" width="1456" height="706" rx="20" class="panel"/>

  <circle cx="144" cy="390" r="22" fill="#0F172A"/>

  <rect x="214" y="280" width="272" height="220" rx="18" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="350" y="328" text-anchor="middle" class="stateTitle">Empty</text>
  <line x1="250" y1="352" x2="450" y2="352" stroke="#EF4444" stroke-width="2"/>
  <text x="350" y="386" text-anchor="middle" class="body">GraphPath.EMPTY</text>
  <text x="350" y="416" text-anchor="middle" class="body">emptyGraphPath()</text>
  <text x="350" y="446" text-anchor="middle" class="body">isEmpty == true</text>

  <rect x="560" y="280" width="272" height="220" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="696" y="328" text-anchor="middle" class="stateTitle">Constructed</text>
  <line x1="596" y1="352" x2="796" y2="352" stroke="#3B82F6" stroke-width="2"/>
  <text x="696" y="386" text-anchor="middle" class="body">GraphPath(steps)</text>
  <text x="696" y="416" text-anchor="middle" class="body">graphPathOf(...)</text>
  <text x="696" y="446" text-anchor="middle" class="body">PathStep list</text>

  <rect x="906" y="280" width="272" height="220" rx="18" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="1042" y="328" text-anchor="middle" class="stateTitle">Derived</text>
  <line x1="942" y1="352" x2="1142" y2="352" stroke="#22C55E" stroke-width="2"/>
  <text x="1042" y="386" text-anchor="middle" class="body">vertices from steps</text>
  <text x="1042" y="416" text-anchor="middle" class="body">edges from steps</text>
  <text x="1042" y="446" text-anchor="middle" class="body">length = edges.size</text>

  <rect x="1252" y="280" width="272" height="220" rx="18" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="1388" y="328" text-anchor="middle" class="stateTitle">Result</text>
  <line x1="1288" y1="352" x2="1488" y2="352" stroke="#8B5CF6" stroke-width="2"/>
  <text x="1388" y="386" text-anchor="middle" class="body">shortestPath</text>
  <text x="1388" y="416" text-anchor="middle" class="body">allPaths</text>
  <text x="1388" y="446" text-anchor="middle" class="body">aStarPath</text>

  <path d="M 166 390 L 212 390" class="line"/>
  <path d="M 486 390 L 558 390" class="line"/>
  <path d="M 832 390 L 904 390" class="line"/>
  <path d="M 1178 390 L 1250 390" class="line"/>

  <text x="522" y="366" text-anchor="middle" class="tiny" stroke="#F8FAFC" stroke-width="7" stroke-linejoin="round">build</text>
  <text x="522" y="366" text-anchor="middle" class="tiny">build</text>
  <text x="868" y="366" text-anchor="middle" class="tiny" stroke="#F8FAFC" stroke-width="7" stroke-linejoin="round">read views</text>
  <text x="868" y="366" text-anchor="middle" class="tiny">read views</text>
  <text x="1214" y="366" text-anchor="middle" class="tiny" stroke="#F8FAFC" stroke-width="7" stroke-linejoin="round">return</text>
  <text x="1214" y="366" text-anchor="middle" class="tiny">return</text>

  <rect x="248" y="594" width="1104" height="112" rx="16" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2.4" class="card"/>
  <text x="800" y="634" text-anchor="middle" class="stateTitle">PathStep order</text>
  <text x="800" y="668" text-anchor="middle" class="body">VertexStep, EdgeStep, VertexStep, ...</text>
  <text x="800" y="696" text-anchor="middle" class="small">totalWeight defaults to edge count; weighted algorithms may supply accumulated cost.</text>

</svg>

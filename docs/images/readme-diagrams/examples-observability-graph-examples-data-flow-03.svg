<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Observability Graph Data Flow</title>
  <desc id="desc">Import incident data and answer blast-radius questions</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5f6f82"/>
    </marker>
    <style>
      .canvas { fill: #fbfcfe; }
      .frame { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 30px; fill: #243142; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #5c6b7d; }
      .box-title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 18px; fill: #233044; }
      .box-text { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 13px; fill: #435266; }
      .label { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 12px; fill: #4f5e70; }
      .edge { fill: none; stroke: #5f6f82; stroke-width: 2.4; marker-end: url(#arrow); }
      .pill { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1; }
    </style>
  </defs>
  <rect class="canvas" width="1120" height="520"/>
  <rect class="frame" x="24" y="24" width="1072" height="472" rx="18"/>
  <text class="title" x="560" y="68" text-anchor="middle">Observability Graph Data Flow</text>
  <text class="subtitle" x="560" y="94" text-anchor="middle">Import incident data and answer blast-radius questions</text>

      <path class="edge" d="M 250 227.5 H 287.5 V 225 H 325"/>
      <rect class="pill" x="271" y="202.25" width="48" height="22" rx="11"/>
      <text class="label" x="295" y="217.25" text-anchor="middle">load</text>

      <path class="edge" d="M 535 225 H 577.5 V 225 H 620"/>
      <rect class="pill" x="556" y="201" width="53" height="22" rx="11"/>
      <text class="label" x="582.5" y="216" text-anchor="middle">query</text>

      <path class="edge" d="M 850 225 H 887.5 V 225 H 925"/>
      <rect class="pill" x="840" y="201" width="60" height="22" rx="11"/>
      <text class="label" x="870" y="216" text-anchor="middle">assert</text>

      <g>
        <rect x="70" y="175" width="180" height="105" rx="14" fill="#e8f4ff" stroke="#98c1df" stroke-width="2"/>
        <text class="box-title" x="160" y="209" text-anchor="middle">CSV Fixture</text>
        <text class="box-text" x="160" y="237" text-anchor="middle">vertices.csv</text>
<text class="box-text" x="160" y="258" text-anchor="middle">edges.csv</text>
      </g>

      <g>
        <rect x="325" y="150" width="210" height="150" rx="14" fill="#eaf7ef" stroke="#9ccdad" stroke-width="2"/>
        <text class="box-title" x="430" y="184" text-anchor="middle">Dataset Loader</text>
        <text class="box-text" x="430" y="212" text-anchor="middle">graph-io import</text>
<text class="box-text" x="430" y="233" text-anchor="middle">sync + suspend</text>
      </g>

      <g>
        <rect x="620" y="150" width="230" height="150" rx="14" fill="#fff4d8" stroke="#e3c46f" stroke-width="2"/>
        <text class="box-title" x="735" y="184" text-anchor="middle">Incident Service</text>
        <text class="box-text" x="735" y="212" text-anchor="middle">alertBoundary</text>
<text class="box-text" x="735" y="233" text-anchor="middle">affectedApis</text>
<text class="box-text" x="735" y="254" text-anchor="middle">owningTeams</text>
      </g>

      <g>
        <rect x="925" y="150" width="160" height="150" rx="14" fill="#fdecef" stroke="#d8a6b0" stroke-width="2"/>
        <text class="box-title" x="1005" y="184" text-anchor="middle">Expected Output</text>
        <text class="box-text" x="1005" y="212" text-anchor="middle">impacted APIs</text>
<text class="box-text" x="1005" y="233" text-anchor="middle">service boundary</text>
<text class="box-text" x="1005" y="254" text-anchor="middle">owner team</text>
      </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1057" viewBox="0 0 1800 1057" role="img" aria-labelledby="title desc">
  <title id="title">Observability graph examples data flow</title>
  <desc id="desc">CSV observability fixture is imported, queried through the incident service, and asserted against backend-independent expected answers.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 16 16" data-role="primary" data-tip-direction="positive-x">
      <path d="M0,0 L0,8 L10,4 z" fill="#2563EB" stroke-dasharray="none"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #F8FAFC; }
      .outer { fill: none; stroke: #60A5FA; stroke-width: 4; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; filter: url(#shadow); }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 48px; fill: #111827; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 22px; fill: #4B5563; }
      .section { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 31px; fill: #111827; }
      .label { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 27px; fill: #111827; }
      .small { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 17px; fill: #374151; }
      .tiny { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #4B5563; }
      .line { fill: none; stroke: #2563EB; stroke-width: 4; marker-end: url(#arrow); }
      .card { filter: url(#shadow); }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1057"/>
  <rect class="outer" x="24" y="24" width="1752" height="1009" rx="22"/>
  <text x="74" y="82" class="title">Observability Graph Example Data Flow</text>
  <text x="74" y="123" class="subtitle">CSV incident data is imported once, then every backend answers the same operational traversal questions.</text>
  <circle cx="1660" cy="78" r="15" fill="#EDE9FE"/>
  <circle cx="1700" cy="78" r="15" fill="#DCFCE7"/>
  <circle cx="1740" cy="78" r="15" fill="#FED7AA"/>

  <rect x="70" y="160" width="1660" height="760" rx="18" class="panel"/>

  <text x="150" y="230" class="section">Fixture</text>
  <text x="500" y="230" class="section">Import</text>
  <text x="825" y="230" class="section">Graph State</text>
  <text x="1165" y="230" class="section">Traversal Queries</text>
  <text x="1490" y="230" class="section">Expected Answers</text>

  <rect x="125" y="300" width="300" height="168" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="165" y="348" class="label">vertices.csv</text>
  <text x="165" y="384" class="small">4 Service, 2 Api</text>
  <text x="165" y="412" class="small">1 Team, 2 Alert</text>
  <text x="165" y="440" class="small">1 Incident</text>

  <rect x="125" y="555" width="300" height="168" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="165" y="603" class="label">edges.csv</text>
  <text x="165" y="639" class="small">DEPENDS_ON path</text>
  <text x="165" y="667" class="small">ALERTS_ON signals</text>
  <text x="165" y="695" class="small">OWNED_BY and ROOT_CAUSE</text>

  <rect x="500" y="360" width="280" height="170" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="540" y="408" class="label">Dataset Loader</text>
  <text x="540" y="444" class="small">DatasetLoader</text>
  <text x="540" y="472" class="small">CSV bulk importer</text>
  <text x="540" y="500" class="small">sync + suspend</text>

  <ellipse cx="960" cy="405" rx="150" ry="42" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <rect x="810" y="405" width="300" height="190" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3"/>
  <ellipse cx="960" cy="595" rx="150" ry="42" fill="#99F6E4" stroke="#14B8A6" stroke-width="3"/>
  <text x="960" y="447" text-anchor="middle" class="label">observability Graph</text>
  <text x="960" y="486" text-anchor="middle" class="small">checkout -> payment</text>
  <text x="960" y="514" text-anchor="middle" class="small">payment -> postgres</text>
  <text x="960" y="542" text-anchor="middle" class="small">alerts and ownership</text>

  <rect x="1180" y="285" width="315" height="170" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" class="card"/>
  <text x="1220" y="333" class="label">Blast Radius</text>
  <text x="1220" y="369" class="small">downstreamDependencies</text>
  <text x="1220" y="397" class="small">upstreamImpactedServices</text>
  <text x="1220" y="425" class="small">affectedApis</text>

  <rect x="1180" y="545" width="315" height="170" rx="14" fill="#F3E8FF" stroke="#A855F7" stroke-width="3" class="card"/>
  <text x="1220" y="593" class="label">Incident Boundary</text>
  <text x="1220" y="629" class="small">alertBoundary(alertIds)</text>
  <text x="1220" y="657" class="small">owningTeams(payment)</text>
  <text x="1220" y="685" class="small">same abstract tests</text>

  <rect x="1535" y="285" width="170" height="170" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="3" class="card"/>
  <text x="1570" y="333" class="label">Impact</text>
  <text x="1570" y="369" class="small">payment svc</text>
  <text x="1570" y="397" class="small">postgres</text>
  <text x="1570" y="425" class="small">checkout APIs</text>

  <rect x="1535" y="545" width="170" height="170" rx="14" fill="#FDF2F8" stroke="#EC4899" stroke-width="3" class="card"/>
  <text x="1570" y="593" class="label">Owner</text>
  <text x="1570" y="629" class="small">checkout svc</text>
  <text x="1570" y="657" class="small">payment svc</text>
  <text x="1570" y="685" class="small">payments-team</text>

  <path d="M 425 384 L 452 384 Q 470 384 470 402 L 470 412 Q 470 430 488 430 L 490 430" class="line"/>
  <path d="M 425 638 L 452 638 Q 470 638 470 620 L 470 496 Q 470 478 488 478 L 490 478" class="line"/>
  <path d="M 780 448 L 810 448" class="line"/>
  <path d="M 1110 448 L 1122 448 Q 1140 448 1140 430 L 1140 388 Q 1140 370 1158 370 L 1170 370" class="line"/>
  <path d="M 1110 530 L 1122 530 Q 1140 530 1140 548 L 1140 612 Q 1140 630 1158 630 L 1170 630" class="line"/>
  <path d="M 1495 370 L 1525 370" class="line"/>
  <path d="M 1495 630 L 1525 630" class="line"/>

  <rect x="215" y="825" width="1370" height="62" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="900" y="855" text-anchor="middle" class="small">The tests import or seed the same graph, query portable traversal APIs, and assert deterministic incident-response answers.</text>

  <text x="900" y="1000" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: observability-graph-examples / data flow</text>
</svg>

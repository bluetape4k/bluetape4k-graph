<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="980" viewBox="0 0 1580 980" role="img" aria-label="Bluetape4k Graph Architecture">
<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
  <style>
    .bg{fill:#ffffff}.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#111827;font-weight:400}.subtitle{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:16px;fill:#6b7280;font-weight:400}
    .layer{fill:#f3f6fa;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:8 6}.layer-title{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .card{fill:#ffffff;stroke:#94a3b8;stroke-width:1.9}.card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:23px;fill:#111827;font-weight:400}.detail{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#6b7280;font-weight:400}
    .label{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:12px;fill:#374151;font-weight:400}.legend{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:12px;fill:#6b7280;font-weight:400}.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#6b7280;font-weight:400}
    .edge-blue{stroke:#2563eb;stroke-width:2.1;fill:none;marker-end:url(#arrow-blue);stroke-linecap:round;stroke-linejoin:round}.edge-green{stroke:#16a34a;stroke-width:2.1;fill:none;marker-end:url(#arrow-green);stroke-linecap:round;stroke-linejoin:round}
    .edge-orange{stroke:#ea580c;stroke-width:2.1;fill:none;marker-end:url(#arrow-orange);stroke-linecap:round;stroke-linejoin:round}.edge-purple{stroke:#9333ea;stroke-width:2.0;fill:none;marker-end:url(#arrow-purple);stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="bg" width="1580" height="980"/>
<rect x="30" y="28" width="1520" height="920" rx="20" fill="none" stroke="#d6e2ed" stroke-width="1.5"/>
<desc>Root README runtime architecture: application entry points call graph-core contracts; backend adapters translate those contracts into native database runtimes; Graph I/O and framework modules remain supporting integration surfaces around the same core.</desc>
<text class="title" x="70" y="78">Bluetape4k Graph Architecture</text>
<text class="subtitle" x="74" y="112">Application entry points target graph-core; adapters translate the same contracts to native graph database runtimes.</text>

<rect class="layer" x="88" y="172" width="1404" height="132" rx="8"/>
<text class="layer-title" x="108" y="198">APPLICATION ENTRY POINTS</text>
<rect class="layer" x="88" y="338" width="1404" height="150" rx="8"/>
<text class="layer-title" x="108" y="364">GRAPH-CORE CONTRACTS</text>
<rect class="layer" x="88" y="524" width="1404" height="176" rx="8"/>
<text class="layer-title" x="108" y="550">RUNTIME ADAPTERS AND SUPPORT MODULES</text>
<rect class="layer" x="88" y="734" width="1404" height="140" rx="8"/>
<text class="layer-title" x="108" y="756">GRAPH DATABASE RUNTIMES</text>

<g id="edges">
  <path class="edge-blue" d="M 435 248 L 630 248"/>
  <text class="label" x="532" y="224" text-anchor="middle">service call</text>
  <path class="edge-blue" d="M 950 248 L 1145 248"/>
  <text class="label" x="1048" y="224" text-anchor="middle">web entry</text>
  <path class="edge-blue" d="M 790 296 L 790 365"/>
  <text class="label" x="835" y="332" text-anchor="middle">uses</text>
  <path class="edge-blue" d="M 1312 296 L 1312 590 L 1120 590"/>
  <text class="label" x="1298" y="445" text-anchor="end">plugin delegates</text>
  <path class="edge-green" d="M 790 488 L 790 572"/>
  <text class="label" x="837" y="530" text-anchor="middle">contracts</text>
  <path class="edge-purple" d="M 710 488 L 710 528 L 430 528 L 430 572"/>
  <text class="label" x="570" y="518" text-anchor="middle">bulk import/export</text>
  <path class="edge-green" d="M 870 488 L 870 528 L 1150 528 L 1150 572"/>
  <text class="label" x="1010" y="518" text-anchor="middle">configuration</text>
  <path class="edge-orange" d="M 790 672 L 790 774"/>
  <text class="label" x="790" y="724" text-anchor="middle">native query translation</text>
</g>

<g id="cards">
  <g id="apps">
    <rect class="card" x="116" y="210" width="319" height="88" rx="8"/>
    <rect x="132" y="228" width="48" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
    <text class="label" x="156" y="258" text-anchor="middle">APP</text>
    <text class="card-title" x="198" y="246">Kotlin services</text>
    <text class="detail" x="198" y="272">blocking or coroutine callers</text>
  </g>
  <g id="api">
    <rect class="card" x="630" y="210" width="319" height="88" rx="8"/>
    <rect x="646" y="228" width="48" height="48" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.3"/>
    <text class="label" x="670" y="258" text-anchor="middle">API</text>
    <text class="card-title" x="712" y="246">Graph API facade</text>
    <text class="detail" x="712" y="272">stable application surface</text>
  </g>
  <g id="web">
    <rect class="card" x="1145" y="210" width="319" height="88" rx="8"/>
    <rect x="1161" y="228" width="48" height="48" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
    <text class="label" x="1185" y="258" text-anchor="middle">WEB</text>
    <text class="card-title" x="1227" y="246">Ktor / Spring Boot</text>
    <text class="detail" x="1227" y="272">plugin and auto-config entry</text>
  </g>

  <g id="core">
    <rect class="card" x="594" y="364" width="392" height="124" rx="8"/>
    <rect x="612" y="384" width="48" height="48" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.3"/>
    <text class="label" x="636" y="414" text-anchor="middle">CORE</text>
    <text class="card-title" x="682" y="402">graph-core</text>
    <text class="detail" x="682" y="428">GraphOperations + suspend API</text>
    <text class="detail" x="682" y="450">Vertex, Edge, Path, Schema DSL</text>
  </g>

  <g id="io">
    <rect class="card" x="146" y="572" width="310" height="100" rx="8"/>
    <rect x="164" y="590" width="48" height="48" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.3"/>
    <text class="label" x="188" y="620" text-anchor="middle">IO</text>
    <text class="card-title" x="234" y="608">Graph I/O</text>
    <text class="detail" x="234" y="634">CSV, NDJSON, GraphML, OkIO</text>
  </g>
  <g id="adapters">
    <rect class="card" x="550" y="572" width="480" height="100" rx="8"/>
    <rect x="568" y="590" width="48" height="48" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
    <text class="label" x="592" y="620" text-anchor="middle">DRV</text>
    <text class="card-title" x="638" y="608">Backend adapters</text>
    <text class="detail" x="638" y="634">Neo4j, Memgraph, AGE, TinkerPop, FalkorDB translation</text>
  </g>
  <g id="frameworks">
    <rect class="card" x="1120" y="572" width="310" height="100" rx="8"/>
    <rect x="1138" y="590" width="48" height="48" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.3"/>
    <text class="label" x="1162" y="620" text-anchor="middle">INT</text>
    <text class="card-title" x="1208" y="608">Framework wiring</text>
    <text class="detail" x="1208" y="634">routes, beans, properties</text>
  </g>

  <g id="dbs">
    <rect class="card" x="180" y="774" width="1220" height="80" rx="8"/>
    <rect x="210" y="792" width="160" height="44" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.3"/>
    <text class="card-title" x="290" y="820" text-anchor="middle">Neo4j</text>
    <rect x="410" y="792" width="180" height="44" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.3"/>
    <text class="card-title" x="500" y="820" text-anchor="middle">Memgraph</text>
    <rect x="630" y="792" width="160" height="44" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.3"/>
    <text class="card-title" x="710" y="820" text-anchor="middle">AGE</text>
    <rect x="830" y="792" width="180" height="44" rx="8" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.3"/>
    <text class="card-title" x="920" y="820" text-anchor="middle">TinkerPop</text>
    <rect x="1050" y="792" width="180" height="44" rx="8" fill="#fee2e2" stroke="#fecaca" stroke-width="1.3"/>
    <text class="card-title" x="1140" y="820" text-anchor="middle">FalkorDB</text>
    <text class="detail" x="1308" y="821" text-anchor="middle">native graph runtimes</text>
  </g>
</g>

<g id="legend" transform="translate(108 900)">
  <line x1="0" y1="8" x2="34" y2="8" class="edge-blue"/><text class="legend" x="46" y="12">application entry</text>
  <line x1="200" y1="8" x2="234" y2="8" class="edge-green"/><text class="legend" x="246" y="12">contract delegation</text>
  <line x1="440" y1="8" x2="474" y2="8" class="edge-orange"/><text class="legend" x="486" y="12">backend query translation</text>
  <line x1="730" y1="8" x2="764" y2="8" class="edge-purple"/><text class="legend" x="776" y="12">bulk graph data path</text>
</g>
<text class="note" x="790" y="948" text-anchor="middle">https://github.com/bluetape4k/bluetape4k-graph | project: bluetape4k-graph | module: root</text>
</svg>

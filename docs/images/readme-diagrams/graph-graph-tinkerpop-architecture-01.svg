<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">graph-tinkerpop architecture diagram</title>
  <desc id="desc">Architecture diagram for the graph-tinkerpop module showing graph-core API entry points, sync and coroutine adapters, embedded TinkerGraph, schema metadata, mapping, and algorithm execution paths.</desc>
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 10 6 L 2 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .layerTitle { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #64748B; font-weight: 700; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .cardTitleSmall { font-family: 'Architects Daughter', cursive; font-size: 25px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 16px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #475569; }
    .label { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; font-weight: 700; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .zone { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .flow { fill: none; stroke: #2563EB; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
    .dep { fill: none; stroke: #64748B; stroke-width: 2.0; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSlate); }
  </style>

  <rect width="1680" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1624" height="1024" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1608" cy="66" r="14" fill="#FED7AA"/>
  <circle cx="1570" cy="66" r="14" fill="#DCFCE7"/>
  <circle cx="1532" cy="66" r="14" fill="#EDE9FE"/>

  <text x="72" y="84" class="title">graph-tinkerpop architecture</text>
  <text x="74" y="122" class="subtitle">Embedded TinkerGraph adapter for tests and prototypes: no server, shared graph-core API, in-memory state.</text>

  <rect x="70" y="160" width="1540" height="790" rx="20" class="panel"/>

  <rect x="108" y="198" width="300" height="590" rx="18" class="zone"/>
  <text x="132" y="230" class="layerTitle">graph-core API</text>

  <rect x="128" y="262" width="260" height="152" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" class="card"/>
  <text x="258" y="302" text-anchor="middle" class="cardTitleSmall">Sync API</text>
  <line x1="154" y1="324" x2="362" y2="324" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="156" y="354" class="body">GraphOperations</text>
  <text x="156" y="380" class="small">CRUD / traversal / merge</text>

  <rect x="128" y="482" width="260" height="166" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.8" class="card"/>
  <text x="258" y="522" text-anchor="middle" class="cardTitleSmall">Coroutine API</text>
  <line x1="154" y1="544" x2="362" y2="544" stroke="#C4B5FD" stroke-width="1.3"/>
  <text x="156" y="574" class="body">GraphSuspendOperations</text>
  <text x="156" y="600" class="small">suspend methods + Flow</text>
  <text x="156" y="626" class="small">Dispatchers.IO wrapper</text>

  <rect x="484" y="214" width="438" height="268" rx="16" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.9" class="card"/>
  <text x="703" y="254" text-anchor="middle" class="cardTitle">TinkerGraphOperations</text>
  <line x1="526" y1="278" x2="880" y2="278" stroke="#C4B5FD" stroke-width="1.3"/>
  <text x="530" y="308" class="body">implements graph-core contracts</text>
  <text x="530" y="335" class="body">owns TinkerGraph + traversal source</text>
  <text x="530" y="362" class="body">snapshot/restore transaction DSL</text>
  <text x="530" y="389" class="body">Semaphore gate + write lock</text>
  <line x1="526" y1="410" x2="880" y2="410" stroke="#C4B5FD" stroke-width="1.3"/>
  <text x="530" y="440" class="small">best for tests, embedded fixtures, local prototypes</text>

  <rect x="484" y="550" width="438" height="190" rx="16" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.8" class="card"/>
  <text x="703" y="590" text-anchor="middle" class="cardTitleSmall">TinkerGraphSuspendOperations</text>
  <line x1="526" y1="612" x2="880" y2="612" stroke="#99F6E4" stroke-width="1.3"/>
  <text x="530" y="642" class="body">delegates to sync operations</text>
  <text x="530" y="669" class="body">materializes Flow results in transaction</text>
  <text x="530" y="696" class="body">uses IO/Default dispatchers</text>

  <rect x="1002" y="214" width="500" height="268" rx="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.9" class="card"/>
  <text x="1252" y="254" text-anchor="middle" class="cardTitle">Embedded TinkerGraph</text>
  <line x1="1044" y1="278" x2="1460" y2="278" stroke="#BBF7D0" stroke-width="1.3"/>
  <text x="1048" y="308" class="body">TinkerGraph.open()</text>
  <text x="1048" y="335" class="body">GraphTraversalSource g</text>
  <text x="1048" y="362" class="body">Vertex / Edge / Path objects</text>
  <text x="1048" y="389" class="body">in-process memory only</text>
  <line x1="1044" y1="410" x2="1460" y2="410" stroke="#BBF7D0" stroke-width="1.3"/>
  <text x="1048" y="440" class="small">no Docker, no network, close() closes the graph</text>

  <rect x="1002" y="548" width="230" height="190" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="1.8" class="card"/>
  <text x="1117" y="588" text-anchor="middle" class="cardTitleSmall">Schema Metadata</text>
  <line x1="1030" y1="610" x2="1204" y2="610" stroke="#FDE68A" stroke-width="1.3"/>
  <text x="1032" y="640" class="small">records indexes</text>
  <text x="1032" y="666" class="small">list/drop metadata</text>
  <text x="1032" y="692" class="small">unique constraints fail</text>

  <rect x="1272" y="548" width="230" height="190" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.8" class="card"/>
  <text x="1387" y="588" text-anchor="middle" class="cardTitleSmall">Model Mapper</text>
  <line x1="1300" y1="610" x2="1474" y2="610" stroke="#FECACA" stroke-width="1.3"/>
  <text x="1302" y="640" class="small">Vertex to GraphVertex</text>
  <text x="1302" y="666" class="small">Edge to GraphEdge</text>
  <text x="1302" y="692" class="small">Path to GraphPath</text>

  <rect x="484" y="794" width="1018" height="92" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="520" y="828" class="body">Algorithm execution:</text>
  <text x="720" y="828" class="small">Gremlin traversals for neighbor/path/degree.</text>
  <text x="520" y="856" class="small">JVM helpers handle weighted path, A* path, PageRank, BFS/DFS, cycles, and components.</text>

  <path d="M 388 338 L 484 338" class="flow"/>
  <path d="M 388 564 L 418 564 Q 436 564 436 582 L 436 610 Q 436 628 454 628 L 484 628" class="flow"/>
  <path d="M 922 338 L 1002 338" class="flow"/>
  <path d="M 703 550 L 703 482" class="dep"/>
  <path d="M 842 482 L 842 497 Q 842 515 860 515 L 1050 515 Q 1068 515 1068 533 L 1068 548" class="dep"/>
  <path d="M 882 482 L 882 497 Q 882 515 900 515 L 1310 515 Q 1328 515 1328 533 L 1328 548" class="dep"/>

  <text x="436" y="326" text-anchor="middle" class="label">calls</text>
  <text x="424" y="584" text-anchor="middle" class="label">calls</text>
  <text x="962" y="326" text-anchor="middle" class="label">traverses</text>
  <text x="730" y="520" class="label">wraps</text>
  <text x="988" y="524" text-anchor="middle" class="label">schema</text>
  <text x="1140" y="524" text-anchor="middle" class="label">maps</text>

  <rect x="160" y="968" width="1360" height="54" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="840" y="1001" text-anchor="middle" class="small">TinkerPop backend is an embedded adapter: graph state, schema metadata, and rollback snapshots live inside the operations instance.</text>
</svg>

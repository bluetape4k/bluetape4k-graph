<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#D97706"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 52px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 19px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 29px; fill: #111827; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 25px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .lane { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .flow { fill: none; stroke: #2563EB; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
    .route { fill: none; stroke: #059669; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
    .life { fill: none; stroke: #D97706; stroke-width: 3.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
  </style>

  <rect x="0" y="0" width="1760" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1704" height="1024" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2"/>

  <text x="72" y="86" class="title">graph-ktor architecture</text>
  <text x="74" y="124" class="subtitle">GraphPlugin installs one explicit graph backend and exposes sync plus coroutine facades to Ktor routes.</text>

  <rect x="74" y="166" width="1612" height="808" rx="20" class="panel"/>

  <rect x="112" y="214" width="350" height="610" rx="18" class="lane"/>
  <text x="142" y="264" class="section">1. Install contract</text>
  <text x="144" y="296" class="small">One backend is selected at install time.</text>

  <rect x="148" y="336" width="278" height="112" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.9" class="card"/>
  <text x="287" y="372" text-anchor="middle" class="cardTitle">install(GraphPlugin)</text>
  <text x="287" y="402" text-anchor="middle" class="body">createApplicationPlugin</text>
  <text x="287" y="427" text-anchor="middle" class="small">fails if no backend is selected</text>

  <rect x="148" y="496" width="278" height="118" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.9" class="card"/>
  <text x="287" y="532" text-anchor="middle" class="cardTitle">Backend helpers</text>
  <text x="287" y="562" text-anchor="middle" class="body">tinkerGraph / operations</text>
  <text x="287" y="587" text-anchor="middle" class="small">neo4j, memgraph, age, falkorDB</text>

  <rect x="148" y="662" width="278" height="94" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.9" class="card"/>
  <text x="287" y="696" text-anchor="middle" class="cardTitle">Managed DSLs</text>
  <text x="287" y="724" text-anchor="middle" class="small">plugin-created driver or pool</text>

  <rect x="520" y="214" width="350" height="610" rx="18" class="lane"/>
  <text x="550" y="264" class="section">2. Resolve state</text>
  <text x="552" y="296" class="small">Factories create the Ktor graph state.</text>

  <rect x="558" y="336" width="274" height="122" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.9" class="card"/>
  <text x="695" y="372" text-anchor="middle" class="cardTitle">GraphPluginConfig</text>
  <text x="695" y="402" text-anchor="middle" class="body">exactly one configure()</text>
  <text x="695" y="427" text-anchor="middle" class="small">sync and suspend factories</text>

  <rect x="558" y="500" width="274" height="112" rx="16" fill="#DCFCE7" stroke="#10B981" stroke-width="1.9" class="card"/>
  <text x="695" y="536" text-anchor="middle" class="cardTitle">GraphPluginState</text>
  <text x="695" y="566" text-anchor="middle" class="body">GraphOperations</text>
  <text x="695" y="591" text-anchor="middle" class="body">GraphSuspendOperations</text>

  <rect x="558" y="664" width="274" height="94" rx="16" fill="#E0F2FE" stroke="#06B6D4" stroke-width="1.9" class="card"/>
  <text x="695" y="698" text-anchor="middle" class="cardTitle">Application attributes</text>
  <text x="695" y="727" text-anchor="middle" class="small">GraphPluginStateKey stores state</text>

  <rect x="928" y="214" width="350" height="610" rx="18" class="lane"/>
  <text x="958" y="264" class="section">3. Route access</text>
  <text x="960" y="296" class="small">ApplicationCall delegates to Application.</text>

  <rect x="966" y="342" width="274" height="112" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.9" class="card"/>
  <text x="1103" y="378" text-anchor="middle" class="cardTitle">Application extensions</text>
  <text x="1103" y="408" text-anchor="middle" class="small">graphOperations()</text>
  <text x="1103" y="430" text-anchor="middle" class="small">graphSuspendOperations()</text>

  <rect x="966" y="506" width="274" height="112" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.9" class="card"/>
  <text x="1103" y="542" text-anchor="middle" class="cardTitle">Route handlers</text>
  <text x="1103" y="572" text-anchor="middle" class="body">ApplicationCall helpers</text>
  <text x="1103" y="597" text-anchor="middle" class="small">prefer suspend facade in routes</text>

  <rect x="966" y="668" width="274" height="94" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="1.9" class="card"/>
  <text x="1103" y="702" text-anchor="middle" class="cardTitle">Backend modules</text>
  <text x="1103" y="730" text-anchor="middle" class="small">application declares dependency</text>

  <rect x="1336" y="214" width="310" height="610" rx="18" class="lane"/>
  <text x="1366" y="264" class="section">4. Lifecycle boundary</text>
  <text x="1368" y="296" class="small">Only plugin-owned resources close.</text>

  <rect x="1370" y="340" width="242" height="112" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.9" class="card"/>
  <text x="1491" y="376" text-anchor="middle" class="cardTitle">ApplicationStarted</text>
  <text x="1491" y="406" text-anchor="middle" class="small">state is ready for routes</text>

  <rect x="1370" y="506" width="242" height="122" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="1.9" class="card"/>
  <text x="1491" y="542" text-anchor="middle" class="cardTitle">ApplicationStopped</text>
  <text x="1491" y="572" text-anchor="middle" class="body">close actions run</text>
  <text x="1491" y="597" text-anchor="middle" class="small">failures do not stop cleanup</text>

  <rect x="1370" y="678" width="242" height="84" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="1491" y="710" text-anchor="middle" class="small">Caller-owned drivers and</text>
  <text x="1491" y="734" text-anchor="middle" class="small">DataSources stay open.</text>

  <path d="M 426 392 L 558 397" class="flow"/>
  <path d="M 426 555 L 558 397" class="route"/>
  <path d="M 426 710 L 558 397" class="life"/>
  <path d="M 695 458 L 695 500" class="flow"/>
  <path d="M 695 612 L 695 664" class="route"/>
  <path d="M 832 711 L 966 398" class="route"/>
  <path d="M 1103 454 L 1103 506" class="route"/>

  <rect x="228" y="858" width="1304" height="76" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="880" y="887" text-anchor="middle" class="small">The plugin never picks a production backend implicitly; install fails until exactly one backend helper configures state.</text>
  <text x="880" y="914" text-anchor="middle" class="small">Route code reads GraphOperations from Application attributes, while ApplicationStopped runs only registered close actions.</text>
</svg>

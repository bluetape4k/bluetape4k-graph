<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .thin { stroke: #64748B; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">graph-ktor Plugin Architecture</text>
  <text x="74" y="118" class="subtitle">Ktor installs one explicit graph backend, stores resolved state in Application attributes, exposes route helpers, and closes only plugin-owned resources.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="275" y="215" text-anchor="middle" class="section">Ktor Application</text>
  <text x="835" y="215" text-anchor="middle" class="section">GraphPlugin Core</text>
  <text x="1430" y="215" text-anchor="middle" class="section">Backend Selection</text>

  <rect x="130" y="265" width="340" height="150" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="165" y="313" class="label">install(GraphPlugin)</text>
  <text x="165" y="349" class="small">createApplicationPlugin("Graph")</text>
  <text x="165" y="377" class="small">configuration block selects backend</text>
  <text x="165" y="405" class="small">fails when no backend is selected</text>

  <rect x="130" y="515" width="340" height="150" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="165" y="563" class="label">Route Handlers</text>
  <text x="165" y="599" class="small">call.graphOperations()</text>
  <text x="165" y="627" class="small">call.graphSuspendOperations()</text>
  <text x="165" y="655" class="small">Application extension lookup</text>

  <rect x="620" y="250" width="430" height="155" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="655" y="298" class="label">GraphPluginConfig</text>
  <text x="655" y="334" class="small">exactly one backend helper</text>
  <text x="655" y="362" class="small">operations(sync, suspend)</text>
  <text x="655" y="390" class="small">closeActions for owned resources</text>

  <rect x="620" y="475" width="430" height="155" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="655" y="523" class="label">GraphPluginState</text>
  <text x="655" y="559" class="small">GraphOperations</text>
  <text x="655" y="587" class="small">GraphSuspendOperations</text>
  <text x="655" y="615" class="small">stored in Application.attributes</text>

  <rect x="620" y="725" width="430" height="120" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="655" y="773" class="label">ApplicationStopped</text>
  <text x="655" y="809" class="small">state.close() runs close actions</text>
  <text x="655" y="837" class="small">close failures do not block the rest</text>

  <rect x="1200" y="245" width="450" height="170" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="1235" y="293" class="label">In-memory / Existing Ops</text>
  <text x="1235" y="329" class="small">tinkerGraph()</text>
  <text x="1235" y="357" class="small">operations(syncOps, suspendOps)</text>
  <text x="1235" y="385" class="small">closeOnStop is explicit</text>

  <rect x="1200" y="465" width="450" height="170" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1235" y="513" class="label">Driver-backed Databases</text>
  <text x="1235" y="549" class="small">neo4j(driver), memgraph(driver)</text>
  <text x="1235" y="577" class="small">falkorDB(driver, graphName)</text>
  <text x="1235" y="605" class="small">caller-owned drivers remain external</text>

  <rect x="1200" y="705" width="450" height="150" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="1235" y="753" class="label">Managed Resources</text>
  <text x="1235" y="789" class="small">neo4j { uri; user; password }</text>
  <text x="1235" y="817" class="small">memgraph { ... } / falkorDB { ... }</text>
  <text x="1235" y="845" class="small">ageDataSource { Hikari + Exposed }</text>

  <path d="M 470 340 L 620 340" class="line"/>
  <path d="M 835 405 L 835 475" class="line"/>
  <path d="M 470 590 L 620 552" class="line"/>
  <path d="M 1050 327 L 1200 327" class="line"/>
  <path d="M 1050 552 L 1200 550" class="thin"/>
  <path d="M 1050 785 L 1200 780" class="thin"/>
  <path d="M 835 630 L 835 725" class="thin"/>

  <text x="545" y="318" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">resolveState</text>
  <text x="545" y="318" text-anchor="middle" class="tiny">resolveState</text>
  <text x="1115" y="305" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">select one</text>
  <text x="1115" y="305" text-anchor="middle" class="tiny">select one</text>
  <text x="1115" y="528" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">construct ops</text>
  <text x="1115" y="528" text-anchor="middle" class="tiny">construct ops</text>
  <text x="1115" y="756" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">register close</text>
  <text x="1115" y="756" text-anchor="middle" class="tiny">register close</text>
  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: graph-ktor / architecture</text>
</svg>

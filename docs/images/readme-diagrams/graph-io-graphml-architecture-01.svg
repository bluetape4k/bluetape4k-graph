<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 21 21" refX="22" refY="12" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#059669" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 21 21" refX="22" refY="12" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#2563EB" stroke-dasharray="none"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 52px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 19px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 26px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .lane { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .import { fill: none; stroke: #059669; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
    .export { fill: none; stroke: #2563EB; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
  </style>

  <rect x="0" y="0" width="1760" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1704" height="1024" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2"/>

  <text x="72" y="86" class="title">graph-io-graphml architecture</text>
  <text x="74" y="124" class="subtitle">GraphML support maps a directed property-graph subset through cached StAX readers and writers.</text>

  <rect x="74" y="166" width="1612" height="798" rx="20" class="panel"/>

  <rect x="112" y="214" width="352" height="600" rx="18" class="lane"/>
  <text x="142" y="264" class="section">1. GraphML XML</text>
  <text x="144" y="296" class="small">Directed property-graph subset.</text>

  <rect x="150" y="340" width="276" height="108" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.9" class="card"/>
  <text x="288" y="375" text-anchor="middle" class="cardTitle">key definitions</text>
  <text x="288" y="404" text-anchor="middle" class="body">attr.name + attr.type</text>
  <text x="288" y="429" text-anchor="middle" class="small">label data is configurable</text>

  <rect x="150" y="500" width="276" height="116" rx="16" fill="#DCFCE7" stroke="#10B981" stroke-width="1.9" class="card"/>
  <text x="288" y="536" text-anchor="middle" class="cardTitle">node / edge</text>
  <text x="288" y="566" text-anchor="middle" class="body">id, source, target</text>
  <text x="288" y="592" text-anchor="middle" class="small">scalar data becomes properties</text>

  <rect x="150" y="682" width="276" height="86" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="288" y="714" text-anchor="middle" class="small">Unsupported constructs are</text>
  <text x="288" y="738" text-anchor="middle" class="small">reported as WARN or ERROR.</text>

  <rect x="526" y="214" width="362" height="600" rx="18" class="lane"/>
  <text x="556" y="264" class="section">2. StAX boundary</text>
  <text x="558" y="296" class="small">Cached XML factories avoid setup cost.</text>

  <rect x="568" y="340" width="278" height="126" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.9" class="card"/>
  <text x="707" y="376" text-anchor="middle" class="cardTitle">StaxGraphMlReader</text>
  <text x="707" y="406" text-anchor="middle" class="body">parse key, node, edge</text>
  <text x="707" y="431" text-anchor="middle" class="small">coerce scalar attr types</text>

  <rect x="568" y="518" width="278" height="126" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.9" class="card"/>
  <text x="707" y="554" text-anchor="middle" class="cardTitle">StaxGraphMlWriter</text>
  <text x="707" y="584" text-anchor="middle" class="body">write keys first</text>
  <text x="707" y="609" text-anchor="middle" class="small">then graph, nodes, edges</text>

  <rect x="568" y="688" width="278" height="94" rx="16" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.9" class="card"/>
  <text x="707" y="719" text-anchor="middle" class="cardTitle">Options</text>
  <text x="707" y="747" text-anchor="middle" class="small">labelAttrName, policy,</text>
  <text x="707" y="768" text-anchor="middle" class="small">edgeDefault, graphId</text>

  <rect x="950" y="214" width="390" height="600" rx="18" class="lane"/>
  <text x="980" y="264" class="section">3. Import and export</text>
  <text x="982" y="296" class="small">GraphML records delegate to graph-io-core.</text>

  <rect x="992" y="336" width="306" height="144" rx="16" fill="#DCFCE7" stroke="#10B981" stroke-width="1.9" class="card"/>
  <text x="1145" y="378" text-anchor="middle" class="cardTitle">Import path</text>
  <text x="1145" y="407" text-anchor="middle" class="body">vertices build</text>
  <text x="1145" y="432" text-anchor="middle" class="body">external-id map</text>
  <text x="1145" y="457" text-anchor="middle" class="small">edges resolve after vertex flush</text>

  <rect x="992" y="528" width="306" height="120" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.9" class="card"/>
  <text x="1145" y="560" text-anchor="middle" class="cardTitle">Export path</text>
  <text x="1145" y="590" text-anchor="middle" class="body">selected labels</text>
  <text x="1145" y="615" text-anchor="middle" class="body">become GraphML records</text>
  <text x="1145" y="640" text-anchor="middle" class="small">labels stored as data elements</text>

  <rect x="992" y="688" width="306" height="76" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="1.9" class="card"/>
  <text x="1145" y="719" text-anchor="middle" class="cardTitle">Core helpers</text>
  <text x="1145" y="748" text-anchor="middle" class="body">Paths, BatchWriter, reports</text>

  <rect x="1400" y="214" width="246" height="600" rx="18" class="lane"/>
  <text x="1430" y="264" class="section">4. API variants</text>
  <text x="1432" y="296" class="small">Same XML contract.</text>

  <rect x="1426" y="348" width="194" height="82" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.9" class="card"/>
  <text x="1523" y="380" text-anchor="middle" class="cardTitle">Sync</text>
  <text x="1523" y="406" text-anchor="middle" class="small">GraphOperations</text>

  <rect x="1426" y="486" width="194" height="96" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.9" class="card"/>
  <text x="1523" y="518" text-anchor="middle" class="cardTitle">Suspend</text>
  <text x="1523" y="544" text-anchor="middle" class="small">GraphSuspend</text>
  <text x="1523" y="566" text-anchor="middle" class="small">Operations</text>

  <rect x="1426" y="638" width="194" height="96" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="1.9" class="card"/>
  <text x="1523" y="670" text-anchor="middle" class="cardTitle">Virtual thread</text>
  <text x="1523" y="698" text-anchor="middle" class="small">CompletableFuture</text>

  <path d="M 426 403 L 568 403" class="import"/>
  <path d="M 846 408 L 992 408" class="import"/>
  <path d="M 992 581 L 846 581" class="export"/>
  <path d="M 568 558 L 426 558" class="export"/>

  <rect x="228" y="858" width="1304" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="880" y="886" text-anchor="middle" class="small">Import reads keys, nodes, and edges with StAX, then writes vertices before resolving directed edges.</text>
  <text x="880" y="912" text-anchor="middle" class="small">Export writes key definitions, graph metadata, nodes, edges, and scalar data using cached XML factories.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1612" viewBox="0 0 1650 1612" role="img" aria-label="shortestPath">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1650" height="1612"/>
<rect class="frame" x="32" y="28" width="1586" height="1556" rx="28"/>
<text class="title" x="66" y="82">shortestPath</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="21" y="166" width="238" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">User</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1552" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="363.5" y="166" width="238" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="482.5" y="209" text-anchor="middle">GraphOperations</text>
<line class="lifeline" x1="482.5" y1="252" x2="482.5" y2="1552" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="706" y="166" width="238" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="825" y="209" text-anchor="middle">Path Algorithm</text>
<line class="lifeline" x1="825" y1="252" x2="825" y2="1552" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1048.5" y="166" width="238" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1167.5" y="209" text-anchor="middle">Backend Driver</text>
<line class="lifeline" x1="1167.5" y1="252" x2="1167.5" y2="1552" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1391" y="166" width="238" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1510" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="1510" y1="252" x2="1510" y2="1552" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="91.75" y="286" width="439" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="109.75" y="313" text-anchor="start">1. shortestPath(fromId, toId, edgeLabel, maxDepth)</text>
<path class="line" d="M140 344 L482.5 344"/>
<rect x="548.75" y="396" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="566.75" y="423" text-anchor="start">2. Find shortest path</text>
<path class="line" d="M482.5 454 L825 454"/>
<rect x="70" y="506" width="1510" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="533" text-anchor="start">ALT: Path cached</text>
<rect x="548.75" y="574" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="566.75" y="601" text-anchor="start">4. GraphPath (cached)</text>
<path class="dashed" d="M825 632 L482.5 632"/>
<rect x="70" y="684" width="1510" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="711" text-anchor="start">ELSE: Path not cached</text>
<rect x="865.25" y="752" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="883.25" y="779" text-anchor="start">6. BFS / Shortest Path Query</text>
<path class="line" d="M825 810 L1167.5 810"/>
<rect x="1227.75" y="862" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1245.75" y="889" text-anchor="start">7. Execute search query</text>
<path class="line" d="M1167.5 920 L1510 920"/>
<rect x="1233.75" y="972" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1251.75" y="999" text-anchor="start">8. vertices + edges</text>
<path class="dashed" d="M1510 1030 L1167.5 1030"/>
<rect x="889.25" y="1082" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="907.25" y="1109" text-anchor="start">9. Construct GraphPath</text>
<path class="line" d="M1167.5 1140 L825 1140"/>
<rect x="768" y="1192" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="786" y="1219" text-anchor="start">10. Cache result</text>
<path class="line" d="M825 1250 C889 1250 889 1284 825 1284"/>
<rect x="548.75" y="1322" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="566.75" y="1349" text-anchor="start">11. GraphPath</text>
<path class="dashed" d="M825 1380 L482.5 1380"/>
<rect x="206.25" y="1432" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="224.25" y="1459" text-anchor="start">12. GraphPath?</text>
<path class="dashed" d="M482.5 1490 L140 1490"/>
</svg>

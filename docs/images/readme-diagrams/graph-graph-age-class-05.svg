<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1120" viewBox="0 0 1840 1120">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .blue { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
    .gray { stroke: #64748B; stroke-width: 2.5; fill: none; marker-end: url(#arrowGray); }
  </style>

  <rect x="0" y="0" width="1840" height="1120" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1072" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">AgeTypeParser Class Model</text>
  <text x="74" y="118" class="subtitle">Parses Apache AGE agtype strings into graph-core vertices, edges, paths, and JSON values.</text>

  <rect x="70" y="150" width="1700" height="820" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <line x1="520" y1="400" x2="635" y2="400" class="blue"/>
  <line x1="1205" y1="400" x2="1320" y2="400" class="blue"/>
  <line x1="780" y1="602" x2="455" y2="700" class="gray"/>
  <line x1="920" y1="602" x2="920" y2="700" class="gray"/>
  <line x1="1060" y1="602" x2="1385" y2="700" class="gray"/>

  <rect x="130" y="280" width="390" height="240" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="325" y="315" text-anchor="middle" class="tiny">&lt;&lt;input strings&gt;&gt;</text>
  <text x="325" y="352" text-anchor="middle" class="section">AGE agtype</text>
  <line x1="130" y1="374" x2="520" y2="374" stroke="#3B82F6" stroke-width="2"/>
  <text x="160" y="410" class="small">{...}::vertex</text>
  <text x="160" y="438" class="small">{...}::edge</text>
  <text x="160" y="466" class="small">[...]::path</text>
  <text x="160" y="494" class="small">JSON object / array payload</text>

  <rect x="635" y="250" width="570" height="352" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="920" y="287" text-anchor="middle" class="tiny">&lt;&lt;object : KLogging&gt;&gt;</text>
  <text x="920" y="326" text-anchor="middle" class="section">AgeTypeParser</text>
  <line x1="635" y1="350" x2="1205" y2="350" stroke="#8B5CF6" stroke-width="2"/>
  <text x="670" y="386" class="small">+ parseVertex(agtype): GraphVertex</text>
  <text x="670" y="414" class="small">+ parseEdge(agtype): GraphEdge</text>
  <text x="670" y="442" class="small">+ parsePath(agtype): GraphPath</text>
  <text x="670" y="470" class="small">+ isVertex / isEdge / isPath</text>
  <text x="670" y="498" class="small">+ parseJsonObject(json): Map</text>
  <text x="670" y="526" class="small">+ parseJsonArray(json): List</text>
  <text x="670" y="554" class="small">- parseValue / findClosing</text>
  <text x="670" y="582" class="small">- parseAgtypeElements for path arrays</text>

  <rect x="1320" y="280" width="390" height="240" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="1515" y="315" text-anchor="middle" class="tiny">&lt;&lt;graph-core output&gt;&gt;</text>
  <text x="1515" y="352" text-anchor="middle" class="section">Model Objects</text>
  <line x1="1320" y1="374" x2="1710" y2="374" stroke="#22C55E" stroke-width="2"/>
  <text x="1350" y="410" class="small">GraphVertex(id, label, props)</text>
  <text x="1350" y="438" class="small">GraphEdge(id, start, end)</text>
  <text x="1350" y="466" class="small">GraphPath(PathStep list)</text>
  <text x="1350" y="494" class="small">GraphElementId.of(Long)</text>

  <rect x="210" y="700" width="490" height="180" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="455" y="735" text-anchor="middle" class="tiny">&lt;&lt;suffix branches&gt;&gt;</text>
  <text x="455" y="772" text-anchor="middle" class="section">Typed Parsers</text>
  <line x1="210" y1="794" x2="700" y2="794" stroke="#EAB308" stroke-width="2"/>
  <text x="240" y="830" class="small">strip ::vertex, ::edge, or ::path suffix</text>
  <text x="240" y="858" class="small">extract id, label, endpoints, properties</text>

  <rect x="735" y="700" width="370" height="180" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="920" y="735" text-anchor="middle" class="tiny">&lt;&lt;lightweight parser&gt;&gt;</text>
  <text x="920" y="772" text-anchor="middle" class="section">JSON Reader</text>
  <line x1="735" y1="794" x2="1105" y2="794" stroke="#F97316" stroke-width="2"/>
  <text x="765" y="830" class="small">maps, arrays, strings, numbers</text>
  <text x="765" y="858" class="small">null, true, false, nested blocks</text>

  <rect x="1140" y="700" width="490" height="180" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="1385" y="735" text-anchor="middle" class="tiny">&lt;&lt;path assembly&gt;&gt;</text>
  <text x="1385" y="772" text-anchor="middle" class="section">Path Steps</text>
  <line x1="1140" y1="794" x2="1630" y2="794" stroke="#14B8A6" stroke-width="2"/>
  <text x="1170" y="830" class="small">PathStep.VertexStep / EdgeStep</text>
  <text x="1170" y="858" class="small">preserves AGE vertex-edge order</text>
  <text x="920" y="1048" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: graph-age / AgeTypeParser class model</text>
</svg>

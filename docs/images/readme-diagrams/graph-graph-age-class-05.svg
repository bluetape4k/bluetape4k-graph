<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">AgeTypeParser class model</title>
  <desc id="desc">UML-style dependency diagram for AgeTypeParser, showing agtype inputs, public parse functions, private JSON and path parsing helpers, and graph-core model outputs.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    marker path, marker polygon, marker polyline { stroke-dasharray: none !important; }
    .title { font-family: 'Architects Daughter', cursive; font-size: 52px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .className { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .classNameSmall { font-family: 'Architects Daughter', cursive; font-size: 24px; fill: #111827; }
    .stereo { font-family: 'Comic Mono', monospace; font-size: 14px; font-weight: 700; fill: #64748B; }
    .member { font-family: 'Comic Mono', monospace; font-size: 16px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; }
    .label { font-family: 'Comic Mono', monospace; font-size: 13px; font-weight: 700; fill: #475569; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .main { fill: #DCFCE7; stroke: #22C55E; stroke-width: 1.9; }
    .input { fill: #DBEAFE; stroke: #3B82F6; stroke-width: 1.8; }
    .helper { fill: #FEF3C7; stroke: #EAB308; stroke-width: 1.8; }
    .output { fill: #CCFBF1; stroke: #14B8A6; stroke-width: 1.8; }
    .gray { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.7; }
    .use { fill: none; stroke: #64748B; stroke-width: 1.9; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round;  }
    .assoc { fill: none; stroke: #64748B; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openArrow); }
  </style>

  <rect width="1680" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1624" height="1024" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1608" cy="66" r="14" fill="#FED7AA"/>
  <circle cx="1570" cy="66" r="14" fill="#DCFCE7"/>
  <circle cx="1532" cy="66" r="14" fill="#EDE9FE"/>

  <text x="72" y="84" class="title">AgeTypeParser class model</text>
  <text x="74" y="122" class="subtitle">AGE returns typed agtype strings; the parser strips suffixes, parses JSON-like content, and builds graph-core models.</text>

  <rect x="70" y="160" width="1540" height="790" rx="20" class="panel"/>

  <rect x="110" y="226" width="320" height="116" rx="14" class="input card"/>
  <text x="270" y="262" text-anchor="middle" class="stereo">&lt;&lt;input&gt;&gt;</text>
  <text x="270" y="298" text-anchor="middle" class="classNameSmall">AGE agtype Strings</text>
  <line x1="140" y1="318" x2="400" y2="318" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="142" y="338" class="small">::vertex / ::edge / ::path</text>

  <rect x="540" y="218" width="600" height="300" rx="18" class="main card"/>
  <text x="840" y="258" text-anchor="middle" class="stereo">&lt;&lt;object&gt;&gt;</text>
  <text x="840" y="300" text-anchor="middle" class="className">AgeTypeParser</text>
  <line x1="594" y1="326" x2="1086" y2="326" stroke="#BBF7D0" stroke-width="1.3"/>
  <text x="600" y="358" class="member">+ parseVertex(agtype): GraphVertex</text>
  <text x="600" y="386" class="member">+ parseEdge(agtype): GraphEdge</text>
  <text x="600" y="414" class="member">+ parsePath(agtype): GraphPath</text>
  <text x="600" y="442" class="member">+ isVertex / isEdge / isPath</text>
  <line x1="594" y1="464" x2="1086" y2="464" stroke="#BBF7D0" stroke-width="1.3"/>
  <text x="600" y="494" class="member">+ parseJsonObject / parseJsonArray</text>

  <rect x="1240" y="226" width="320" height="116" rx="14" class="helper card"/>
  <text x="1400" y="262" text-anchor="middle" class="stereo">&lt;&lt;private helpers&gt;&gt;</text>
  <text x="1400" y="298" text-anchor="middle" class="classNameSmall">Parser Helpers</text>
  <line x1="1270" y1="318" x2="1530" y2="318" stroke="#FDE68A" stroke-width="1.3"/>
  <text x="1272" y="338" class="small">parseValue / findClosing</text>

  <rect x="240" y="642" width="300" height="122" rx="14" class="output card"/>
  <text x="390" y="678" text-anchor="middle" class="stereo">&lt;&lt;model&gt;&gt;</text>
  <text x="390" y="714" text-anchor="middle" class="classNameSmall">GraphVertex</text>
  <line x1="270" y1="734" x2="510" y2="734" stroke="#99F6E4" stroke-width="1.3"/>
  <text x="272" y="756" class="small">id, label, properties</text>

  <rect x="690" y="642" width="300" height="122" rx="14" class="output card"/>
  <text x="840" y="678" text-anchor="middle" class="stereo">&lt;&lt;model&gt;&gt;</text>
  <text x="840" y="714" text-anchor="middle" class="classNameSmall">GraphEdge</text>
  <line x1="720" y1="734" x2="960" y2="734" stroke="#99F6E4" stroke-width="1.3"/>
  <text x="722" y="756" class="small">id, label, startId, endId</text>

  <rect x="1140" y="642" width="300" height="122" rx="14" class="output card"/>
  <text x="1290" y="678" text-anchor="middle" class="stereo">&lt;&lt;model&gt;&gt;</text>
  <text x="1290" y="714" text-anchor="middle" class="classNameSmall">GraphPath</text>
  <line x1="1170" y1="734" x2="1410" y2="734" stroke="#99F6E4" stroke-width="1.3"/>
  <text x="1172" y="756" class="small">PathStep vertex / edge list</text>

  <rect x="350" y="832" width="980" height="64" rx="14" class="gray card"/>
  <text x="840" y="872" text-anchor="middle" class="small">Path parsing extracts `{...}::vertex` and `{...}::edge` elements before assembling alternating PathStep values.</text>


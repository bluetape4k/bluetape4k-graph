  <polyline points="1229,305 1240,300 1229,295" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 738 518 L 738 562 Q 738 580 720 580 L 408 580 Q 390 580 390 598 L 390 642" class="assoc"/>
  <path d="M 840 518 L 840 642" class="assoc"/>
  <path d="M 944 518 L 944 562 Q 944 580 962 580 L 1272 580 Q 1290 580 1290 598 L 1290 642" class="assoc"/>
  <path d="M 1290 764 L 1290 780 Q 1290 798 1272 798 L 1068 798 Q 1050 798 1050 816 L 1050 832" class="use" style="marker-end:none"/>
  <polyline points="1045,821 1050,832 1055,821" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 840 764 L 840 832" class="use" style="marker-end:none"/>
  <polyline points="835,821 840,832 845,821" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 390 764 L 390 780 Q 390 798 408 798 L 612 798 Q 630 798 630 816 L 630 832" class="use" style="marker-end:none"/>
  <polyline points="625,821 630,832 635,821" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <rect x="438" y="267" width="96" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="486" y="284" text-anchor="middle" class="label">typed input</text>
  <rect x="1164" y="303" width="56" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="1192" y="320" text-anchor="middle" class="label">uses</text>
  <rect x="476" y="579" width="104" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="528" y="596" text-anchor="middle" class="label">parseVertex</text>
  <rect x="792" y="579" width="96" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="840" y="596" text-anchor="middle" class="label">parseEdge</text>
  <rect x="1104" y="579" width="96" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="1152" y="596" text-anchor="middle" class="label">parsePath</text>

  <rect x="220" y="976" width="1240" height="46" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="840" y="1005" text-anchor="middle" class="small">Dashed open arrows show helper parsing dependencies; solid arrows show typed agtype inputs becoming graph-core models.</text>

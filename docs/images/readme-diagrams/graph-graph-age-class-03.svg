<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1120" viewBox="0 0 1840 1120">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #4B5563; }
    .micro { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #64748B; }
    .card { filter: url(#softShadow); }
    .arrow { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
    .softArrow { stroke: #64748B; stroke-width: 2.4; fill: none; marker-end: url(#arrowSlate); }
  </style>

  <rect x="0" y="0" width="1840" height="1120" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1072" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">AgeGraphOperations Class Model</text>
  <text x="74" y="118" class="subtitle">The synchronous AGE adapter implements graph-core contracts and delegates SQL, parsing, transactions, merge, and algorithms.</text>

  <rect x="70" y="150" width="1700" height="820" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="115" y="215" width="365" height="175" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="298" y="249" text-anchor="middle" class="tiny">&lt;&lt;interface&gt;&gt;</text>
  <text x="298" y="286" text-anchor="middle" class="section">GraphOperations</text>
  <line x1="115" y1="306" x2="480" y2="306" stroke="#3B82F6" stroke-width="2"/>
  <text x="145" y="340" class="small">session + vertex + edge repos</text>
  <text x="145" y="369" class="small">traversal + algorithm repos</text>

  <rect x="525" y="215" width="365" height="175" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="3" class="card"/>
  <text x="708" y="249" text-anchor="middle" class="tiny">&lt;&lt;interface&gt;&gt;</text>
  <text x="708" y="283" text-anchor="middle" class="small">GraphTransactionalOperations</text>
  <line x1="525" y1="306" x2="890" y2="306" stroke="#16A34A" stroke-width="2"/>
  <text x="555" y="340" class="small">transaction(block)</text>
  <text x="555" y="369" class="small">GraphTransactionScope bridge</text>

  <rect x="935" y="215" width="365" height="175" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="3" class="card"/>
  <text x="1118" y="249" text-anchor="middle" class="tiny">&lt;&lt;interface&gt;&gt;</text>
  <text x="1118" y="281" text-anchor="middle" class="small">GraphSchemaManagement</text>
  <text x="1118" y="303" text-anchor="middle" class="tiny">Operations</text>
  <line x1="935" y1="320" x2="1300" y2="320" stroke="#D97706" stroke-width="2"/>
  <text x="965" y="350" class="small">schemaManager()</text>
  <text x="965" y="379" class="small">AGE schema support surface</text>

  <rect x="1345" y="215" width="365" height="175" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="1528" y="249" text-anchor="middle" class="tiny">&lt;&lt;interface&gt;&gt;</text>
  <text x="1528" y="286" text-anchor="middle" class="section">GraphMergeOperations</text>
  <line x1="1345" y1="306" x2="1710" y2="306" stroke="#EF4444" stroke-width="2"/>
  <text x="1375" y="340" class="small">mergeVertex / mergeEdge</text>
  <text x="1375" y="369" class="small">validated match + set props</text>

  <rect x="560" y="470" width="720" height="245" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="920" y="505" text-anchor="middle" class="tiny">&lt;&lt;class&gt;&gt;</text>
  <text x="920" y="543" text-anchor="middle" class="section">AgeGraphOperations</text>
  <line x1="560" y1="565" x2="1280" y2="565" stroke="#8B5CF6" stroke-width="2"/>
  <text x="590" y="600" class="small">- graphName: String</text>
  <text x="590" y="629" class="small">- batchChunkSize: Int = 500</text>
  <text x="590" y="658" class="small">+ graph lifecycle, vertex/edge CRUD, batch create</text>
  <text x="590" y="687" class="small">+ traversal, shortest paths, analytics, merge, transactions</text>

  <rect x="115" y="790" width="365" height="150" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="298" y="825" text-anchor="middle" class="tiny">&lt;&lt;object&gt;&gt;</text>
  <text x="298" y="862" text-anchor="middle" class="section">AgeSql</text>
  <line x1="115" y1="882" x2="480" y2="882" stroke="#EF4444" stroke-width="2"/>
  <text x="145" y="916" class="small">Cypher-over-SQL builder</text>

  <rect x="525" y="790" width="365" height="150" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="708" y="825" text-anchor="middle" class="tiny">&lt;&lt;object&gt;&gt;</text>
  <text x="708" y="862" text-anchor="middle" class="section">AgeTypeParser</text>
  <line x1="525" y1="882" x2="890" y2="882" stroke="#14B8A6" stroke-width="2"/>
  <text x="555" y="916" class="small">agtype -> graph models</text>

  <rect x="935" y="790" width="365" height="150" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="3" class="card"/>
  <text x="1118" y="825" text-anchor="middle" class="tiny">&lt;&lt;class&gt;&gt;</text>
  <text x="1118" y="860" text-anchor="middle" class="small">AgeGraphTransactionScope</text>
  <line x1="935" y1="882" x2="1300" y2="882" stroke="#16A34A" stroke-width="2"/>
  <text x="965" y="916" class="small">scoped delegate operations</text>

  <rect x="1345" y="790" width="365" height="150" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1528" y="825" text-anchor="middle" class="tiny">&lt;&lt;helpers&gt;&gt;</text>
  <text x="1528" y="862" text-anchor="middle" class="section">Graph Algorithms</text>
  <line x1="1345" y1="882" x2="1710" y2="882" stroke="#F97316" stroke-width="2"/>
  <text x="1375" y="916" class="small">Fallback + BFS/DFS/PageRank</text>
  <text x="920" y="1072" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: graph-age / AgeGraphOperations class model</text>

  <path d="M 298 390 L 720 468" class="softArrow"/>
  <path d="M 708 390 L 845 468" class="softArrow"/>
  <path d="M 1118 390 L 995 468" class="softArrow"/>
  <path d="M 1528 390 L 1110 468" class="softArrow"/>
  <text x="920" y="448" text-anchor="middle" class="micro">implements</text>
  <path d="M 740 715 L 298 788" class="arrow"/>
  <path d="M 880 715 L 708 788" class="arrow"/>
  <path d="M 1000 715 L 1118 788" class="arrow"/>
  <path d="M 1115 715 L 1528 788" class="arrow"/>
</svg>

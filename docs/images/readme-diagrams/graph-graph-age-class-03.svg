<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">AgeGraphOperations class model</title>
  <desc id="desc">UML class diagram showing AgeGraphOperations interface realizations, major operation groups, and collaborators such as AgeSql, AgeTypeParser, AgeGraphSchemaManager, Exposed transactions, and graph-core fallback algorithms.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="hollowTriangle" viewBox="0 0 16 14" refX="14" refY="7" markerWidth="16" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 7 L 2 12 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 52px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .className { font-family: 'Architects Daughter', cursive; font-size: 29px; fill: #111827; }
    .classNameSmall { font-family: 'Architects Daughter', cursive; font-size: 23px; fill: #111827; }
    .stereo { font-family: 'Comic Mono', monospace; font-size: 14px; font-weight: 700; fill: #64748B; }
    .member { font-family: 'Comic Mono', monospace; font-size: 16px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; }
    .label { font-family: 'Comic Mono', monospace; font-size: 13px; font-weight: 700; fill: #475569; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .interface { fill: #DBEAFE; stroke: #3B82F6; stroke-width: 1.8; }
    .main { fill: #EDE9FE; stroke: #8B5CF6; stroke-width: 1.9; }
    .rose { fill: #FFE4E6; stroke: #FB7185; stroke-width: 1.8; }
    .green { fill: #DCFCE7; stroke: #22C55E; stroke-width: 1.8; }
    .amber { fill: #FEF3C7; stroke: #EAB308; stroke-width: 1.8; }
    .gray { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.7; }
    .realize { fill: none; stroke: #64748B; stroke-width: 1.9; stroke-dasharray: 8 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#hollowTriangle); }
    .use { fill: none; stroke: #64748B; stroke-width: 1.9; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openArrow); }
    .assoc { fill: none; stroke: #64748B; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openArrow); }
  </style>

  <rect width="1680" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1624" height="1024" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1608" cy="66" r="14" fill="#FED7AA"/>
  <circle cx="1570" cy="66" r="14" fill="#DCFCE7"/>
  <circle cx="1532" cy="66" r="14" fill="#EDE9FE"/>

  <text x="72" y="84" class="title">AgeGraphOperations class model</text>
  <text x="74" y="122" class="subtitle">The sync AGE adapter realizes graph-core contracts, then delegates SQL construction, agtype parsing, schema behavior, and fallback algorithms.</text>

  <rect x="70" y="160" width="1540" height="790" rx="20" class="panel"/>

  <rect x="120" y="210" width="300" height="132" rx="14" class="interface card"/>
  <text x="270" y="246" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="270" y="282" text-anchor="middle" class="classNameSmall">GraphOperations</text>
  <line x1="150" y1="304" x2="390" y2="304" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="152" y="330" class="small">Vertex / Edge / Traversal</text>

  <rect x="500" y="210" width="300" height="132" rx="14" class="interface card"/>
  <text x="650" y="246" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="650" y="282" text-anchor="middle" class="classNameSmall">GraphTransactional</text>
  <line x1="530" y1="304" x2="770" y2="304" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="532" y="330" class="small">transaction(scope): T</text>

  <rect x="880" y="210" width="300" height="132" rx="14" class="interface card"/>
  <text x="1030" y="246" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="1030" y="282" text-anchor="middle" class="classNameSmall">Schema Management</text>
  <line x1="910" y1="304" x2="1150" y2="304" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="912" y="330" class="small">schemaManager()</text>

  <rect x="1260" y="210" width="300" height="132" rx="14" class="interface card"/>
  <text x="1410" y="246" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text>
  <text x="1410" y="282" text-anchor="middle" class="classNameSmall">GraphMergeOperations</text>
  <line x1="1290" y1="304" x2="1530" y2="304" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="1292" y="330" class="small">mergeVertex / mergeEdge</text>

  <rect x="520" y="444" width="640" height="254" rx="18" class="main card"/>
  <text x="840" y="484" text-anchor="middle" class="stereo">&lt;&lt;class&gt;&gt;</text>
  <text x="840" y="524" text-anchor="middle" class="className">AgeGraphOperations</text>
  <line x1="572" y1="548" x2="1108" y2="548" stroke="#C4B5FD" stroke-width="1.3"/>
  <text x="576" y="579" class="member">- graphName: String</text>
  <text x="576" y="607" class="member">- batchChunkSize: Int = 500</text>
  <text x="576" y="635" class="member">+ CRUD / traversal / merge methods</text>
  <text x="576" y="663" class="member">+ algorithm methods with native + fallback paths</text>

  <rect x="120" y="780" width="300" height="118" rx="14" class="rose card"/>
  <text x="270" y="816" text-anchor="middle" class="stereo">&lt;&lt;object&gt;&gt;</text>
  <text x="270" y="852" text-anchor="middle" class="classNameSmall">AgeSql</text>
  <line x1="150" y1="872" x2="390" y2="872" stroke="#FECDD3" stroke-width="1.3"/>
  <text x="152" y="892" class="small">Cypher-over-SQL builder</text>

  <rect x="500" y="780" width="300" height="118" rx="14" class="green card"/>
  <text x="650" y="816" text-anchor="middle" class="stereo">&lt;&lt;object&gt;&gt;</text>
  <text x="650" y="852" text-anchor="middle" class="classNameSmall">AgeTypeParser</text>
  <line x1="530" y1="872" x2="770" y2="872" stroke="#BBF7D0" stroke-width="1.3"/>
  <text x="532" y="892" class="small">agtype -> graph models</text>

  <rect x="880" y="780" width="300" height="118" rx="14" class="amber card"/>
  <text x="1030" y="816" text-anchor="middle" class="stereo">&lt;&lt;class&gt;&gt;</text>
  <text x="1030" y="852" text-anchor="middle" class="classNameSmall">SchemaManager</text>
  <line x1="910" y1="872" x2="1150" y2="872" stroke="#FDE68A" stroke-width="1.3"/>
  <text x="912" y="892" class="small">explicit unsupported DDL</text>

  <rect x="1260" y="780" width="300" height="118" rx="14" class="gray card"/>
  <text x="1410" y="816" text-anchor="middle" class="stereo">&lt;&lt;helpers&gt;&gt;</text>
  <text x="1410" y="852" text-anchor="middle" class="classNameSmall">Fallback Algorithms</text>
  <line x1="1290" y1="872" x2="1530" y2="872" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="1292" y="892" class="small">Dijkstra, A*, BFS/DFS, PageRank</text>

  <path d="M 660 444 L 270 342" class="realize"/>
  <path d="M 760 444 L 650 342" class="realize"/>
  <path d="M 920 444 L 1030 342" class="realize"/>
  <path d="M 1020 444 L 1410 342" class="realize"/>

  <path d="M 665 698 L 270 780" class="use"/>
  <path d="M 780 698 L 650 780" class="use"/>
  <path d="M 900 698 L 1030 780" class="assoc"/>
  <path d="M 1016 698 L 1410 780" class="use"/>

  <text x="414" y="402" text-anchor="middle" class="label">realizes</text>
  <text x="622" y="396" text-anchor="middle" class="label">realizes</text>
  <text x="1058" y="396" text-anchor="middle" class="label">realizes</text>
  <text x="1264" y="402" text-anchor="middle" class="label">realizes</text>

  <text x="444" y="744" text-anchor="middle" class="label">builds SQL</text>
  <text x="688" y="744" text-anchor="middle" class="label">parses rows</text>
  <text x="964" y="744" text-anchor="middle" class="label">returns</text>
  <text x="1212" y="744" text-anchor="middle" class="label">fallbacks</text>

  <rect x="180" y="976" width="1320" height="46" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="840" y="1005" text-anchor="middle" class="small">Dashed hollow triangles show interface realization; dashed open arrows show helper dependencies.</text>
</svg>

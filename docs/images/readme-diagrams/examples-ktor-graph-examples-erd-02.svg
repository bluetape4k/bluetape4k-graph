<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .rel { font-family: 'Comic Mono', monospace; font-size: 16px; fill: #1E40AF; }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Ktor City Graph Model</text>
  <text x="74" y="118" class="subtitle">The demo graph is intentionally tiny: three City vertices and directed ROUTE_TO edges with distance.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="920" y="220" text-anchor="middle" class="section">DemoCityGraph Schema</text>

  <rect x="150" y="330" width="360" height="190" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="190" y="380" class="label">City: Seoul</text>
  <text x="190" y="420" class="small">label: City</text>
  <text x="190" y="448" class="small">name: Seoul</text>
  <text x="190" y="476" class="small">created by /demo/reset</text>

  <rect x="740" y="330" width="360" height="190" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="780" y="380" class="label">City: Daejeon</text>
  <text x="780" y="420" class="small">label: City</text>
  <text x="780" y="448" class="small">name: Daejeon</text>
  <text x="780" y="476" class="small">intermediate path vertex</text>

  <rect x="1330" y="330" width="360" height="190" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="1370" y="380" class="label">City: Busan</text>
  <text x="1370" y="420" class="small">label: City</text>
  <text x="1370" y="448" class="small">name: Busan</text>
  <text x="1370" y="476" class="small">shortest path target</text>

  <path d="M 510 425 L 740 425" class="line"/>
  <text x="625" y="402" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">ROUTE_TO distance=160.0</text>
  <text x="625" y="402" text-anchor="middle" class="rel">ROUTE_TO distance=160.0</text>

  <path d="M 1100 425 L 1330 425" class="line"/>
  <text x="1215" y="402" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">ROUTE_TO distance=220.0</text>
  <text x="1215" y="402" text-anchor="middle" class="rel">ROUTE_TO distance=220.0</text>

  <rect x="235" y="660" width="410" height="120" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="270" y="708" class="label">Graph Name</text>
  <text x="270" y="744" class="small">DemoCityGraph.GRAPH_NAME = demo</text>

  <rect x="715" y="660" width="410" height="120" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="750" y="708" class="label">Count Query</text>
  <text x="750" y="744" class="small">countVertices(City) returns 3</text>

  <rect x="1195" y="660" width="410" height="120" rx="14" fill="#FCE7F3" stroke="#EC4899" stroke-width="3" class="card"/>
  <text x="1230" y="708" class="label">Path Query</text>
  <text x="1230" y="744" class="small">shortestPath(Seoul, Busan)</text>

  <rect x="185" y="850" width="1470" height="45" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="920" y="879" text-anchor="middle" class="small">The model is deliberately small so route tests can verify count and shortest-path behavior without external setup.</text>
  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: ktor-graph-examples / ERD</text>
</svg>

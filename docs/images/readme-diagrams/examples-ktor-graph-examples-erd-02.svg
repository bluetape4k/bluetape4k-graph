<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Ktor City Graph ERD</title>
  <desc id="desc">Small route graph used by reset, count, and shortest-path APIs</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5f6f82"/>
    </marker>
    <style>
      .canvas { fill: #fbfcfe; }
      .frame { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 30px; fill: #243142; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #5c6b7d; }
      .box-title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 18px; fill: #233044; }
      .box-text { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 13px; fill: #435266; }
      .label { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 12px; fill: #4f5e70; }
      .edge { fill: none; stroke: #5f6f82; stroke-width: 2.4; marker-end: url(#arrow); }
      .pill { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1; }
    </style>
  </defs>
  <rect class="canvas" width="1120" height="520"/>
  <rect class="frame" x="24" y="24" width="1072" height="472" rx="18"/>
  <text class="title" x="560" y="68" text-anchor="middle">Ktor City Graph ERD</text>
  <text class="subtitle" x="560" y="94" text-anchor="middle">Small route graph used by reset, count, and shortest-path APIs</text>

      <path class="edge" d="M 380 227.5 H 420 V 227.5 H 460"/>
      <rect class="pill" x="388.5" y="203.5" width="48" height="22" rx="11"/>
      <text class="label" x="412.5" y="218.5" text-anchor="middle">from</text>

      <path class="edge" d="M 650 227.5 H 697.5 V 227.5 H 745"/>
      <rect class="pill" x="681" y="203.5" width="48" height="22" rx="11"/>
      <text class="label" x="705" y="218.5" text-anchor="middle">to</text>

      <path class="edge" d="M 745 227.5 H 562.5 V 227.5 H 380"/>
      <rect class="pill" x="515" y="203.5" width="95" height="22" rx="11"/>
      <text class="label" x="562.5" y="218.5" text-anchor="middle">path search</text>

      <g>
        <rect x="160" y="170" width="220" height="115" rx="14" fill="#e8f4ff" stroke="#98c1df" stroke-width="2"/>
        <text class="box-title" x="270" y="204" text-anchor="middle">City</text>
        <text class="box-text" x="270" y="232" text-anchor="middle">name</text>
      </g>

      <g>
        <rect x="460" y="180" width="190" height="95" rx="14" fill="#fff4d8" stroke="#e3c46f" stroke-width="2"/>
        <text class="box-title" x="555" y="214" text-anchor="middle">ROUTE_TO</text>
        <text class="box-text" x="555" y="242" text-anchor="middle">distance</text>
      </g>

      <g>
        <rect x="745" y="170" width="220" height="115" rx="14" fill="#eaf7ef" stroke="#9ccdad" stroke-width="2"/>
        <text class="box-title" x="855" y="204" text-anchor="middle">City</text>
        <text class="box-text" x="855" y="232" text-anchor="middle">name</text>
      </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn Graph ERD</title>
  <desc id="desc">People, employers, skills, and social relationships</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5f6f82"/>
    </marker>
    <style>
      .canvas { fill: #fbfcfe; }
      .frame { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 30px; fill: #243142; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #5c6b7d; }
      .box-title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 18px; fill: #233044; }
      .box-text { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 13px; fill: #435266; }
      .label { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 12px; fill: #4f5e70; }
      .edge { fill: none; stroke: #5f6f82; stroke-width: 2.4; marker-end: url(#arrow); }
      .pill { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1; }
    </style>
  </defs>
  <rect class="canvas" width="1120" height="520"/>
  <rect class="frame" x="24" y="24" width="1072" height="472" rx="18"/>
  <text class="title" x="560" y="68" text-anchor="middle">LinkedIn Graph ERD</text>
  <text class="subtitle" x="560" y="94" text-anchor="middle">People, employers, skills, and social relationships</text>

      <path class="edge" d="M 315 241 H 377.5 V 167 H 440"/>
      <rect class="pill" x="340.5" y="180" width="74" height="22" rx="11"/>
      <text class="label" x="377.5" y="195" text-anchor="middle">WORKS_AT</text>

      <path class="edge" d="M 315 241 H 377.5 V 372.5 H 440"/>
      <rect class="pill" x="337" y="282.75" width="81" height="22" rx="11"/>
      <text class="label" x="377.5" y="297.75" text-anchor="middle">HAS_SKILL</text>

      <path class="edge" d="M 315 241 H 572.5 V 240 H 830"/>
      <rect class="pill" x="506" y="216.5" width="123" height="22" rx="11"/>
      <text class="label" x="567.5" y="231.5" text-anchor="middle">KNOWS / FOLLOWS</text>

      <path class="edge" d="M 830 240 H 572.5 V 241 H 315"/>
      <rect class="pill" x="530.5" y="216.5" width="74" height="22" rx="11"/>
      <text class="label" x="567.5" y="231.5" text-anchor="middle">ENDORSES</text>

      <g>
        <rect x="75" y="150" width="240" height="182" rx="14" fill="#e8f4ff" stroke="#98c1df" stroke-width="2"/>
        <text class="box-title" x="195" y="184" text-anchor="middle">Person</text>
        <text class="box-text" x="195" y="212" text-anchor="middle">name</text>
<text class="box-text" x="195" y="233" text-anchor="middle">title</text>
<text class="box-text" x="195" y="254" text-anchor="middle">company</text>
<text class="box-text" x="195" y="275" text-anchor="middle">location</text>
<text class="box-text" x="195" y="296" text-anchor="middle">connectionCount</text>
      </g>

      <g>
        <rect x="440" y="92" width="240" height="150" rx="14" fill="#eaf7ef" stroke="#9ccdad" stroke-width="2"/>
        <text class="box-title" x="560" y="126" text-anchor="middle">Company</text>
        <text class="box-text" x="560" y="154" text-anchor="middle">name</text>
<text class="box-text" x="560" y="175" text-anchor="middle">industry</text>
<text class="box-text" x="560" y="196" text-anchor="middle">size</text>
<text class="box-text" x="560" y="217" text-anchor="middle">location</text>
      </g>

      <g>
        <rect x="440" y="315" width="240" height="115" rx="14" fill="#fff4d8" stroke="#e3c46f" stroke-width="2"/>
        <text class="box-title" x="560" y="349" text-anchor="middle">Skill</text>
        <text class="box-text" x="560" y="377" text-anchor="middle">name</text>
<text class="box-text" x="560" y="398" text-anchor="middle">category</text>
      </g>

      <g>
        <rect x="830" y="165" width="220" height="150" rx="14" fill="#fdecef" stroke="#d8a6b0" stroke-width="2"/>
        <text class="box-title" x="940" y="199" text-anchor="middle">Other Person</text>
        <text class="box-text" x="940" y="227" text-anchor="middle">connection</text>
<text class="box-text" x="940" y="248" text-anchor="middle">endorsement target</text>
      </g>
</svg>

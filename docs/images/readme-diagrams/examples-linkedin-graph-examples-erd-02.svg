<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .rel { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #1E40AF; }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">LinkedIn Social Graph Model</text>
  <text x="74" y="118" class="subtitle">People connect to people, companies, and skills through typed social relationship edges.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>
  <text x="920" y="214" text-anchor="middle" class="section">Vertex Labels and Relationship Labels</text>

  <rect x="130" y="300" width="390" height="225" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="170" y="350" class="label">Person</text>
  <text x="170" y="390" class="small">name, title, company, location</text>
  <text x="170" y="418" class="small">skills: string list</text>
  <text x="170" y="446" class="small">connectionCount: integer</text>
  <text x="170" y="484" class="small">self edges: KNOWS, FOLLOWS, ENDORSES</text>

  <rect x="725" y="285" width="390" height="190" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="765" y="335" class="label">Company</text>
  <text x="765" y="375" class="small">name: string</text>
  <text x="765" y="403" class="small">industry: string</text>
  <text x="765" y="431" class="small">size and location</text>

  <rect x="1320" y="430" width="390" height="190" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="1360" y="480" class="label">Skill</text>
  <text x="1360" y="520" class="small">name: string</text>
  <text x="1360" y="548" class="small">category: string</text>
  <text x="1360" y="576" class="small">level stored on HAS_SKILL edge</text>

  <path d="M 520 395 L 725 395" class="line"/>
  <text x="620" y="365" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">WORKS_AT role, isCurrent</text>
  <text x="620" y="365" text-anchor="middle" class="rel">WORKS_AT role, isCurrent</text>

  <path d="M 520 505 L 1320 505" class="line"/>
  <text x="920" y="536" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">HAS_SKILL level</text>
  <text x="920" y="536" text-anchor="middle" class="rel">HAS_SKILL level</text>

  <path d="M 325 525 L 325 647 Q 325 665 307 665 L 148 665 Q 130 665 130 647 L 130 525" class="line"/>
  <text x="225" y="646" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">KNOWS both directions</text>
  <text x="225" y="646" text-anchor="middle" class="rel">KNOWS both directions</text>

  <rect x="240" y="720" width="430" height="105" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="275" y="762" class="label">Connection Edge Properties</text>
  <text x="275" y="795" class="small">KNOWS: since, strength</text>

  <rect x="705" y="720" width="430" height="105" rx="14" fill="#FCE7F3" stroke="#EC4899" stroke-width="3" class="card"/>
  <text x="740" y="762" class="label">Endorsement</text>
  <text x="740" y="795" class="small">ENDORSES: skillName</text>

  <rect x="1170" y="720" width="430" height="105" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="1205" y="762" class="label">Query Targets</text>
  <text x="1205" y="795" class="small">friends, paths, followers, employees</text>
  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: linkedin-graph-examples / ERD</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 2 2 L 16 9 L 2 16 Z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 52px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 19px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 26px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #64748B; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .lane { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .import { fill: none; stroke: #059669; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
    .export { fill: none; stroke: #2563EB; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
    .line { fill: none; stroke: #64748B; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-slate); }
  </style>

  <rect x="0" y="0" width="1760" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1704" height="1024" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2"/>

  <text x="72" y="86" class="title">graph-io-jackson2 architecture</text>
  <text x="74" y="124" class="subtitle">Jackson 2 reads and writes one NDJSON envelope per line while graph-io-core owns batching, IDs, and reports.</text>

  <rect x="74" y="166" width="1612" height="798" rx="20" class="panel"/>

  <rect x="112" y="214" width="352" height="600" rx="18" class="lane"/>
  <text x="142" y="264" class="section">1. NDJSON stream</text>
  <text x="144" y="296" class="small">One file, one complete envelope per line.</text>

  <rect x="150" y="350" width="276" height="118" rx="16" fill="#DCFCE7" stroke="#10B981" stroke-width="1.9" class="card"/>
  <text x="288" y="386" text-anchor="middle" class="cardTitle">vertex line</text>
  <text x="288" y="417" text-anchor="middle" class="body">type, id, label</text>
  <text x="288" y="443" text-anchor="middle" class="small">properties object</text>

  <rect x="150" y="530" width="276" height="124" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.9" class="card"/>
  <text x="288" y="566" text-anchor="middle" class="cardTitle">edge line</text>
  <text x="288" y="597" text-anchor="middle" class="body">type, id, label</text>
  <text x="288" y="623" text-anchor="middle" class="small">from, to, properties</text>

  <rect x="150" y="704" width="276" height="78" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="288" y="735" text-anchor="middle" class="small">GraphImportSource and</text>
  <text x="288" y="759" text-anchor="middle" class="small">GraphExportSink wrap the file.</text>

  <rect x="526" y="214" width="362" height="600" rx="18" class="lane"/>
  <text x="556" y="264" class="section">2. Envelope codec</text>
  <text x="558" y="296" class="small">Jackson maps each line to graph-io records.</text>

  <rect x="568" y="348" width="278" height="112" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.9" class="card"/>
  <text x="707" y="384" text-anchor="middle" class="cardTitle">parseLine</text>
  <text x="707" y="414" text-anchor="middle" class="body">JSON line -> envelope</text>
  <text x="707" y="439" text-anchor="middle" class="small">malformed JSON becomes failure</text>

  <rect x="568" y="508" width="278" height="116" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.9" class="card"/>
  <text x="707" y="544" text-anchor="middle" class="cardTitle">toVertex / toEdge</text>
  <text x="707" y="574" text-anchor="middle" class="body">default labels</text>
  <text x="707" y="600" text-anchor="middle" class="small">required id, from, to checks</text>

  <rect x="568" y="672" width="278" height="92" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.9" class="card"/>
  <text x="707" y="708" text-anchor="middle" class="cardTitle">write envelope</text>
  <text x="707" y="738" text-anchor="middle" class="body">records -> JSON lines</text>

  <rect x="950" y="214" width="390" height="600" rx="18" class="lane"/>
  <text x="980" y="264" class="section">3. Import and export</text>
  <text x="982" y="296" class="small">Format-specific logic stays above graph-io-core.</text>

  <rect x="992" y="336" width="306" height="144" rx="16" fill="#DCFCE7" stroke="#10B981" stroke-width="1.9" class="card"/>
  <text x="1145" y="378" text-anchor="middle" class="cardTitle">Import path</text>
  <text x="1145" y="407" text-anchor="middle" class="body">vertices create</text>
  <text x="1145" y="432" text-anchor="middle" class="body">external-id map</text>
  <text x="1145" y="457" text-anchor="middle" class="small">edges buffer until vertices flush</text>

  <rect x="992" y="528" width="306" height="120" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.9" class="card"/>
  <text x="1145" y="560" text-anchor="middle" class="cardTitle">Export path</text>
  <text x="1145" y="590" text-anchor="middle" class="body">selected labels</text>
  <text x="1145" y="615" text-anchor="middle" class="body">become records</text>
  <text x="1145" y="640" text-anchor="middle" class="small">vertices written before edges</text>

  <rect x="992" y="688" width="306" height="76" rx="16" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.9" class="card"/>
  <text x="1145" y="719" text-anchor="middle" class="cardTitle">Core helpers</text>
  <text x="1145" y="748" text-anchor="middle" class="body">Paths, BatchWriter, reports</text>

  <rect x="1400" y="214" width="246" height="600" rx="18" class="lane"/>
  <text x="1430" y="264" class="section">4. API variants</text>
  <text x="1432" y="296" class="small">Same envelope contract.</text>

  <rect x="1426" y="348" width="194" height="82" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.9" class="card"/>
  <text x="1523" y="380" text-anchor="middle" class="cardTitle">Sync</text>
  <text x="1523" y="406" text-anchor="middle" class="small">GraphOperations</text>

  <rect x="1426" y="486" width="194" height="96" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.9" class="card"/>
  <text x="1523" y="518" text-anchor="middle" class="cardTitle">Suspend</text>
  <text x="1523" y="544" text-anchor="middle" class="small">GraphSuspend</text>
  <text x="1523" y="566" text-anchor="middle" class="small">Operations</text>

  <rect x="1426" y="638" width="194" height="96" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="1.9" class="card"/>
  <text x="1523" y="670" text-anchor="middle" class="cardTitle">Virtual thread</text>
  <text x="1523" y="698" text-anchor="middle" class="small">CompletableFuture</text>

  <path d="M 426 404 L 568 404" class="import"/>
  <path d="M 846 408 L 992 408" class="import"/>
  <path d="M 992 580 L 937 580 Q 919 580 919 598 L 919 700 Q 919 718 901 718 L 846 718" class="export"/>
  <path d="M 568 718 L 515 718 Q 497 718 497 700 L 497 610 Q 497 592 479 592 L 426 592" class="export"/>
  <rect x="228" y="858" width="1304" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="880" y="886" text-anchor="middle" class="small">Import reads envelopes in file order, writes vertices first, then resolves buffered edges through the external-id map.</text>
  <text x="880" y="912" text-anchor="middle" class="small">Export scans selected labels, serializes graph-io records with Jackson 2, and emits one JSON object per line.</text>
</svg>

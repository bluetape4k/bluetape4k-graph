<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .thin { stroke: #64748B; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">LinkedIn Graph Example Architecture</text>
  <text x="74" y="118" class="subtitle">A social graph service models people, companies, skills, and portable connection queries.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="295" y="214" text-anchor="middle" class="section">Social Domain</text>
  <text x="735" y="214" text-anchor="middle" class="section">Service Layer</text>
  <text x="1165" y="214" text-anchor="middle" class="section">Queries</text>
  <text x="1535" y="214" text-anchor="middle" class="section">Backends</text>

  <rect x="125" y="265" width="350" height="165" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="160" y="313" class="label">Profile Graph</text>
  <text x="160" y="349" class="small">Person, Company, Skill vertices</text>
  <text x="160" y="377" class="small">Alice, Bob, Carol, Dave</text>
  <text x="160" y="405" class="small">TechCorp employment scenario</text>

  <rect x="125" y="535" width="350" height="165" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="160" y="583" class="label">Relationship Edges</text>
  <text x="160" y="619" class="small">KNOWS is written both ways</text>
  <text x="160" y="647" class="small">FOLLOWS is one-way</text>
  <text x="160" y="675" class="small">WORKS_AT and HAS_SKILL edges</text>

  <rect x="575" y="260" width="360" height="175" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="610" y="308" class="label">LinkedInGraphService</text>
  <text x="610" y="344" class="small">addPerson, addCompany</text>
  <text x="610" y="372" class="small">connect, follow, addWorkExperience</text>
  <text x="610" y="400" class="small">uses GraphOperations contract</text>

  <rect x="575" y="535" width="360" height="155" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="610" y="583" class="label">Suspend Service</text>
  <text x="610" y="619" class="small">GraphSuspendOperations variant</text>
  <text x="610" y="647" class="small">Flow-based traversal results</text>
  <text x="610" y="675" class="small">same social graph semantics</text>

  <rect x="1020" y="245" width="330" height="145" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="1055" y="293" class="label">Connection Queries</text>
  <text x="1055" y="329" class="small">direct and second-degree KNOWS</text>
  <text x="1055" y="357" class="small">shortestPath maxDepth=6</text>

  <rect x="1020" y="450" width="330" height="145" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1055" y="498" class="label">Work Lookup</text>
  <text x="1055" y="534" class="small">incoming WORKS_AT traversal</text>
  <text x="1055" y="562" class="small">TechCorp employee list</text>

  <rect x="1020" y="650" width="330" height="145" rx="14" fill="#FCE7F3" stroke="#EC4899" stroke-width="3" class="card"/>
  <text x="1055" y="698" class="label">Follower Lookup</text>
  <text x="1055" y="734" class="small">incoming FOLLOWS traversal</text>
  <text x="1055" y="762" class="small">find profile followers</text>

  <g class="card">
    <ellipse cx="1555" cy="420" rx="165" ry="46" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <rect x="1390" y="420" width="330" height="265" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <ellipse cx="1555" cy="685" rx="165" ry="46" fill="#FDBA74" stroke="#F59E0B" stroke-width="3"/>
  </g>
  <text x="1555" y="443" text-anchor="middle" class="label">Backend Matrix</text>
  <text x="1555" y="496" text-anchor="middle" class="small">TinkerGraph memory</text>
  <text x="1555" y="530" text-anchor="middle" class="small">Neo4j and Memgraph</text>
  <text x="1555" y="564" text-anchor="middle" class="small">PostgreSQL AGE</text>
  <text x="1555" y="598" text-anchor="middle" class="small">FalkorDB test wiring</text>

  <path d="M 475 348 L 575 348" class="line"/>
  <path d="M 475 620 L 575 612" class="line"/>
  <path d="M 935 348 L 1020 318" class="line"/>
  <path d="M 935 612 L 1020 522" class="line"/>
  <path d="M 935 612 L 1020 722" class="thin"/>
  <path d="M 1350 318 L 1390 420" class="line"/>
  <path d="M 1350 522 L 1390 505" class="thin"/>
  <path d="M 1350 722 L 1390 640" class="thin"/>

  <rect x="180" y="825" width="1480" height="58" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="920" y="852" text-anchor="middle" class="small">The same social graph service is reused by abstract tests across backend-specific GraphOperations factories.</text>

  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: linkedin-graph-examples / architecture</text>
</svg>

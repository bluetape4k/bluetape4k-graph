<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="980" viewBox="0 0 1760 980">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <g id="check">
      <circle cx="0" cy="0" r="15" fill="#16A34A"/>
      <path d="M -7 -1 L -2 5 L 8 -7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <style>
    marker path, marker polygon, marker polyline { stroke-dasharray: none !important; }
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 19px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #334155; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #64748B; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .card { filter: url(#shadow); }
    .cell { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.4; }
    .muted { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #64748B; }
  </style>

  <rect x="0" y="0" width="1760" height="980" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1704" height="924" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2"/>

  <text x="72" y="84" class="title">graph-core repository contracts</text>
  <text x="74" y="122" class="subtitle">Facade interfaces are composition surfaces; they do not own only one repository type.</text>

  <rect x="76" y="162" width="1608" height="276" rx="20" class="panel"/>
  <text x="112" y="216" class="section">Contract families</text>

  <rect x="132" y="250" width="260" height="118" rx="16" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.1" class="card"/>
  <text x="262" y="288" text-anchor="middle" class="cardTitle">Session</text>
  <text x="262" y="318" text-anchor="middle" class="body">graph lifecycle</text>
  <text x="262" y="343" text-anchor="middle" class="small">create/drop/exists/close</text>

  <rect x="430" y="250" width="260" height="118" rx="16" fill="#F0FDF4" stroke="#34D399" stroke-width="2.1" class="card"/>
  <text x="560" y="288" text-anchor="middle" class="cardTitle">Vertex</text>
  <text x="560" y="318" text-anchor="middle" class="body">node CRUD</text>
  <text x="560" y="343" text-anchor="middle" class="small">single + batch methods</text>

  <rect x="728" y="250" width="260" height="118" rx="16" fill="#FFFBEB" stroke="#FBBF24" stroke-width="2.1" class="card"/>
  <text x="858" y="288" text-anchor="middle" class="cardTitle">Edge</text>
  <text x="858" y="318" text-anchor="middle" class="body">relationship CRUD</text>
  <text x="858" y="343" text-anchor="middle" class="small">start/end lookup</text>

  <rect x="1026" y="250" width="260" height="118" rx="16" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2.1" class="card"/>
  <text x="1156" y="288" text-anchor="middle" class="cardTitle">Traversal</text>
  <text x="1156" y="318" text-anchor="middle" class="body">neighbors + paths</text>
  <text x="1156" y="343" text-anchor="middle" class="small">shortest/all/A*</text>

  <rect x="1324" y="250" width="260" height="118" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.1" class="card"/>
  <text x="1454" y="288" text-anchor="middle" class="cardTitle">Algorithm</text>
  <text x="1454" y="318" text-anchor="middle" class="body">analytics API</text>
  <text x="1454" y="343" text-anchor="middle" class="small">PageRank, BFS/DFS</text>

  <rect x="76" y="480" width="1608" height="338" rx="20" class="panel"/>
  <text x="112" y="534" class="section">Facade composition map</text>

  <rect x="160" y="578" width="318" height="60" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="319" y="616" text-anchor="middle" class="body">Facade</text>
  <rect x="478" y="578" width="190" height="60" class="cell"/>
  <text x="573" y="616" text-anchor="middle" class="body">Session</text>
  <rect x="668" y="578" width="190" height="60" class="cell"/>
  <text x="763" y="616" text-anchor="middle" class="body">Vertex</text>
  <rect x="858" y="578" width="190" height="60" class="cell"/>
  <text x="953" y="616" text-anchor="middle" class="body">Edge</text>
  <rect x="1048" y="578" width="220" height="60" class="cell"/>
  <text x="1158" y="616" text-anchor="middle" class="body">Traversal</text>
  <rect x="1268" y="578" width="220" height="60" class="cell"/>
  <text x="1378" y="616" text-anchor="middle" class="body">Algorithm</text>

  <rect x="160" y="638" width="318" height="58" fill="#DBEAFE" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="319" y="674" text-anchor="middle" class="body">GraphOperations</text>
  <rect x="478" y="638" width="190" height="58" class="cell"/><use href="#check" x="573" y="667"/>
  <rect x="668" y="638" width="190" height="58" class="cell"/><use href="#check" x="763" y="667"/>
  <rect x="858" y="638" width="190" height="58" class="cell"/><use href="#check" x="953" y="667"/>
  <rect x="1048" y="638" width="220" height="58" class="cell"/><use href="#check" x="1158" y="667"/>
  <rect x="1268" y="638" width="220" height="58" class="cell"/><use href="#check" x="1378" y="667"/>

  <rect x="160" y="696" width="318" height="58" fill="#DCFCE7" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="319" y="732" text-anchor="middle" class="body">GraphSuspendOperations</text>
  <rect x="478" y="696" width="190" height="58" class="cell"/><use href="#check" x="573" y="725"/>
  <rect x="668" y="696" width="190" height="58" class="cell"/><use href="#check" x="763" y="725"/>
  <rect x="858" y="696" width="190" height="58" class="cell"/><use href="#check" x="953" y="725"/>
  <rect x="1048" y="696" width="220" height="58" class="cell"/><use href="#check" x="1158" y="725"/>
  <rect x="1268" y="696" width="220" height="58" class="cell"/><use href="#check" x="1378" y="725"/>

  <rect x="160" y="754" width="318" height="58" fill="#FEF3C7" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="319" y="790" text-anchor="middle" class="body">GraphVirtualThreadOperations</text>
  <rect x="478" y="754" width="190" height="58" class="cell"/><use href="#check" x="573" y="783"/>
  <rect x="668" y="754" width="190" height="58" class="cell"/><use href="#check" x="763" y="783"/>
  <rect x="858" y="754" width="190" height="58" class="cell"/><use href="#check" x="953" y="783"/>
  <rect x="1048" y="754" width="220" height="58" class="cell"/><use href="#check" x="1158" y="783"/>
  <rect x="1268" y="754" width="220" height="58" class="cell"/><use href="#check" x="1378" y="783"/>

  <rect x="178" y="858" width="1404" height="62" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="880" y="884" text-anchor="middle" class="small">GraphGenericRepository groups Traversal + Algorithm when callers want a narrower injection type.</text>
  <text x="880" y="908" text-anchor="middle" class="small">Optional capabilities such as transactions, merge, and schema management are separate opt-in interfaces.</text>
</svg>

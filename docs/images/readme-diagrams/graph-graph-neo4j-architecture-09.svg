<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1120" viewBox="0 0 1840 1120">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #64748B; stroke-width: 2.1; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="1840" height="1120" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1072" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Neo4j neighbors Cypher Patterns</text>
  <text x="74" y="118" class="subtitle">NeighborOptions become a safe relationship pattern, then Neo4j returns distinct neighbor nodes mapped to GraphVertex.</text>

  <rect x="70" y="150" width="1700" height="830" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="1.4" filter="url(#softShadow)"/>

  <line x1="455" y1="350" x2="585" y2="350" class="line"/>
  <line x1="920" y1="485" x2="920" y2="620" class="line"/>
  <line x1="1255" y1="350" x2="1385" y2="350" class="line"/>

  <rect x="130" y="260" width="325" height="210" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.9" class="card"/>
  <text x="292" y="297" text-anchor="middle" class="tiny">&lt;&lt;input&gt;&gt;</text>
  <text x="292" y="336" text-anchor="middle" class="section">NeighborOptions</text>
  <line x1="130" y1="360" x2="455" y2="360" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="160" y="397" class="small">startId.value required</text>
  <text x="160" y="426" class="small">edgeLabel safe identifier</text>
  <text x="160" y="455" class="small">maxDepth controls *1..N</text>

  <rect x="585" y="240" width="670" height="245" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.9" class="card"/>
  <text x="920" y="278" text-anchor="middle" class="tiny">&lt;&lt;pattern builder&gt;&gt;</text>
  <text x="920" y="317" text-anchor="middle" class="section">edgePart and Direction</text>
  <line x1="585" y1="341" x2="1255" y2="341" stroke="#8B5CF6" stroke-width="1.4"/>
  <text x="625" y="378" class="small">depthStr = "" when maxDepth == 1, otherwise *1..maxDepth</text>
  <text x="625" y="407" class="small">edgePart = :LABEL + depthStr, or depthStr without a label</text>
  <text x="625" y="436" class="small">OUTGOING, INCOMING, BOTH choose the Cypher arrow shape</text>
  <text x="625" y="465" class="small">query uses WHERE elementId(start) = $startId</text>

  <rect x="1385" y="260" width="325" height="210" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.9" class="card"/>
  <text x="1548" y="297" text-anchor="middle" class="tiny">&lt;&lt;output&gt;&gt;</text>
  <text x="1548" y="336" text-anchor="middle" class="section">Result Mapping</text>
  <line x1="1385" y1="360" x2="1710" y2="360" stroke="#22C55E" stroke-width="1.4"/>
  <text x="1415" y="397" class="small">RETURN DISTINCT neighbor</text>
  <text x="1415" y="426" class="small">recordToVertex(..., "neighbor")</text>
  <text x="1415" y="455" class="small">List or Flow&lt;GraphVertex&gt;</text>

  <rect x="180" y="620" width="430" height="210" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="1.9" class="card"/>
  <text x="395" y="658" text-anchor="middle" class="tiny">&lt;&lt;Direction.OUTGOING&gt;&gt;</text>
  <text x="395" y="697" text-anchor="middle" class="section">Outgoing</text>
  <line x1="180" y1="721" x2="610" y2="721" stroke="#EAB308" stroke-width="1.4"/>
  <text x="215" y="764" class="small">(start)-[edgePart]-&gt;(neighbor)</text>
  <text x="215" y="793" class="small">from the start node to target nodes</text>

  <rect x="705" y="620" width="430" height="210" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="1.9" class="card"/>
  <text x="920" y="658" text-anchor="middle" class="tiny">&lt;&lt;Direction.INCOMING&gt;&gt;</text>
  <text x="920" y="697" text-anchor="middle" class="section">Incoming</text>
  <line x1="705" y1="721" x2="1135" y2="721" stroke="#F97316" stroke-width="1.4"/>
  <text x="740" y="764" class="small">(start)&lt;-[edgePart]-(neighbor)</text>
  <text x="740" y="793" class="small">incoming relationships into start</text>

  <rect x="1230" y="620" width="430" height="210" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.9" class="card"/>
  <text x="1445" y="658" text-anchor="middle" class="tiny">&lt;&lt;Direction.BOTH&gt;&gt;</text>
  <text x="1445" y="697" text-anchor="middle" class="section">Both</text>
  <line x1="1230" y1="721" x2="1660" y2="721" stroke="#14B8A6" stroke-width="1.4"/>
  <text x="1265" y="764" class="small">(start)-[edgePart]-(neighbor)</text>
  <text x="1265" y="793" class="small">undirected neighbor expansion</text>
  <rect x="240" y="1000" width="1360" height="56" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="920" y="1024" text-anchor="middle" class="tiny">NeighborOptions selects the relationship label, depth range, and traversal direction.</text>
  <text x="920" y="1048" text-anchor="middle" class="tiny">The query returns distinct neighbor nodes, then Neo4jRecordMapper converts each record to GraphVertex.</text>
</svg>

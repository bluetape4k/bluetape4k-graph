<text x="139" y="531" class="small">maxDepth == 1 -&gt; empty</text>
<text x="139" y="559" class="small">else *1..maxDepth</text>
<text x="139" y="587" class="small">label + depth suffix</text>
<rect x="535" y="215" width="295" height="170" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>

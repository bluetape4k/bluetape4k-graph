<text x="557" y="255" class="label">OUTGOING</text>
<text x="559" y="291" class="small">(start)-[edgePart]-&gt;</text>
<text x="559" y="319" class="small">(neighbor)</text>
<text x="559" y="347" class="small">follows outgoing rels</text>
<rect x="535" y="450" width="295" height="170" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
<rect x="545" y="460" width="12" height="150" rx="6" fill="#8B5CF6" opacity="0.95"/>
<text x="557" y="490" class="label">INCOMING</text>
<text x="559" y="526" class="small">(start)&lt;-[edgePart]-</text>
<text x="559" y="554" class="small">(neighbor)</text>
<text x="559" y="582" class="small">follows incoming rels</text>
<rect x="535" y="685" width="295" height="170" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
<rect x="545" y="695" width="12" height="150" rx="6" fill="#14B8A6" opacity="0.95"/>
<text x="557" y="725" class="label">BOTH</text>
<text x="559" y="761" class="small">(start)-[edgePart]-</text>
<text x="559" y="789" class="small">(neighbor)</text>
<text x="559" y="817" class="small">undirected pattern</text>
<rect x="1010" y="205" width="350" height="160" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
<rect x="1020" y="215" width="12" height="140" rx="6" fill="#F97316" opacity="0.95"/>
<text x="1032" y="245" class="label">Cypher Pattern</text>
<text x="1034" y="281" class="small">MATCH pattern</text>
<text x="1034" y="309" class="small">WHERE elementId(start) = $startId</text>
<text x="1034" y="337" class="small">RETURN DISTINCT neighbor</text>
<rect x="1010" y="455" width="350" height="160" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
<rect x="1020" y="465" width="12" height="140" rx="6" fill="#EF4444" opacity="0.95"/>
<text x="1032" y="495" class="label">Safe Identifier Rules</text>
<text x="1034" y="531" class="small">edgeLabel.requireNotBlank</text>
<text x="1034" y="559" class="small">requireSafeIdentifier</text>
<text x="1034" y="587" class="small">params carry startId.value</text>

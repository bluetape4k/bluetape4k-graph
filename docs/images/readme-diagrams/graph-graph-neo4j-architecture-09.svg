<text x="137" y="265" class="label">NeighborOptions</text>
<text x="139" y="301" class="small">startId: GraphElementId</text>
<text x="139" y="329" class="small">edgeLabel optional</text>
<text x="139" y="357" class="small">direction</text>
<text x="139" y="385" class="small">maxDepth</text>

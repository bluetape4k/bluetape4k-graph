<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Code Graph ERD</title>
  <desc id="desc">Property graph labels and relationships</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5f6f82"/>
    </marker>
    <style>
      .canvas { fill: #fbfcfe; }
      .frame { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 30px; fill: #243142; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #5c6b7d; }
      .box-title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 18px; fill: #233044; }
      .box-text { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 13px; fill: #435266; }
      .label { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 12px; fill: #4f5e70; }
      .edge { fill: none; stroke: #5f6f82; stroke-width: 2.4; marker-end: url(#arrow); }
      .pill { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1; }
    </style>
  </defs>
  <rect class="canvas" width="1120" height="520"/>
  <rect class="frame" x="24" y="24" width="1072" height="472" rx="18"/>
  <text class="title" x="560" y="68" text-anchor="middle">Code Graph ERD</text>
  <text class="subtitle" x="560" y="94" text-anchor="middle">Property graph labels and relationships</text>

      <path class="edge" d="M 435 183 H 362.5 V 250 H 290"/>
      <rect class="pill" x="326" y="192.5" width="88" height="22" rx="11"/>
      <text class="label" x="370" y="207.5" text-anchor="middle">BELONGS_TO</text>

      <path class="edge" d="M 435 385 H 362.5 V 250 H 290"/>
      <rect class="pill" x="326" y="293.5" width="88" height="22" rx="11"/>
      <text class="label" x="370" y="308.5" text-anchor="middle">BELONGS_TO</text>

      <path class="edge" d="M 290 250 H 560 V 240 H 830"/>
      <rect class="pill" x="516" y="221" width="88" height="22" rx="11"/>
      <text class="label" x="560" y="236" text-anchor="middle">DEPENDS_ON</text>

      <path class="edge" d="M 685 155.7 H 740 V 210.3 H 685"/>
      <rect class="pill" x="491.5" y="159" width="137" height="22" rx="11"/>
      <text class="label" x="560" y="174" text-anchor="middle">IMPORTS / EXTENDS</text>

      <path class="edge" d="M 685 362.5 H 740 V 407.5 H 685"/>
      <rect class="pill" x="533.5" y="361" width="53" height="22" rx="11"/>
      <text class="label" x="560" y="376" text-anchor="middle">CALLS</text>

      <g>
        <rect x="70" y="175" width="220" height="150" rx="14" fill="#e8f4ff" stroke="#98c1df" stroke-width="2"/>
        <text class="box-title" x="180" y="209" text-anchor="middle">Module</text>
        <text class="box-text" x="180" y="237" text-anchor="middle">name</text>
<text class="box-text" x="180" y="258" text-anchor="middle">path</text>
<text class="box-text" x="180" y="279" text-anchor="middle">version</text>
<text class="box-text" x="180" y="300" text-anchor="middle">language</text>
      </g>

      <g>
        <rect x="435" y="92" width="250" height="182" rx="14" fill="#eaf7ef" stroke="#9ccdad" stroke-width="2"/>
        <text class="box-title" x="560" y="126" text-anchor="middle">Class</text>
        <text class="box-text" x="560" y="154" text-anchor="middle">name</text>
<text class="box-text" x="560" y="175" text-anchor="middle">qualifiedName</text>
<text class="box-text" x="560" y="196" text-anchor="middle">module</text>
<text class="box-text" x="560" y="217" text-anchor="middle">isAbstract</text>
<text class="box-text" x="560" y="238" text-anchor="middle">isInterface</text>
      </g>

      <g>
        <rect x="435" y="310" width="250" height="150" rx="14" fill="#fff4d8" stroke="#e3c46f" stroke-width="2"/>
        <text class="box-title" x="560" y="344" text-anchor="middle">Function</text>
        <text class="box-text" x="560" y="372" text-anchor="middle">name</text>
<text class="box-text" x="560" y="393" text-anchor="middle">signature</text>
<text class="box-text" x="560" y="414" text-anchor="middle">className</text>
<text class="box-text" x="560" y="435" text-anchor="middle">lineCount</text>
      </g>

      <g>
        <rect x="830" y="175" width="220" height="130" rx="14" fill="#fdecef" stroke="#d8a6b0" stroke-width="2"/>
        <text class="box-title" x="940" y="209" text-anchor="middle">Other Module</text>
        <text class="box-text" x="940" y="237" text-anchor="middle">dependency target</text>
      </g>
</svg>

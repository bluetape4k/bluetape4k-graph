<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 31px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .rel { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #1E40AF; }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Code Graph Property Model</text>
  <text x="74" y="118" class="subtitle">Modules, classes, and functions are vertices; dependency, inheritance, containment, and call relationships are edges.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>
  <text x="920" y="210" text-anchor="middle" class="section">Vertex Labels and Edge Labels</text>

  <rect x="125" y="290" width="440" height="220" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="165" y="340" class="label">Module</text>
  <text x="165" y="380" class="small">name: string</text>
  <text x="165" y="408" class="small">path: string</text>
  <text x="165" y="436" class="small">version: string</text>
  <text x="165" y="464" class="small">language: string</text>

  <rect x="700" y="245" width="440" height="245" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="740" y="295" class="label">Class</text>
  <text x="740" y="335" class="small">name: string</text>
  <text x="740" y="363" class="small">qualifiedName: string</text>
  <text x="740" y="391" class="small">module: string</text>
  <text x="740" y="419" class="small">isAbstract: boolean</text>
  <text x="740" y="447" class="small">isInterface: boolean</text>
  <text x="740" y="475" class="small">self edges: IMPORTS, EXTENDS, IMPLEMENTS</text>

  <rect x="1275" y="290" width="440" height="220" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="1315" y="340" class="label">Function</text>
  <text x="1315" y="380" class="small">name: string</text>
  <text x="1315" y="408" class="small">signature: string</text>
  <text x="1315" y="436" class="small">className: string</text>
  <text x="1315" y="464" class="small">module: string, lineCount: integer</text>

  <path d="M 700 365 L 565 392" class="line"/>
  <text x="632" y="356" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">BELONGS_TO</text>
  <text x="632" y="356" text-anchor="middle" class="rel">BELONGS_TO</text>

  <path d="M 1495 510 L 1495 670 L 1275 670 L 1275 510" class="line"/>
  <text x="1385" y="652" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">CALLS</text>
  <text x="1385" y="652" text-anchor="middle" class="rel">CALLS</text>

  <path d="M 345 510 L 345 675 L 920 675 L 920 490" class="line"/>
  <text x="630" y="655" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">DEPENDS_ON</text>
  <text x="630" y="655" text-anchor="middle" class="rel">DEPENDS_ON</text>

  <path d="M 920 490 L 920 600 L 700 600 L 700 490" class="line"/>
  <text x="810" y="582" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">EXTENDS</text>
  <text x="810" y="582" text-anchor="middle" class="rel">EXTENDS</text>

  <path d="M 1005 490 L 1005 620 L 1140 620 L 1140 490" class="line"/>
  <text x="1075" y="602" text-anchor="middle" class="rel" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">IMPLEMENTS</text>
  <text x="1075" y="602" text-anchor="middle" class="rel">IMPLEMENTS</text>

  <rect x="160" y="735" width="470" height="95" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="3" class="card"/>
  <text x="195" y="772" class="label">Dependency Edge Properties</text>
  <text x="195" y="805" class="small">DEPENDS_ON: dependencyType, version</text>

  <rect x="685" y="735" width="470" height="95" rx="14" fill="#FCE7F3" stroke="#EC4899" stroke-width="3" class="card"/>
  <text x="720" y="772" class="label">Call Edge Properties</text>
  <text x="720" y="805" class="small">CALLS: callCount, isRecursive</text>

  <rect x="1210" y="735" width="470" height="95" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="1245" y="772" class="label">Query Use Cases</text>
  <text x="1245" y="805" class="small">paths, impact radius, chains, containment</text>
  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: code-graph-examples / ERD</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1057" viewBox="0 0 1800 1057" role="img" aria-labelledby="title desc">
  <title id="title">Recommendation examples domain UML</title>
  <desc id="desc">Domain labels and service operations for product, follow, and ranking recommendation examples.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L10,4 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowSoft" markerWidth="14" markerHeight="14" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L10,4 z" fill="#94A3B8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
    marker path, marker polygon, marker polyline { stroke-dasharray: none !important; }
      .canvas { fill: #F8FAFC; }
      .outer { fill: none; stroke: #60A5FA; stroke-width: 4; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; filter: url(#shadow); }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 48px; fill: #111827; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 22px; fill: #4B5563; }
      .label { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 29px; fill: #111827; }
      .small { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 17px; fill: #374151; }
      .tiny { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #4B5563; }
      .line { fill: none; stroke: #2563EB; stroke-width: 4; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #94A3B8; stroke-width: 3; marker-end: url(#arrowSoft); }
      .pill { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .card { filter: url(#shadow); }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1057"/>
  <rect class="outer" x="24" y="24" width="1752" height="1009" rx="22"/>
  <text x="74" y="82" class="title">Recommendation Domain UML</text>
  <text x="74" y="123" class="subtitle">User/Product labels, PURCHASED/FOLLOWS edges, and the service methods that turn paths into recommendations.</text>
  <circle cx="1660" cy="78" r="15" fill="#EDE9FE"/>
  <circle cx="1700" cy="78" r="15" fill="#DCFCE7"/>
  <circle cx="1740" cy="78" r="15" fill="#FED7AA"/>

  <rect x="70" y="160" width="1660" height="760" rx="18" class="panel"/>

  <rect x="130" y="275" width="330" height="230" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="295" y="328" text-anchor="middle" class="label">User</text>
  <line x1="130" y1="355" x2="460" y2="355" stroke="#3B82F6" stroke-width="2"/>
  <text x="170" y="398" class="small">userId: String</text>
  <text x="170" y="430" class="small">displayName: String</text>
  <text x="170" y="462" class="small">segment: String</text>

  <rect x="130" y="590" width="330" height="190" rx="10" fill="#F3E8FF" stroke="#A855F7" stroke-width="3" class="card"/>
  <text x="295" y="643" text-anchor="middle" class="label">FOLLOWS</text>
  <line x1="130" y1="670" x2="460" y2="670" stroke="#A855F7" stroke-width="2"/>
  <text x="170" y="713" class="small">from User</text>
  <text x="170" y="745" class="small">to User</text>

  <rect x="625" y="275" width="330" height="230" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" class="card"/>
  <text x="790" y="328" text-anchor="middle" class="label">Product</text>
  <line x1="625" y1="355" x2="955" y2="355" stroke="#F59E0B" stroke-width="2"/>
  <text x="665" y="398" class="small">productId: String</text>
  <text x="665" y="430" class="small">name: String</text>
  <text x="665" y="462" class="small">category: String</text>

  <rect x="625" y="590" width="330" height="190" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="790" y="643" text-anchor="middle" class="label">PURCHASED</text>
  <line x1="625" y1="670" x2="955" y2="670" stroke="#EF4444" stroke-width="2"/>
  <text x="665" y="713" class="small">quantity: Int</text>
  <text x="665" y="745" class="small">purchasedAt: String</text>

  <rect x="1110" y="255" width="520" height="370" rx="10" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="1370" y="308" text-anchor="middle" class="label">RecommendationService</text>
  <line x1="1110" y1="335" x2="1630" y2="335" stroke="#22C55E" stroke-width="2"/>
  <text x="1150" y="378" class="small">addUser(userId, displayName, segment)</text>
  <text x="1150" y="410" class="small">addProduct(productId, name, category)</text>
  <text x="1150" y="442" class="small">recordPurchase(userId, productId, quantity)</text>
  <text x="1150" y="474" class="small">follow(followerId, targetId)</text>
  <text x="1150" y="506" class="small">recommendProducts(userId, limit)</text>
  <text x="1150" y="538" class="small">recommendFollows(userId, limit)</text>
  <text x="1150" y="570" class="small">rankPopularProducts(limit)</text>

  <rect x="1110" y="690" width="520" height="110" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="1150" y="737" class="label">Suspend Service</text>
  <text x="1150" y="773" class="small">same recommendation operations with Flow results</text>

  <path d="M 460 390 L 615 390" class="line"/>
  <rect x="492" y="356" width="92" height="34" rx="17" class="pill"/>
  <text x="538" y="379" text-anchor="middle" class="tiny">buys</text>

  <path d="M 295 590 L 295 505" class="soft"/>
  <rect x="185" y="535" width="125" height="34" rx="17" class="pill"/>
  <text x="248" y="558" text-anchor="middle" class="tiny">follows</text>

  <path d="M 790 590 L 790 505" class="soft"/>
  <rect x="688" y="535" width="135" height="34" rx="17" class="pill"/>
  <text x="756" y="558" text-anchor="middle" class="tiny">purchased</text>

  <rect x="1015" y="635" width="235" height="46" rx="23" class="pill"/>
  <text x="1132" y="664" text-anchor="middle" class="tiny">service uses these labels</text>

  <rect x="270" y="835" width="1260" height="62" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="900" y="865" text-anchor="middle" class="small">The service keeps the model small: two vertex labels, two edge labels, traversal exclusion rules, and PageRank for product popularity.</text>

  <text x="900" y="1000" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: recommendation-examples / domain UML</text>
</svg>

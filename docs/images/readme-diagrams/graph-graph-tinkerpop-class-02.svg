<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">graph-tinkerpop class diagram</title>
  <desc id="desc">UML class diagram showing TinkerGraphOperations and TinkerGraphSuspendOperations contracts, dependencies, schema manager, mapper, and embedded TinkerGraph collaborators.</desc>
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="hollowTriangle" viewBox="0 0 16 14" refX="14" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 7 L 2 12 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    marker path, marker polygon, marker polyline { stroke-dasharray: none !important; }
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .className { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .classNameSmall { font-family: 'Architects Daughter', cursive; font-size: 24px; fill: #111827; }
    .stereo { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #64748B; font-weight: 700; }
    .member { font-family: 'Comic Mono', monospace; font-size: 16px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #475569; }
    .label { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; font-weight: 700; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .realize { fill: none; stroke: #64748B; stroke-width: 1.9; stroke-dasharray: 8 7; stroke-linecap: round; stroke-linejoin: round;  }
    .use { fill: none; stroke: #64748B; stroke-width: 1.9; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round;  }
    .assoc { fill: none; stroke: #64748B; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openArrow); }
  </style>

  <rect width="1680" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1624" height="1024" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1608" cy="66" r="14" fill="#FED7AA"/>
  <circle cx="1570" cy="66" r="14" fill="#DCFCE7"/>
  <circle cx="1532" cy="66" r="14" fill="#EDE9FE"/>

  <text x="72" y="84" class="title">graph-tinkerpop class model</text>
  <text x="74" y="122" class="subtitle">Sync operations own the embedded graph; coroutine operations wrap the sync implementation and expose suspend/Flow contracts.</text>

  <rect x="70" y="160" width="1540" height="790" rx="20" class="panel"/>

  <rect x="150" y="210" width="300" height="160" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" class="card"/>
  <text x="300" y="248" text-anchor="middle" class="stereo">&lt;&lt;interfaces&gt;&gt;</text>
  <text x="300" y="284" text-anchor="middle" class="classNameSmall">Sync Contracts</text>
  <line x1="180" y1="306" x2="420" y2="306" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="182" y="334" class="small">GraphOperations</text>
  <text x="182" y="356" class="small">Algorithm / Transaction / Merge</text>

  <rect x="1230" y="210" width="300" height="160" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" class="card"/>
  <text x="1380" y="248" text-anchor="middle" class="stereo">&lt;&lt;interfaces&gt;&gt;</text>
  <text x="1380" y="284" text-anchor="middle" class="classNameSmall">Suspend Contracts</text>
  <line x1="1260" y1="306" x2="1500" y2="306" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="1262" y="334" class="small">GraphSuspendOperations</text>
  <text x="1262" y="356" class="small">Suspend Transaction / Merge</text>

  <rect x="260" y="420" width="500" height="240" rx="16" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.9" class="card"/>
  <text x="510" y="458" text-anchor="middle" class="stereo">&lt;&lt;class&gt;&gt;</text>
  <text x="510" y="496" text-anchor="middle" class="className">TinkerGraphOperations</text>
  <line x1="302" y1="518" x2="718" y2="518" stroke="#C4B5FD" stroke-width="1.3"/>
  <text x="306" y="548" class="member">- graph: TinkerGraph</text>
  <text x="306" y="575" class="member">- g: GraphTraversalSource</text>
  <text x="306" y="602" class="member">- schemaManager</text>
  <text x="306" y="629" class="member">- transactionGate / writeLock</text>

  <rect x="920" y="420" width="500" height="240" rx="16" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.9" class="card"/>
  <text x="1170" y="458" text-anchor="middle" class="stereo">&lt;&lt;class&gt;&gt;</text>
  <text x="1170" y="496" text-anchor="middle" class="className">TinkerGraphSuspendOperations</text>
  <line x1="962" y1="518" x2="1378" y2="518" stroke="#99F6E4" stroke-width="1.3"/>
  <text x="966" y="548" class="member">- delegate: TinkerGraphOperations</text>
  <text x="966" y="575" class="member">- acquireTransactionGate()</text>
  <text x="966" y="602" class="member">- materialize Flow result</text>
  <line x1="962" y1="622" x2="1378" y2="622" stroke="#99F6E4" stroke-width="1.3"/>
  <text x="966" y="650" class="member">+ suspendTransaction(block): T</text>

  <rect x="130" y="760" width="300" height="132" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8" class="card"/>
  <text x="280" y="798" text-anchor="middle" class="stereo">&lt;&lt;embedded graph&gt;&gt;</text>
  <text x="280" y="836" text-anchor="middle" class="classNameSmall">TinkerGraph</text>
  <line x1="160" y1="858" x2="400" y2="858" stroke="#BBF7D0" stroke-width="1.3"/>
  <text x="162" y="884" class="small">GraphTraversalSource g</text>

  <rect x="500" y="760" width="300" height="132" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="1.8" class="card"/>
  <text x="650" y="798" text-anchor="middle" class="stereo">&lt;&lt;class&gt;&gt;</text>
  <text x="650" y="836" text-anchor="middle" class="classNameSmall">SchemaManager</text>
  <line x1="530" y1="858" x2="770" y2="858" stroke="#FDE68A" stroke-width="1.3"/>
  <text x="532" y="884" class="small">index metadata only</text>

  <rect x="870" y="760" width="300" height="132" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.8" class="card"/>
  <text x="1020" y="798" text-anchor="middle" class="stereo">&lt;&lt;object&gt;&gt;</text>
  <text x="1020" y="836" text-anchor="middle" class="classNameSmall">GremlinRecordMapper</text>
  <line x1="900" y1="858" x2="1140" y2="858" stroke="#FECACA" stroke-width="1.3"/>
  <text x="902" y="884" class="small">Vertex / Edge / Path mapping</text>

  <rect x="1240" y="760" width="300" height="132" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.8" class="card"/>
  <text x="1390" y="798" text-anchor="middle" class="stereo">&lt;&lt;private&gt;&gt;</text>
  <text x="1390" y="836" text-anchor="middle" class="classNameSmall">Snapshot Types</text>
  <line x1="1270" y1="858" x2="1510" y2="858" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="1272" y="884" class="small">rollback copy model</text>

  <path d="M 400 420 L 400 413 Q 400 395 382 395 L 318 395 Q 300 395 300 377 L 300 370" class="realize" style="marker-end:none"/>
  <polygon points="306,385 300,370 294,385" fill="#FFFFFF" stroke="#64748B" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 1280 420 L 1280 413 Q 1280 395 1298 395 L 1362 395 Q 1380 395 1380 377 L 1380 370" class="realize" style="marker-end:none"/>
  <polygon points="1386,385 1380,370 1374,385" fill="#FFFFFF" stroke="#64748B" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 920 548 L 760 548" class="assoc"/>
  <path d="M 390 660 L 390 692 Q 390 710 372 710 L 298 710 Q 280 710 280 728 L 280 760" class="assoc"/>
  <path d="M 546 660 L 546 692 Q 546 710 564 710 L 632 710 Q 650 710 650 728 L 650 760" class="use" style="marker-end:none"/>
  <polyline points="645,749 650,760 655,749" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 660 660 L 660 692 Q 660 710 678 710 L 1002 710 Q 1020 710 1020 728 L 1020 760" class="use" style="marker-end:none"/>
  <polyline points="1015,749 1020,760 1025,749" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 720 660 L 720 692 Q 720 710 738 710 L 1372 710 Q 1390 710 1390 728 L 1390 760" class="use" style="marker-end:none"/>
  <polyline points="1385,749 1390,760 1395,749" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <text x="840" y="536" text-anchor="middle" class="label">delegates</text>
  <rect x="324" y="691" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="356" y="708" text-anchor="middle" class="label">owns</text>
  <rect x="604" y="691" width="72" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="640" y="708" text-anchor="middle" class="label">schema</text>
  <rect x="848" y="691" width="64" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="880" y="708" text-anchor="middle" class="label">maps</text>
  <rect x="1044" y="691" width="88" height="24" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
  <text x="1088" y="708" text-anchor="middle" class="label">rollback</text>

  <rect x="160" y="968" width="1360" height="54" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="840" y="1001" text-anchor="middle" class="small">Dashed hollow triangles show interface realization. Solid arrows show ownership/delegation, dashed open arrows show dependencies.</text>
</svg>

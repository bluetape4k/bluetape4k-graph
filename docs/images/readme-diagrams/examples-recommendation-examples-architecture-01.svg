<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1057" viewBox="0 0 1800 1057" role="img" aria-labelledby="title desc">
  <title id="title">Recommendation examples architecture</title>
  <desc id="desc">Recommendation service architecture for product recommendations, follow recommendations, PageRank ranking, CSV import, and portable graph backends.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L10,4 z" fill="#2563EB"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #F8FAFC; }
      .outer { fill: none; stroke: #60A5FA; stroke-width: 4; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; filter: url(#shadow); }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 48px; fill: #111827; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 22px; fill: #4B5563; }
      .section { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 31px; fill: #111827; }
      .label { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 27px; fill: #111827; }
      .small { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 17px; fill: #374151; }
      .tiny { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #4B5563; }
      .line { fill: none; stroke: #2563EB; stroke-width: 4; marker-end: url(#arrow); }
      .card { filter: url(#shadow); }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1057"/>
  <rect class="outer" x="24" y="24" width="1752" height="1009" rx="22"/>
  <text x="74" y="82" class="title">Recommendation Graph Example Architecture</text>
  <text x="74" y="123" class="subtitle">Model users, products, purchases, and follows once; run traversal and PageRank recommendations on every backend.</text>
  <circle cx="1660" cy="78" r="15" fill="#EDE9FE"/>
  <circle cx="1700" cy="78" r="15" fill="#DCFCE7"/>
  <circle cx="1740" cy="78" r="15" fill="#FED7AA"/>

  <rect x="70" y="160" width="1660" height="760" rx="18" class="panel"/>

  <text x="145" y="230" class="section">Inputs</text>
  <text x="520" y="230" class="section">Recommendation Service</text>
  <text x="960" y="230" class="section">Portable Graph API</text>
  <text x="1390" y="230" class="section">Learning Outcomes</text>

  <rect x="125" y="300" width="310" height="155" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="165" y="348" class="label">Tiny Domain Graph</text>
  <text x="165" y="384" class="small">Alice buys camera</text>
  <text x="165" y="412" class="small">Bob buys camera + tripod</text>

  <rect x="125" y="540" width="310" height="155" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="165" y="588" class="label">CSV Fixture</text>
  <text x="165" y="624" class="small">users and products</text>
  <text x="165" y="652" class="small">PURCHASED and FOLLOWS</text>

  <rect x="520" y="255" width="350" height="138" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="560" y="303" class="label">Product Traversal</text>
  <text x="560" y="339" class="small">same purchased product</text>
  <text x="560" y="367" class="small">similar user -> other product</text>

  <rect x="520" y="460" width="350" height="138" rx="14" fill="#F3E8FF" stroke="#A855F7" stroke-width="3" class="card"/>
  <text x="560" y="508" class="label">Follow Traversal</text>
  <text x="560" y="544" class="small">outgoing FOLLOWS</text>
  <text x="560" y="572" class="small">second-hop candidate</text>

  <rect x="520" y="665" width="350" height="138" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" class="card"/>
  <text x="560" y="713" class="label">Popularity Ranking</text>
  <text x="560" y="749" class="small">pageRank(Product, PURCHASED)</text>
  <text x="560" y="777" class="small">top purchased products</text>

  <rect x="960" y="315" width="330" height="155" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="3" class="card"/>
  <text x="1000" y="363" class="label">GraphOperations</text>
  <text x="1000" y="399" class="small">neighbors traversal</text>
  <text x="1000" y="427" class="small">pageRank(PageRankOptions)</text>

  <rect x="960" y="575" width="330" height="155" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="1000" y="623" class="label">Backend Matrix</text>
  <text x="1000" y="659" class="small">TinkerGraph, Neo4j, Memgraph</text>
  <text x="1000" y="687" class="small">Apache AGE, FalkorDB</text>

  <rect x="1400" y="255" width="285" height="145" rx="14" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="3" class="card"/>
  <text x="1440" y="303" class="label">Product Rec</text>
  <text x="1440" y="339" class="small">Alice receives tripod</text>
  <text x="1440" y="367" class="small">via Bob's shared camera</text>

  <rect x="1400" y="465" width="285" height="145" rx="14" fill="#FDF2F8" stroke="#EC4899" stroke-width="3" class="card"/>
  <text x="1440" y="513" class="label">Follow Rec</text>
  <text x="1440" y="549" class="small">Alice -> Bob -> Carol</text>
  <text x="1440" y="577" class="small">exclude direct follows</text>

  <rect x="1400" y="675" width="285" height="145" rx="14" fill="#FFEDD5" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1440" y="723" class="label">Ranking</text>
  <text x="1440" y="759" class="small">popular product appears</text>
  <text x="1440" y="787" class="small">backend-neutral order</text>

  <path d="M 435 378 L 510 324" class="line"/>
  <path d="M 435 378 L 510 529" class="line"/>
  <path d="M 435 618 L 510 734" class="line"/>
  <path d="M 870 324 L 950 392" class="line"/>
  <path d="M 870 529 L 950 392" class="line"/>
  <path d="M 870 734 L 950 392" class="line"/>
  <path d="M 1125 470 L 1125 565" class="line"/>
  <path d="M 1290 392 L 1390 328" class="line"/>
  <path d="M 1290 392 L 1390 538" class="line"/>
  <path d="M 1290 392 L 1390 748" class="line"/>

  <rect x="235" y="850" width="1330" height="62" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="900" y="880" text-anchor="middle" class="small">Abstract tests define the recommendation behavior once; concrete backend tests only provide GraphOperations setup.</text>

  <text x="900" y="1000" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: recommendation-examples / architecture</text>
</svg>

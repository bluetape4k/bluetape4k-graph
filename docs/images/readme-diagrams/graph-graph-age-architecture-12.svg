<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">graph-age test environment</title>
  <desc id="desc">Architecture diagram showing graph-age integration test setup with JUnit tests, PostgreSQLAgeServer Testcontainers launcher, HikariCP connectionInitSql, Exposed Database.connect, and Apache AGE container runtime.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 20 14" refX="18" refY="7" markerWidth="20" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 18 7 L 2 12 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 20 14" refX="18" refY="7" markerWidth="20" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 18 7 L 2 12 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 20 14" refX="18" refY="7" markerWidth="20" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 18 7 L 2 12 Z" fill="#B45309"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 52px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .layerTitle { font-family: 'Comic Mono', monospace; font-size: 16px; font-weight: 700; fill: #334155; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; }
    .label { font-family: 'Comic Mono', monospace; font-size: 13px; font-weight: 700; fill: #475569; }
    .layer { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .blue { fill: #DBEAFE; stroke: #3B82F6; stroke-width: 1.8; }
    .violet { fill: #EDE9FE; stroke: #8B5CF6; stroke-width: 1.8; }
    .amber { fill: #FEF3C7; stroke: #EAB308; stroke-width: 1.8; }
    .green { fill: #DCFCE7; stroke: #22C55E; stroke-width: 1.8; }
    .teal { fill: #CCFBF1; stroke: #14B8A6; stroke-width: 1.8; }
    .gray { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.7; }
    .lineBlue { fill: none; stroke: #2563EB; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
    .lineTeal { fill: none; stroke: #0F766E; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowTeal); }
    .lineAmber { fill: none; stroke: #B45309; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowAmber); }
  </style>

  <rect width="1680" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1624" height="1024" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1608" cy="66" r="14" fill="#FED7AA"/>
  <circle cx="1570" cy="66" r="14" fill="#DCFCE7"/>
  <circle cx="1532" cy="66" r="14" fill="#EDE9FE"/>

  <text x="72" y="84" class="title">graph-age test environment</text>
  <text x="74" y="122" class="subtitle">Integration tests share the AGE container launcher, build a HikariCP DataSource, then bind Exposed to the AGE-ready connection pool.</text>

  <rect x="70" y="164" width="1540" height="208" rx="20" class="layer"/>
  <text x="96" y="198" class="layerTitle">test suites</text>

  <rect x="120" y="240" width="300" height="90" rx="16" class="blue card"/>
  <text x="270" y="274" text-anchor="middle" class="cardTitle">CRUD / Batch Tests</text>
  <text x="146" y="304" class="body">AgeGraphOperationsTest</text>
  <text x="146" y="326" class="small">batch, merge, schema</text>

  <rect x="500" y="240" width="300" height="90" rx="16" class="violet card"/>
  <text x="650" y="274" text-anchor="middle" class="cardTitle">Suspend Tests</text>
  <text x="526" y="304" class="body">AgeGraphSuspendOperationsTest</text>
  <text x="526" y="326" class="small">Flow + suspend APIs</text>

  <rect x="880" y="240" width="300" height="90" rx="16" class="teal card"/>
  <text x="1030" y="274" text-anchor="middle" class="cardTitle">Algorithm Tests</text>
  <text x="906" y="304" class="body">AgeAlgorithmTest</text>
  <text x="906" y="326" class="small">degree + JVM fallbacks</text>

  <rect x="1260" y="240" width="300" height="90" rx="16" class="green card"/>
  <text x="1410" y="274" text-anchor="middle" class="cardTitle">Weighted Path Tests</text>
  <text x="1286" y="304" class="body">Dijkstra / A* coverage</text>
  <text x="1286" y="326" class="small">sync + suspend variants</text>

  <rect x="70" y="412" width="1540" height="240" rx="20" class="layer"/>
  <text x="96" y="446" class="layerTitle">shared test infrastructure</text>

  <rect x="160" y="496" width="330" height="100" rx="16" class="amber card"/>
  <text x="325" y="532" text-anchor="middle" class="cardTitle">PostgreSQLAgeServer</text>
  <text x="186" y="562" class="body">Launcher.postgresqlAge</text>
  <text x="186" y="584" class="small">Testcontainers shared server</text>

  <rect x="675" y="496" width="330" height="100" rx="16" class="green card"/>
  <text x="840" y="532" text-anchor="middle" class="cardTitle">HikariDataSource</text>
  <text x="701" y="562" class="body">connectionInitSql</text>
  <text x="701" y="584" class="small">LOAD age; SET search_path</text>

  <rect x="1190" y="496" width="330" height="100" rx="16" class="teal card"/>
  <text x="1355" y="532" text-anchor="middle" class="cardTitle">Exposed Database</text>
  <text x="1216" y="562" class="body">Database.connect(dataSource)</text>
  <text x="1216" y="584" class="small">transaction boundary for ops</text>

  <rect x="70" y="692" width="1540" height="240" rx="20" class="layer"/>
  <text x="96" y="726" class="layerTitle">container runtime</text>

  <path d="M 230 790
           C 230 764, 610 764, 610 790
           L 610 872
           C 610 898, 230 898, 230 872 Z" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8" class="card"/>
  <ellipse cx="420" cy="790" rx="190" ry="28" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.8"/>
  <text x="420" y="832" text-anchor="middle" class="cardTitle">apache/age:PG16_latest</text>
  <text x="420" y="862" text-anchor="middle" class="body">PostgreSQL with AGE extension</text>

  <path d="M 790 790
           C 790 764, 1190 764, 1190 790
           L 1190 872
           C 1190 898, 790 898, 790 872 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8" class="card"/>
  <ellipse cx="990" cy="790" rx="200" ry="28" fill="#FDE68A" stroke="#D97706" stroke-width="1.8"/>
  <text x="990" y="832" text-anchor="middle" class="cardTitle">AGE graph namespace</text>
  <text x="990" y="862" text-anchor="middle" class="body">created/dropped by operations tests</text>

  <rect x="1280" y="780" width="230" height="96" rx="16" class="gray card"/>
  <text x="1395" y="816" text-anchor="middle" class="cardTitle">JUnit Resources</text>
  <text x="1306" y="846" class="small">logback-test.xml</text>
  <text x="1306" y="868" class="small">junit-platform.properties</text>

  <path d="M 270 330 L 270 412 L 325 496" class="lineBlue"/>
  <path d="M 650 330 L 650 412 L 840 496" class="lineBlue"/>
  <path d="M 1030 330 L 1030 412 L 840 496" class="lineBlue"/>
  <path d="M 1410 330 L 1410 412 L 1355 496" class="lineBlue"/>

  <path d="M 490 546 L 675 546" class="lineAmber"/>
  <path d="M 1005 546 L 1190 546" class="lineTeal"/>
  <path d="M 840 596 L 620 790" class="lineTeal"/>
  <path d="M 1355 596 L 990 790" class="lineTeal"/>
  <path d="M 610 832 L 790 832" class="lineAmber"/>

  <text x="580" y="528" text-anchor="middle" class="label">jdbcUrl / credentials</text>
  <text x="1098" y="528" text-anchor="middle" class="label">connects</text>
  <text x="706" y="690" text-anchor="middle" class="label">AGE-ready pool</text>
  <text x="1180" y="690" text-anchor="middle" class="label">transactions</text>
  <text x="700" y="814" text-anchor="middle" class="label">stores graphs</text>

  <rect x="220" y="984" width="1240" height="38" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="840" y="1008" text-anchor="middle" class="small">Every test DataSource must run LOAD 'age' and set ag_catalog in connectionInitSql before Exposed transactions execute AGE SQL.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1180" viewBox="0 0 1840 1180">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .soft { stroke: #64748B; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1180" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1132" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Graph AGE Test Environment</text>
  <text x="74" y="118" class="subtitle">JUnit tests share a PostgreSQL AGE container, initialize every pooled connection, then verify sync and suspend graph operations.</text>

  <rect x="70" y="155" width="1700" height="865" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <line x1="445" y1="315" x2="555" y2="315" class="line"/>
  <line x1="880" y1="315" x2="990" y2="315" class="line"/>
  <line x1="1315" y1="315" x2="1425" y2="315" class="line"/>
  <line x1="1590" y1="480" x2="1590" y2="615" class="soft"/>
  <line x1="665" y1="480" x2="665" y2="615" class="soft"/>
  <line x1="945" y1="795" x2="1120" y2="795" class="line"/>
  <line x1="1415" y1="795" x2="1530" y2="795" class="line"/>

  <rect x="120" y="240" width="325" height="215" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="282" y="278" text-anchor="middle" class="tiny">&lt;&lt;JUnit 5 classes&gt;&gt;</text>
  <text x="282" y="316" text-anchor="middle" class="section">AGE Tests</text>
  <line x1="120" y1="340" x2="445" y2="340" stroke="#3B82F6" stroke-width="2"/>
  <text x="150" y="377" class="small">@BeforeAll setup</text>
  <text x="150" y="406" class="small">@BeforeEach resetGraph</text>
  <text x="150" y="435" class="small">runSuspendIO / runTest</text>

  <g class="card">
    <ellipse cx="718" cy="240" rx="162" ry="40" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/>
    <rect x="556" y="240" width="324" height="240" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/>
    <ellipse cx="718" cy="480" rx="162" ry="40" fill="#DCFCE7" stroke="#22C55E" stroke-width="3"/>
    <line x1="556" y1="240" x2="556" y2="480" stroke="#22C55E" stroke-width="3"/>
    <line x1="880" y1="240" x2="880" y2="480" stroke="#22C55E" stroke-width="3"/>
  </g>
  <text x="718" y="292" text-anchor="middle" class="section">PostgreSQL AGE</text>
  <text x="590" y="344" class="small">PostgreSQLAgeServer</text>
  <text x="590" y="373" class="small">Launcher.postgresqlAge</text>
  <text x="590" y="402" class="small">jdbcUrl / username / password</text>

  <rect x="990" y="240" width="325" height="215" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="1152" y="278" text-anchor="middle" class="tiny">&lt;&lt;connection pool&gt;&gt;</text>
  <text x="1152" y="316" text-anchor="middle" class="section">HikariCP</text>
  <line x1="990" y1="340" x2="1315" y2="340" stroke="#EAB308" stroke-width="2"/>
  <text x="1020" y="377" class="small">driver: PostgreSQL</text>
  <text x="1020" y="406" class="small">maximumPoolSize = 5</text>
  <text x="1020" y="435" class="small">LOAD age + search_path</text>

  <rect x="1425" y="240" width="325" height="215" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="1588" y="278" text-anchor="middle" class="tiny">&lt;&lt;Exposed JDBC&gt;&gt;</text>
  <text x="1588" y="316" text-anchor="middle" class="section">Database</text>
  <line x1="1425" y1="340" x2="1750" y2="340" stroke="#14B8A6" stroke-width="2"/>
  <text x="1455" y="377" class="small">Database.connect(dataSource)</text>
  <text x="1455" y="406" class="small">TransactionManager.exec</text>
  <text x="1455" y="435" class="small">JDBC transaction boundary</text>

  <rect x="385" y="615" width="560" height="240" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="665" y="653" text-anchor="middle" class="tiny">&lt;&lt;operations under test&gt;&gt;</text>
  <text x="665" y="691" text-anchor="middle" class="section">Graph Operations</text>
  <line x1="385" y1="715" x2="945" y2="715" stroke="#8B5CF6" stroke-width="2"/>
  <text x="420" y="752" class="small">AgeGraphOperations(graphName)</text>
  <text x="420" y="781" class="small">AgeGraphSuspendOperations(graphName)</text>
  <text x="420" y="810" class="small">reset: dropGraph then createGraph</text>
  <text x="420" y="839" class="small">same test_graph boundary per test</text>

  <rect x="1120" y="615" width="295" height="240" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1268" y="653" text-anchor="middle" class="tiny">&lt;&lt;coverage focus&gt;&gt;</text>
  <text x="1268" y="691" text-anchor="middle" class="section">Scenarios</text>
  <line x1="1120" y1="715" x2="1415" y2="715" stroke="#F97316" stroke-width="2"/>
  <text x="1150" y="752" class="small">graph create / drop</text>
  <text x="1150" y="781" class="small">vertex and edge CRUD</text>
  <text x="1150" y="810" class="small">neighbors / shortestPath</text>
  <text x="1150" y="839" class="small">merge and weighted path</text>

  <rect x="1530" y="615" width="220" height="240" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="1640" y="653" text-anchor="middle" class="tiny">&lt;&lt;assertions&gt;&gt;</text>
  <text x="1640" y="691" text-anchor="middle" class="section">Results</text>
  <line x1="1530" y1="715" x2="1750" y2="715" stroke="#EF4444" stroke-width="2"/>
  <text x="1560" y="752" class="small">GraphVertex</text>
  <text x="1560" y="781" class="small">GraphEdge</text>
  <text x="1560" y="810" class="small">GraphPath</text>
  <text x="1560" y="839" class="small">AGE agtype parsed</text>
  <text x="920" y="1088" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: graph-age / test environment</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .thin { stroke: #64748B; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Knowledge Graph Example Architecture</text>
  <text x="74" y="118" class="subtitle">Documents, entities, and concepts become connected facts for mention lookup and bounded path inference.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="285" y="214" text-anchor="middle" class="section">Knowledge Facts</text>
  <text x="720" y="214" text-anchor="middle" class="section">Service Layer</text>
  <text x="1150" y="214" text-anchor="middle" class="section">Traversal Features</text>
  <text x="1525" y="214" text-anchor="middle" class="section">Backends</text>

  <rect x="125" y="270" width="340" height="155" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="160" y="318" class="label">Manual Scenario</text>
  <text x="160" y="354" class="small">document mentions Kotlin</text>
  <text x="160" y="382" class="small">Kotlin relates to Coroutines</text>
  <text x="160" y="410" class="small">entities classify under concepts</text>

  <rect x="125" y="535" width="340" height="155" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="160" y="583" class="label">CSV Fixture Import</text>
  <text x="160" y="619" class="small">documents, entities, concepts</text>
  <text x="160" y="647" class="small">MENTIONS, RELATED_TO, IS_A</text>
  <text x="160" y="675" class="small">graph-io CSV bulk importer</text>

  <rect x="565" y="250" width="360" height="175" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="600" y="298" class="label">KnowledgeGraphService</text>
  <text x="600" y="334" class="small">addDocument, addEntity, addConcept</text>
  <text x="600" y="362" class="small">mention, relateEntities, classify</text>
  <text x="600" y="390" class="small">uses GraphOperations contract</text>

  <rect x="565" y="535" width="360" height="150" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="600" y="583" class="label">Suspend Variant</text>
  <text x="600" y="619" class="small">KnowledgeGraphSuspendService</text>
  <text x="600" y="647" class="small">GraphSuspendOperations path</text>
  <text x="600" y="675" class="small">Flow results for async lookup</text>

  <rect x="1010" y="245" width="330" height="145" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="1045" y="293" class="label">Mention Lookup</text>
  <text x="1045" y="329" class="small">neighbors over MENTIONS</text>
  <text x="1045" y="357" class="small">document to entity facts</text>

  <rect x="1010" y="450" width="330" height="145" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1045" y="498" class="label">Related Traversal</text>
  <text x="1045" y="534" class="small">neighbors over RELATED_TO</text>
  <text x="1045" y="562" class="small">depth-limited entity expansion</text>

  <rect x="1010" y="650" width="330" height="145" rx="14" fill="#FCE7F3" stroke="#EC4899" stroke-width="3" class="card"/>
  <text x="1045" y="698" class="label">Path Inference</text>
  <text x="1045" y="734" class="small">allPaths(PathOptions)</text>
  <text x="1045" y="762" class="small">service-side maxPaths bound</text>

  <g class="card">
    <ellipse cx="1555" cy="420" rx="165" ry="46" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <rect x="1390" y="420" width="330" height="265" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <ellipse cx="1555" cy="685" rx="165" ry="46" fill="#FDBA74" stroke="#F59E0B" stroke-width="3"/>
  </g>
  <text x="1555" y="443" text-anchor="middle" class="label">Runtime Matrix</text>
  <text x="1555" y="496" text-anchor="middle" class="small">TinkerGraph memory</text>
  <text x="1555" y="530" text-anchor="middle" class="small">Neo4j and Memgraph</text>
  <text x="1555" y="564" text-anchor="middle" class="small">PostgreSQL AGE</text>
  <text x="1555" y="598" text-anchor="middle" class="small">FalkorDB isolated names</text>

  <path d="M 465 345 L 565 338" class="line"/>
  <path d="M 465 612 L 565 610" class="line"/>
  <path d="M 925 338 L 1010 318" class="line"/>
  <path d="M 925 610 L 1010 522" class="line"/>
  <path d="M 925 610 L 1010 722" class="thin"/>
  <path d="M 1340 318 L 1390 420" class="line"/>
  <path d="M 1340 522 L 1390 505" class="thin"/>
  <path d="M 1340 722 L 1390 640" class="thin"/>

  <rect x="180" y="825" width="1480" height="58" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="920" y="852" text-anchor="middle" class="small">The example keeps fact modeling, traversal, and backend wiring separate so the path explanation stays portable.</text>

  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: knowledge-graph-examples / architecture</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1060" viewBox="0 0 1700 1060">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1.2 1.4 L 8.6 5 L 1.2 8.6 Z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    marker path, marker polygon, marker polyline { stroke-dasharray: none !important; }
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 19px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 29px; fill: #111827; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .code { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #1F2937; }
    .kw { fill: #2563EB; font-weight: 700; }
    .type { fill: #7C3AED; }
    .prop { fill: #B45309; }
    .call { fill: #0F766E; }
    .str { fill: #15803D; }
    .punct { fill: #64748B; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .codePanel { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.6; }
    .card { filter: url(#shadow); }
    .line { fill: none; stroke: #64748B; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1700" height="1060" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1644" height="1004" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2"/>

  <text x="72" y="84" class="title">schema DSL as executable metadata</text>
  <text x="74" y="122" class="subtitle">Write label objects like Kotlin pseudocode; graph-core records typed metadata for repositories and backend schema managers.</text>

  <rect x="76" y="164" width="1548" height="756" rx="20" class="panel"/>

  <text x="120" y="224" class="section">1. User declares graph vocabulary</text>
  <rect x="120" y="254" width="690" height="480" rx="18" class="codePanel"/>
  <text x="154" y="304" class="code"><tspan class="kw">object</tspan><tspan> </tspan><tspan class="type">PersonLabel</tspan><tspan class="punct"> : </tspan><tspan class="type">VertexLabel</tspan><tspan class="punct">(</tspan><tspan class="str">"Person"</tspan><tspan class="punct">) {</tspan></text>
  <text x="188" y="336" class="code"><tspan class="kw">val</tspan><tspan> </tspan><tspan class="prop">email</tspan><tspan class="punct"> = </tspan><tspan class="call">string</tspan><tspan class="punct">(</tspan><tspan class="str">"email"</tspan><tspan class="punct">)</tspan></text>
  <text x="188" y="368" class="code"><tspan class="kw">val</tspan><tspan> </tspan><tspan class="prop">name</tspan><tspan class="punct"> = </tspan><tspan class="call">string</tspan><tspan class="punct">(</tspan><tspan class="str">"name"</tspan><tspan class="punct">)</tspan></text>
  <text x="188" y="400" class="code"><tspan class="kw">val</tspan><tspan> </tspan><tspan class="prop">joinedAt</tspan><tspan class="punct"> = </tspan><tspan class="call">localDate</tspan><tspan class="punct">(</tspan><tspan class="str">"joined_at"</tspan><tspan class="punct">)</tspan></text>
  <text x="154" y="432" class="code"><tspan class="punct">}</tspan></text>

  <text x="154" y="494" class="code"><tspan class="kw">object</tspan><tspan> </tspan><tspan class="type">CompanyLabel</tspan><tspan class="punct"> : </tspan><tspan class="type">VertexLabel</tspan><tspan class="punct">(</tspan><tspan class="str">"Company"</tspan><tspan class="punct">) {</tspan></text>
  <text x="188" y="526" class="code"><tspan class="kw">val</tspan><tspan> </tspan><tspan class="prop">name</tspan><tspan class="punct"> = </tspan><tspan class="call">string</tspan><tspan class="punct">(</tspan><tspan class="str">"name"</tspan><tspan class="punct">)</tspan></text>
  <text x="154" y="558" class="code"><tspan class="punct">}</tspan></text>

  <text x="154" y="620" class="code"><tspan class="kw">object</tspan><tspan> </tspan><tspan class="type">WorksAtLabel</tspan><tspan class="punct"> :</tspan></text>
  <text x="188" y="652" class="code"><tspan class="type">EdgeLabel</tspan><tspan class="punct">(</tspan><tspan class="str">"WORKS_AT"</tspan><tspan class="punct">, </tspan><tspan class="type">PersonLabel</tspan><tspan class="punct">, </tspan><tspan class="type">CompanyLabel</tspan><tspan class="punct">) {</tspan></text>
  <text x="188" y="684" class="code"><tspan class="kw">val</tspan><tspan> </tspan><tspan class="prop">since</tspan><tspan class="punct"> = </tspan><tspan class="call">localDate</tspan><tspan class="punct">(</tspan><tspan class="str">"since"</tspan><tspan class="punct">)</tspan></text>
  <text x="154" y="716" class="code"><tspan class="punct">}</tspan></text>

  <path d="M 810 494 L 900 494" class="line"/>

  <text x="930" y="224" class="section">2. graph-core records metadata</text>
  <rect x="930" y="254" width="610" height="178" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.2" class="card"/>
  <text x="1235" y="294" text-anchor="middle" class="cardTitle">Vertex labels</text>
  <text x="970" y="330" class="body">Person.label = "Person"</text>
  <text x="970" y="360" class="body">Person.properties = [email:String, name:String]</text>
  <text x="970" y="390" class="body">Person.properties += [joinedAt:LocalDate]</text>
  <text x="970" y="420" class="body">Company.properties = [name:String]</text>

  <rect x="930" y="472" width="610" height="178" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.2" class="card"/>
  <text x="1235" y="512" text-anchor="middle" class="cardTitle">Edge labels</text>
  <text x="970" y="548" class="body">WorksAt.label = "WORKS_AT"</text>
  <text x="970" y="578" class="body">WorksAt.from = PersonLabel</text>
  <text x="970" y="608" class="body">WorksAt.to = CompanyLabel</text>
  <text x="970" y="638" class="body">WorksAt.properties = [since:LocalDate]</text>

  <rect x="930" y="690" width="610" height="120" rx="18" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.2" class="card"/>
  <text x="1235" y="730" text-anchor="middle" class="cardTitle">PropertyDef&lt;T&gt;</text>
  <text x="970" y="766" class="body">Each DSL call returns typed metadata: name + KClass&lt;out T&gt;.</text>
  <text x="970" y="792" class="small">properties returns a copied list, not mutable internal state.</text>

  <rect x="180" y="952" width="1340" height="58" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="850" y="986" text-anchor="middle" class="small">The DSL does not create database objects by itself; backend schema managers decide which indexes or constraints can be emitted.</text>
</svg>

<line class="lifeline" x1="235.0" y1="230" x2="235.0" y2="700"/>
<rect class="card" x="420.0" y="156" width="230" height="58" rx="16" fill="#EAF7EF" stroke="#58A978"/>
<text class="label" x="535.0" y="185.0" text-anchor="middle">GraphOperations</text>
<line class="lifeline" x1="535.0" y1="230" x2="535.0" y2="700"/>
<rect class="card" x="720.0" y="156" width="230" height="58" rx="16" fill="#FFF3D9" stroke="#D6A441"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .thin { stroke: #64748B; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Fraud Detection Example Architecture</text>
  <text x="74" y="118" class="subtitle">Money transfers become a directed account graph for cycle, component, and centrality analytics.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="285" y="214" text-anchor="middle" class="section">Sample Input</text>
  <text x="710" y="214" text-anchor="middle" class="section">Fraud Domain Service</text>
  <text x="1150" y="214" text-anchor="middle" class="section">Graph Analytics</text>
  <text x="1525" y="214" text-anchor="middle" class="section">Backends</text>

  <rect x="125" y="270" width="340" height="150" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="160" y="318" class="label">Manual Scenario</text>
  <text x="160" y="354" class="small">Alice transfers to Bob</text>
  <text x="160" y="382" class="small">Bob transfers to Carol</text>
  <text x="160" y="410" class="small">Carol transfers back to Alice</text>

  <rect x="125" y="535" width="340" height="150" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="160" y="583" class="label">CSV Fixture Import</text>
  <text x="160" y="619" class="small">vertices.csv: three accounts</text>
  <text x="160" y="647" class="small">edges.csv: transfer chain</text>
  <text x="160" y="675" class="small">graph-io CSV bulk importer</text>

  <rect x="565" y="250" width="360" height="170" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="600" y="298" class="label">FraudDetectionService</text>
  <text x="600" y="334" class="small">addAccount creates Account vertices</text>
  <text x="600" y="362" class="small">recordTransfer writes TRANSFERRED_TO</text>
  <text x="600" y="390" class="small">uses GraphOperations contract</text>

  <rect x="565" y="535" width="360" height="150" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="600" y="583" class="label">Suspend Variant</text>
  <text x="600" y="619" class="small">FraudDetectionSuspendService</text>
  <text x="600" y="647" class="small">GraphSuspendOperations path</text>
  <text x="600" y="675" class="small">Flow-friendly analytics results</text>

  <rect x="1010" y="245" width="330" height="150" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="1045" y="293" class="label">Cycle Detection</text>
  <text x="1045" y="329" class="small">detectCycles(CycleOptions)</text>
  <text x="1045" y="357" class="small">finds circular transfers</text>
  <text x="1045" y="385" class="small">maxDepth and maxCycles controls</text>

  <rect x="1010" y="455" width="330" height="135" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1045" y="503" class="label">Cluster Detection</text>
  <text x="1045" y="539" class="small">connectedComponents()</text>
  <text x="1045" y="567" class="small">suspicious connected groups</text>

  <rect x="1010" y="650" width="330" height="135" rx="14" fill="#FCE7F3" stroke="#EC4899" stroke-width="3" class="card"/>
  <text x="1045" y="698" class="label">High Risk Ranking</text>
  <text x="1045" y="734" class="small">pageRank(PageRankOptions)</text>
  <text x="1045" y="762" class="small">topK accounts for review</text>

  <g class="card">
    <ellipse cx="1555" cy="420" rx="165" ry="46" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <rect x="1390" y="420" width="330" height="265" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
    <ellipse cx="1555" cy="685" rx="165" ry="46" fill="#FDBA74" stroke="#F59E0B" stroke-width="3"/>
  </g>
  <text x="1555" y="443" text-anchor="middle" class="label">Runtime Matrix</text>
  <text x="1555" y="496" text-anchor="middle" class="small">TinkerGraph memory</text>
  <text x="1555" y="530" text-anchor="middle" class="small">Neo4j and Memgraph</text>
  <text x="1555" y="564" text-anchor="middle" class="small">PostgreSQL AGE</text>
  <text x="1555" y="598" text-anchor="middle" class="small">FalkorDB isolated names</text>

  <path d="M 465 345 L 565 335" class="line"/>
  <path d="M 465 610 L 565 610" class="line"/>
  <path d="M 925 335 L 1010 320" class="line"/>
  <path d="M 925 610 L 1010 520" class="line"/>
  <path d="M 925 610 L 1010 715" class="thin"/>
  <path d="M 1340 320 L 1390 420" class="line"/>
  <path d="M 1340 520 L 1390 500" class="thin"/>
  <path d="M 1340 715 L 1390 640" class="thin"/>

  <rect x="180" y="825" width="1480" height="58" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="920" y="852" text-anchor="middle" class="small">The example teaches relationship-first fraud signals without binding the domain logic to one graph database.</text>

  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: fraud-detection-examples / architecture</text>
</svg>

  <path d="M 1410 490 L 1412 490 Q 1430 490 1430 508 L 1430 747 Q 1430 765 1448 765 L 1450 765" class="flow" />
  <path d="M 1220 530 L 1220 635" class="use" />

  <rect x="310" y="850" width="1220" height="52" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
  <text x="920" y="883" text-anchor="middle" class="small">The service answers deterministic impact and alternate-route questions from explicit graph relationships.</text>
  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: supply-chain-graph-examples / architecture</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1057" viewBox="0 0 1800 1057" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k-graph backend capability matrix</title>
  <desc id="desc">Backend capability comparison for Neo4j, Memgraph, Apache AGE, TinkerGraph, and FalkorDB under the shared GraphOperations contract.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #F8FAFC; }
      .outer { fill: none; stroke: #60A5FA; stroke-width: 4; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; filter: url(#shadow); }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 48px; fill: #111827; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 22px; fill: #4B5563; }
      .section { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 30px; fill: #111827; }
      .label { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 27px; fill: #111827; }
      .small { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 17px; fill: #374151; }
      .tiny { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #4B5563; }
      .chip { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #111827; }
      .card { filter: url(#shadow); }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1057"/>
  <rect class="outer" x="24" y="24" width="1752" height="1009" rx="22"/>
  <text x="74" y="82" class="title">Backend Capability Matrix</text>
  <text x="74" y="123" class="subtitle">One GraphOperations contract, five backend implementations, and explicit gaps where a database cannot enforce a capability.</text>
  <circle cx="1660" cy="78" r="15" fill="#EDE9FE"/>
  <circle cx="1700" cy="78" r="15" fill="#DCFCE7"/>
  <circle cx="1740" cy="78" r="15" fill="#FED7AA"/>

  <rect x="70" y="160" width="1660" height="760" rx="18" class="panel"/>

  <rect x="115" y="225" width="350" height="595" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="155" y="277" class="label">Shared Contract</text>
  <text x="155" y="320" class="small">graph-core</text>
  <text x="155" y="362" class="small">GraphOperations</text>
  <text x="155" y="394" class="small">GraphSuspendOperations</text>
  <text x="155" y="426" class="small">schemaManager()</text>
  <text x="155" y="458" class="small">merge operations</text>
  <text x="155" y="490" class="small">transaction DSL</text>
  <rect x="155" y="550" width="270" height="52" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
  <text x="290" y="582" text-anchor="middle" class="chip">sync + coroutine APIs</text>
  <rect x="155" y="625" width="270" height="52" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
  <text x="290" y="657" text-anchor="middle" class="chip">explicit unsupported gaps</text>
  <rect x="155" y="700" width="270" height="52" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
  <text x="290" y="732" text-anchor="middle" class="chip">abstract test reuse</text>

  <text x="540" y="230" class="section">Server Backends</text>
  <rect x="520" y="275" width="345" height="230" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="3" class="card"/>
  <text x="560" y="325" class="label">Neo4j</text>
  <text x="560" y="360" class="small">graph-neo4j</text>
  <text x="560" y="397" class="small">Cypher, Neo4j Java Driver</text>
  <text x="560" y="429" class="small">index + unique constraints</text>
  <text x="560" y="461" class="small">native MERGE, driver tx</text>

  <rect x="915" y="275" width="345" height="230" rx="16" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="955" y="325" class="label">Memgraph</text>
  <text x="955" y="360" class="small">graph-memgraph</text>
  <text x="955" y="397" class="small">Cypher, Bolt-compatible</text>
  <text x="955" y="429" class="small">index + unique constraints</text>
  <text x="955" y="461" class="small">native MERGE, driver tx</text>

  <rect x="1310" y="275" width="345" height="230" rx="16" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="1350" y="325" class="label">Apache AGE</text>
  <text x="1350" y="360" class="small">graph-age</text>
  <text x="1350" y="397" class="small">Cypher over PostgreSQL</text>
  <text x="1350" y="429" class="small">schema DDL unsupported</text>
  <text x="1350" y="461" class="small">transactional merge fallback</text>

  <text x="540" y="570" class="section">Embedded / Redis Backends</text>
  <rect x="520" y="615" width="345" height="220" rx="16" fill="#FFEDD5" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="560" y="665" class="label">TinkerGraph</text>
  <text x="560" y="700" class="small">graph-tinkerpop</text>
  <text x="560" y="737" class="small">Gremlin, JVM in-memory</text>
  <text x="560" y="769" class="small">index metadata, no unique</text>
  <text x="560" y="801" class="small">tests, demos, local analysis</text>

  <rect x="915" y="615" width="345" height="220" rx="16" fill="#FCE7F3" stroke="#EC4899" stroke-width="3" class="card"/>
  <text x="955" y="665" class="label">FalkorDB</text>
  <text x="955" y="700" class="small">graph-falkordb</text>
  <text x="955" y="737" class="small">openCypher over Redis</text>
  <text x="955" y="769" class="small">range index, no unique</text>
  <text x="955" y="801" class="small">native MERGE, no tx support</text>

  <rect x="1310" y="615" width="345" height="220" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="1350" y="665" class="label">Selection Cue</text>
  <text x="1350" y="700" class="small">Neo4j: mature graph server</text>
  <text x="1350" y="732" class="small">Memgraph: low-latency Cypher</text>
  <text x="1350" y="764" class="small">AGE: PostgreSQL consolidation</text>
  <text x="1350" y="796" class="small">Tinker/Falkor: local or Redis</text>

  <rect x="245" y="842" width="1310" height="58" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="900" y="871" text-anchor="middle" class="small">Capability labels summarize README-backed support: schema, merge, transaction, infrastructure, and strongest local role.</text>

  <text x="900" y="1000" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | root README / backend capability matrix</text>
</svg>

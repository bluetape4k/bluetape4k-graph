<rect x="70" y="1844" width="2422" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1871" text-anchor="start">ALT: Element is vertex</text>
<rect x="1974.6666666666665" y="1912" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1992.6666666666665" y="1939" text-anchor="start">16. parseVertex(element)</text>
<path class="line" d="M2041.6666666666665 1970 C2105.6666666666665 1970 2105.6666666666665 2004 2041.6666666666665 2004"/>
<rect x="2126.833333333333" y="2042" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2144.833333333333" y="2069" text-anchor="start">17. Add VertexStep</text>
<path class="line" d="M2041.6666666666665 2100 L2422 2100"/>
<rect x="70" y="2152" width="2422" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="2179" text-anchor="start">ELSE: Element is edge</text>
<rect x="1982.6666666666665" y="2220" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2000.6666666666665" y="2247" text-anchor="start">19. parseEdge(element)</text>
<path class="line" d="M2041.6666666666665 2278 C2105.6666666666665 2278 2105.6666666666665 2312 2041.6666666666665 2312"/>
<rect x="2126.833333333333" y="2350" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2144.833333333333" y="2377" text-anchor="start">20. Add EdgeStep</text>
<path class="line" d="M2041.6666666666665 2408 L2422 2408"/>
<rect x="2126.833333333333" y="2460" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2144.833333333333" y="2487" text-anchor="start">21. GraphPath(steps)</text>
<path class="line" d="M2041.6666666666665 2518 L2422 2518"/>
<rect x="2126.833333333333" y="2570" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2144.833333333333" y="2597" text-anchor="start">22. GraphPath</text>
<path class="dashed" d="M2422 2628 L2041.6666666666665 2628"/>
<rect x="1176" y="2680" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1194" y="2707" text-anchor="start">23. GraphPath or null</text>
<path class="dashed" d="M2041.6666666666665 2738 L520.3333333333333 2738"/>
<rect x="225.16666666666663" y="2790" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="243.16666666666663" y="2817" text-anchor="start">24. GraphPath?</text>
<path class="dashed" d="M520.3333333333333 2848 L140 2848"/>

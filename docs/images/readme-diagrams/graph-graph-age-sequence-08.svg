<rect x="114.66666666666663" y="286" width="431" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="132.66666666666663" y="313" text-anchor="start">1. shortestPath(fromId, toId, KNOWS, maxDepth=10)</text>
<path class="line" d="M140 344 L520.3333333333333 344"/>
<rect x="417.33333333333326" y="396" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>

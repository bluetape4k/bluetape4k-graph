<path class="dashed" d="M1661.3333333333333 914 L1281 914"/>
<rect x="1356.1666666666665" y="966" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1374.1666666666665" y="993" text-anchor="start">7. exec(SET search_path)</text>
<path class="line" d="M1281 1024 L1661.3333333333333 1024"/>
<rect x="1366.1666666666665" y="1076" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1384.1666666666665" y="1103" text-anchor="start">8. OK</text>
<path class="dashed" d="M1661.3333333333333 1134 L1281 1134"/>
<rect x="1320.1666666666665" y="1186" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1338.1666666666665" y="1213" text-anchor="start">9. exec(AgeSql.shortestPath(...))</text>
<path class="line" d="M1281 1244 L1661.3333333333333 1244"/>
<rect x="1251.6666666666665" y="1296" width="439" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1269.6666666666665" y="1323" text-anchor="start">10. agtype path: [vertex, edge, vertex, ...]::path</text>
<path class="dashed" d="M1661.3333333333333 1354 L1281 1354"/>
<rect x="1546.3333333333333" y="1406" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1564.3333333333333" y="1433" text-anchor="start">11. parsePath(agtypeStr)</text>
<path class="line" d="M1281 1464 L2041.6666666666665 1464"/>
<rect x="1974.6666666666665" y="1516" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1992.6666666666665" y="1543" text-anchor="start">12. Remove ::path suffix</text>
<path class="line" d="M2041.6666666666665 1574 C2105.6666666666665 1574 2105.6666666666665 1608 2041.6666666666665 1608"/>
<rect x="1954.6666666666665" y="1646" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1972.6666666666665" y="1673" text-anchor="start">13. Parse JSON array of steps</text>
<path class="line" d="M2041.6666666666665 1704 C2105.6666666666665 1704 2105.6666666666665 1738 2041.6666666666665 1738"/>
<rect x="70" y="1776" width="2422" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>

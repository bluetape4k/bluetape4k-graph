<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1060" viewBox="0 0 1760 1060">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="15.0" markerHeight="15.0" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="smallArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 19px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .card { filter: url(#shadow); }
    .mainLine { fill: none; stroke: #2563EB; stroke-width: 5.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .softLine { fill: none; stroke: #64748B; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#smallArrow); }
  </style>

  <rect x="0" y="0" width="1760" height="1060" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1704" height="1004" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2"/>

  <text x="72" y="84" class="title">vertex and edge CRUD contracts</text>
  <text x="74" y="122" class="subtitle">Graph-core defines vertex and edge repository contracts; batch helpers validate bulk inputs before backend adapters execute them.</text>

  <rect x="76" y="160" width="1608" height="788" rx="20" class="panel"/>

  <text x="122" y="342" class="section">1. Batch input gate</text>
  <rect x="122" y="376" width="382" height="182" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.2" class="card"/>
  <text x="313" y="418" text-anchor="middle" class="cardTitle">GraphBatchValidation</text>
  <text x="158" y="458" class="body">label: nonblank safe identifier</text>
  <text x="158" y="489" class="body">property keys: safe identifiers</text>
  <text x="158" y="520" class="body">batch edges: fromId + toId</text>

  <text x="626" y="218" class="section">2. Repository contract</text>
  <rect x="626" y="252" width="430" height="182" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.2" class="card"/>
  <text x="841" y="294" text-anchor="middle" class="cardTitle">GraphVertexRepository</text>
  <text x="664" y="334" class="body">create / find / update / delete</text>
  <text x="664" y="365" class="body">createVertices fallback loop</text>
  <text x="664" y="396" class="small">returns vertex models, counts, or delete status</text>

  <rect x="626" y="558" width="430" height="182" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.2" class="card"/>
  <text x="841" y="600" text-anchor="middle" class="cardTitle">GraphEdgeRepository</text>
  <text x="664" y="640" class="body">create / find / delete edges</text>
  <text x="664" y="671" class="body">createEdges fallback loop</text>
  <text x="664" y="702" class="small">BatchEdge carries endpoints and row properties</text>

  <path d="M 504 424 L 530 424 Q 548 424 548 406 L 548 360 Q 548 342 566 342 L 592 342" class="mainLine"/>
  <path d="M 504 510 L 530 510 Q 548 510 548 528 L 548 630 Q 548 648 566 648 L 592 648" class="mainLine"/>

  <path d="M 1056 342 L 1144 342" class="mainLine"/>
  <path d="M 1056 648 L 1144 648" class="mainLine"/>

  <text x="1178" y="218" class="section">3. Backend adapter</text>
  <path d="M 1184 296
           C 1184 266, 1512 266, 1512 296
           L 1512 694
           C 1512 724, 1184 724, 1184 694
           Z" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.4" filter="url(#shadow)"/>
  <ellipse cx="1348" cy="296" rx="164" ry="30" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.4"/>
  <ellipse cx="1348" cy="694" rx="164" ry="30" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2.4"/>
  <text x="1348" y="374" text-anchor="middle" class="cardTitle">Persistence mapping</text>
  <text x="1238" y="420" class="body">Neo4j / Memgraph</text>
  <text x="1238" y="451" class="body">AGE / FalkorDB</text>
  <text x="1238" y="482" class="body">TinkerPop</text>
  <text x="1238" y="528" class="small">native query, transaction,</text>
  <text x="1238" y="555" class="small">or traversal primitive</text>

  <path d="M 1348 724 L 1348 792" class="mainLine"/>

  <rect x="330" y="808" width="1080" height="74" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
  <text x="870" y="846" text-anchor="middle" class="cardTitle">Return contract</text>
  <text x="870" y="874" text-anchor="middle" class="body">GraphVertex, GraphEdge, List&lt;T&gt;, Long count, null when missing, or Boolean delete result.</text>
</svg>

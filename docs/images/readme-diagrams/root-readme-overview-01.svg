  <rect class="box db-fill" x="778" y="224" width="174" height="54"/>
  <text class="label" x="865" y="247" text-anchor="middle">graph-neo4j</text>
  <text class="sub" x="865" y="266" text-anchor="middle">Cypher driver</text>


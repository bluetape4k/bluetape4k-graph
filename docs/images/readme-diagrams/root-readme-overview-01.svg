  <rect class="box db-fill" x="778" y="292" width="174" height="54"/>
  <text class="label" x="865" y="315" text-anchor="middle">graph-age</text>
  <text class="sub" x="865" y="334" text-anchor="middle">PostgreSQL + AGE</text>

  <rect x="972" y="292" width="174" height="54" rx="8" fill="#0f172a"/>
  <rect class="box db-fill" x="972" y="292" width="174" height="54"/>
  <text class="label" x="1059" y="315" text-anchor="middle">graph-falkordb</text>
  <text class="sub" x="1059" y="334" text-anchor="middle">Redis module graph</text>

  <rect x="1162" y="258" width="62" height="54" rx="8" fill="#0f172a"/>
  <rect class="box db-fill" x="1162" y="258" width="62" height="54"/>
  <text class="label" x="1193" y="282" text-anchor="middle">Tinker</text>
  <text class="sub" x="1193" y="300" text-anchor="middle">Pop</text>

  <rect x="296" y="462" width="188" height="58" rx="8" fill="#0f172a"/>
  <rect class="box io-fill" x="296" y="462" width="188" height="58"/>
  <text class="label" x="390" y="486" text-anchor="middle">graph-io</text>
  <text class="sub" x="390" y="505" text-anchor="middle">CSV / NDJSON / GraphML</text>

  <rect x="496" y="462" width="168" height="58" rx="8" fill="#0f172a"/>
  <rect class="box io-fill" x="496" y="462" width="168" height="58"/>
  <text class="label" x="580" y="486" text-anchor="middle">graph-okio</text>
  <text class="sub" x="580" y="505" text-anchor="middle">streams + encryption</text>

  <rect x="688" y="462" width="174" height="58" rx="8" fill="#0f172a"/>
  <rect class="box app-fill" x="688" y="462" width="174" height="58"/>
  <text class="label" x="775" y="486" text-anchor="middle">graph-ktor</text>
  <text class="sub" x="775" y="505" text-anchor="middle">Ktor 3 plugin</text>

  <rect x="878" y="462" width="174" height="58" rx="8" fill="#0f172a"/>
  <rect class="box app-fill" x="878" y="462" width="174" height="58"/>
  <text class="label" x="965" y="486" text-anchor="middle">graph-spring-boot</text>
  <text class="sub" x="965" y="505" text-anchor="middle">Spring Boot 4 config</text>

  <rect x="1070" y="462" width="170" height="58" rx="8" fill="#0f172a"/>

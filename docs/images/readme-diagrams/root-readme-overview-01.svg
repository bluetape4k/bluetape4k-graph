<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120" role="img" aria-label="Bluetape4k Graph overview">
<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
  <style>
    .canvas{fill:#ffffff}
    .layer{fill:#f3f6fa;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:8 6}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:44px;fill:#111827;font-weight:400}
    .subtitle{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:16px;fill:#6b7280;font-weight:400}
    .section{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:16px;fill:#4b5563;font-weight:700;letter-spacing:0.8px}
    .card-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#111827;font-weight:400}
    .detail{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#6b7280;font-weight:400}
    .label{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:12px;fill:#374151;font-weight:400}
    .footer{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#6b7280;font-weight:400}
    .badge-text{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#374151;font-weight:700}
    .card{fill:#ffffff;stroke:#94a3b8;stroke-width:1.9}
    .db-title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#111827;font-weight:400}
    .db-small{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#6b7280;font-weight:400}
  </style>
</defs>
<rect class="canvas" width="1900" height="1120"/>
<text class="title" x="72" y="82">Bluetape4k Graph overview</text>
<text class="subtitle" x="76" y="118">One repository provides a unified Kotlin graph API, backend adapters, bulk graph I/O, and application integrations.</text>

<rect class="layer" x="64" y="142" width="1772" height="210" rx="8"/>
<rect class="layer" x="64" y="392" width="1772" height="274" rx="8"/>
<rect class="layer" x="64" y="706" width="1772" height="324" rx="8"/>
<text class="section" x="92" y="165">ENTRY AND API SURFACE</text>
<text class="section" x="92" y="418">PORTABLE GRAPH CAPABILITIES</text>
<text class="section" x="92" y="730">BACKEND RUNTIME COVERAGE</text>

<g id="edges">
  <path d="M 420 246 L 540 246" stroke="#2563eb" stroke-width="2.1" fill="none" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="480" y="236" text-anchor="middle">use</text>
  <path d="M 880 246 L 1020 246" stroke="#2563eb" stroke-width="2.1" fill="none" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="950" y="236" text-anchor="middle">extend</text>
  <path d="M 710 306 L 710 455" stroke="#2563eb" stroke-width="2.1" fill="none" marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="710" y="375" text-anchor="middle">contracts</text>
  <path d="M 1185 306 L 1185 455" stroke="#16a34a" stroke-width="2.1" fill="none" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1185" y="375" text-anchor="middle">route + config</text>
  <path d="M 300 616 L 300 695 L 490 695 L 490 770" stroke="#ea580c" stroke-width="2.1" fill="none" marker-end="url(#arrow-orange)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="392" y="685" text-anchor="middle">query model</text>
  <path d="M 710 616 L 710 695 L 710 770" stroke="#ea580c" stroke-width="2.1" fill="none" marker-end="url(#arrow-orange)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="710" y="685" text-anchor="middle">query model</text>
  <path d="M 1120 616 L 1120 695 L 980 695 L 980 770" stroke="#9333ea" stroke-width="2.1" fill="none" marker-end="url(#arrow-purple)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1050" y="685" text-anchor="middle">bulk data</text>
  <path d="M 1530 616 L 1530 695 L 1420 695 L 1420 770" stroke="#16a34a" stroke-width="2.1" fill="none" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="1476" y="685" text-anchor="middle">service use</text>
</g>

<g id="nodes">
  <g id="services">
    <rect class="card" x="90" y="190" width="330" height="116" rx="8"/>
    <rect x="108" y="210" width="44" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
    <text class="badge-text" x="130" y="238" text-anchor="middle">APP</text>
    <text class="card-title" x="172" y="224">Kotlin services</text>
    <text class="detail" x="172" y="262">blocking and suspend callers</text>
  </g>
  <g id="core">
    <rect class="card" x="540" y="190" width="340" height="116" rx="8"/>
    <rect x="558" y="210" width="44" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.3"/>
    <text class="badge-text" x="580" y="238" text-anchor="middle">CORE</text>
    <text class="card-title" x="622" y="224">graph-core</text>
    <text class="detail" x="622" y="262">models, repositories, schema</text>
  </g>
  <g id="integrations-entry">
    <rect class="card" x="1020" y="190" width="330" height="116" rx="8"/>
    <rect x="1038" y="210" width="44" height="44" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
    <text class="badge-text" x="1060" y="238" text-anchor="middle">INT</text>
    <text class="card-title" x="1102" y="224">App integrations</text>
    <text class="detail" x="1102" y="262">Ktor plugin and Spring Boot</text>
  </g>

  <g id="operations">
    <rect class="card" x="90" y="455" width="420" height="162" rx="8"/>
    <rect x="108" y="475" width="44" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
    <text class="badge-text" x="130" y="503" text-anchor="middle">OPS</text>
    <text class="card-title" x="172" y="489">Graph operations</text>
    <text class="detail" x="172" y="527">vertices, edges, paths</text>
    <text class="detail" x="172" y="551">batch, schema, transactions</text>
    <text class="detail" x="172" y="575">weighted paths and algorithms</text>
  </g>
  <g id="adapters">
    <rect class="card" x="560" y="455" width="380" height="162" rx="8"/>
    <rect x="578" y="475" width="44" height="44" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
    <text class="badge-text" x="600" y="503" text-anchor="middle">DRV</text>
    <text class="card-title" x="642" y="489">Backend adapters</text>
    <text class="detail" x="642" y="527">Cypher, Gremlin, SQL bridge</text>
    <text class="detail" x="642" y="551">driver-specific translation</text>
  </g>
  <g id="io">
    <rect class="card" x="990" y="455" width="380" height="162" rx="8"/>
    <rect x="1008" y="475" width="44" height="44" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.3"/>
    <text class="badge-text" x="1030" y="503" text-anchor="middle">IO</text>
    <text class="card-title" x="1072" y="489">Graph I/O</text>
    <text class="detail" x="1072" y="527">CSV, NDJSON, GraphML</text>
    <text class="detail" x="1072" y="551">OkIO stream utilities</text>
  </g>
  <g id="app">
    <rect class="card" x="1420" y="455" width="380" height="162" rx="8"/>
    <rect x="1438" y="475" width="44" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.3"/>
    <text class="badge-text" x="1460" y="503" text-anchor="middle">WEB</text>
    <text class="card-title" x="1502" y="489">Service adapters</text>
    <text class="detail" x="1502" y="527">Ktor routes and graph plugin</text>
    <text class="detail" x="1502" y="551">Spring Boot auto-config</text>
  </g>
</g>

<g id="databases">
  <g id="neo4j">
    <path d="M320 798 C320 770 540 770 540 798 L540 900 C540 928 320 928 320 900 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.4"/>

    <text class="db-small" x="430" y="858" text-anchor="middle">Cypher / Java Driver</text>
  </g>
  <g id="memgraph">
    <path d="M600 798 C600 770 820 770 820 798 L820 900 C820 928 600 928 600 900 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.4"/>

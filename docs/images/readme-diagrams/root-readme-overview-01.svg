  <text class="label" x="1155" y="486" text-anchor="middle">benchmark</text>
  <text class="sub" x="1155" y="505" text-anchor="middle">JMH performance suites</text>

  <text class="section" x="76" y="600">DOMAIN EXAMPLES</text>
  <text class="section" x="756" y="600">FORMAT AND API COVERAGE</text>
  <text class="section" x="1094" y="600">LOCAL PROOF</text>

  <rect x="84" y="626" width="598" height="196" rx="8" fill="#0f172a"/>
  <rect class="box external-fill" x="84" y="626" width="598" height="196"/>
  <text class="label" x="112" y="660">examples/</text>
  <text class="sub" x="112" y="688">code-graph, fraud-detection, iam-access, knowledge-graph</text>
  <text class="sub" x="112" y="716">linkedin, observability, recommendation, supply-chain</text>
  <text class="sub" x="112" y="744">data-lineage, network-topology, security-attack-path</text>
  <text class="sub" x="112" y="772">ktor-graph app examples</text>
  <text class="tiny" x="112" y="798">Concrete tests share abstract graph scenarios across supported backends.</text>

  <rect x="720" y="626" width="286" height="196" rx="8" fill="#0f172a"/>
  <rect class="box backend-fill" x="720" y="626" width="286" height="196"/>
  <text class="label" x="748" y="660">Execution models</text>
  <text class="sub" x="748" y="688">blocking GraphOperations</text>
  <text class="sub" x="748" y="716">coroutine GraphSuspendOperations</text>
  <text class="sub" x="748" y="744">virtual-thread adapters</text>
  <text class="tiny" x="748" y="784">Bulk import/export reuses the same graph contracts.</text>

  <rect x="1054" y="626" width="226" height="196" rx="8" fill="#0f172a"/>
  <rect class="box verify-fill" x="1054" y="626" width="226" height="196"/>
  <text class="label" x="1082" y="660">Verification</text>
  <text class="sub" x="1082" y="688">Testcontainers graphdb launchers</text>
  <text class="sub" x="1082" y="716">TinkerGraph in-memory tests</text>
  <text class="sub" x="1082" y="744">examples workflow coverage</text>
  <text class="sub" x="1082" y="772">benchmark decision guide</text>

  <text class="section" x="76" y="876">LEGEND</text>
  <rect x="76" y="898" width="16" height="10" rx="2" class="bom-fill"/>
  <text class="tiny" x="102" y="907">BOM</text>
  <rect x="172" y="898" width="16" height="10" rx="2" class="backend-fill"/>
  <text class="tiny" x="198" y="907">Core API</text>
  <rect x="298" y="898" width="16" height="10" rx="2" class="db-fill"/>
  <text class="tiny" x="324" y="907">Graph DB backend</text>
  <rect x="478" y="898" width="16" height="10" rx="2" class="io-fill"/>
  <text class="tiny" x="504" y="907">Bulk I/O</text>
  <rect x="590" y="898" width="16" height="10" rx="2" class="app-fill"/>
  <text class="tiny" x="616" y="907">Application integration</text>
  <rect x="790" y="898" width="16" height="10" rx="2" class="verify-fill"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k Graph overview</title>
  <desc id="desc">Dark architecture overview of the bluetape4k-graph repository: BOM, common graph APIs, backend adapters, graph I/O, application integrations, examples, benchmarks, and verification surfaces.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7"/>
    </pattern>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <style>
      .bg { fill: #020617; }
      .panel { fill: #0f172a; stroke: #1e293b; stroke-width: 2; }
      .title { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 38px; fill: #f8fafc; font-weight: 700; }
      .subtitle { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; fill: #94a3b8; }
      .section { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #cbd5e1; font-weight: 700; letter-spacing: 0; }
      .label { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #f8fafc; font-weight: 700; }
      .sub { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #94a3b8; }
      .tiny { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #94a3b8; }
      .note { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #64748b; }
      .bom-fill { fill: #78350f; fill-opacity: 0.32; stroke: #fbbf24; }
      .backend-fill { fill: #064e3b; fill-opacity: 0.42; stroke: #34d399; }
      .db-fill { fill: #4c1d95; fill-opacity: 0.44; stroke: #a78bfa; }
      .io-fill { fill: #7c2d12; fill-opacity: 0.34; stroke: #fb923c; }
      .app-fill { fill: #083344; fill-opacity: 0.44; stroke: #22d3ee; }
      .verify-fill { fill: #881337; fill-opacity: 0.40; stroke: #fb7185; }
      .external-fill { fill: #1e293b; fill-opacity: 0.70; stroke: #94a3b8; }
      .box { stroke-width: 1.6; rx: 8; filter: url(#glow); }
      .cluster { fill: transparent; stroke-width: 1.2; stroke-dasharray: 8 5; rx: 14; }
      .flow { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrowhead); }
      .flow-strong { fill: none; stroke: #34d399; stroke-width: 2; marker-end: url(#arrowhead); }
      .flow-io { fill: none; stroke: #fb923c; stroke-width: 1.8; marker-end: url(#arrowhead); }
      .flow-app { fill: none; stroke: #22d3ee; stroke-width: 1.8; marker-end: url(#arrowhead); }
      .flow-verify { fill: none; stroke: #fb7185; stroke-width: 1.6; stroke-dasharray: 6 5; marker-end: url(#arrowhead); }
    </style>
  </defs>

  <rect class="bg" width="1400" height="1000"/>
  <rect width="1400" height="1000" fill="url(#grid)" opacity="0.72"/>
  <rect class="panel" x="36" y="32" width="1328" height="936" rx="22"/>

  <circle cx="78" cy="78" r="7" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text class="title" x="102" y="91">Bluetape4k Graph overview</text>
  <text class="subtitle" x="102" y="121">Unified Kotlin graph APIs, backend adapters, bulk I/O, application integrations, examples, and benchmark surfaces.</text>

  <text class="section" x="76" y="172">DEPENDENCY ALIGNMENT</text>
  <text class="section" x="426" y="172">COMMON API FOUNDATION</text>
  <text class="section" x="776" y="172">GRAPH DATABASE ADAPTERS</text>
  <text class="section" x="1106" y="172">VERIFICATION SURFACES</text>

  <!-- Arrows are intentionally drawn before boxes so components mask connection lines. -->
  <path class="flow-strong" d="M 334 250 L 430 250"/>
  <path class="flow-strong" d="M 680 250 L 778 250"/>
  <path class="flow-io" d="M 582 338 C 582 384 390 392 390 440"/>
  <path class="flow-io" d="M 582 338 C 582 384 580 392 580 440"/>
  <path class="flow-app" d="M 972 338 C 972 384 775 394 775 440"/>
  <path class="flow-app" d="M 972 338 C 972 384 965 394 965 440"/>
  <path class="flow-app" d="M 972 338 C 972 384 1155 394 1155 440"/>
  <path class="flow-verify" d="M 1182 520 L 1182 600"/>
  <path class="flow-verify" d="M 1054 658 C 935 610 835 610 720 660"/>
  <path class="flow-verify" d="M 1142 658 C 1070 608 1034 578 997 520"/>
  <path class="flow" d="M 755 740 C 635 785 495 785 390 740"/>

  <rect class="cluster" x="752" y="186" width="486" height="166" stroke="#a78bfa"/>
  <text class="tiny" x="772" y="208" fill="#a78bfa">runtime backends</text>
  <rect class="cluster" x="296" y="426" width="960" height="118" stroke="#22d3ee"/>
  <text class="tiny" x="316" y="448" fill="#22d3ee">consumer entrypoints</text>

  <rect x="96" y="198" width="238" height="104" rx="8" fill="#0f172a"/>
  <rect class="box bom-fill" x="96" y="198" width="238" height="104"/>
  <text class="label" x="215" y="232" text-anchor="middle">bluetape4k-graph-bom</text>
  <text class="sub" x="215" y="255" text-anchor="middle">Maven BOM</text>
  <text class="tiny" x="215" y="276" text-anchor="middle">version alignment for all modules</text>

  <rect x="430" y="198" width="250" height="104" rx="8" fill="#0f172a"/>
  <rect class="box backend-fill" x="430" y="198" width="250" height="104"/>
  <text class="label" x="555" y="229" text-anchor="middle">graph-core</text>
  <text class="sub" x="555" y="252" text-anchor="middle">GraphOperations + suspend API</text>
  <text class="tiny" x="555" y="273" text-anchor="middle">schema, merge, transaction DSL</text>


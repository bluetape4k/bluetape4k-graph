    <path d="M600 900 C600 872 820 872 820 900" fill="none" stroke="#0284c7" stroke-width="1.8" opacity="0.62"/>
    <text class="db-title" x="710" y="808" text-anchor="middle">Memgraph</text>
    <text class="db-small" x="710" y="858" text-anchor="middle">Neo4j protocol</text>
  </g>
  <g id="age">
    <path d="M880 798 C880 770 1080 770 1080 798 L1080 900 C1080 928 880 928 880 900 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
    <ellipse cx="980" cy="798" rx="100" ry="28" fill="#fffbeb" stroke="#d97706" stroke-width="2.4"/>
    <path d="M880 900 C880 872 1080 872 1080 900" fill="none" stroke="#d97706" stroke-width="1.8" opacity="0.62"/>
    <text class="db-title" x="980" y="808" text-anchor="middle">AGE</text>
    <text class="db-small" x="980" y="858" text-anchor="middle">PostgreSQL graph</text>
  </g>
  <g id="tinkerpop">
    <path d="M1140 798 C1140 770 1360 770 1360 798 L1360 900 C1360 928 1140 928 1140 900 Z" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.4"/>
    <ellipse cx="1250" cy="798" rx="110" ry="28" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.4"/>
    <path d="M1140 900 C1140 872 1360 872 1360 900" fill="none" stroke="#0d9488" stroke-width="1.8" opacity="0.62"/>
    <text class="db-title" x="1250" y="808" text-anchor="middle">TinkerPop</text>
    <text class="db-small" x="1250" y="858" text-anchor="middle">Gremlin / TinkerGraph</text>
  </g>
  <g id="falkordb">
    <path d="M1420 798 C1420 770 1640 770 1640 798 L1640 900 C1640 928 1420 928 1420 900 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="2.4"/>
    <ellipse cx="1530" cy="798" rx="110" ry="28" fill="#fff1f2" stroke="#dc2626" stroke-width="2.4"/>
    <path d="M1420 900 C1420 872 1640 872 1640 900" fill="none" stroke="#dc2626" stroke-width="1.8" opacity="0.62"/>
    <text class="db-title" x="1530" y="808" text-anchor="middle">FalkorDB</text>
    <text class="db-small" x="1530" y="858" text-anchor="middle">Redis graph runtime</text>
  </g>
</g>

<text class="footer" x="950" y="1070" text-anchor="middle">https://github.com/bluetape4k/bluetape4k-graph | project: bluetape4k-graph | module: root</text>
</svg>

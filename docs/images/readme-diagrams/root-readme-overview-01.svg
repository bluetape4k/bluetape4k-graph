  <line x1="1036" y1="903" x2="1082" y2="903" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <text class="tiny" x="1098" y="907">primary dependency / validation flow</text>

  <text class="note" x="700" y="944" text-anchor="middle">Source-backed overview for README placement. Labels are English-only and reflect the current repository layout.</text>
</svg>

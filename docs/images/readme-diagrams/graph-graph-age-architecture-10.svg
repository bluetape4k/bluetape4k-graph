<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
  <title id="title">agtype parsing contract</title>
  <desc id="desc">Data-flow diagram showing how graph-age parses AGE vertex, edge, and path agtype strings through AgeTypeParser into graph-core models.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 19.25 14" refX="20" refY="8" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 2 2 L 20 8 L 2 14 Z" fill="#2563EB" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 19.25 14" refX="20" refY="8" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 2 2 L 20 8 L 2 14 Z" fill="#B45309" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 19.25 14" refX="20" refY="8" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 2 2 L 20 8 L 2 14 Z" fill="#0F766E" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 19.25 14" refX="20" refY="8" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M 2 2 L 20 8 L 2 14 Z" fill="#7C3AED" stroke-dasharray="none"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 52px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .laneTitle { font-family: 'Comic Mono', monospace; font-size: 16px; font-weight: 700; fill: #334155; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; }
    .label { font-family: 'Comic Mono', monospace; font-size: 13px; font-weight: 700; fill: #475569; }
    .lane { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .input { fill: #DBEAFE; stroke: #3B82F6; stroke-width: 1.8; }
    .api { fill: #FEF3C7; stroke: #EAB308; stroke-width: 1.8; }
    .helper { fill: #EDE9FE; stroke: #8B5CF6; stroke-width: 1.8; }
    .model { fill: #CCFBF1; stroke: #14B8A6; stroke-width: 1.8; }
    .lineBlue { fill: none; stroke: #2563EB; stroke-width: 3.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
    .lineAmber { fill: none; stroke: #B45309; stroke-width: 3.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowAmber); }
    .lineTeal { fill: none; stroke: #0F766E; stroke-width: 3.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowTeal); }
    .lineViolet { fill: none; stroke: #7C3AED; stroke-width: 3.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowViolet); }
  </style>

  <rect width="1680" height="1120" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1624" height="1064" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1608" cy="66" r="14" fill="#FED7AA"/>
  <circle cx="1570" cy="66" r="14" fill="#DCFCE7"/>
  <circle cx="1532" cy="66" r="14" fill="#EDE9FE"/>

  <text x="72" y="84" class="title">agtype parsing contract</text>
  <text x="74" y="122" class="subtitle">AgeTypeParser turns AGE typed strings into graph-core objects with three public entrypoints.</text>

  <rect x="70" y="164" width="1540" height="782" rx="20" class="lane"/>
  <text x="96" y="198" class="laneTitle">Parsing contract: input string -> parser entrypoint -> shared helpers -> graph-core model</text>

  <rect x="118" y="232" width="426" height="690" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="627" y="232" width="426" height="690" rx="18" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <rect x="1136" y="232" width="426" height="690" rx="18" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="331" y="266" text-anchor="middle" class="laneTitle">Vertex agtype</text>
  <text x="840" y="266" text-anchor="middle" class="laneTitle">Edge agtype</text>
  <text x="1349" y="266" text-anchor="middle" class="laneTitle">Path agtype</text>

  <rect x="166" y="310" width="330" height="92" rx="16" class="input card"/>
  <text x="331" y="344" text-anchor="middle" class="cardTitle">{...}::vertex</text>
  <text x="192" y="374" class="body">id, label, properties</text>

  <rect x="675" y="310" width="330" height="92" rx="16" class="input card"/>
  <text x="840" y="344" text-anchor="middle" class="cardTitle">{...}::edge</text>
  <text x="701" y="374" class="body">id, label, start_id, end_id</text>

  <rect x="1184" y="310" width="330" height="92" rx="16" class="input card"/>
  <text x="1349" y="344" text-anchor="middle" class="cardTitle">[...]::path</text>
  <text x="1210" y="374" class="body">alternating vertex/edge values</text>

  <rect x="166" y="478" width="330" height="92" rx="16" class="api card"/>
  <text x="331" y="512" text-anchor="middle" class="cardTitle">parseVertex</text>
  <text x="192" y="542" class="body">remove ::vertex suffix</text>

  <rect x="675" y="478" width="330" height="92" rx="16" class="api card"/>
  <text x="840" y="512" text-anchor="middle" class="cardTitle">parseEdge</text>
  <text x="701" y="542" class="body">remove ::edge suffix</text>

  <rect x="1184" y="478" width="330" height="92" rx="16" class="api card"/>
  <text x="1349" y="512" text-anchor="middle" class="cardTitle">parsePath</text>
  <text x="1210" y="542" class="body">remove ::path suffix</text>

  <rect x="166" y="646" width="330" height="98" rx="16" class="helper card"/>
  <text x="331" y="680" text-anchor="middle" class="cardTitle">parseJsonObject</text>
  <text x="192" y="710" class="body">parse object fields</text>
  <text x="192" y="732" class="body">parseValue handles nested data</text>

  <rect x="675" y="646" width="330" height="98" rx="16" class="helper card"/>
  <text x="840" y="680" text-anchor="middle" class="cardTitle">parseJsonObject</text>
  <text x="701" y="710" class="body">parse edge fields</text>
  <text x="701" y="732" class="body">start/end IDs become endpoints</text>

  <rect x="1184" y="646" width="330" height="98" rx="16" class="helper card"/>
  <text x="1349" y="680" text-anchor="middle" class="cardTitle">parseAgtypeElements</text>
  <text x="1210" y="710" class="body">split array without losing suffixes</text>
  <text x="1210" y="732" class="body">reuse parseVertex / parseEdge</text>

  <rect x="166" y="810" width="330" height="92" rx="16" class="model card"/>
  <text x="331" y="844" text-anchor="middle" class="cardTitle">GraphVertex</text>
  <text x="192" y="874" class="body">GraphElementId + label + props</text>

  <rect x="675" y="810" width="330" height="92" rx="16" class="model card"/>
  <text x="840" y="844" text-anchor="middle" class="cardTitle">GraphEdge</text>
  <text x="701" y="874" class="body">id + label + start/end IDs</text>

  <rect x="1184" y="810" width="330" height="92" rx="16" class="model card"/>
  <text x="1349" y="844" text-anchor="middle" class="cardTitle">GraphPath</text>
  <text x="1210" y="874" class="body">List&lt;PathStep&gt;</text>

  <path d="M 331 402 L 331 478" class="lineBlue"/>
  <path d="M 331 570 L 331 646" class="lineAmber"/>
  <path d="M 331 744 L 331 810" class="lineTeal"/>

  <path d="M 840 402 L 840 478" class="lineBlue"/>
  <path d="M 840 570 L 840 646" class="lineAmber"/>
  <path d="M 840 744 L 840 810" class="lineTeal"/>

  <path d="M 1349 402 L 1349 478" class="lineBlue"/>
  <path d="M 1349 570 L 1349 646" class="lineViolet"/>
  <path d="M 1349 744 L 1349 810" class="lineTeal"/>

  <rect x="220" y="984" width="1240" height="42" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="840" y="1010" text-anchor="middle" class="small">Path parsing is the only recursive case: each typed element is delegated back to parseVertex or parseEdge.</text>
</svg>

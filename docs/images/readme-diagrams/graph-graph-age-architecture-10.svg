<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1180" viewBox="0 0 1840 1180">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1180" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1132" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">AGE agtype Parsing Flow</text>
  <text x="74" y="118" class="subtitle">PostgreSQL AGE returns typed agtype strings; graph-age strips the suffix and rebuilds graph-core models.</text>

  <rect x="70" y="155" width="1700" height="855" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <line x1="430" y1="395" x2="555" y2="395" class="line"/>
  <line x1="855" y1="395" x2="980" y2="395" class="line"/>
  <line x1="1280" y1="395" x2="1405" y2="395" class="line"/>
  <line x1="920" y1="545" x2="920" y2="665" class="line"/>

  <g class="card">
    <ellipse cx="265" cy="280" rx="165" ry="44" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/>
    <rect x="100" y="280" width="330" height="230" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/>
    <ellipse cx="265" cy="510" rx="165" ry="44" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/>
    <line x1="100" y1="280" x2="100" y2="510" stroke="#3B82F6" stroke-width="3"/>
    <line x1="430" y1="280" x2="430" y2="510" stroke="#3B82F6" stroke-width="3"/>
  </g>
  <text x="265" y="286" text-anchor="middle" class="section">AGE Result</text>
  <text x="130" y="365" class="small">cypher(...) AS (v agtype)</text>
  <text x="130" y="394" class="small">cypher(...) AS (e agtype)</text>
  <text x="130" y="423" class="small">cypher(...) AS (p agtype)</text>

  <rect x="555" y="260" width="300" height="270" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="705" y="296" text-anchor="middle" class="tiny">&lt;&lt;type guard&gt;&gt;</text>
  <text x="705" y="333" text-anchor="middle" class="section">Suffix Router</text>
  <line x1="555" y1="355" x2="855" y2="355" stroke="#8B5CF6" stroke-width="2"/>
  <text x="585" y="392" class="small">isVertex: ::vertex</text>
  <text x="585" y="421" class="small">isEdge: ::edge</text>
  <text x="585" y="450" class="small">isPath: ::path</text>
  <text x="585" y="493" class="tiny">trimEnd before suffix check</text>

  <rect x="980" y="260" width="300" height="270" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1130" y="296" text-anchor="middle" class="tiny">&lt;&lt;payload parser&gt;&gt;</text>
  <text x="1130" y="333" text-anchor="middle" class="section">JSON Core</text>
  <line x1="980" y1="355" x2="1280" y2="355" stroke="#F97316" stroke-width="2"/>
  <text x="1010" y="392" class="small">parseJsonObject</text>
  <text x="1010" y="421" class="small">parseJsonArray</text>
  <text x="1010" y="450" class="small">parseValue</text>
  <text x="1010" y="493" class="tiny">numbers, booleans, null, nested blocks</text>

  <rect x="1405" y="260" width="335" height="270" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="1572" y="296" text-anchor="middle" class="tiny">&lt;&lt;domain rebuild&gt;&gt;</text>
  <text x="1572" y="333" text-anchor="middle" class="section">Graph Model</text>
  <line x1="1405" y1="355" x2="1740" y2="355" stroke="#22C55E" stroke-width="2"/>
  <text x="1435" y="392" class="small">GraphVertex</text>
  <text x="1435" y="421" class="small">GraphEdge</text>
  <text x="1435" y="450" class="small">GraphPath</text>
  <text x="1435" y="493" class="tiny">GraphElementId wraps AGE numeric ids</text>

  <rect x="270" y="665" width="1300" height="215" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="920" y="704" text-anchor="middle" class="tiny">&lt;&lt;path-only branch&gt;&gt;</text>
  <text x="920" y="743" text-anchor="middle" class="section">Path agtype Array Handling</text>
  <line x1="270" y1="766" x2="1570" y2="766" stroke="#94A3B8" stroke-width="2"/>
  <text x="315" y="805" class="small">1. Remove ::path and trim the surrounding array brackets.</text>
  <text x="315" y="835" class="small">2. Scan each {...}::vertex or {...}::edge element without dropping its suffix.</text>
  <text x="315" y="865" class="small">3. Build PathStep.VertexStep / EdgeStep, then return GraphPath(steps).</text>
  <text x="920" y="1088" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: graph-age / agtype parsing flow</text>
</svg>

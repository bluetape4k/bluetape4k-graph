<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1060" viewBox="0 0 1840 1060">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="arrowBlue" viewBox="0 0 8.75 8.75" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB" stroke-dasharray="none"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" stroke-dasharray="none"/>
    </marker>
  </defs>
  <style>
    marker path, marker polygon, marker polyline { stroke-dasharray: none !important; }
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #4B5563; }
    .micro { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #64748B; }
    .card { filter: url(#softShadow); }
    .arrow { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
    .softArrow { stroke: #64748B; stroke-width: 2.4; fill: none; marker-end: url(#arrowSlate); }
  </style>

  <rect x="0" y="0" width="1840" height="1060" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1012" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Bluetape4k Graph Class Structure</text>
  <text x="74" y="118" class="subtitle">GraphOperations composes repository contracts; backends implement the same model-facing API.</text>

  <rect x="70" y="150" width="1700" height="765" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="125" y="230" width="330" height="230" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="155" y="278" class="section">Repository Contracts</text>
  <text x="155" y="318" class="small">GraphSession</text>
  <text x="155" y="347" class="small">GraphVertexRepository</text>
  <text x="155" y="376" class="small">GraphEdgeRepository</text>
  <text x="155" y="405" class="small">GraphGenericRepository</text>
  <text x="155" y="434" class="tiny">Traversal + Algorithm repositories</text>

  <rect x="570" y="230" width="355" height="230" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="3" class="card"/>
  <text x="600" y="278" class="section">GraphOperations</text>
  <text x="600" y="318" class="small">sync facade</text>
  <text x="600" y="347" class="small">CRUD, traversal, algorithms</text>
  <text x="600" y="376" class="small">backend-independent contract</text>
  <text x="600" y="405" class="tiny">implemented by graph database modules</text>

  <rect x="1040" y="230" width="310" height="230" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="3" class="card"/>
  <text x="1070" y="278" class="section">Model Surface</text>
  <text x="1070" y="318" class="small">GraphElementId</text>
  <text x="1070" y="347" class="small">GraphVertex / GraphEdge</text>
  <text x="1070" y="376" class="small">GraphPath / PathStep</text>
  <text x="1070" y="405" class="tiny">Options and result DTOs</text>

  <rect x="1440" y="230" width="260" height="230" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="1470" y="278" class="section">Schema DSL</text>
  <text x="1470" y="318" class="small">VertexLabel</text>
  <text x="1470" y="347" class="small">EdgeLabel</text>
  <text x="1470" y="376" class="small">PropertyDef</text>
  <text x="1470" y="405" class="small">GraphSchemaManager</text>

  <rect x="150" y="565" width="350" height="185" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="180" y="613" class="section">Optional Capabilities</text>
  <text x="180" y="653" class="small">GraphMergeOperations</text>
  <text x="180" y="682" class="small">GraphTransactionalOperations</text>
  <text x="180" y="711" class="small">Suspend variants mirror them</text>

  <rect x="600" y="565" width="355" height="185" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="630" y="613" class="section">Async Facades</text>
  <text x="630" y="653" class="small">GraphSuspendOperations</text>
  <text x="630" y="682" class="small">GraphVirtualThreadOperations</text>
  <text x="630" y="711" class="tiny">Flow and CompletableFuture adapters</text>

  <rect x="1080" y="565" width="565" height="185" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="1110" y="613" class="section">Backend Implementations</text>
  <text x="1110" y="653" class="small">AgeGraphOperations / Neo4jGraphOperations</text>
  <text x="1110" y="682" class="small">MemgraphGraphOperations / TinkerGraphOperations</text>
  <text x="1110" y="711" class="small">FalkorDBGraphOperations</text>

  <rect x="235" y="805" width="1370" height="70" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="920" y="858" text-anchor="middle" class="tiny">The root README class view stays API-focused; example, benchmark, and BOM details belong in their own README diagrams.</text>

  <path d="M 455 345 L 568 345" class="arrow"/>
  <text x="512" y="329" text-anchor="middle" class="micro">composes</text>
  <path d="M 925 345 L 1038 345" class="arrow"/>
  <text x="982" y="329" text-anchor="middle" class="micro">uses</text>
  <path d="M 1350 345 L 1438 345" class="softArrow"/>
  <text x="1394" y="329" text-anchor="middle" class="micro">defines</text>
  <path d="M 748 460 L 748 563" class="softArrow"/>
  <text x="780" y="520" class="micro">async forms</text>
  <path d="M 748 460 L 748 493.5 Q 748 511.5 766 511.5 L 1337 511.5 Q 1355 511.5 1355 529.5 L 1355 563" class="arrow"/>
  <text x="1110" y="512" class="micro">implemented by</text>
  <path d="M 570 395 L 548 395 Q 535 395 535 408 L 535 532 Q 535 545 522 545 L 488 545 Q 475 545 475 558 L 475 565" class="softArrow"/>
  <text x="523" y="510" class="micro">optional</text>

  <text x="920" y="1012" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | root README / class structure</text>
</svg>

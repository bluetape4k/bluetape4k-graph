  <text x="1070" y="409" class="small">upstreamTablesForDashboard</text>
  <text x="1070" y="437" class="small">ownersForBrokenJob</text>
  <text x="1070" y="465" class="small">explainLineagePath</text>

  <rect x="1030" y="610" width="380" height="120" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" class="card"/>
  <text x="1070" y="658" class="label">Suspend Variant</text>
  <text x="1070" y="688" class="small">same questions through</text>
  <text x="1070" y="716" class="small">GraphSuspendOperations</text>

  <rect x="1450" y="285" width="280" height="150" rx="14" fill="#FCE7F3" stroke="#EC4899" stroke-width="2" class="card"/>
  <text x="1485" y="332" class="label">Impact</text>
  <text x="1485" y="370" class="small">raw.orders affects</text>
  <text x="1485" y="398" class="small">exec-revenue, ops-quality</text>

  <rect x="1450" y="520" width="280" height="150" rx="14" fill="#FFEDD5" stroke="#F97316" stroke-width="2" class="card"/>
  <text x="1485" y="567" class="label">Explanation</text>
  <text x="1485" y="605" class="small">bounded path shows</text>
  <text x="1485" y="633" class="small">why the dashboard changes</text>

  <path d="M 455 385 L 565 385" class="flow"/>
  <path d="M 455 650 L 565 650" class="flow"/>
  <path d="M 945 385 L 1030 385" class="flow"/>
  <path d="M 945 655 L 1030 655" class="use"/>
  <path d="M 1410 360 L 1450 360" class="flow"/>
  <path d="M 1410 430 L 1412 430 Q 1430 430 1430 448 L 1430 577 Q 1430 595 1448 595 L 1450 595" class="flow"/>
  <path d="M 1220 510 L 1220 610" class="use"/>

  <rect x="300" y="840" width="1240" height="52" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="920" y="873" text-anchor="middle" class="small">Bounded graph-io fixtures feed service methods that answer lineage impact questions without a catalog backend.</text>
  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: data-lineage-examples / architecture</text>

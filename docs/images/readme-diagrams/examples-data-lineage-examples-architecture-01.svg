<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .flow { stroke: #2563EB; stroke-width: 3.2; fill: none; marker-end: url(#arrowBlue); }
    .use { stroke: #64748B; stroke-width: 2.6; fill: none; marker-end: url(#arrowSlate); }
  </style>
  <rect width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE"/>
  <text x="72" y="82" class="title">Data Lineage Example Architecture</text>
  <text x="74" y="118" class="subtitle">CSV fixtures become a bounded lineage graph for dashboard impact, ownership, and explainable paths.</text>
  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="250" y="220" text-anchor="middle" class="section">Sample Fixture</text>
  <text x="695" y="220" text-anchor="middle" class="section">Lineage Graph</text>
  <text x="1160" y="220" text-anchor="middle" class="section">Impact Service</text>
  <text x="1560" y="220" text-anchor="middle" class="section">Reader Questions</text>

  <rect x="135" y="305" width="320" height="160" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" class="card"/>
  <text x="170" y="352" class="label">vertices.csv</text>
  <text x="170" y="390" class="small">Dataset, Table, Column</text>
  <text x="170" y="418" class="small">PipelineJob, Dashboard</text>
  <text x="170" y="446" class="small">Owner, QualityCheck</text>

  <rect x="135" y="575" width="320" height="150" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2" class="card"/>
  <text x="170" y="622" class="label">edges.csv</text>
  <text x="170" y="660" class="small">contains, input/output</text>
  <text x="170" y="688" class="small">feeds dashboard</text>
  <text x="170" y="716" class="small">owns, validates column</text>

  <rect x="565" y="280" width="380" height="215" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="2" class="card"/>
  <text x="605" y="328" class="label">Asset Lineage</text>
  <text x="605" y="368" class="small">raw.orders -> ingest job</text>
  <text x="605" y="396" class="small">curated.orders_enriched</text>
  <text x="605" y="424" class="small">mart.revenue_daily</text>
  <text x="605" y="452" class="small">exec-revenue dashboard</text>

  <rect x="565" y="580" width="380" height="150" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="2" class="card"/>
  <text x="605" y="628" class="label">Controls and Owners</text>
  <text x="605" y="666" class="small">check-orders-customer</text>
  <text x="605" y="694" class="small">finance-analytics owner</text>
  <text x="605" y="722" class="small">broken job notification path</text>


<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 24 24" refX="22" refY="12" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 3 3 L 22 12 L 3 21 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 18 18" refX="16" refY="9" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 2 2 L 16 9 L 2 16 Z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 52px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 19px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 26px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #64748B; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .lane { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .export { fill: none; stroke: #2563EB; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
    .import { fill: none; stroke: #059669; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
    .line { fill: none; stroke: #64748B; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-slate); }
  </style>

  <rect x="0" y="0" width="1760" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1704" height="1024" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2"/>

  <text x="72" y="86" class="title">graph-io-csv architecture</text>
  <text x="74" y="124" class="subtitle">CSV keeps vertices and edges in separate files while a shared codec preserves the same graph-io import/export contract.</text>

  <rect x="74" y="166" width="1612" height="798" rx="20" class="panel"/>

  <rect x="112" y="214" width="360" height="600" rx="18" class="lane"/>
  <text x="142" y="264" class="section">1. Two CSV files</text>
  <text x="144" y="296" class="small">Files stay simple and backend-neutral.</text>

  <rect x="152" y="342" width="280" height="106" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.9" class="card"/>
  <text x="292" y="376" text-anchor="middle" class="cardTitle">vertices.csv</text>
  <text x="292" y="405" text-anchor="middle" class="body">id, label, prop.*</text>
  <text x="292" y="430" text-anchor="middle" class="small">one row per vertex</text>

  <rect x="152" y="504" width="280" height="112" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.9" class="card"/>
  <text x="292" y="538" text-anchor="middle" class="cardTitle">edges.csv</text>
  <text x="292" y="567" text-anchor="middle" class="body">id, label, from, to</text>
  <text x="292" y="592" text-anchor="middle" class="small">endpoints use external ids</text>

  <rect x="152" y="688" width="280" height="76" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="292" y="718" text-anchor="middle" class="small">CsvGraphImportSource and</text>
  <text x="292" y="742" text-anchor="middle" class="small">CsvGraphExportSink pair the files.</text>

  <rect x="520" y="214" width="392" height="600" rx="18" class="lane"/>
  <text x="552" y="264" class="section">2. CsvRecordCodec</text>
  <text x="554" y="296" class="small">One codec owns headers and property columns.</text>

  <rect x="560" y="334" width="312" height="112" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.9" class="card"/>
  <text x="716" y="370" text-anchor="middle" class="cardTitle">Union header</text>
  <text x="716" y="399" text-anchor="middle" class="body">reserved columns +</text>
  <text x="716" y="424" text-anchor="middle" class="body">all property keys</text>

  <rect x="560" y="484" width="312" height="122" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.9" class="card"/>
  <text x="716" y="518" text-anchor="middle" class="cardTitle">Property modes</text>
  <text x="716" y="548" text-anchor="middle" class="body">PrefixedColumns</text>
  <text x="716" y="574" text-anchor="middle" class="body">RawJsonColumn</text>
  <text x="716" y="600" text-anchor="middle" class="body">None</text>

  <rect x="560" y="650" width="312" height="104" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.9" class="card"/>
  <text x="716" y="684" text-anchor="middle" class="cardTitle">Row extraction</text>
  <text x="716" y="712" text-anchor="middle" class="body">CSV columns become</text>
  <text x="716" y="737" text-anchor="middle" class="body">GraphIo records</text>

  <rect x="964" y="214" width="384" height="600" rx="18" class="lane"/>
  <text x="996" y="264" class="section">3. Import and export</text>
  <text x="998" y="296" class="small">CSV-specific import/export work</text>
  <text x="998" y="320" class="small">delegates to graph-io-core helpers.</text>

  <rect x="1004" y="330" width="304" height="122" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.9" class="card"/>
  <text x="1156" y="376" text-anchor="middle" class="cardTitle">Export path</text>
  <text x="1156" y="404" text-anchor="middle" class="body">find labels and build records</text>
  <text x="1156" y="429" text-anchor="middle" class="body">then write paired CSV files</text>

  <rect x="1004" y="490" width="304" height="112" rx="16" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.9" class="card"/>
  <text x="1156" y="524" text-anchor="middle" class="cardTitle">Import path</text>
  <text x="1156" y="552" text-anchor="middle" class="body">vertex pass builds id map</text>
  <text x="1156" y="578" text-anchor="middle" class="body">edge pass resolves endpoints</text>

  <rect x="1004" y="652" width="304" height="94" rx="16" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.9" class="card"/>
  <text x="1156" y="686" text-anchor="middle" class="cardTitle">Core helpers</text>
  <text x="1156" y="714" text-anchor="middle" class="body">GraphIoPaths + BatchWriter</text>

  <rect x="1384" y="214" width="262" height="600" rx="18" class="lane"/>
  <text x="1414" y="264" class="section">4. API variants</text>
  <text x="1416" y="296" class="small">Same CSV behavior.</text>

  <rect x="1412" y="348" width="208" height="82" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.9" class="card"/>
  <text x="1516" y="380" text-anchor="middle" class="cardTitle">Sync</text>
  <text x="1516" y="406" text-anchor="middle" class="small">GraphOperations</text>

  <rect x="1412" y="478" width="208" height="94" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.9" class="card"/>
  <text x="1516" y="510" text-anchor="middle" class="cardTitle">Suspend</text>
  <text x="1516" y="536" text-anchor="middle" class="small">GraphSuspend</text>
  <text x="1516" y="558" text-anchor="middle" class="small">Operations</text>

  <rect x="1412" y="620" width="208" height="96" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="1.9" class="card"/>
  <text x="1516" y="652" text-anchor="middle" class="cardTitle">Virtual thread</text>
  <text x="1516" y="680" text-anchor="middle" class="small">CompletableFuture</text>

  <path d="M 1004 390 L 872 390" class="export"/>
  <path d="M 560 390 L 432 390" class="export"/>
  <path d="M 432 560 L 560 560" class="import"/>
  <path d="M 872 560 L 1004 560" class="import"/>

  <rect x="226" y="858" width="1308" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="880" y="886" text-anchor="middle" class="small">Import is two-pass: vertices create the external-id map first, then edges resolve from/to before batch creation.</text>
  <text x="880" y="912" text-anchor="middle" class="small">Export scans selected labels, builds union CSV headers, writes vertices and edges, and returns a CSV report.</text>
</svg>

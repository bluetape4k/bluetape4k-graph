<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1.2 1.4 L 8.6 5 L 1.2 8.6 Z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 19px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 26px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #64748B; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .card { filter: url(#shadow); }
    .line { fill: none; stroke: #64748B; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1760" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1704" height="1024" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2"/>

  <text x="72" y="84" class="title">traversal and algorithm APIs</text>
  <text x="74" y="122" class="subtitle">The core module separates graph questions into path finding and analytics result contracts.</text>

  <rect x="74" y="166" width="778" height="660" rx="20" class="panel"/>
  <text x="112" y="222" class="section">TraversalRepository</text>
  <text x="114" y="254" class="small">Ask for nearby vertices or paths between vertices.</text>

  <rect x="122" y="302" width="292" height="86" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.1" class="card"/>
  <text x="268" y="336" text-anchor="middle" class="cardTitle">neighbors</text>
  <text x="268" y="364" text-anchor="middle" class="body">startId + NeighborOptions</text>
  <rect x="512" y="302" width="242" height="86" rx="16" fill="#F0FDF4" stroke="#22C55E" stroke-width="2.1" class="card"/>
  <text x="633" y="336" text-anchor="middle" class="cardTitle">List&lt;GraphVertex&gt;</text>
  <text x="633" y="364" text-anchor="middle" class="body">nearby vertices</text>
  <path d="M 414 345 L 512 345" class="line"/>

  <rect x="122" y="430" width="292" height="86" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.1" class="card"/>
  <text x="268" y="464" text-anchor="middle" class="cardTitle">shortestPath</text>
  <text x="268" y="492" text-anchor="middle" class="body">fromId + toId + PathOptions</text>
  <rect x="512" y="430" width="242" height="86" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.1" class="card"/>
  <text x="633" y="464" text-anchor="middle" class="cardTitle">GraphPath?</text>
  <text x="633" y="492" text-anchor="middle" class="body">best path or null</text>
  <path d="M 414 473 L 512 473" class="line"/>

  <rect x="122" y="558" width="292" height="86" rx="16" fill="#F0FDFA" stroke="#14B8A6" stroke-width="2.1" class="card"/>
  <text x="268" y="592" text-anchor="middle" class="cardTitle">allPaths</text>
  <text x="268" y="620" text-anchor="middle" class="body">bounded simple paths</text>
  <rect x="512" y="558" width="242" height="86" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.1" class="card"/>
  <text x="633" y="592" text-anchor="middle" class="cardTitle">List&lt;GraphPath&gt;</text>
  <text x="633" y="620" text-anchor="middle" class="body">all matches</text>
  <path d="M 414 601 L 512 601" class="line"/>

  <rect x="122" y="686" width="292" height="86" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="2.1" class="card"/>
  <text x="268" y="720" text-anchor="middle" class="cardTitle">A* path</text>
  <text x="268" y="748" text-anchor="middle" class="body">weight + heuristic</text>
  <rect x="512" y="686" width="242" height="86" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.1" class="card"/>
  <text x="633" y="720" text-anchor="middle" class="cardTitle">GraphPath?</text>
  <text x="633" y="748" text-anchor="middle" class="body">weighted best path</text>
  <path d="M 414 729 L 512 729" class="line"/>

  <rect x="908" y="166" width="778" height="660" rx="20" class="panel"/>
  <text x="946" y="222" class="section">GraphAlgorithmRepository</text>
  <text x="948" y="254" class="small">Ask for ranking, centrality, grouping, visits, or cycles.</text>

  <rect x="956" y="302" width="278" height="76" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.1" class="card"/>
  <text x="1095" y="334" text-anchor="middle" class="cardTitle">pageRank</text>
  <text x="1095" y="358" text-anchor="middle" class="small">PageRankOptions</text>
  <rect x="1338" y="302" width="242" height="76" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="2.1" class="card"/>
  <text x="1459" y="334" text-anchor="middle" class="cardTitle">PageRankScore</text>
  <text x="1459" y="358" text-anchor="middle" class="small">score desc</text>
  <path d="M 1234 340 L 1338 340" class="line"/>

  <rect x="956" y="408" width="278" height="76" rx="16" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.1" class="card"/>
  <text x="1095" y="440" text-anchor="middle" class="cardTitle">degreeCentrality</text>
  <text x="1095" y="464" text-anchor="middle" class="small">DegreeOptions</text>
  <rect x="1338" y="408" width="242" height="76" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.1" class="card"/>
  <text x="1459" y="440" text-anchor="middle" class="cardTitle">DegreeResult</text>
  <text x="1459" y="464" text-anchor="middle" class="small">in + out + total</text>
  <path d="M 1234 446 L 1338 446" class="line"/>

  <rect x="956" y="514" width="278" height="76" rx="16" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2.1" class="card"/>
  <text x="1095" y="546" text-anchor="middle" class="cardTitle">connectedComponents</text>
  <text x="1095" y="570" text-anchor="middle" class="small">ComponentOptions</text>
  <rect x="1338" y="514" width="242" height="76" rx="16" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.1" class="card"/>
  <text x="1459" y="546" text-anchor="middle" class="cardTitle">GraphComponent</text>
  <text x="1459" y="570" text-anchor="middle" class="small">component id + size</text>
  <path d="M 1234 552 L 1338 552" class="line"/>

  <rect x="956" y="620" width="278" height="76" rx="16" fill="#F0FDF4" stroke="#22C55E" stroke-width="2.1" class="card"/>
  <text x="1095" y="652" text-anchor="middle" class="cardTitle">bfs / dfs</text>
  <text x="1095" y="676" text-anchor="middle" class="small">BfsDfsOptions</text>
  <rect x="1338" y="620" width="242" height="76" rx="16" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.1" class="card"/>
  <text x="1459" y="652" text-anchor="middle" class="cardTitle">TraversalVisit</text>
  <text x="1459" y="676" text-anchor="middle" class="small">vertex + depth + parent</text>
  <path d="M 1234 658 L 1338 658" class="line"/>

  <rect x="956" y="726" width="278" height="76" rx="16" fill="#FDF2F8" stroke="#EC4899" stroke-width="2.1" class="card"/>
  <text x="1095" y="758" text-anchor="middle" class="cardTitle">detectCycles</text>
  <text x="1095" y="782" text-anchor="middle" class="small">CycleOptions</text>
  <rect x="1338" y="726" width="242" height="76" rx="16" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.1" class="card"/>
  <text x="1459" y="758" text-anchor="middle" class="cardTitle">GraphCycle</text>
  <text x="1459" y="782" text-anchor="middle" class="small">cycle path + length</text>
  <path d="M 1234 764 L 1338 764" class="line"/>

  <rect x="156" y="866" width="1448" height="98" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="880" y="898" text-anchor="middle" class="small">Use TraversalRepository when the caller wants vertices or paths. Use GraphAlgorithmRepository when the caller wants graph-level measurements.</text>
  <text x="880" y="926" text-anchor="middle" class="small">Backends may use native graph features or fallback implementations, but unsupported algorithms can fail explicitly.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="980" viewBox="0 0 1640 980">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1.2 1.4 L 8.6 5 L 1.2 8.6 Z" fill="#64748B"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="inheritanceArrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1.5 1.5 L 10.5 6 L 1.5 10.5 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    </marker>
  </defs>

  <style>
    marker path, marker polygon, marker polyline { stroke-dasharray: none !important; }
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 19px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #334155; }
    .className { font-family: 'Architects Daughter', cursive; font-size: 32px; fill: #111827; }
    .member { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #64748B; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .card { filter: url(#shadow); }
    .flow { fill: none; stroke: #64748B; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .inheritLine { fill: none; stroke: #64748B; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#inheritanceArrow); }
  </style>

  <rect x="0" y="0" width="1640" height="980" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1584" height="924" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2"/>

  <text x="72" y="84" class="title">graph-core path model</text>
  <text x="74" y="122" class="subtitle">GraphPath is an ordered list of alternating vertex and edge snapshots, with derived convenience views.</text>

  <rect x="76" y="162" width="1488" height="244" rx="20" class="panel"/>
  <text x="112" y="216" class="section">Path shape returned by traversal APIs</text>
  <rect x="176" y="268" width="186" height="58" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="269" y="304" text-anchor="middle" class="member">Vertex(A)</text>
  <path d="M 372 297 L 458 297" class="flow"/>
  <rect x="470" y="268" width="196" height="58" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="568" y="304" text-anchor="middle" class="member">Edge(KNOWS)</text>
  <path d="M 676 297 L 762 297" class="flow"/>
  <rect x="774" y="268" width="186" height="58" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="867" y="304" text-anchor="middle" class="member">Vertex(B)</text>
  <path d="M 970 297 L 1056 297" class="flow"/>
  <rect x="1068" y="268" width="220" height="58" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="1178" y="304" text-anchor="middle" class="member">Edge(WORKS_AT)</text>
  <path d="M 1298 297 L 1384 297" class="flow"/>
  <rect x="1396" y="268" width="124" height="58" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="1458" y="304" text-anchor="middle" class="member">Vertex(C)</text>
  <text x="820" y="362" text-anchor="middle" class="small">steps = [VertexStep, EdgeStep, VertexStep, EdgeStep, VertexStep]</text>

  <rect x="76" y="450" width="1488" height="286" rx="20" class="panel"/>
  <text x="112" y="504" class="section">Types behind that shape</text>

  <rect x="180" y="548" width="390" height="138" rx="18" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.2" class="card"/>
  <text x="375" y="586" text-anchor="middle" class="className">GraphPath</text>
  <line x1="214" y1="606" x2="536" y2="606" stroke="#DDD6FE" stroke-width="2"/>
  <text x="230" y="636" class="member">steps: List&lt;PathStep&gt;</text>
  <text x="230" y="666" class="member">totalWeight: Double</text>

  <rect x="646" y="548" width="348" height="138" rx="18" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.2" class="card"/>
  <text x="820" y="586" text-anchor="middle" class="className">PathStep</text>
  <text x="820" y="616" text-anchor="middle" class="small">sealed class</text>
  <line x1="684" y1="638" x2="956" y2="638" stroke="#BBF7D0" stroke-width="2"/>
  <text x="820" y="668" text-anchor="middle" class="member">one snapshot in the path</text>

  <rect x="1070" y="526" width="214" height="90" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.1" class="card"/>
  <text x="1177" y="562" text-anchor="middle" class="className">VertexStep</text>
  <text x="1177" y="590" text-anchor="middle" class="small">vertex: GraphVertex</text>
  <rect x="1070" y="648" width="214" height="90" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.1" class="card"/>
  <text x="1177" y="684" text-anchor="middle" class="className">EdgeStep</text>
  <text x="1177" y="712" text-anchor="middle" class="small">edge: GraphEdge</text>

  <path d="M 570 617 L 646 617" class="flow"/>
  <path d="M 1070 571 L 1050 571 Q 1032 571 1032 589 L 1032 599 Q 1032 617 1014 617 L 994 617" class="inheritLine"/>
  <path d="M 1070 693 L 1050 693 Q 1032 693 1032 675 L 1032 635 Q 1032 617 1014 617 L 994 617" class="inheritLine"/>

  <rect x="156" y="790" width="1328" height="94" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="820" y="824" text-anchor="middle" class="small">Derived views keep caller code simple: vertices, edges, length, isEmpty.</text>
  <text x="820" y="852" text-anchor="middle" class="small">Unweighted paths default totalWeight to edge count; weighted algorithms can return accumulated cost.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">observability-graph-examples architecture</title>
  <desc id="desc">Graph-io CSV data is loaded into portable GraphOperations backends, then sync and suspend services run observability incident traversals.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5f6f82"/>
    </marker>
    <style>
      .canvas { fill: #fbfcfe; }
      .frame { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 30px; fill: #243142; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #5c6b7d; }
      .box-title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 18px; fill: #233044; }
      .box-text { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 13px; fill: #435266; }
      .label { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 12px; fill: #4f5e70; }
      .edge { fill: none; stroke: #5f6f82; stroke-width: 2.4; marker-end: url(#arrow); }
      .pill { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1; }
    </style>
  </defs>
  <rect class="canvas" width="1120" height="500"/>
  <rect class="frame" x="24" y="24" width="1072" height="452" rx="18"/>
  <text class="title" x="560" y="68" text-anchor="middle">Observability Incident Graph Example</text>
  <text class="subtitle" x="560" y="94" text-anchor="middle">CSV fixture + portable graph API + sync/suspend incident traversal scenarios</text>

  <g transform="translate(70,150)">
    <rect x="0" y="0" width="190" height="96" rx="14" fill="#e8f4ff" stroke="#9fc3df" stroke-width="2"/>
    <text class="box-title" x="95" y="38" text-anchor="middle">Bundled CSV</text>
    <text class="box-text" x="95" y="64" text-anchor="middle">vertices.csv / edges.csv</text>
  </g>

  <g transform="translate(330,150)">
    <rect x="0" y="0" width="220" height="96" rx="14" fill="#eaf7ef" stroke="#9ccdad" stroke-width="2"/>
    <text class="box-title" x="110" y="34" text-anchor="middle">SampleDatasetLoader</text>
    <text class="box-text" x="110" y="60" text-anchor="middle">graph-io CSV import</text>
    <text class="box-text" x="110" y="78" text-anchor="middle">sync + suspend</text>
  </g>

  <g transform="translate(650,112)">
    <rect x="0" y="0" width="240" height="78" rx="14" fill="#fff4d8" stroke="#e3c46f" stroke-width="2"/>
    <text class="box-title" x="120" y="33" text-anchor="middle">IncidentService</text>
    <text class="box-text" x="120" y="58" text-anchor="middle">sync traversal API</text>
  </g>

  <g transform="translate(650,210)">
    <rect x="0" y="0" width="240" height="78" rx="14" fill="#fff4d8" stroke="#e3c46f" stroke-width="2"/>
    <text class="box-title" x="120" y="33" text-anchor="middle">SuspendService</text>
    <text class="box-text" x="120" y="58" text-anchor="middle">coroutine traversal API</text>
  </g>

  <g transform="translate(330,330)">
    <rect x="0" y="0" width="220" height="86" rx="14" fill="#edf7f7" stroke="#9ccaca" stroke-width="2"/>
    <text class="box-title" x="110" y="34" text-anchor="middle">Backend Tests</text>
    <text class="box-text" x="110" y="60" text-anchor="middle">blast radius / owner / APIs</text>
  </g>

  <g transform="translate(650,330)">
    <rect x="0" y="0" width="240" height="86" rx="14" fill="#f2eefc" stroke="#b7a7dc" stroke-width="2"/>
    <text class="box-title" x="120" y="34" text-anchor="middle">GraphOperations</text>
    <text class="box-text" x="120" y="60" text-anchor="middle">portable graph contract</text>
  </g>

  <g transform="translate(940,188)">
    <rect x="0" y="0" width="120" height="158" rx="14" fill="#fdecef" stroke="#d8a6b0" stroke-width="2"/>
    <text class="box-title" x="60" y="34" text-anchor="middle">Backends</text>
    <text class="box-text" x="60" y="62" text-anchor="middle">TinkerGraph</text>
    <text class="box-text" x="60" y="84" text-anchor="middle">Neo4j</text>
    <text class="box-text" x="60" y="106" text-anchor="middle">Memgraph</text>
    <text class="box-text" x="60" y="128" text-anchor="middle">AGE</text>
    <text class="box-text" x="60" y="150" text-anchor="middle">FalkorDB</text>
  </g>

  <path class="edge" d="M260 198 H322"/>
  <rect class="pill" x="278" y="184" width="34" height="20" rx="10"/>
  <text class="label" x="295" y="198" text-anchor="middle">load</text>

  <path class="edge" d="M550 198 C590 198 596 151 642 151"/>
  <path class="edge" d="M550 198 C592 198 596 249 642 249"/>
  <path class="edge" d="M550 386 H642"/>
  <rect class="pill" x="570" y="372" width="52" height="20" rx="10"/>
  <text class="label" x="596" y="386" text-anchor="middle">verify</text>

  <path class="edge" d="M890 151 C925 151 925 346 898 373"/>
  <path class="edge" d="M770 288 V322"/>
  <path class="edge" d="M890 373 C915 373 918 300 932 282"/>
  <rect class="pill" x="904" y="360" width="62" height="20" rx="10"/>
  <text class="label" x="935" y="374" text-anchor="middle">execute</text>

  <path class="edge" d="M550 373 H642"/>
  <path class="edge" d="M440 330 V254"/>
  <path class="edge" d="M550 198 C596 198 600 373 642 373"/>
</svg>

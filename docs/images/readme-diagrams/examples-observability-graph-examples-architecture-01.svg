<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1057" viewBox="0 0 1800 1057" role="img" aria-labelledby="title desc">
  <title id="title">Observability graph examples architecture</title>
  <desc id="desc">Incident signals, public API paths, service dependencies, ownership, and portable graph backends used by the observability example.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L10,4 z" fill="#2563EB"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #F8FAFC; }
      .outer { fill: none; stroke: #60A5FA; stroke-width: 4; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; filter: url(#shadow); }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 48px; fill: #111827; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 22px; fill: #4B5563; }
      .section { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 31px; fill: #111827; }
      .label { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 27px; fill: #111827; }
      .small { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 17px; fill: #374151; }
      .tiny { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #4B5563; }
      .line { fill: none; stroke: #2563EB; stroke-width: 4; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #64748B; stroke-width: 2.5; }
      .card { filter: url(#shadow); }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1057"/>
  <rect class="outer" x="24" y="24" width="1752" height="1009" rx="22"/>
  <text x="74" y="82" class="title">Observability Incident Graph Example</text>
  <text x="74" y="123" class="subtitle">Correlate alerts, dependencies, public APIs, incidents, and on-call ownership with one backend-independent graph API.</text>
  <circle cx="1660" cy="78" r="15" fill="#EDE9FE"/>
  <circle cx="1700" cy="78" r="15" fill="#DCFCE7"/>
  <circle cx="1740" cy="78" r="15" fill="#FED7AA"/>

  <rect x="70" y="160" width="1660" height="760" rx="18" class="panel"/>

  <text x="150" y="230" class="section">Runtime Signals</text>
  <text x="605" y="230" class="section">Typed Incident Graph</text>
  <text x="1055" y="230" class="section">Portable Operations</text>
  <text x="1420" y="230" class="section">Operational Answers</text>

  <rect x="130" y="285" width="320" height="136" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="165" y="333" class="label">Customer APIs</text>
  <text x="165" y="369" class="small">checkout-api</text>
  <text x="165" y="397" class="small">mobile-checkout-api</text>

  <rect x="130" y="470" width="320" height="156" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="165" y="518" class="label">Monitoring Alerts</text>
  <text x="165" y="554" class="small">payment-latency critical</text>
  <text x="165" y="582" class="small">checkout-errors warning</text>

  <rect x="130" y="675" width="320" height="136" rx="14" fill="#FFEDD5" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="165" y="723" class="label">Incident Record</text>
  <text x="165" y="759" class="small">Checkout payment incident</text>
  <text x="165" y="787" class="small">root cause: payment-service</text>

  <rect x="555" y="285" width="350" height="130" rx="14" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="3" class="card"/>
  <text x="595" y="333" class="label">Dependency Path</text>
  <text x="595" y="369" class="small">edge-api -> checkout</text>
  <text x="595" y="397" class="small">payment -> postgres-primary</text>

  <rect x="555" y="460" width="350" height="190" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="595" y="518" class="label">Graph Model</text>
  <text x="595" y="554" class="small">Service, Api, Alert</text>
  <text x="595" y="582" class="small">Incident, Team</text>
  <text x="595" y="610" class="small">DEPENDS_ON, ALERTS_ON</text>
  <text x="595" y="638" class="small">ROOT_CAUSE, OWNED_BY</text>

  <rect x="555" y="675" width="350" height="136" rx="14" fill="#F3E8FF" stroke="#A855F7" stroke-width="3" class="card"/>
  <text x="595" y="723" class="label">Ownership</text>
  <text x="595" y="759" class="small">payment-service -> payments-team</text>
  <text x="595" y="787" class="small">checkout-service -> payments-team</text>

  <rect x="1015" y="285" width="315" height="150" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" class="card"/>
  <text x="1055" y="333" class="label">Incident Service</text>
  <text x="1055" y="369" class="small">GraphOperations</text>
  <text x="1055" y="397" class="small">GraphSuspendOperations</text>

  <rect x="1015" y="500" width="315" height="175" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="1055" y="548" class="label">Backends Under Test</text>
  <text x="1055" y="584" class="small">TinkerGraph, Neo4j, Memgraph</text>
  <text x="1055" y="612" class="small">Apache AGE, FalkorDB</text>
  <text x="1055" y="640" class="small">same abstract test contract</text>

  <ellipse cx="1172" cy="725" rx="150" ry="38" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <rect x="1022" y="725" width="300" height="80" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3"/>
  <ellipse cx="1172" cy="805" rx="150" ry="38" fill="#99F6E4" stroke="#14B8A6" stroke-width="3"/>
  <text x="1172" y="757" text-anchor="middle" class="label">observability Graph</text>
  <text x="1172" y="793" text-anchor="middle" class="small">portable storage</text>

  <rect x="1410" y="285" width="290" height="150" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="3" class="card"/>
  <text x="1450" y="333" class="label">Blast Radius</text>
  <text x="1450" y="369" class="small">downstream dependencies</text>
  <text x="1450" y="397" class="small">upstream impacted services</text>

  <rect x="1410" y="500" width="290" height="150" rx="14" fill="#FDF2F8" stroke="#EC4899" stroke-width="3" class="card"/>
  <text x="1450" y="548" class="label">Customer Impact</text>
  <text x="1450" y="584" class="small">affected public APIs</text>
  <text x="1450" y="612" class="small">alert boundary services</text>

  <rect x="1410" y="715" width="290" height="135" rx="14" fill="#EFF6FF" stroke="#60A5FA" stroke-width="3" class="card"/>
  <text x="1450" y="763" class="label">Escalation</text>
  <text x="1450" y="799" class="small">owningTeams(payment)</text>
  <text x="1450" y="827" class="small">payments-team</text>

  <path d="M 450 350 L 545 350" class="line"/>
  <path d="M 450 548 L 545 548" class="line"/>
  <path d="M 450 743 L 545 743" class="line"/>
  <path d="M 905 548 L 1005 360" class="line"/>
  <path d="M 905 548 L 1005 760" class="line"/>
  <path d="M 1330 360 L 1400 360" class="line"/>
  <path d="M 1330 575 L 1400 575" class="line"/>
  <path d="M 1322 782 L 1400 782" class="line"/>

  <rect x="185" y="870" width="1430" height="56" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="900" y="899" text-anchor="middle" class="small">CSV fixtures and abstract tests run the same incident graph against every backend-specific operations factory.</text>

  <text x="900" y="1000" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: observability-graph-examples / architecture</text>
</svg>

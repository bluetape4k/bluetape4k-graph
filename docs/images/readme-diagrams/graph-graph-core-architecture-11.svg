<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="980" viewBox="0 0 1620 980">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#334155" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10.2" markerHeight="10.2" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="softArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10.2" markerHeight="10.2" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #475569; }
    .stateTitle { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #64748B; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.7; }
    .card { filter: url(#shadow); }
    .line { stroke: #2563EB; stroke-width: 3.6; fill: none; marker-end: url(#arrow); }
    .soft { stroke: #64748B; stroke-width: 2.8; stroke-dasharray: 8 8; fill: none; marker-end: url(#softArrow); }
  </style>

  <rect x="0" y="0" width="1620" height="980" fill="#F8FAFC"/>
  <rect x="26" y="26" width="1568" height="928" rx="24" fill="none" stroke="#93C5FD" stroke-width="4"/>
  <circle cx="1528" cy="68" r="15" fill="#DBEAFE"/>
  <circle cx="1488" cy="68" r="15" fill="#D1FAE5"/>
  <circle cx="1448" cy="68" r="15" fill="#FDE68A"/>

  <text x="72" y="82" class="title">GraphOperations usage states</text>
  <text x="74" y="120" class="subtitle">A backend facade exposes graph lifecycle, CRUD, traversal/analytics, opt-in capabilities, and close.</text>

  <rect x="72" y="158" width="1476" height="704" rx="20" class="panel"/>

  <circle cx="138" cy="330" r="22" fill="#0F172A"/>

  <rect x="204" y="226" width="252" height="208" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="330" y="272" text-anchor="middle" class="stateTitle">Facade ready</text>
  <line x1="240" y1="296" x2="420" y2="296" stroke="#3B82F6" stroke-width="2"/>
  <text x="330" y="330" text-anchor="middle" class="body">GraphOperations</text>
  <text x="330" y="360" text-anchor="middle" class="body">backend implementation</text>
  <text x="330" y="390" text-anchor="middle" class="body">AutoCloseable</text>

  <rect x="524" y="226" width="252" height="208" rx="18" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="650" y="272" text-anchor="middle" class="stateTitle">Graph selected</text>
  <line x1="560" y1="296" x2="740" y2="296" stroke="#22C55E" stroke-width="2"/>
  <text x="650" y="330" text-anchor="middle" class="body">createGraph</text>
  <text x="650" y="360" text-anchor="middle" class="body">graphExists</text>
  <text x="650" y="390" text-anchor="middle" class="body">dropGraph</text>

  <rect x="844" y="226" width="252" height="208" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" class="card"/>
  <text x="970" y="272" text-anchor="middle" class="stateTitle">Working graph</text>
  <line x1="880" y1="296" x2="1060" y2="296" stroke="#F59E0B" stroke-width="2"/>
  <text x="970" y="330" text-anchor="middle" class="body">vertex CRUD</text>
  <text x="970" y="360" text-anchor="middle" class="body">edge CRUD</text>
  <text x="970" y="390" text-anchor="middle" class="body">batch operations</text>

  <rect x="1164" y="226" width="252" height="208" rx="18" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="1290" y="272" text-anchor="middle" class="stateTitle">Read results</text>
  <line x1="1200" y1="296" x2="1380" y2="296" stroke="#8B5CF6" stroke-width="2"/>
  <text x="1290" y="330" text-anchor="middle" class="body">neighbors, paths</text>
  <text x="1290" y="360" text-anchor="middle" class="body">PageRank, degree</text>
  <text x="1290" y="390" text-anchor="middle" class="body">BFS/DFS/cycles</text>

  <path d="M 160 330 L 202 330" class="line"/>
  <path d="M 456 330 L 522 330" class="line"/>
  <path d="M 776 330 L 842 330" class="line"/>
  <path d="M 1096 330 L 1162 330" class="line"/>

  <rect x="264" y="564" width="338" height="118" rx="16" fill="#FDF2F8" stroke="#EC4899" stroke-width="2.4" class="card"/>
  <text x="433" y="602" text-anchor="middle" class="stateTitle">Transactions</text>
  <text x="433" y="636" text-anchor="middle" class="body">transaction { }</text>
  <text x="433" y="664" text-anchor="middle" class="small">supported backends only</text>

  <rect x="642" y="564" width="338" height="118" rx="16" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2.4" class="card"/>
  <text x="811" y="602" text-anchor="middle" class="stateTitle">Schema / merge</text>
  <text x="811" y="636" text-anchor="middle" class="body">schemaManager()</text>
  <text x="811" y="664" text-anchor="middle" class="body">mergeVertex / mergeEdge</text>

  <rect x="1020" y="564" width="338" height="118" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.4" class="card"/>
  <text x="1189" y="602" text-anchor="middle" class="stateTitle">Closed</text>
  <text x="1189" y="636" text-anchor="middle" class="body">close()</text>
  <text x="1189" y="664" text-anchor="middle" class="small">release facade resources</text>

  <path d="M 970 434 L 970 481 Q 970 499 952 499 L 451 499 Q 433 499 433 517 L 433 564" class="soft"/>
  <path d="M 970 434 L 970 481 Q 970 499 952 499 L 829 499 Q 811 499 811 517 L 811 564" class="soft"/>
  <path d="M 1290 434 L 1290 481 Q 1290 499 1272 499 L 1207 499 Q 1189 499 1189 517 L 1189 564" class="soft"/>

  <rect x="230" y="746" width="1160" height="42" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="810" y="773" text-anchor="middle" class="small">Unsupported optional capabilities throw explicitly; GraphOperations itself stays source-compatible.</text>

</svg>

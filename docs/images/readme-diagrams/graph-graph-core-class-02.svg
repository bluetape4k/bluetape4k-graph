<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M 1.2 1.4 L 8.6 5 L 1.2 8.6 Z" fill="#64748B"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="softDot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="14" markerHeight="14">
      <circle cx="5" cy="5" r="3.5" fill="#94A3B8"/>
    </marker>
  </defs>

  <style>
    marker path, marker polygon, marker polyline { stroke-dasharray: none !important; }
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 19px; fill: #475569; }
    .className { font-family: 'Architects Daughter', cursive; font-size: 34px; fill: #111827; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 26px; fill: #334155; }
    .member { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #64748B; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .card { filter: url(#shadow); }
    .line { fill: none; stroke: #64748B; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .ref { fill: none; stroke: #94A3B8; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 8;  }
  </style>

  <rect x="0" y="0" width="1600" height="980" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1544" height="924" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2"/>

  <text x="72" y="84" class="title">graph-core basic model</text>
  <text x="74" y="122" class="subtitle">Three immutable records form the backend-neutral graph vocabulary used by every repository contract.</text>

  <rect x="76" y="160" width="1448" height="640" rx="20" class="panel"/>
  <text x="112" y="214" class="section">One ID type, two element records</text>

  <rect x="550" y="238" width="500" height="182" rx="18" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.2" class="card"/>
  <text x="800" y="278" text-anchor="middle" class="small">@JvmInline value class</text>
  <text x="800" y="320" text-anchor="middle" class="className">GraphElementId</text>
  <line x1="590" y1="342" x2="1010" y2="342" stroke="#BBF7D0" stroke-width="2"/>
  <text x="616" y="374" class="member">value: String</text>
  <text x="616" y="404" class="member">of(String), of(Long), graphElementIdOf(Any)</text>

  <rect x="150" y="512" width="520" height="212" rx="18" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.2" class="card"/>
  <text x="410" y="556" text-anchor="middle" class="className">GraphVertex</text>
  <text x="410" y="584" text-anchor="middle" class="small">data class, Serializable</text>
  <line x1="190" y1="606" x2="630" y2="606" stroke="#BFDBFE" stroke-width="2"/>
  <text x="214" y="640" class="member">id: GraphElementId</text>
  <text x="214" y="670" class="member">label: String</text>
  <text x="214" y="700" class="member">properties: Map&lt;String, Any?&gt;</text>

  <rect x="930" y="512" width="520" height="212" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.2" class="card"/>
  <text x="1190" y="556" text-anchor="middle" class="className">GraphEdge</text>
  <text x="1190" y="584" text-anchor="middle" class="small">data class, Serializable</text>
  <line x1="970" y1="606" x2="1410" y2="606" stroke="#FDE68A" stroke-width="2"/>
  <text x="994" y="640" class="member">id: GraphElementId</text>
  <text x="994" y="670" class="member">label: String</text>
  <text x="994" y="700" class="member">startId / endId: GraphElementId</text>

  <path d="M 410 512 L 410 484 Q 410 466 428 466 L 692 466 Q 710 466 710 448 L 710 420" class="line"/>
  <path d="M 1190 512 L 1190 484 Q 1190 466 1172 466 L 908 466 Q 890 466 890 448 L 890 420" class="line"/>
  <path d="M 930 632 L 670 632" class="ref" style="marker-start:none;marker-end:none"/>
  <circle cx="930" cy="632" r="3.5" fill="#94A3B8" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <polygon points="682,627 670,632 682,637" fill="#64748B" stroke="#64748B" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <rect x="690" y="598" width="220" height="26" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="800" y="616" text-anchor="middle" class="tiny">edge stores vertex IDs</text>

  <rect x="116" y="832" width="1368" height="70" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="800" y="862" text-anchor="middle" class="small">GraphElementId normalizes backend-specific identifiers while model records stay immutable and Serializable.</text>
  <text x="800" y="888" text-anchor="middle" class="small">Property maps allow nullable values because graph backends differ in how they store optional attributes.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1040" viewBox="0 0 1760 1040">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #4B5563; }
    .micro { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #64748B; }
    .card { filter: url(#softShadow); }
    .arrow { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
    .softArrow { stroke: #64748B; stroke-width: 2.4; fill: none; marker-end: url(#arrowSlate); }
  </style>

  <rect x="0" y="0" width="1760" height="1040" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1712" height="992" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1696" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1656" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1616" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Apache AGE Execution Flow</text>
  <text x="74" y="118" class="subtitle">AGE wraps Cypher as SQL, executes it through Exposed/JDBC, then parses agtype rows into graph-core models.</text>

  <rect x="70" y="150" width="1620" height="735" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="110" y="255" width="250" height="170" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="140" y="303" class="section">Graph API</text>
  <text x="140" y="339" class="small">create / update</text>
  <text x="140" y="368" class="small">delete / find</text>
  <text x="140" y="397" class="small">neighbors / paths</text>

  <rect x="440" y="255" width="285" height="170" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="3" class="card"/>
  <text x="470" y="303" class="section">AgeGraphOps</text>
  <text x="470" y="343" class="small">validate label + id</text>
  <text x="470" y="372" class="small">select AGE query</text>
  <text x="470" y="401" class="tiny">or route weighted fallback</text>

  <rect x="805" y="255" width="290" height="170" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="3" class="card"/>
  <text x="835" y="303" class="section">AgeSql</text>
  <text x="835" y="343" class="small">build Cypher</text>
  <text x="835" y="372" class="small">wrap ag_catalog.cypher</text>
  <text x="835" y="401" class="tiny">typed agtype columns</text>

  <rect x="1175" y="255" width="285" height="170" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="1205" y="303" class="section">Exposed JDBC</text>
  <text x="1205" y="343" class="small">transaction boundary</text>
  <text x="1205" y="372" class="small">exec(...) callback</text>
  <text x="1205" y="401" class="tiny">suspend path uses IO dispatcher</text>

  <path d="M 1390 540
           C 1390 498, 1645 498, 1645 540
           L 1645 650
           C 1645 692, 1390 692, 1390 650
           Z" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" filter="url(#softShadow)"/>
  <ellipse cx="1517" cy="540" rx="127" ry="42" fill="#F0FDFA" stroke="#14B8A6" stroke-width="3"/>
  <ellipse cx="1517" cy="650" rx="127" ry="42" fill="#99F6E4" stroke="#14B8A6" stroke-width="3"/>
  <rect x="1430" y="572" width="180" height="36" rx="8" fill="#CCFBF1" opacity="0.96"/>
  <text x="1447" y="598" class="section">PostgreSQL AGE</text>
  <text x="1447" y="633" class="tiny">LOAD age + search_path</text>
  <text x="1447" y="655" class="tiny">returns agtype rows</text>

  <rect x="870" y="575" width="300" height="170" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="900" y="623" class="section">AgeTypeParser</text>
  <text x="900" y="663" class="small">parseVertex / parseEdge</text>
  <text x="900" y="692" class="small">parsePath</text>
  <text x="900" y="721" class="tiny">JSON-like agtype to models</text>

  <rect x="495" y="575" width="285" height="170" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="3" class="card"/>
  <text x="525" y="623" class="section">Graph Models</text>
  <text x="525" y="663" class="small">GraphVertex</text>
  <text x="525" y="692" class="small">GraphEdge</text>
  <text x="525" y="721" class="small">GraphPath</text>

  <rect x="150" y="555" width="260" height="190" rx="14" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" class="card"/>
  <text x="180" y="603" class="section">Weighted Branch</text>
  <text x="180" y="643" class="small">weightProperty set</text>
  <text x="180" y="672" class="small">ShortestPathFallback</text>
  <text x="180" y="701" class="small">Dijkstra or A*</text>
  <text x="180" y="730" class="tiny">uses AGE vertex/edge reads</text>

  <rect x="805" y="455" width="290" height="78" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="835" y="488" class="section">Property Values</text>
  <text x="835" y="516" class="tiny">AgePropertySerializer escapes Cypher literals</text>
  <text x="880" y="992" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: graph-age / Apache AGE flow</text>

  <path d="M 360 340 L 438 340" class="arrow"/>
  <text x="399" y="324" text-anchor="middle" class="micro">call</text>
  <path d="M 725 340 L 803 340" class="arrow"/>
  <text x="764" y="324" text-anchor="middle" class="micro">query</text>
  <path d="M 1095 340 L 1173 340" class="arrow"/>
  <text x="1134" y="324" text-anchor="middle" class="micro">SQL</text>
  <path d="M 1317 425 L 1440 520" class="arrow"/>
  <text x="1380" y="455" text-anchor="middle" class="micro">execute</text>
  <path d="M 1390 635 L 1172 660" class="arrow"/>
  <text x="1278" y="633" text-anchor="middle" class="micro">agtype</text>
  <path d="M 870 660 L 782 660" class="arrow"/>
  <text x="826" y="644" text-anchor="middle" class="micro">parse</text>
  <path d="M 950 425 L 950 453" class="softArrow"/>
  <path d="M 582 425 L 280 553" class="softArrow"/>
  <text x="390" y="485" text-anchor="middle" class="micro">weighted path</text>
  <path d="M 410 650 L 493 650" class="softArrow"/>
</svg>

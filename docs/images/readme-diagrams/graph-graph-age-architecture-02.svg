<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">Apache AGE Cypher-over-SQL flow</title>
  <desc id="desc">Data-flow diagram showing how graph-age builds Cypher-over-SQL statements, executes them through Exposed JDBC against PostgreSQL Apache AGE, and maps agtype rows back to graph-core models.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 22 16" refX="20" refY="8" markerWidth="22" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 20 8 L 2 14 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 22 16" refX="20" refY="8" markerWidth="22" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 20 8 L 2 14 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 22 16" refX="20" refY="8" markerWidth="22" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 20 8 L 2 14 Z" fill="#B45309"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 22 16" refX="20" refY="8" markerWidth="22" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 20 8 L 2 14 Z" fill="#E11D48"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 52px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .bandTitle { font-family: 'Comic Mono', monospace; font-size: 16px; font-weight: 700; fill: #334155; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 29px; fill: #111827; }
    .cardTitleSmall { font-family: 'Architects Daughter', cursive; font-size: 24px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; }
    .label { font-family: 'Comic Mono', monospace; font-size: 13px; font-weight: 700; fill: #475569; }
    .band { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .blue { fill: #DBEAFE; stroke: #3B82F6; stroke-width: 1.8; }
    .rose { fill: #FFE4E6; stroke: #FB7185; stroke-width: 1.8; }
    .amber { fill: #FEF3C7; stroke: #EAB308; stroke-width: 1.8; }
    .green { fill: #DCFCE7; stroke: #22C55E; stroke-width: 1.8; }
    .teal { fill: #CCFBF1; stroke: #14B8A6; stroke-width: 1.8; }
    .gray { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.7; }
    .forward { fill: none; stroke: #2563EB; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
    .dbLine { fill: none; stroke: #B45309; stroke-width: 3.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowAmber); }
    .return { fill: none; stroke: #0F766E; stroke-width: 3.0; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowTeal); }
    .guard { fill: none; stroke: #E11D48; stroke-width: 2.4; stroke-dasharray: 8 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRose); }
  </style>

  <rect width="1680" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1624" height="1024" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1608" cy="66" r="14" fill="#FED7AA"/>
  <circle cx="1570" cy="66" r="14" fill="#DCFCE7"/>
  <circle cx="1532" cy="66" r="14" fill="#EDE9FE"/>

  <text x="72" y="84" class="title">Apache AGE Cypher-over-SQL flow</text>
  <text x="74" y="122" class="subtitle">graph-age does not call a graph driver directly; it wraps Cypher in SQL, executes JDBC rows, then parses agtype values.</text>

  <rect x="70" y="164" width="1540" height="230" rx="20" class="band"/>
  <text x="96" y="198" class="bandTitle">request construction</text>

  <rect x="130" y="242" width="280" height="96" rx="16" class="blue card"/>
  <text x="270" y="276" text-anchor="middle" class="cardTitleSmall">Graph API Call</text>
  <text x="156" y="304" class="body">createVertex / createEdge</text>
  <text x="156" y="328" class="body">neighbors / shortestPath</text>

  <rect x="520" y="242" width="280" height="96" rx="16" class="blue card"/>
  <text x="660" y="276" text-anchor="middle" class="cardTitleSmall">AgeGraphOperations</text>
  <text x="546" y="304" class="body">validate AGE numeric IDs</text>
  <text x="546" y="328" class="body">open Exposed transaction</text>

  <rect x="910" y="242" width="280" height="96" rx="16" class="rose card"/>
  <text x="1050" y="276" text-anchor="middle" class="cardTitleSmall">AgeSql</text>
  <text x="936" y="304" class="body">build Cypher string</text>
  <text x="936" y="328" class="body">wrap with ag_catalog.cypher</text>

  <rect x="1280" y="242" width="280" height="96" rx="16" class="rose card"/>
  <text x="1420" y="276" text-anchor="middle" class="cardTitleSmall">Property Serializer</text>
  <text x="1306" y="304" class="body">escape string values</text>
  <text x="1306" y="328" class="body">validate map keys</text>

  <path d="M 410 290 L 520 290" class="forward"/>
  <path d="M 800 290 L 910 290" class="forward"/>
  <path d="M 1190 290 L 1280 290" class="guard"/>
  <text x="465" y="274" text-anchor="middle" class="label">dispatch</text>
  <text x="855" y="274" text-anchor="middle" class="label">create SQL</text>
  <text x="1235" y="274" text-anchor="middle" class="label">literal props</text>

  <rect x="70" y="432" width="1540" height="264" rx="20" class="band"/>
  <text x="96" y="466" class="bandTitle">database execution</text>

  <rect x="130" y="532" width="300" height="92" rx="16" class="amber card"/>
  <text x="280" y="566" text-anchor="middle" class="cardTitleSmall">Exposed Transaction</text>
  <text x="156" y="594" class="body">exec(sql) through JDBC</text>

  <rect x="530" y="532" width="300" height="92" rx="16" class="amber card"/>
  <text x="680" y="566" text-anchor="middle" class="cardTitleSmall">HikariCP Connection</text>
  <text x="556" y="594" class="body">LOAD age; SET search_path</text>

  <path d="M 950 528
           C 950 506, 1280 506, 1280 528
           L 1280 618
           C 1280 640, 950 640, 950 618 Z" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8" class="card"/>
  <ellipse cx="1115" cy="528" rx="165" ry="25" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.8"/>
  <text x="1115" y="566" text-anchor="middle" class="cardTitleSmall">PostgreSQL + AGE</text>
  <text x="1115" y="594" text-anchor="middle" class="body">execute Cypher inside SQL</text>
  <text x="1115" y="618" text-anchor="middle" class="small">vertices, edges, paths as agtype</text>

  <path d="M 1050 338 L 1050 414 L 280 414 L 280 532" class="dbLine"/>
  <path d="M 430 578 L 530 578" class="dbLine"/>
  <path d="M 830 578 L 950 578" class="dbLine"/>
  <text x="665" y="402" text-anchor="middle" class="label">SELECT * FROM ag_catalog.cypher(...)</text>
  <text x="480" y="560" text-anchor="middle" class="label">JDBC</text>
  <text x="890" y="560" text-anchor="middle" class="label">SQL</text>

  <rect x="70" y="734" width="1540" height="216" rx="20" class="band"/>
  <text x="96" y="768" class="bandTitle">result mapping</text>

  <rect x="130" y="816" width="300" height="88" rx="16" class="green card"/>
  <text x="280" y="850" text-anchor="middle" class="cardTitleSmall">JDBC ResultSet</text>
  <text x="156" y="878" class="body">v / e / p columns</text>

  <rect x="530" y="816" width="300" height="88" rx="16" class="green card"/>
  <text x="680" y="850" text-anchor="middle" class="cardTitleSmall">AgeTypeParser</text>
  <text x="556" y="878" class="body">parse ::vertex / ::edge / ::path</text>

  <rect x="930" y="816" width="300" height="88" rx="16" class="teal card"/>
  <text x="1080" y="850" text-anchor="middle" class="cardTitleSmall">graph-core Models</text>
  <text x="956" y="878" class="body">GraphVertex / Edge / Path</text>

  <rect x="1330" y="816" width="230" height="88" rx="16" class="gray card"/>
  <text x="1445" y="850" text-anchor="middle" class="cardTitleSmall">Caller Result</text>
  <text x="1356" y="878" class="body">domain object returned</text>

  <path d="M 1115 640 L 1115 704 L 280 704 L 280 816" class="return"/>
  <path d="M 430 860 L 530 860" class="return"/>
  <path d="M 830 860 L 930 860" class="return"/>
  <path d="M 1230 860 L 1330 860" class="return"/>
  <text x="720" y="690" text-anchor="middle" class="label">agtype rows</text>
  <text x="480" y="842" text-anchor="middle" class="label">strings</text>
  <text x="880" y="842" text-anchor="middle" class="label">mapped</text>
  <text x="1280" y="842" text-anchor="middle" class="label">returns</text>

  <rect x="220" y="988" width="1240" height="38" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="840" y="1012" text-anchor="middle" class="small">Weighted shortest path and A* bypass native AGE path matching and use graph-core fallback algorithms.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Code Graph Data Flow</title>
  <desc id="desc">Build a sample graph and answer dependency questions</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5f6f82"/>
    </marker>
    <style>
      .canvas { fill: #fbfcfe; }
      .frame { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 30px; fill: #243142; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 15px; fill: #5c6b7d; }
      .box-title { font-family: "Architects Daughter", "Comic Sans MS", "Helvetica", sans-serif; font-size: 18px; fill: #233044; }
      .box-text { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 13px; fill: #435266; }
      .label { font-family: "Comic Mono", "Comic Sans MS", "Helvetica", sans-serif; font-size: 12px; fill: #4f5e70; }
      .edge { fill: none; stroke: #5f6f82; stroke-width: 2.4; marker-end: url(#arrow); }
      .pill { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1; }
    </style>
  </defs>
  <rect class="canvas" width="1120" height="520"/>
  <rect class="frame" x="24" y="24" width="1072" height="472" rx="18"/>
  <text class="title" x="560" y="68" text-anchor="middle">Code Graph Data Flow</text>
  <text class="subtitle" x="560" y="94" text-anchor="middle">Build a sample graph and answer dependency questions</text>

      <path class="edge" d="M 260 230 H 292.5 V 225 H 325"/>
      <rect class="pill" x="267.5" y="203.5" width="60" height="22" rx="11"/>
      <text class="label" x="297.5" y="218.5" text-anchor="middle">create</text>

      <path class="edge" d="M 535 225 H 577.5 V 225 H 620"/>
      <rect class="pill" x="553.5" y="201" width="53" height="22" rx="11"/>
      <text class="label" x="580" y="216" text-anchor="middle">query</text>

      <path class="edge" d="M 840 225 H 875 V 225 H 910"/>
      <rect class="pill" x="832.5" y="201" width="60" height="22" rx="11"/>
      <text class="label" x="862.5" y="216" text-anchor="middle">assert</text>

      <g>
        <rect x="70" y="180" width="190" height="100" rx="14" fill="#e8f4ff" stroke="#98c1df" stroke-width="2"/>
        <text class="box-title" x="165" y="214" text-anchor="middle">Seed Scenario</text>
        <text class="box-text" x="165" y="242" text-anchor="middle">modules</text>
<text class="box-text" x="165" y="263" text-anchor="middle">classes</text>
<text class="box-text" x="165" y="284" text-anchor="middle">functions</text>
      </g>

      <g>
        <rect x="325" y="150" width="210" height="150" rx="14" fill="#eaf7ef" stroke="#9ccdad" stroke-width="2"/>
        <text class="box-title" x="430" y="184" text-anchor="middle">Create Graph</text>
        <text class="box-text" x="430" y="212" text-anchor="middle">addModule</text>
<text class="box-text" x="430" y="233" text-anchor="middle">addDependency</text>
<text class="box-text" x="430" y="254" text-anchor="middle">addCall</text>
      </g>

      <g>
        <rect x="620" y="150" width="220" height="150" rx="14" fill="#fff4d8" stroke="#e3c46f" stroke-width="2"/>
        <text class="box-title" x="730" y="184" text-anchor="middle">Traversal API</text>
        <text class="box-text" x="730" y="212" text-anchor="middle">shortestPath</text>
<text class="box-text" x="730" y="233" text-anchor="middle">neighbors</text>
<text class="box-text" x="730" y="254" text-anchor="middle">allPaths</text>
      </g>

      <g>
        <rect x="910" y="150" width="170" height="150" rx="14" fill="#fdecef" stroke="#d8a6b0" stroke-width="2"/>
        <text class="box-title" x="995" y="184" text-anchor="middle">Expected Output</text>
        <text class="box-text" x="995" y="212" text-anchor="middle">dependency path</text>
<text class="box-text" x="995" y="233" text-anchor="middle">impact radius</text>
<text class="box-text" x="995" y="254" text-anchor="middle">call chain</text>
      </g>
</svg>

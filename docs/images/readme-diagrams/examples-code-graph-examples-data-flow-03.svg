<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .thin { stroke: #64748B; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Code Graph Example Data Flow</text>
  <text x="74" y="118" class="subtitle">Shared tests seed a small code graph, run graph queries, and verify identical behavior across backends.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="270" y="214" text-anchor="middle" class="section">Seed Codebase</text>
  <text x="690" y="214" text-anchor="middle" class="section">Write Graph</text>
  <text x="1110" y="214" text-anchor="middle" class="section">Query Scenarios</text>
  <text x="1515" y="214" text-anchor="middle" class="section">Assertions</text>

  <rect x="125" y="270" width="330" height="150" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="160" y="318" class="label">Module Stack</text>
  <text x="160" y="354" class="small">app depends on middle</text>
  <text x="160" y="382" class="small">middle depends on core</text>
  <text x="160" y="410" class="small">dependencyType = compile</text>

  <rect x="125" y="500" width="330" height="155" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="160" y="548" class="label">Code Relationships</text>
  <text x="160" y="584" class="small">Dog extends Mammal</text>
  <text x="160" y="612" class="small">Mammal extends Animal</text>
  <text x="160" y="640" class="small">processOrder calls saveOrder</text>

  <rect x="555" y="295" width="330" height="150" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="590" y="343" class="label">Service Commands</text>
  <text x="590" y="379" class="small">addModule, addClass</text>
  <text x="590" y="407" class="small">addFunction, addDependency</text>
  <text x="590" y="435" class="small">initialize creates code_graph</text>

  <g class="card">
    <ellipse cx="720" cy="610" rx="165" ry="38" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3"/>
    <rect x="555" y="610" width="330" height="118" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3"/>
    <ellipse cx="720" cy="728" rx="165" ry="38" fill="#A7F3D0" stroke="#14B8A6" stroke-width="3"/>
  </g>
  <text x="720" y="632" text-anchor="middle" class="label">code_graph</text>
  <text x="720" y="670" text-anchor="middle" class="small">Module, Class, Function vertices</text>
  <text x="720" y="700" text-anchor="middle" class="small">DEPENDS_ON, EXTENDS, CALLS edges</text>

  <rect x="980" y="260" width="330" height="170" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="1015" y="308" class="label">Path Queries</text>
  <text x="1015" y="344" class="small">shortestPath(top, core)</text>
  <text x="1015" y="372" class="small">neighbors with maxDepth</text>
  <text x="1015" y="400" class="small">incoming traversal for impact</text>

  <rect x="980" y="535" width="330" height="150" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1015" y="583" class="label">Chain Queries</text>
  <text x="1015" y="619" class="small">getInheritanceChain(Dog)</text>
  <text x="1015" y="647" class="small">getCallChain(processOrder)</text>
  <text x="1015" y="675" class="small">find by module or class name</text>

  <rect x="1410" y="295" width="330" height="150" rx="14" fill="#FCE7F3" stroke="#EC4899" stroke-width="3" class="card"/>
  <text x="1445" y="343" class="label">Expected Results</text>
  <text x="1445" y="379" class="small">connected paths are present</text>
  <text x="1445" y="407" class="small">isolated path returns null</text>
  <text x="1445" y="435" class="small">query lists are not empty</text>

  <rect x="1410" y="565" width="330" height="130" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="1445" y="613" class="label">Backend Coverage</text>
  <text x="1445" y="649" class="small">Neo4j, Memgraph, AGE</text>
  <text x="1445" y="677" class="small">TinkerGraph and FalkorDB wiring</text>

  <path d="M 455 345 L 555 370" class="line"/>
  <path d="M 455 580 L 555 610" class="line"/>
  <path d="M 720 445 L 720 572" class="line"/>
  <path d="M 885 665 L 980 620" class="line"/>
  <path d="M 885 610 L 980 345" class="thin"/>
  <path d="M 1310 345 L 1410 365" class="line"/>
  <path d="M 1310 620 L 1410 630" class="line"/>

  <rect x="175" y="800" width="1490" height="62" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="920" y="828" text-anchor="middle" class="small">Same scenario, same assertions, different GraphOperations factories.</text>

  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: code-graph-examples / data flow</text>
</svg>

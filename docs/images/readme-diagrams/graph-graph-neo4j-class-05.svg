<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">Neo4jRecordMapper class diagram</title>
  <desc id="desc">UML class diagram showing Neo4jRecordMapper methods that read Neo4j driver values and return graph-core domain models.</desc>
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker id="openArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    marker path, marker polygon, marker polyline { stroke-dasharray: none !important; }
    .title { font-family: 'Architects Daughter', cursive; font-size: 50px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #475569; }
    .className { font-family: 'Architects Daughter', cursive; font-size: 29px; fill: #111827; }
    .classNameSmall { font-family: 'Architects Daughter', cursive; font-size: 25px; fill: #111827; }
    .stereo { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #64748B; font-weight: 700; }
    .member { font-family: 'Comic Mono', monospace; font-size: 16px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #475569; }
    .label { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #475569; font-weight: 700; }
    .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
    .card { filter: url(#shadow); }
    .use { fill: none; stroke: #64748B; stroke-width: 1.9; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round;  }
  </style>

  <rect width="1680" height="1080" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1624" height="1024" rx="22" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>
  <circle cx="1608" cy="66" r="14" fill="#FED7AA"/>
  <circle cx="1570" cy="66" r="14" fill="#DCFCE7"/>
  <circle cx="1532" cy="66" r="14" fill="#EDE9FE"/>

  <text x="72" y="84" class="title">Neo4jRecordMapper class model</text>
  <text x="74" y="122" class="subtitle">Maps Neo4j Record, Node, Relationship, and Path values into graph-core domain objects with elementId-based IDs.</text>

  <rect x="70" y="160" width="1540" height="780" rx="20" class="panel"/>

  <rect x="112" y="266" width="338" height="300" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" class="card"/>
  <text x="281" y="304" text-anchor="middle" class="stereo">&lt;&lt;Neo4j driver types&gt;&gt;</text>
  <text x="281" y="342" text-anchor="middle" class="classNameSmall">Inputs</text>
  <line x1="142" y1="364" x2="420" y2="364" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="144" y="394" class="member">Record</text>
  <text x="144" y="424" class="member">Node</text>
  <text x="144" y="454" class="member">Relationship</text>
  <text x="144" y="484" class="member">Path</text>
  <line x1="142" y1="506" x2="420" y2="506" stroke="#BFDBFE" stroke-width="1.3"/>
  <text x="144" y="536" class="small">default keys: n / r / p</text>

  <rect x="540" y="238" width="600" height="382" rx="16" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.9" class="card"/>
  <text x="840" y="276" text-anchor="middle" class="stereo">&lt;&lt;object&gt;&gt;</text>
  <text x="840" y="314" text-anchor="middle" class="className">Neo4jRecordMapper</text>
  <line x1="584" y1="336" x2="1096" y2="336" stroke="#C4B5FD" stroke-width="1.3"/>
  <text x="588" y="366" class="member">+ nodeToVertex(node): GraphVertex</text>
  <text x="588" y="393" class="member">+ relationshipToEdge(rel): GraphEdge</text>
  <text x="588" y="420" class="member">+ pathToGraphPath(path): GraphPath</text>
  <line x1="584" y1="442" x2="1096" y2="442" stroke="#C4B5FD" stroke-width="1.3"/>
  <text x="588" y="472" class="member">+ recordToVertex(record, key = "n")</text>
  <text x="588" y="499" class="member">+ recordToEdge(record, key = "r")</text>
  <text x="588" y="526" class="member">+ recordToPath(record, key = "p")</text>
  <line x1="584" y1="548" x2="1096" y2="548" stroke="#C4B5FD" stroke-width="1.3"/>
  <text x="588" y="578" class="member">+ requireNotBlank(key) before record access</text>

  <rect x="1230" y="266" width="338" height="300" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8" class="card"/>
  <text x="1399" y="304" text-anchor="middle" class="stereo">&lt;&lt;graph-core models&gt;&gt;</text>
  <text x="1399" y="342" text-anchor="middle" class="classNameSmall">Outputs</text>
  <line x1="1260" y1="364" x2="1538" y2="364" stroke="#BBF7D0" stroke-width="1.3"/>
  <text x="1262" y="394" class="member">GraphVertex</text>
  <text x="1262" y="424" class="member">GraphEdge</text>
  <text x="1262" y="454" class="member">GraphPath</text>
  <text x="1262" y="484" class="member">PathStep</text>
  <line x1="1260" y1="506" x2="1538" y2="506" stroke="#BBF7D0" stroke-width="1.3"/>
  <text x="1262" y="536" class="small">GraphElementId(elementId)</text>

  <rect x="120" y="756" width="360" height="132" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="1.8" class="card"/>
  <text x="300" y="794" text-anchor="middle" class="stereo">&lt;&lt;node conversion&gt;&gt;</text>
  <text x="300" y="830" text-anchor="middle" class="classNameSmall">Vertex Mapping</text>
  <line x1="150" y1="852" x2="450" y2="852" stroke="#FDE68A" stroke-width="1.3"/>
  <text x="152" y="880" class="small">first label or "Unknown"; node.asMap()</text>

  <rect x="660" y="756" width="360" height="132" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="1.8" class="card"/>
  <text x="840" y="794" text-anchor="middle" class="stereo">&lt;&lt;relationship conversion&gt;&gt;</text>
  <text x="840" y="830" text-anchor="middle" class="classNameSmall">Edge Mapping</text>
  <line x1="690" y1="852" x2="990" y2="852" stroke="#FDBA74" stroke-width="1.3"/>
  <text x="692" y="880" class="small">type, start/end IDs, rel.asMap()</text>

  <rect x="1200" y="756" width="360" height="132" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1.8" class="card"/>
  <text x="1380" y="794" text-anchor="middle" class="stereo">&lt;&lt;path conversion&gt;&gt;</text>
  <text x="1380" y="830" text-anchor="middle" class="classNameSmall">Path Mapping</text>
  <line x1="1230" y1="852" x2="1530" y2="852" stroke="#99F6E4" stroke-width="1.3"/>
  <text x="1232" y="880" class="small">VertexStep / EdgeStep interleaving</text>

  <path d="M 540 410 L 450 410" class="use" style="marker-end:none"/>
  <polyline points="461,405 450,410 461,415" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 1140 410 L 1230 410" class="use" style="marker-end:none"/>
  <polyline points="1219,415 1230,410 1219,405" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 710 620 L 710 670 Q 710 688 692 688 L 318 688 Q 300 688 300 706 L 300 756" class="use" style="marker-end:none"/>
  <polyline points="295,745 300,756 305,745" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 840 620 L 840 756" class="use" style="marker-end:none"/>
  <polyline points="835,745 840,756 845,745" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 970 620 L 970 670 Q 970 688 988 688 L 1362 688 Q 1380 688 1380 706 L 1380 756" class="use" style="marker-end:none"/>
  <polyline points="1375,745 1380,756 1385,745" fill="none" stroke="#64748B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <rect x="462" y="376" width="84" height="28" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="504" y="395" text-anchor="middle" class="label">reads</text>
  <rect x="1134" y="376" width="92" height="28" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="1180" y="395" text-anchor="middle" class="label">returns</text>

  <rect x="160" y="968" width="1360" height="54" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="840" y="1001" text-anchor="middle" class="small">This object has no inheritance relation; dashed open arrows show type dependencies used by mapper methods.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1120" viewBox="0 0 1840 1120">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #64748B; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1120" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1072" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">Neo4jRecordMapper Class Model</text>
  <text x="74" y="118" class="subtitle">Maps Neo4j Record, Node, Relationship, and Path values into graph-core domain objects with elementId-based IDs.</text>

  <rect x="70" y="150" width="1700" height="830" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <line x1="520" y1="380" x2="640" y2="380" class="line"/>
  <line x1="1200" y1="380" x2="1320" y2="380" class="line"/>
  <line x1="760" y1="585" x2="450" y2="700" class="line"/>
  <line x1="920" y1="585" x2="920" y2="700" class="line"/>
  <line x1="1080" y1="585" x2="1390" y2="700" class="line"/>

  <rect x="130" y="285" width="390" height="210" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="325" y="322" text-anchor="middle" class="tiny">&lt;&lt;Neo4j driver values&gt;&gt;</text>
  <text x="325" y="361" text-anchor="middle" class="section">Inputs</text>
  <line x1="130" y1="385" x2="520" y2="385" stroke="#3B82F6" stroke-width="2"/>
  <text x="160" y="422" class="small">Record key defaults: n, r, p</text>
  <text x="160" y="451" class="small">Node / Relationship / Path</text>
  <text x="160" y="480" class="small">elementId and property maps</text>

  <rect x="640" y="240" width="560" height="345" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="920" y="278" text-anchor="middle" class="tiny">&lt;&lt;object : KLogging&gt;&gt;</text>
  <text x="920" y="317" text-anchor="middle" class="section">Neo4jRecordMapper</text>
  <line x1="640" y1="341" x2="1200" y2="341" stroke="#8B5CF6" stroke-width="2"/>
  <text x="675" y="378" class="small">+ nodeToVertex(node): GraphVertex</text>
  <text x="675" y="407" class="small">+ relationshipToEdge(rel): GraphEdge</text>
  <text x="675" y="436" class="small">+ pathToGraphPath(path): GraphPath</text>
  <text x="675" y="465" class="small">+ recordToVertex(record, key = "n")</text>
  <text x="675" y="494" class="small">+ recordToEdge(record, key = "r")</text>
  <text x="675" y="523" class="small">+ recordToPath(record, key = "p")</text>
  <text x="675" y="552" class="small">+ requireNotBlank(key) before record access</text>

  <rect x="1320" y="285" width="390" height="210" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="1515" y="322" text-anchor="middle" class="tiny">&lt;&lt;graph-core domain&gt;&gt;</text>
  <text x="1515" y="361" text-anchor="middle" class="section">Outputs</text>
  <line x1="1320" y1="385" x2="1710" y2="385" stroke="#22C55E" stroke-width="2"/>
  <text x="1350" y="422" class="small">GraphVertex(id, label, props)</text>
  <text x="1350" y="451" class="small">GraphEdge(id, start, end, props)</text>
  <text x="1350" y="480" class="small">GraphPath(PathStep list)</text>

  <rect x="240" y="700" width="420" height="180" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="450" y="738" text-anchor="middle" class="tiny">&lt;&lt;node conversion&gt;&gt;</text>
  <text x="450" y="777" text-anchor="middle" class="section">Vertex Mapping</text>
  <line x1="240" y1="801" x2="660" y2="801" stroke="#EAB308" stroke-width="2"/>
  <text x="270" y="838" class="small">GraphElementId(node.elementId())</text>
  <text x="270" y="867" class="small">first label or "Unknown", node.asMap()</text>

  <rect x="710" y="700" width="420" height="180" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="920" y="738" text-anchor="middle" class="tiny">&lt;&lt;relationship conversion&gt;&gt;</text>
  <text x="920" y="777" text-anchor="middle" class="section">Edge Mapping</text>
  <line x1="710" y1="801" x2="1130" y2="801" stroke="#F97316" stroke-width="2"/>
  <text x="740" y="838" class="small">elementId plus start/end node ids</text>
  <text x="740" y="867" class="small">relationship type and rel.asMap()</text>

  <rect x="1180" y="700" width="420" height="180" rx="14" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3" class="card"/>
  <text x="1390" y="738" text-anchor="middle" class="tiny">&lt;&lt;path conversion&gt;&gt;</text>
  <text x="1390" y="777" text-anchor="middle" class="section">Path Mapping</text>
  <line x1="1180" y1="801" x2="1600" y2="801" stroke="#14B8A6" stroke-width="2"/>
  <text x="1210" y="838" class="small">nodes and relationships are interleaved</text>
  <text x="1210" y="867" class="small">VertexStep, EdgeStep, VertexStep...</text>
  <text x="920" y="1048" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: graph-neo4j / Neo4jRecordMapper class model</text>
</svg>

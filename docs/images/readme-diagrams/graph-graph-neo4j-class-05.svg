<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1539" viewBox="0 0 1754 1539" role="img" aria-label="Neo4jGraphOperations">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1539"/>
<rect class="frame" x="32" y="28" width="1690" height="1483" rx="28"/>
<text class="title" x="66" y="82">Neo4jGraphOperations</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M240 418 L240 478 L240 478 L240 538"/>
<path class="line" d="M240 418 L240 478 L1089.3 478 L1089.3 538"/>
<path class="line" d="M240 418 L240 478 L1514 478 L1514 538"/>
<path class="line" d="M877 1155 L877 1215 L877 1215 L877 1275"/>
<path class="line" d="M664.7 538 L664.7 478 L240 478 L240 418"/>
<path class="line" d="M664.7 734 L664.7 804.5 L877 804.5 L877 875"/>
<path class="implLine" d="M664.7 538 L664.7 478 L1514 478 L1514 418"/>
<g transform="translate(70,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">Neo4jRecordMapper</text>
  <text class="mono" x="18" y="108">+nodeToVertex(node): GraphVertex$</text>
<text class="mono" x="18" y="129">+relationshipToEdge(rel): GraphEdge$</text>
<text class="mono" x="18" y="150">+pathToGraphPath(path): GraphPath$</text>
<text class="mono" x="18" y="171">+recordToVertex(record, key): GraphVertex$</text>
<text class="mono" x="18" y="192">+recordToEdge(record, key): GraphEdge$</text>
<text class="mono" x="18" y="213">+recordToPath(record, key): GraphPath$</text>
</g>
<g transform="translate(70,538)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">GraphPath</text>
  <text class="mono" x="18" y="108">+steps: List~PathStep~</text>
</g>
<g transform="translate(494.7,538)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">Neo4jGraphOperations</text>
  <text class="mono" x="18" y="108">-driver: Driver</text>
<text class="mono" x="18" y="129">-database: String</text>
<text class="mono" x="18" y="150">-session(): ReactiveSession</text>
<text class="mono" x="18" y="171">-runQuery(cypher, params, mapper): List~T~</text>
</g>
<g transform="translate(919.3,538)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">GraphEdge</text>
  <text class="mono" x="18" y="108">+id: GraphElementId</text>
<text class="mono" x="18" y="129">+type: String</text>
<text class="mono" x="18" y="150">+startId: GraphElementId</text>
<text class="mono" x="18" y="171">+endId: GraphElementId</text>
<text class="mono" x="18" y="192">+properties: Map~String, Any?~</text>
</g>
<g transform="translate(1344,538)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">GraphVertex</text>
  <text class="mono" x="18" y="108">+id: GraphElementId</text>
<text class="mono" x="18" y="129">+label: String</text>
<text class="mono" x="18" y="150">+properties: Map~String, Any?~</text>
</g>
<g transform="translate(707,875)">
  <rect class="card" x="0" y="0" width="340" height="280" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">Neo4jCoroutineSession</text>
  <text class="mono" x="18" y="108">-driver: Driver</text>
<text class="mono" x="18" y="129">-database: String</text>
<text class="mono" x="18" y="150">+read(block): List~T~</text>
<text class="mono" x="18" y="171">+write(block): List~T~</text>
<text class="mono" x="18" y="192">+runReadQuery(cypher, params):</text>
<text class="mono" x="18" y="213">List~Record~</text>
<text class="mono" x="18" y="234">+runWriteQuery(cypher, params):</text>
<text class="mono" x="18" y="255">List~Record~</text>
</g>
<g transform="translate(1344,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">GraphOperations</text>
  <text class="mono" x="18" y="108">+createGraph(name)*</text>
<text class="mono" x="18" y="129">+dropGraph(name)*</text>
<text class="mono" x="18" y="150">+graphExists(name)*</text>
<text class="mono" x="18" y="171">+createVertex(label, properties)*</text>
<text class="mono" x="18" y="192">+findVertexById(label, id)*</text>
<text class="mono" x="18" y="213">+findVerticesByLabel(label, filter)*</text>
</g>
<g transform="translate(707,1275)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">ReactiveSession</text>
  <text class="mono" x="18" y="108">+run(query): Publisher~Result~</text>
<text class="mono" x="18" y="129">+close(): Publisher~Void~</text>
</g>
</svg>

<path class="line" d="M908 564 L1292 564"/>
<rect x="1763" y="616" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1781" y="643" text-anchor="start">4. Publisher~Record~</text>
<path class="dashed" d="M1292 674 L2444 674"/>
<rect x="1763" y="726" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1781" y="753" text-anchor="start">5. Path</text>
<path class="dashed" d="M908 784 L2828 784"/>
<rect x="977" y="836" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="995" y="863" text-anchor="start">6. recordToPath(record, p)</text>
<path class="line" d="M524 894 L1676 894"/>
<rect x="1593" y="946" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1611" y="973" text-anchor="start">7. path = record[p].asPath()</text>
<path class="line" d="M1676 1004 C1740 1004 1740 1038 1676 1038"/>
<rect x="1577" y="1076" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1595" y="1103" text-anchor="start">8. nodes = path.nodes().toList()</text>
<path class="line" d="M1676 1134 C1740 1134 1740 1168 1676 1168"/>
<rect x="1548.5" y="1206" width="351" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1566.5" y="1233" text-anchor="start">9. rels = path.relationships().toList()</text>
<path class="line" d="M1676 1264 C1740 1264 1740 1298 1676 1298"/>
<rect x="70" y="1336" width="2828" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1363" text-anchor="start">LOOP: (index = 0..n)</text>
<rect x="1601" y="1404" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1619" y="1431" text-anchor="start">11. nodeToVertex(nodes[i])</text>
<path class="line" d="M1676 1462 C1740 1462 1740 1496 1676 1496"/>
<rect x="1763" y="1534" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1781" y="1561" text-anchor="start">13. add(VertexStep)</text>
<path class="line" d="M1676 1592 L2060 1592"/>
<rect x="70" y="1644" width="2828" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1671" text-anchor="start">ALT: index &lt; rels.size</text>
<rect x="1581" y="1712" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1599" y="1739" text-anchor="start">16. relationshipToEdge(rels[i])</text>
<path class="line" d="M1676 1770 C1740 1770 1740 1804 1676 1804"/>
<rect x="1763" y="1842" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1781" y="1869" text-anchor="start">18. add(EdgeStep)</text>
<path class="line" d="M1676 1900 L2060 1900"/>
<rect x="2064.5" y="1952" width="375" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2082.5" y="1979" text-anchor="start">20. GraphPath([VertexStep, EdgeStep, ...])</text>
<path class="dashed" d="M1676 2010 L2828 2010"/>
</svg>

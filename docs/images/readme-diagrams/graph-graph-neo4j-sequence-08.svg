<rect class="card" x="2294" y="166" width="300" height="72" rx="20" fill="#F7F1E7" stroke="#B88A44"/>
<text class="smallLabel" x="2444" y="209" text-anchor="middle">-RxSession</text>
<line class="lifeline" x1="2444" y1="252" x2="2444" y2="2072" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2678" y="166" width="300" height="72" rx="20" fill="#EEF6D9" stroke="#8BA84D"/>
<text class="smallLabel" x="2828" y="209" text-anchor="middle">-Ops</text>
<line class="lifeline" x1="2828" y1="252" x2="2828" y2="2072" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="120.5" y="286" width="423" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="138.5" y="313" text-anchor="start">1. shortestPath(fromId, toId, KNOWS, maxDepth=5)</text>
<path class="line" d="M140 344 L524 344"/>
<rect x="611" y="396" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="629" y="423" text-anchor="start">2. run(Query)</text>
<path class="line" d="M524 454 L908 454"/>
<rect x="995" y="506" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>

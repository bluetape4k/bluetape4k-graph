<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .thin { stroke: #64748B; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">FalkorDB Backend Overview</text>
  <text x="74" y="118" class="subtitle">graph-falkordb adapts graph-core operations to jfalkordb, Redis-module storage, schema indexes, merge, and coroutine IO isolation.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="275" y="215" text-anchor="middle" class="section">graph-core Contract</text>
  <text x="835" y="215" text-anchor="middle" class="section">FalkorDB Adapter</text>
  <text x="1435" y="215" text-anchor="middle" class="section">Redis Graph Runtime</text>

  <rect x="135" y="270" width="330" height="150" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="170" y="318" class="label">Repository APIs</text>
  <text x="170" y="354" class="small">GraphOperations</text>
  <text x="170" y="382" class="small">GraphMergeOperations</text>
  <text x="170" y="410" class="small">GraphSchemaManager</text>

  <rect x="135" y="500" width="330" height="150" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="170" y="548" class="label">Coroutine APIs</text>
  <text x="170" y="584" class="small">GraphSuspendOperations</text>
  <text x="170" y="612" class="small">Flow results</text>
  <text x="170" y="640" class="small">cancellation-aware wrappers</text>

  <rect x="620" y="250" width="430" height="175" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="655" y="298" class="label">FalkorDBGraphOperations</text>
  <text x="655" y="334" class="small">driver.graph(graphName).use { ... }</text>
  <text x="655" y="362" class="small">CREATE uses named properties</text>
  <text x="655" y="390" class="small">id(n) = toInteger($id)</text>

  <rect x="620" y="475" width="430" height="175" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="655" y="523" class="label">Suspend Adapter</text>
  <text x="655" y="559" class="small">withContext(Dispatchers.IO)</text>
  <text x="655" y="587" class="small">queryListIO and flowQuery</text>
  <text x="655" y="615" class="small">sync delegate for merge/schema</text>

  <rect x="620" y="725" width="430" height="120" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="655" y="773" class="label">Record Mapping</text>
  <text x="655" y="809" class="small">Node / Edge / Path to graph-core model</text>
  <text x="655" y="837" class="small">integer IDs become GraphElementId strings</text>

  <rect x="1195" y="250" width="440" height="130" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="1230" y="298" class="label">jfalkordb Driver</text>
  <text x="1230" y="334" class="small">FalkorDB.driver(host, port)</text>
  <text x="1230" y="362" class="small">ResultSet / Record from Cypher queries</text>

  <g class="card">
    <ellipse cx="1415" cy="505" rx="235" ry="48" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3"/>
    <rect x="1180" y="505" width="470" height="230" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3"/>
    <ellipse cx="1415" cy="735" rx="235" ry="48" fill="#A7F3D0" stroke="#14B8A6" stroke-width="3"/>
  </g>
  <text x="1415" y="527" text-anchor="middle" class="label">FalkorDB</text>
  <text x="1415" y="586" text-anchor="middle" class="small">Redis module with openCypher subset</text>
  <text x="1415" y="622" text-anchor="middle" class="small">nodes, relationships, indexes</text>
  <text x="1415" y="658" text-anchor="middle" class="small">unique constraints need raw command path</text>
  <text x="1415" y="684" text-anchor="middle" class="tiny">test image: falkordb/falkordb:v4.18.1</text>

  <rect x="1160" y="805" width="510" height="90" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="1195" y="838" class="label">Test Fixture</text>
  <text x="1195" y="866" class="small">FalkorDBServer.Launcher.falkordb</text>
  <text x="1195" y="889" class="small">exposes host and mapped Redis port</text>


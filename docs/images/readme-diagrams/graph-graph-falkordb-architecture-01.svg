  <text x="540" y="322" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">implements</text>
  <text x="540" y="322" text-anchor="middle" class="tiny">implements</text>
  <text x="1120" y="315" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">query</text>
  <text x="1120" y="315" text-anchor="middle" class="tiny">query</text>
  <text x="1120" y="528" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">IO isolated</text>
  <text x="1120" y="528" text-anchor="middle" class="tiny">IO isolated</text>
  <text x="1115" y="762" text-anchor="middle" class="tiny" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">maps results</text>
  <text x="1115" y="762" text-anchor="middle" class="tiny">maps results</text>
  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: graph-falkordb / overview</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1080" viewBox="0 0 1840 1080">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 48px; fill: #111827; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #4B5563; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 30px; fill: #111827; }
    .label { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .small { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #374151; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #4B5563; }
    .card { filter: url(#softShadow); }
    .line { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0" y="0" width="1840" height="1080" fill="#F8FAFC"/>
  <rect x="24" y="24" width="1792" height="1032" rx="22" fill="none" stroke="#60A5FA" stroke-width="4"/>
  <circle cx="1776" cy="64" r="15" fill="#FED7AA" opacity="0.95"/>
  <circle cx="1736" cy="64" r="15" fill="#DCFCE7" opacity="0.95"/>
  <circle cx="1696" cy="64" r="15" fill="#EDE9FE" opacity="0.95"/>

  <text x="72" y="82" class="title">LinkedIn Graph Example Data Flow</text>
  <text x="74" y="118" class="subtitle">Shared tests seed a social graph, run traversals, and assert portable social-network answers.</text>

  <rect x="70" y="150" width="1700" height="790" rx="18" fill="#FFFFFF" stroke="#D6E2ED" stroke-width="2" filter="url(#softShadow)"/>

  <text x="270" y="214" text-anchor="middle" class="section">Seed Network</text>
  <text x="690" y="214" text-anchor="middle" class="section">Write Graph</text>
  <text x="1110" y="214" text-anchor="middle" class="section">Traversal Queries</text>
  <text x="1515" y="214" text-anchor="middle" class="section">Expected Results</text>

  <rect x="125" y="270" width="330" height="150" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" class="card"/>
  <text x="160" y="318" class="label">People and Company</text>
  <text x="160" y="354" class="small">Alice, Bob, Carol, Dave</text>
  <text x="160" y="382" class="small">TechCorp company vertex</text>
  <text x="160" y="410" class="small">titles and locations on profiles</text>

  <rect x="125" y="525" width="330" height="150" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3" class="card"/>
  <text x="160" y="573" class="label">Relationships</text>
  <text x="160" y="609" class="small">Alice knows Bob knows Carol</text>
  <text x="160" y="637" class="small">Carol knows Dave</text>
  <text x="160" y="665" class="small">Bob follows Alice</text>

  <rect x="555" y="295" width="330" height="150" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="3" class="card"/>
  <text x="590" y="343" class="label">Service Writes</text>
  <text x="590" y="379" class="small">addPerson, addCompany</text>
  <text x="590" y="407" class="small">connect writes two KNOWS edges</text>
  <text x="590" y="435" class="small">follow and addWorkExperience</text>

  <g class="card">
    <ellipse cx="720" cy="630" rx="165" ry="38" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3"/>
    <rect x="555" y="630" width="330" height="135" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3"/>
    <ellipse cx="720" cy="765" rx="165" ry="38" fill="#A7F3D0" stroke="#14B8A6" stroke-width="3"/>
  </g>
  <text x="720" y="652" text-anchor="middle" class="label">linkedin Graph</text>
  <text x="720" y="700" text-anchor="middle" class="small">Person, Company, Skill vertices</text>
  <text x="720" y="728" text-anchor="middle" class="small">KNOWS, FOLLOWS, WORKS_AT edges</text>

  <rect x="980" y="260" width="330" height="150" rx="14" fill="#FEF3C7" stroke="#EAB308" stroke-width="3" class="card"/>
  <text x="1015" y="308" class="label">Connection Queries</text>
  <text x="1015" y="344" class="small">getDirectConnections(Alice)</text>
  <text x="1015" y="372" class="small">getConnectionsWithinDegree(2)</text>
  <text x="1015" y="400" class="small">findConnectionPath(Alice, Dave)</text>

  <rect x="980" y="535" width="330" height="150" rx="14" fill="#FED7AA" stroke="#F97316" stroke-width="3" class="card"/>
  <text x="1015" y="583" class="label">Lookup Queries</text>
  <text x="1015" y="619" class="small">findEmployees(TechCorp)</text>
  <text x="1015" y="647" class="small">incoming FOLLOWS for followers</text>
  <text x="1015" y="675" class="small">findPersonByName(Alice)</text>

  <rect x="1410" y="295" width="330" height="150" rx="14" fill="#FCE7F3" stroke="#EC4899" stroke-width="3" class="card"/>
  <text x="1445" y="343" class="label">Network Answers</text>
  <text x="1445" y="379" class="small">Bob is Alice direct connection</text>
  <text x="1445" y="407" class="small">Dave reachable through chain</text>
  <text x="1445" y="435" class="small">Carol is second degree</text>

  <rect x="1410" y="552" width="330" height="158" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3" class="card"/>
  <text x="1445" y="600" class="label">Business Answers</text>
  <text x="1445" y="636" class="small">TechCorp employees returned</text>
  <text x="1445" y="664" class="small">followers found via</text>
  <text x="1445" y="692" class="small">incoming FOLLOWS edge</text>

  <path d="M 455 345 L 555 370" class="line"/>
  <path d="M 455 600 L 555 630" class="line"/>
  <path d="M 885 698 L 980 335" class="line"/>
  <path d="M 885 698 L 980 610" class="line"/>
  <path d="M 1310 335 L 1410 370" class="line"/>
  <path d="M 1310 610 L 1410 630" class="line"/>

  <rect x="190" y="820" width="1460" height="62" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="920" y="848" text-anchor="middle" class="small">Abstract tests run the same seed and query flow against every backend-specific operations factory.</text>

  <text x="920" y="1032" text-anchor="middle" class="tiny">https://github.com/bluetape4k/bluetape4k-graph | module: linkedin-graph-examples / data flow</text>
</svg>

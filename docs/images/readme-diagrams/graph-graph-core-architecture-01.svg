<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1120" viewBox="0 0 1760 1120">
  <defs>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#334155" flood-opacity="0.10"/>
    </filter>
    <marker markerUnits="userSpaceOnUse" id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="14" markerHeight="14" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 1.2 1.4 L 8.6 5 L 1.2 8.6 Z" fill="#64748B" stroke-dasharray="none"/>
    </marker>
    <marker markerUnits="userSpaceOnUse" id="arrowHint" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="14" markerHeight="14" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 1.2 1.4 L 8.6 5 L 1.2 8.6 Z" fill="#94A3B8" stroke-dasharray="none"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Architects Daughter', cursive; font-size: 54px; fill: #0F172A; }
    .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #475569; }
    .section { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #334155; }
    .cardTitle { font-family: 'Architects Daughter', cursive; font-size: 27px; fill: #111827; }
    .apiTitle { font-family: 'Architects Daughter', cursive; font-size: 23px; fill: #111827; }
    .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #334155; }
    .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #475569; }
    .tiny { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #64748B; }
    .stage { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; }
    .card { filter: url(#shadow); }
    .flow { fill: none; stroke: #64748B; stroke-width: 2.35; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .hint { fill: none; stroke: #94A3B8; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 8; marker-end: url(#arrowHint); }
  </style>

  <rect x="0" y="0" width="1760" height="1120" fill="#F8FAFC"/>
  <rect x="28" y="28" width="1704" height="1064" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2.2"/>

  <text x="78" y="88" class="title">graph-core architecture</text>
  <text x="80" y="126" class="subtitle">Read this module as shared graph contracts: choose an API style, compose repository capabilities, share one model, then implement a backend.</text>

  <rect x="76" y="164" width="1608" height="116" rx="18" class="stage"/>
  <text x="106" y="212" class="section">1. Facade layer</text>
  <rect x="482" y="190" width="280" height="62" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.1" class="card"/>
  <text x="622" y="216" text-anchor="middle" class="apiTitle">GraphOperations</text>
  <text x="622" y="240" text-anchor="middle" class="small">blocking facade</text>
  <rect x="802" y="190" width="336" height="62" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.1" class="card"/>
  <text x="970" y="216" text-anchor="middle" class="apiTitle">GraphSuspendOperations</text>
  <text x="970" y="240" text-anchor="middle" class="small">suspend + Flow facade</text>
  <rect x="1178" y="190" width="390" height="62" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.1" class="card"/>
  <text x="1373" y="216" text-anchor="middle" class="apiTitle">GraphVirtualThreadOperations</text>
  <text x="1373" y="240" text-anchor="middle" class="small">CompletableFuture facade</text>

  <rect x="76" y="326" width="1608" height="186" rx="18" class="stage"/>
  <text x="106" y="366" class="section">2. Repository contract layer</text>
  <rect x="308" y="388" width="270" height="96" rx="14" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.1" class="card"/>
  <text x="443" y="421" text-anchor="middle" class="cardTitle">Session</text>
  <text x="443" y="449" text-anchor="middle" class="body">create/drop graph</text>
  <text x="443" y="474" text-anchor="middle" class="body">exists, close</text>
  <rect x="618" y="388" width="270" height="96" rx="14" fill="#F0FDF4" stroke="#34D399" stroke-width="2.1" class="card"/>
  <text x="753" y="421" text-anchor="middle" class="cardTitle">Vertex</text>
  <text x="753" y="449" text-anchor="middle" class="body">create/find/update</text>
  <text x="753" y="474" text-anchor="middle" class="body">delete, count, batch</text>
  <rect x="928" y="388" width="270" height="96" rx="14" fill="#FFFBEB" stroke="#FBBF24" stroke-width="2.1" class="card"/>
  <text x="1063" y="421" text-anchor="middle" class="cardTitle">Edge</text>
  <text x="1063" y="449" text-anchor="middle" class="body">connect vertices</text>
  <text x="1063" y="474" text-anchor="middle" class="body">endpoint lookup</text>
  <rect x="1238" y="388" width="270" height="96" rx="14" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.1" class="card"/>
  <text x="1373" y="421" text-anchor="middle" class="cardTitle">Traversal + Algo</text>
  <text x="1373" y="449" text-anchor="middle" class="body">paths, neighbors</text>
  <text x="1373" y="474" text-anchor="middle" class="body">PageRank, BFS/DFS</text>

  <rect x="76" y="558" width="1608" height="172" rx="18" class="stage"/>
  <text x="106" y="598" class="section">3. Shared graph language</text>
  <rect x="340" y="614" width="290" height="98" rx="14" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2.1" class="card"/>
  <text x="485" y="649" text-anchor="middle" class="cardTitle">Model</text>
  <text x="485" y="677" text-anchor="middle" class="body">GraphElementId</text>
  <text x="485" y="702" text-anchor="middle" class="small">GraphVertex, GraphEdge</text>
  <rect x="735" y="614" width="290" height="98" rx="14" fill="#F0FDF4" stroke="#22C55E" stroke-width="2.1" class="card"/>
  <text x="880" y="649" text-anchor="middle" class="cardTitle">Path results</text>
  <text x="880" y="677" text-anchor="middle" class="body">VertexStep / EdgeStep</text>
  <text x="880" y="702" text-anchor="middle" class="small">length + totalWeight</text>
  <rect x="1130" y="614" width="290" height="98" rx="14" fill="#FFF7ED" stroke="#F97316" stroke-width="2.1" class="card"/>
  <text x="1275" y="649" text-anchor="middle" class="cardTitle">Schema DSL</text>
  <text x="1275" y="677" text-anchor="middle" class="body">VertexLabel, EdgeLabel</text>
  <text x="1275" y="702" text-anchor="middle" class="small">PropertyDef types</text>

  <rect x="76" y="776" width="1608" height="156" rx="18" class="stage"/>
  <text x="106" y="816" class="section">4. Optional capabilities are explicit</text>
  <rect x="306" y="842" width="310" height="70" rx="14" fill="#FDF2F8" stroke="#EC4899" stroke-width="2.1" class="card"/>
  <text x="461" y="870" text-anchor="middle" class="cardTitle">Transactions</text>
  <text x="461" y="896" text-anchor="middle" class="body">scope-based CRUD</text>
  <rect x="724" y="842" width="310" height="70" rx="14" fill="#FEFCE8" stroke="#EAB308" stroke-width="2.1" class="card"/>
  <text x="879" y="870" text-anchor="middle" class="cardTitle">Merge / upsert</text>
  <text x="879" y="896" text-anchor="middle" class="body">validated identity keys</text>
  <rect x="1142" y="842" width="310" height="70" rx="14" fill="#F0F9FF" stroke="#0284C7" stroke-width="2.1" class="card"/>
  <text x="1297" y="870" text-anchor="middle" class="cardTitle">Schema manager</text>
  <text x="1297" y="896" text-anchor="middle" class="body">indexes + constraints</text>

  <rect x="76" y="978" width="1608" height="80" rx="18" class="stage"/>
  <text x="106" y="1028" class="section">Backend modules implement these contracts for Neo4j, Memgraph, AGE, TinkerPop, and FalkorDB.</text>

  <path d="M 622 252 L 622 282 Q 622 300 640 300 L 862 300 Q 880 300 880 318 L 880 326" class="hint"/>
  <path d="M 970 252 L 970 326" class="flow"/>
  <path d="M 1373 252 L 1373 282 Q 1373 300 1355 300 L 898 300 Q 880 300 880 318 L 880 326" class="hint"/>
  <path d="M 880 512 L 880 558" class="flow"/>
  <path d="M 880 730 L 880 776" class="flow"/>
  <path d="M 880 932 L 880 978" class="flow"/>
  <rect x="688" y="304" width="384" height="30" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="880" y="324" text-anchor="middle" class="tiny">each facade composes the contract set</text>

  <text x="880" y="1078" text-anchor="middle" class="tiny">Unsupported capabilities are not hidden fallbacks; callers get explicit failures when a backend cannot honor the contract.</text>
</svg>

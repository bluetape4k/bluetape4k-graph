name: CodeQL Analysis

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Pin Kotlin for CodeQL extractor
        if: matrix.language == 'java-kotlin'
        run: |
          catalog_ref="$(sed -n 's/.*orElse("\([0-9a-f]\{40,64\}\)").*/\1/p' settings.gradle.kts)"
          test -n "$catalog_ref"
          catalog_path="$RUNNER_TEMP/bluetape4k-codeql-libs.versions.toml"
          checksum_path="$RUNNER_TEMP/bluetape4k-codeql-libs.versions.toml.sha256"
          catalog_base_url="https://raw.githubusercontent.com/bluetape4k/bluetape4k-dependencies/$catalog_ref/gradle"
          curl --fail --silent --show-error --location --retry 3 \
            "$catalog_base_url/libs.versions.toml" --output "$catalog_path"
          curl --fail --silent --show-error --location --retry 3 \
            "$catalog_base_url/libs.versions.toml.sha256" --output "$checksum_path"
          expected_checksum="$(awk '{print $1}' "$checksum_path")"
          actual_checksum="$(shasum -a 256 "$catalog_path" | awk '{print $1}')"
          test "$actual_checksum" = "$expected_checksum"
          grep -nE '^[[:space:]]*kotlin[[:space:]]*=[[:space:]]*"2\.4\.10"' "$catalog_path"
          echo "BLUETAPE4K_DEPENDENCIES_CATALOG_PATH=$catalog_path" >> "$GITHUB_ENV"

      - name: Setup JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Gradle
        if: matrix.language == 'java-kotlin'
        run: ./gradlew build -x test --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

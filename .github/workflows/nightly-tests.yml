  # ── 9. 커버리지 집계 ──────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report

    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test-core
      - test-spring-starters
      - test-graph-ktor
      - test-graph-neo4j
      - test-graph-memgraph

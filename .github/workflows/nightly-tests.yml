name: Nightly

on:
  schedule:
    - cron: '7 19 * * 1-6'  # Daily smoke, UTC 19:07 (KST 04:07) Mon-Sat
    - cron: '7 19 * * 0'    # Weekly full, UTC 19:07 (KST 04:07) Sunday
  workflow_dispatch:
    inputs:
      scope:
        description: 'Nightly scope to run'
        required: true
        type: choice
        default: full
        options:
          - smoke
          - full

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 0. Gradle Wrapper 검증 ────────────────────────────────────────────────
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.3.0

  # ── 1. 전체 빌드 + Detekt ─────────────────────────────────────────────────
  build:
    name: Build & Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper

      - name: Build (compile only)
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew build -x test --parallel --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Detekt static analysis
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew detekt --parallel --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: '**/build/reports/detekt/*.xml'
          retention-days: 14

  # ── 2. 전체 graph image family startup/workload gate ────────────────────
  testcontainers-image-gate:
    name: Testcontainers Image Family Gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: build
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '7 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Restore Testcontainers image cache
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: restore
          cache-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-${{ hashFiles('.github/testcontainers-images.txt') }}
          restore-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-

      - name: Run full graph image family gate
        run: |
          python3 scripts/run_testcontainers_image_gate.py \
            --scope full \
            --report-dir build/reports/testcontainers-image-gate \
            --max-attempts 3 \
            --timeout-minutes 30
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Save Testcontainers image cache
        if: always()
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: save

      - name: Upload image family gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testcontainers-image-gate
          path: build/reports/testcontainers-image-gate/
          retention-days: 30

  # ── 3. Core + TinkerGraph (in-memory) ────────────────────────────────────
  test-core:
    name: Test / Core & TinkerGraph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test graph-core & graph-tinkerpop & graph-io
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew --no-configuration-cache \
              :bluetape4k-graph-core:test \
              :bluetape4k-graph-tinkerpop:test \
              :bluetape4k-graph-io-core:test \
              :bluetape4k-graph-io-csv:test \
              :bluetape4k-graph-io-jackson2:test \
              :bluetape4k-graph-io-jackson3:test \
              :bluetape4k-graph-io-graphml:test \
              :bluetape4k-graph-io-micrometer:test \
              :bluetape4k-graph-okio:test \
              --no-daemon --continue && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew --no-configuration-cache \
              :bluetape4k-graph-core:koverXmlReport \
              :bluetape4k-graph-tinkerpop:koverXmlReport \
              :bluetape4k-graph-io-core:koverXmlReport \
              :bluetape4k-graph-io-csv:koverXmlReport \
              :bluetape4k-graph-io-jackson2:koverXmlReport \
              :bluetape4k-graph-io-jackson3:koverXmlReport \
              :bluetape4k-graph-io-graphml:koverXmlReport \
              :bluetape4k-graph-io-micrometer:koverXmlReport \
              :bluetape4k-graph-okio:koverXmlReport \
              --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── 3. Spring Boot (TinkerGraph + full-scope FalkorDB) ─────────
  test-spring-starters:

name: Branch Governance

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify branch governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Fetch frozen legacy branch
        shell: bash
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Run verifier regression tests
        shell: bash
        run: python3 .github/scripts/test_verify_branch_governance.py

      - name: Verify live branch policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/verify_branch_governance.py \
            --policy config/branch-governance.json \
            --repository . \
            --canonical-ref HEAD \
            --legacy-ref origin/main \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --ref-name "$REF_NAME"

name: Nightly

on:
  schedule:
    - cron: '0 19 * * 1-6'  # Daily smoke, UTC 19:00 (KST 04:00) Mon-Sat
    - cron: '0 19 * * 0'    # Weekly full, UTC 19:00 (KST 04:00) Sunday
  workflow_dispatch:
    inputs:
      scope:
        description: 'Nightly scope to run'
        required: true
        type: choice
        default: full
        options:
          - smoke
          - full

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 0. Gradle Wrapper 검증 ────────────────────────────────────────────────
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

  # ── 1. 전체 빌드 + Detekt ─────────────────────────────────────────────────
  build:
    name: Build & Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Build (compile only)
        run: ./gradlew build -x test --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Detekt static analysis
        run: ./gradlew detekt --parallel

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: 'build/reports/detekt/*.xml'
          retention-days: 14

  # ── 2. Core + TinkerGraph (in-memory) ────────────────────────────────────
  test-core:
    name: Test / Core & TinkerGraph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test graph-core & graph-tinkerpop & graph-io
        run: |
          for attempt in 1 2 3; do
            ./gradlew \
              :graph-core:test \
              :graph-tinkerpop:test \
              :graph-io-core:test \
              :graph-io-csv:test \
              :graph-io-jackson2:test \
              :graph-io-jackson3:test \
              :graph-io-graphml:test \
              :graph-okio:test \
              --no-daemon --continue && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :graph-core:koverXmlReport \
            :graph-tinkerpop:koverXmlReport \
            :graph-okio:koverXmlReport \
            --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── 3. Spring Boot (TinkerGraph, in-memory) ───────────────────
  test-spring-starters:
    name: Test / Spring Boot (TinkerGraph)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test Spring Boot
        run: |
          for attempt in 1 2 3; do
            ./gradlew \
              :graph-spring-boot:test \
              --no-daemon --continue && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          SPRING_PROFILES_ACTIVE: tinkergraph

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :graph-spring-boot:koverXmlReport \
            --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-spring-starters
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-spring-starters
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── 4. Ktor Graph (Testcontainers) ───────────────────────────────────────
  test-graph-ktor:
    name: Test / Ktor Graph (Testcontainers)
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') }}

    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Restore Testcontainers image cache
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: restore
          cache-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-${{ hashFiles('.github/testcontainers-images.txt') }}
          restore-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-

      - name: Test graph-ktor
        run: |
          for attempt in 1 2 3; do
            ./gradlew :graph-ktor:test --no-daemon --continue && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Save Testcontainers image cache
        if: always()
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: save

      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :graph-ktor:koverXmlReport --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ktor
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ktor
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── 5. Neo4j (Testcontainers) ─────────────────────────────────────────────
  test-graph-neo4j:
    name: Test / Neo4j (Testcontainers)
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') }}

    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Restore Testcontainers image cache
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: restore
          cache-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-${{ hashFiles('.github/testcontainers-images.txt') }}
          restore-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-

      - name: Test graph-neo4j

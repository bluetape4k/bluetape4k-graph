            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-neo4j
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-neo4j
          path: '**/build/reports/kover/report.xml'
          retention-days: 7

  # ── 8. Memgraph (Testcontainers) ──────────────────────────────────────────
  test-graph-memgraph:
    name: Test / Memgraph (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes]
    if: >
      needs.changes.outputs['graph-memgraph'] == 'true' ||
      needs.changes.outputs['graph-core'] == 'true' ||
      needs.changes.outputs.common == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}

name: CI

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.omc/**'
      - '.claude/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.omc/**'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 0. 시크릿 스캔 ────────────────────────────────────────────────────────
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  # ── 1. Gradle Wrapper 검증 ────────────────────────────────────────────────
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  # ── 2. 전체 빌드 (테스트 제외) ───────────────────────────────────────────
  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build (compile only)
        run: ./gradlew build -x test --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  # ── 3. Core + TinkerGraph 테스트 (Docker 불필요) ──────────────────────────
  test-core:
    name: Test / Core & TinkerGraph
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test graph-core & graph-tinkerpop & graph-io
        run: |
          ./gradlew \
            :graph-core:test \
            :graph-tinkerpop:test \
            :graph-io-core:test \
            :graph-io-csv:test \
            :graph-io-jackson2:test \
            :graph-io-jackson3:test \
            :graph-io-graphml:test \
            :graph-io-okio:test \
            --no-daemon --continue
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :graph-core:koverXmlReport \
            :graph-tinkerpop:koverXmlReport \
            :graph-io-core:koverXmlReport \
            :graph-io-csv:koverXmlReport \
            :graph-io-jackson2:koverXmlReport \
            :graph-io-jackson3:koverXmlReport \
            :graph-io-graphml:koverXmlReport \
            :graph-io-okio:koverXmlReport \
            --no-daemon --continue
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-core
          path: 'build/*/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: 'build/*/reports/kover/report.xml'
          retention-days: 7

  # ── 4. Spring Boot Starter 테스트 (TinkerGraph 프로파일, Docker 불필요) ──
  test-spring-starters:
    name: Test / Spring Boot Starters (TinkerGraph)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test Spring Boot 3/4 starters
        run: |
          ./gradlew \
            :graph-spring-boot3-starter:test \
            :graph-spring-boot4-starter:test \
            --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          SPRING_PROFILES_ACTIVE: tinkergraph

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :graph-spring-boot3-starter:koverXmlReport \
            :graph-spring-boot4-starter:koverXmlReport \
            --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-spring-starters
          path: 'build/*/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-spring-starters
          path: 'build/*/reports/kover/report.xml'
          retention-days: 7

  # ── 5. 커버리지 집계 ─────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test-core, test-spring-starters]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Aggregate Kover coverage summary
        if: always()
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 14

  # ── 6. 결과 집계 ──────────────────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - build
      - test-core
      - test-spring-starters
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"

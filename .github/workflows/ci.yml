  # ── 11. 커버리지 집계 ─────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test-core
      - test-spring-starters
      - test-graph-ktor
      - test-graph-neo4j
      - test-graph-memgraph
      - test-graph-age
      - test-graph-falkordb
    if: >
      always() &&
      (needs.test-core.result == 'success' ||
       needs.test-spring-starters.result == 'success' ||
       needs.test-graph-ktor.result == 'success' ||
       needs.test-graph-neo4j.result == 'success' ||
       needs.test-graph-memgraph.result == 'success' ||
       needs.test-graph-age.result == 'success' ||
       needs.test-graph-falkordb.result == 'success')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false

      - name: Aggregate Kover coverage summary
        if: always()
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 14

  # ── 12. 결과 집계 ──────────────────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - gitleaks
      - changes
      - build
      - test-core
      - test-spring-starters
      - test-graph-ktor
      - test-graph-neo4j
      - test-graph-memgraph
      - test-graph-age
      - test-graph-falkordb
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"

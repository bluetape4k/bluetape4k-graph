name: CI

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.omc/**'
      - '.claude/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.omc/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BLUETAPE4K_DEPENDENCIES_CATALOG_REF: 'df64293753a9491b337852a158f89d4a93a1734a'

jobs:
  # ── 0. 시크릿 스캔 ────────────────────────────────────────────────────────
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_RELEASE=$(curl -sSfL --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}")
          GITLEAKS_ARCHIVE_ASSET=$(jq -er \
            '[.assets[] | select(.name | test("_linux_x64\\.tar\\.gz$")) | [.name, .browser_download_url]]
             | if length == 1 then .[0] | @tsv else error("expected exactly one Linux x64 archive") end' \
            <<< "${GITLEAKS_RELEASE}")
          read -r GITLEAKS_ARCHIVE GITLEAKS_ARCHIVE_URL <<< "${GITLEAKS_ARCHIVE_ASSET}"
          GITLEAKS_CHECKSUMS_ASSET=$(jq -er \
            '[.assets[] | select(.name | test("_checksums\\.txt$")) | [.name, .browser_download_url]]
             | if length == 1 then .[0] | @tsv else error("expected exactly one checksums file") end' \
            <<< "${GITLEAKS_RELEASE}")
          read -r GITLEAKS_CHECKSUMS GITLEAKS_CHECKSUMS_URL <<< "${GITLEAKS_CHECKSUMS_ASSET}"
          curl -sSfL --retry 3 -o "${GITLEAKS_ARCHIVE}" "${GITLEAKS_ARCHIVE_URL}"
          curl -sSfL --retry 3 -o "${GITLEAKS_CHECKSUMS}" "${GITLEAKS_CHECKSUMS_URL}"
          EXPECTED_CHECKSUM=$(awk -v archive="${GITLEAKS_ARCHIVE}" '$2 == archive { print $1 }' "${GITLEAKS_CHECKSUMS}")
          [[ "${EXPECTED_CHECKSUM}" =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s  %s\n' "${EXPECTED_CHECKSUM}" "${GITLEAKS_ARCHIVE}" | sha256sum -c -
          tar -xzf "${GITLEAKS_ARCHIVE}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  # ── 1. Gradle Wrapper 검증 ────────────────────────────────────────────────
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.3.0

  # ── 2. paths-filter ───────────────────────────────────────────────────────
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate-wrapper
    permissions:
      contents: read
      pull-requests: read
    outputs:
      graph-core: ${{ steps.filter.outputs.graph-core }}
      graph-neo4j: ${{ steps.filter.outputs.graph-neo4j }}
      graph-memgraph: ${{ steps.filter.outputs.graph-memgraph }}
      graph-age: ${{ steps.filter.outputs.graph-age }}
      graph-falkordb: ${{ steps.filter.outputs.graph-falkordb }}
      graph-benchmark: ${{ steps.filter.outputs.graph-benchmark }}
      graph-benchmarks: ${{ steps.filter.outputs.graph-benchmarks }}
      graph-spring-boot: ${{ steps.filter.outputs.graph-spring-boot }}
      graph-ktor: ${{ steps.filter.outputs.graph-ktor }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            graph-core:
              - 'graph/graph-core/**'
              - 'graph/graph-tinkerpop/**'
              - 'graph-io/**'
            graph-neo4j:
              - 'graph/graph-neo4j/**'
            graph-memgraph:
              - 'graph/graph-memgraph/**'
            graph-age:
              - 'graph/graph-age/**'
            graph-falkordb:
              - 'graph/graph-falkordb/**'
            graph-benchmark:
              - 'benchmark/graph-benchmark/**'
            graph-benchmarks:
              - 'benchmark/**'
              - '.github/workflows/benchmark.yml'
              - '.github/workflows/ci.yml'
            graph-spring-boot:
              - 'spring-boot/**'
            graph-ktor:
              - 'ktor/graph-ktor/**'
            common:
              - 'buildSrc/**'
              - 'gradle/**'
              - '.github/actions/testcontainers-image-cache/**'
              - '.github/scripts/docker-image-cache.sh'
              - '.github/scripts/run-gradle-retry.sh'
              - '.github/scripts/test_run_gradle_retry.py'
              - '.github/testcontainers-images.txt'
              - '.github/testcontainers-image-families.txt'
              - 'scripts/testcontainers_image_gate*'
              - '*.gradle.kts'
              - 'settings.gradle.kts'
              - '.github/workflows/ci.yml'

  # ── 3. retry helper 회귀 검증 ─────────────────────────────────────────────
  retry-helper:
    name: Test / Gradle Retry Helper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run retry helper tests
        run: python3 .github/scripts/test_run_gradle_retry.py

  # ── 4. 전체 빌드 + Detekt 품질 게이트 ─────────────────────────────────────
  catalog-governance:
    name: Central Catalog Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k-dependencies
          ref: ${{ env.BLUETAPE4K_DEPENDENCIES_CATALOG_REF }}
          path: .catalog/bluetape4k-dependencies
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify immutable catalog checkout
        run: test "$(git -C .catalog/bluetape4k-dependencies rev-parse HEAD)" = "$BLUETAPE4K_DEPENDENCIES_CATALOG_REF"
      - name: Check central catalog adoption
        run: |
          python3 .catalog/bluetape4k-dependencies/scripts/sync-shared-versions.py \
            --workspace "$(dirname "$GITHUB_WORKSPACE")" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --check \
            --summary
      - name: Resolve Gradle catalog from checked-out source
        env:
          BLUETAPE4K_DEPENDENCIES_CATALOG_PATH: ${{ github.workspace }}/.catalog/bluetape4k-dependencies/gradle/libs.versions.toml
        run: ./gradlew help --no-daemon

  build:
    name: Build & Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-wrapper, changes, catalog-governance]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build (compile only)
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew build -x test --parallel && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Validate publication POMs
        run: |
          ruby scripts/publication/publication_pom_audit_test.rb
          ruby scripts/publication/publication_pom_integration_test.rb
          ./gradlew generatePomFileForBluetapeGraphPublication -PsnapshotVersion=-SNAPSHOT \
            --no-daemon --no-configuration-cache --no-build-cache
          ruby scripts/publication/validate_poms.rb
          ruby scripts/publication/graph_core_consumer_compile_smoke.rb

      - name: Detekt static analysis
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew detekt --parallel && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: '**/build/reports/detekt/*.xml'
          retention-days: 7

  # ── 4. Core + TinkerGraph 테스트 (Docker 불필요) ──────────────────────────
  test-core:
    name: Test / Core & TinkerGraph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes]
    if: >
      needs.changes.outputs['graph-core'] == 'true' ||
      needs.changes.outputs.common == 'true' ||
      github.event_name == 'workflow_dispatch'
    outputs:
      retry_status: ${{ steps.test_core_retry.outputs.retry_status }}
      retry_attempts: ${{ steps.test_core_retry.outputs.retry_attempts }}
      retry_count: ${{ steps.test_core_retry.outputs.retry_count }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test graph-core & graph-tinkerpop & graph-io
        id: test_core_retry
        run: |
          ./.github/scripts/run-gradle-retry.sh \
            ./gradlew \
              :bluetape4k-graph-core:test \
              :bluetape4k-graph-tinkerpop:test \
              :bluetape4k-graph-io-core:test \
              :bluetape4k-graph-io-csv:test \
              :bluetape4k-graph-io-jackson2:test \
              :bluetape4k-graph-io-jackson3:test \
              :bluetape4k-graph-io-graphml:test \
              :bluetape4k-graph-io-micrometer:test \
              :bluetape4k-graph-okio:test \
              --no-daemon --continue
        env:
          RETRY_NAME: ci-test-core
          RETRY_MAX_ATTEMPTS: "5"
          RETRY_DELAY_SECONDS: "30"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew \
              :bluetape4k-graph-core:koverXmlReport \
              :bluetape4k-graph-tinkerpop:koverXmlReport \
              :bluetape4k-graph-io-core:koverXmlReport \
              :bluetape4k-graph-io-csv:koverXmlReport \
              :bluetape4k-graph-io-jackson2:koverXmlReport \
              :bluetape4k-graph-io-jackson3:koverXmlReport \
              :bluetape4k-graph-io-graphml:koverXmlReport \
              :bluetape4k-graph-io-micrometer:koverXmlReport \
              :bluetape4k-graph-okio:koverXmlReport \
              --no-daemon --continue --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload Gradle retry evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retry-evidence-ci-test-core
          path: ${{ runner.temp }}/bluetape4k-retry/ci-test-core/
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: '**/build/reports/kover/report.xml'
          retention-days: 7

  # ── 5. Spring Boot 테스트 (TinkerGraph 프로파일, Docker 불필요) ──
  test-spring-starters:
    name: Test / Spring Boot (TinkerGraph)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes]
    if: >
      needs.changes.outputs['graph-spring-boot'] == 'true' ||
      needs.changes.outputs['graph-core'] == 'true' ||
      needs.changes.outputs['graph-neo4j'] == 'true' ||
      needs.changes.outputs['graph-memgraph'] == 'true' ||
      needs.changes.outputs['graph-age'] == 'true' ||
      needs.changes.outputs['graph-falkordb'] == 'true' ||
      needs.changes.outputs.common == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test Spring Boot
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew \
              :bluetape4k-graph-spring-boot:test \
              --no-daemon --continue && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          SPRING_PROFILES_ACTIVE: tinkergraph

      - name: Generate Kover XML report
        if: always()
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew \
              :bluetape4k-graph-spring-boot:koverXmlReport \
              --no-daemon --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-spring-starters
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-spring-starters
          path: '**/build/reports/kover/report.xml'
          retention-days: 7

  # ── 6. Ktor Graph (Testcontainers + TinkerGraph example) ─────────────────
  test-graph-ktor:
    name: Test / Ktor Graph (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes]
    if: >
      needs.changes.outputs['graph-ktor'] == 'true' ||
      needs.changes.outputs['graph-core'] == 'true' ||
      needs.changes.outputs['graph-neo4j'] == 'true' ||
      needs.changes.outputs['graph-memgraph'] == 'true' ||
      needs.changes.outputs['graph-age'] == 'true' ||
      needs.changes.outputs['graph-falkordb'] == 'true' ||
      needs.changes.outputs.common == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Restore Testcontainers image cache
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: restore
          cache-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-${{ hashFiles('.github/testcontainers-images.txt') }}
          restore-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-

      - name: Test graph-ktor
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-graph-ktor:test --no-daemon --continue && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Save Testcontainers image cache
        if: always()
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: save

      - name: Generate Kover XML report
        if: always()
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-graph-ktor:koverXmlReport --no-daemon --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ktor
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ktor
          path: '**/build/reports/kover/report.xml'
          retention-days: 7

  # ── 7. Neo4j (Testcontainers) ─────────────────────────────────────────────
  test-graph-neo4j:
    name: Test / Neo4j (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes]
    if: >
      needs.changes.outputs['graph-neo4j'] == 'true' ||
      needs.changes.outputs['graph-core'] == 'true' ||
      needs.changes.outputs.common == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:

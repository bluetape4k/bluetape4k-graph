            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-memgraph
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-memgraph
          path: '**/build/reports/kover/report.xml'
          retention-days: 7

  # ── 9. Apache AGE (Testcontainers) ────────────────────────────────────────
  test-graph-age:
    name: Test / Apache AGE (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes]
    if: >
      needs.changes.outputs['graph-age'] == 'true' ||
      needs.changes.outputs['graph-core'] == 'true' ||
      needs.changes.outputs.common == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Restore Testcontainers image cache
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: restore
          cache-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-${{ hashFiles('.github/testcontainers-images.txt') }}
          restore-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-

      - name: Test graph-age
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-graph-age:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Save Testcontainers image cache
        if: always()
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: save

      - name: Generate Kover XML report
        if: always()
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-graph-age:koverXmlReport --no-daemon --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-age
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-age
          path: '**/build/reports/kover/report.xml'
          retention-days: 7

  # ── 10. FalkorDB (Testcontainers) ─────────────────────────────────────────
  test-graph-falkordb:
    name: Test / FalkorDB (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes]
    if: >
      needs.changes.outputs['graph-falkordb'] == 'true' ||
      needs.changes.outputs['graph-core'] == 'true' ||
      needs.changes.outputs.common == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Restore Testcontainers image cache
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: restore
          cache-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-${{ hashFiles('.github/testcontainers-images.txt') }}
          restore-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-

      - name: Test graph-falkordb
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-graph-falkordb:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Save Testcontainers image cache
        if: always()
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: save

      - name: Generate Kover XML report
        if: always()
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew :bluetape4k-graph-falkordb:koverXmlReport --no-daemon --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-falkordb
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-falkordb
          path: '**/build/reports/kover/report.xml'
          retention-days: 7

  # ── 11. 변경 image family startup/workload gate ─────────────────────────
  testcontainers-image-gate:
    name: Testcontainers Image Family Gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [build, changes]
    if: ${{ always() && needs.build.result == 'success' && needs.changes.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Restore Testcontainers image cache
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: restore
          cache-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-${{ hashFiles('.github/testcontainers-images.txt') }}
          restore-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-

      - name: Collect exact-head changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/graph-changed-paths.txt"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            ROOT_SHA=$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)
            git diff --name-only "$ROOT_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/graph-changed-paths.txt"
          else
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/graph-changed-paths.txt"
          fi
          cat "$RUNNER_TEMP/graph-changed-paths.txt"

      - name: Run changed graph image family gate
        run: |
          python3 scripts/run_testcontainers_image_gate.py \
            --scope changed \
            --changed-path-file "$RUNNER_TEMP/graph-changed-paths.txt" \
            --report-dir build/reports/testcontainers-image-gate \
            --max-attempts 3 \
            --timeout-minutes 30
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Save Testcontainers image cache
        if: always()
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: save

      - name: Upload image family gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testcontainers-image-gate
          path: build/reports/testcontainers-image-gate/
          retention-days: 14

  # ── 12. Benchmark lifecycle (serial Testcontainers scope) ────────────────
  benchmark-catalog:
    name: Benchmark Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: >
      needs.changes.outputs['graph-benchmarks'] == 'true' ||
      needs.changes.outputs.common == 'true' ||
      github.event_name == 'workflow_dispatch'
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Build benchmark matrix
        id: catalog
        run: |
          set -euo pipefail
          test "$(jq 'length' benchmark/benchmark-modules.json)" -eq 4
          jq -e 'all(.[]; (.id | type == "string") and (.project | type == "string") and (.report_root | type == "string"))' benchmark/benchmark-modules.json >/dev/null
          echo "matrix=$(jq -c '{include: .}' benchmark/benchmark-modules.json)" >> "$GITHUB_OUTPUT"

  test-graph-benchmark:
    name: Test / Benchmark Lifecycle (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes, benchmark-catalog]
    if: >
      needs.changes.outputs['graph-benchmarks'] == 'true' ||
      needs.changes.outputs.common == 'true' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.benchmark-catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Restore Testcontainers image cache
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: restore
          cache-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-${{ matrix.project }}-${{ hashFiles('.github/testcontainers-images.txt') }}
          restore-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-${{ matrix.project }}-

      - name: Test benchmark module
        run: |
          set -euo pipefail
          ./gradlew ":${{ matrix.project }}:test" \
            --no-daemon --no-configuration-cache
          if [ "${{ matrix.project }}" = "graph-benchmark" ]; then
            ./gradlew :bluetape4k-graph-falkordb:test \
              --tests 'io.bluetape4k.graph.falkordb.FalkorDBGraphOperationsTest' \
              --no-daemon --no-configuration-cache
          fi
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Save Testcontainers image cache
        if: always()
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: save

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}
          path: |
            benchmark/${{ matrix.project }}/build/test-results/test/*.xml
            graph/graph-falkordb/build/test-results/test/*.xml
          retention-days: 7

  # ── 12. 커버리지 집계 ─────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test-core
      - test-spring-starters
      - test-graph-ktor
      - test-graph-neo4j
      - test-graph-memgraph
      - test-graph-age
      - test-graph-falkordb
    if: >
      always() &&
      (needs.test-core.result == 'success' ||
       needs.test-spring-starters.result == 'success' ||
       needs.test-graph-ktor.result == 'success' ||
       needs.test-graph-neo4j.result == 'success' ||
       needs.test-graph-memgraph.result == 'success' ||
       needs.test-graph-age.result == 'success' ||
       needs.test-graph-falkordb.result == 'success')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false

      - name: Aggregate Kover coverage summary
        if: always()
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 14

  # ── 13. 결과 집계 ──────────────────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - catalog-governance
      - retry-helper
      - gitleaks
      - changes
      - build
      - test-core
      - test-spring-starters
      - test-graph-ktor
      - test-graph-neo4j
      - test-graph-memgraph
      - test-graph-age
      - test-graph-falkordb
      - testcontainers-image-gate
      - test-graph-benchmark
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          CORE_RETRY_STATUS: ${{ needs.test-core.outputs.retry_status }}
          CORE_RETRY_ATTEMPTS: ${{ needs.test-core.outputs.retry_attempts }}
          CORE_RETRY_COUNT: ${{ needs.test-core.outputs.retry_count }}
        run: |
          echo "Job results: $RESULTS"
          echo "Core retry status: ${CORE_RETRY_STATUS:-not-run} (attempts: ${CORE_RETRY_ATTEMPTS:-0}, retries: ${CORE_RETRY_COUNT:-0})"
          {
            echo "### CI retry status"
            echo "- graph-core status: \`${CORE_RETRY_STATUS:-not-run}\`"
            echo "- attempts: \`${CORE_RETRY_ATTEMPTS:-0}\`"
            echo "- retry count: \`${CORE_RETRY_COUNT:-0}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"

name: CI

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.omc/**'
      - '.claude/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.omc/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 0. 시크릿 스캔 ────────────────────────────────────────────────────────
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_CHECKSUMS}"
          grep " ${GITLEAKS_ARCHIVE}$" "${GITLEAKS_CHECKSUMS}" | sha256sum -c -
          tar -xzf "${GITLEAKS_ARCHIVE}" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  # ── 1. Gradle Wrapper 검증 ────────────────────────────────────────────────
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  # ── 2. paths-filter ───────────────────────────────────────────────────────
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate-wrapper
    permissions:
      contents: read
      pull-requests: read
    outputs:
      graph-core: ${{ steps.filter.outputs.graph-core }}
      graph-neo4j: ${{ steps.filter.outputs.graph-neo4j }}
      graph-memgraph: ${{ steps.filter.outputs.graph-memgraph }}
      graph-age: ${{ steps.filter.outputs.graph-age }}
      graph-falkordb: ${{ steps.filter.outputs.graph-falkordb }}
      graph-spring-boot: ${{ steps.filter.outputs.graph-spring-boot }}
      graph-ktor: ${{ steps.filter.outputs.graph-ktor }}
      common: ${{ steps.filter.outputs.common }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            graph-core:
              - 'graph/graph-core/**'
              - 'graph/graph-tinkerpop/**'
              - 'graph-io/**'
            graph-neo4j:
              - 'graph/graph-neo4j/**'
            graph-memgraph:
              - 'graph/graph-memgraph/**'
            graph-age:
              - 'graph/graph-age/**'
            graph-falkordb:
              - 'graph/graph-falkordb/**'
            graph-spring-boot:
              - 'spring-boot/**'
            graph-ktor:
              - 'ktor/graph-ktor/**'
            common:
              - 'buildSrc/**'
              - 'gradle/**'
              - '.github/actions/testcontainers-image-cache/**'
              - '.github/scripts/docker-image-cache.sh'
              - '.github/testcontainers-images.txt'
              - '*.gradle.kts'
              - 'settings.gradle.kts'
              - '.github/workflows/ci.yml'

  # ── 3. 전체 빌드 + Detekt 품질 게이트 ─────────────────────────────────────
  build:
    name: Build & Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-wrapper, changes]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build (compile only)
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew build -x test --parallel && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Detekt static analysis
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew detekt --parallel && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: '**/build/reports/detekt/*.xml'
          retention-days: 7

  # ── 4. Core + TinkerGraph 테스트 (Docker 불필요) ──────────────────────────
  test-core:
    name: Test / Core & TinkerGraph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes]
    if: >
      needs.changes.outputs['graph-core'] == 'true' ||
      needs.changes.outputs.common == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test graph-core & graph-tinkerpop & graph-io
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew \
              :bluetape4k-graph-core:test \
              :bluetape4k-graph-tinkerpop:test \
              :bluetape4k-graph-io-core:test \
              :bluetape4k-graph-io-csv:test \
              :bluetape4k-graph-io-jackson2:test \
              :bluetape4k-graph-io-jackson3:test \
              :bluetape4k-graph-io-graphml:test \
              :bluetape4k-graph-okio:test \
              --no-daemon --continue && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          for attempt in 1 2 3 4 5; do
            ./gradlew \
              :bluetape4k-graph-core:koverXmlReport \
              :bluetape4k-graph-tinkerpop:koverXmlReport \
              :bluetape4k-graph-io-core:koverXmlReport \
              :bluetape4k-graph-io-csv:koverXmlReport \
              :bluetape4k-graph-io-jackson2:koverXmlReport \
              :bluetape4k-graph-io-jackson3:koverXmlReport \
              :bluetape4k-graph-io-graphml:koverXmlReport \
              :bluetape4k-graph-okio:koverXmlReport \
              --no-daemon --continue --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 5 ] && sleep 30 || exit 1
          done
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: '**/build/reports/kover/report.xml'
          retention-days: 7

  # ── 5. Spring Boot 테스트 (TinkerGraph 프로파일, Docker 불필요) ──
  test-spring-starters:
    name: Test / Spring Boot (TinkerGraph)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes]
    if: >
      needs.changes.outputs['graph-spring-boot'] == 'true' ||
      needs.changes.outputs['graph-core'] == 'true' ||
      needs.changes.outputs['graph-neo4j'] == 'true' ||
      needs.changes.outputs['graph-memgraph'] == 'true' ||
      needs.changes.outputs['graph-age'] == 'true' ||
      needs.changes.outputs['graph-falkordb'] == 'true' ||
      needs.changes.outputs.common == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:

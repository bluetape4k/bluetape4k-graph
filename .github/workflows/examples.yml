name: Examples

on:
  schedule:
    - cron: '0 21 * * *'  # Daily example coverage, UTC 21:00 (KST 06:00)
  push:
    branches: [develop, main]
    paths:
      - 'examples/**'
      - 'graph/**'
      - 'graph-io/**'
      - 'ktor/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/actions/testcontainers-image-cache/**'
      - '.github/scripts/docker-image-cache.sh'
      - '.github/testcontainers-images.txt'
      - '.github/workflows/examples.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'examples/**'
      - 'graph/**'
      - 'graph-io/**'
      - 'ktor/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/actions/testcontainers-image-cache/**'
      - '.github/scripts/docker-image-cache.sh'
      - '.github/testcontainers-images.txt'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.3.0

  build-examples:
    name: Build / All Examples (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate-wrapper
    outputs:
      retry_status: ${{ steps.build_examples_retry.outputs.retry_status }}
      retry_attempts: ${{ steps.build_examples_retry.outputs.retry_attempts }}
      retry_count: ${{ steps.build_examples_retry.outputs.retry_count }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Restore Testcontainers image cache
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: restore
          cache-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-${{ hashFiles('.github/testcontainers-images.txt') }}
          restore-key: ${{ runner.os }}-testcontainers-images-v1-${{ github.job }}-

      - name: Build and test example modules
        id: build_examples_retry
        run: |
          ./.github/scripts/run-gradle-retry.sh \
            ./gradlew \
              :code-graph-examples:build \
              :linkedin-graph-examples:build \
              :ktor-graph-examples:build \
              :fraud-detection-examples:build \
              :iam-access-graph-examples:build \
              :recommendation-examples:build \
              :observability-graph-examples:build \
              :knowledge-graph-examples:build \
              :supply-chain-graph-examples:build \
              :data-lineage-examples:build \
              :network-topology-examples:build \
              :security-attack-path-examples:build \
              --no-daemon --continue
        env:
          RETRY_NAME: examples-build
          RETRY_MAX_ATTEMPTS: "5"
          RETRY_DELAY_SECONDS: "30"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Save Testcontainers image cache
        if: always() && github.event_name != 'pull_request'
        uses: ./.github/actions/testcontainers-image-cache
        with:
          mode: save

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-examples
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload Gradle retry evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retry-evidence-examples
          path: ${{ runner.temp }}/bluetape4k-retry/examples-build/
          if-no-files-found: ignore
          retention-days: 14

  examples-status:
    name: Examples Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - validate-wrapper
      - build-examples
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          RETRY_STATUS: ${{ needs.build-examples.outputs.retry_status }}
          RETRY_ATTEMPTS: ${{ needs.build-examples.outputs.retry_attempts }}
          RETRY_COUNT: ${{ needs.build-examples.outputs.retry_count }}
        run: |
          echo "Examples results: $RESULTS"
          echo "Examples retry status: ${RETRY_STATUS:-not-run} (attempts: ${RETRY_ATTEMPTS:-0}, retries: ${RETRY_COUNT:-0})"
          {
            echo "### Examples retry status"
            echo "- status: \`${RETRY_STATUS:-not-run}\`"
            echo "- attempts: \`${RETRY_ATTEMPTS:-0}\`"
            echo "- retry count: \`${RETRY_COUNT:-0}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Examples workflow failed"
            exit 1
          fi
          echo "Examples workflow passed"

name: Benchmarks

# Manually-triggered JMH workflow for every module listed in benchmark-modules.json.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  benchmark-catalog:
    name: Validate benchmark catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Build benchmark matrix
        id: catalog
        run: |
          set -euo pipefail
          test "$(jq 'length' benchmark/benchmark-modules.json)" -eq 4
          jq -e 'all(.[]; (.id | type == "string") and (.project | type == "string") and (.report_root | type == "string"))' benchmark/benchmark-modules.json >/dev/null
          echo "matrix=$(jq -c '{include: .}' benchmark/benchmark-modules.json)" >> "$GITHUB_OUTPUT"

  benchmark:
    name: ${{ matrix.id }} (JMH)
    needs: benchmark-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.benchmark-catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run JMH benchmarks
        run: ./gradlew ":${{ matrix.project }}:benchmark" --no-daemon --no-configuration-cache

      - name: Locate JMH JSON results
        run: |
          find "${{ matrix.report_root }}" -name 'main.json' | sort > benchmark-json-files.txt
          if [ ! -s benchmark-json-files.txt ]; then
            echo "ERROR: JMH JSON results not found" >&2
            exit 1
          fi
          cat benchmark-json-files.txt

      - name: Render SVG charts
        run: |
          while IFS= read -r json_path; do
            result_name="$(basename "$(dirname "$json_path")")"
            safe_name="$(printf '%s' "$result_name" | tr -c 'A-Za-z0-9._-' '-')"
            BENCHMARK_CHART_PREFIX="${{ matrix.id }}-${safe_name}-" python3 benchmark/scripts/render_benchmark_svg.py "$json_path"
          done < benchmark-json-files.txt

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}-results
          path: |
            benchmark/${{ matrix.project }}/build/reports/benchmarks/**/main.json
            docs/benchmark-results/*.svg
            docs/benchmark-results/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## ${{ matrix.id }} results"
            echo ""
            echo "### JMH JSON results"
            while IFS= read -r json_path; do
              echo "- \`$json_path\`"
            done < benchmark-json-files.txt
            echo ""
            echo "### Rendered SVG charts"
            for svg in docs/benchmark-results/*.svg; do
              [ -e "$svg" ] || continue
              echo "- \`$svg\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

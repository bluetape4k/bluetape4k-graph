name: Benchmarks

# Manually-triggered JMH benchmark workflow for graph-benchmark.
# Runs the TinkerGraph baseline benchmarks (BatchInsert / ShortestPath / Neighbors / Algorithm / Traversal / VertexOperations)
# and uploads JMH JSON + rendered SVG charts as build artifacts.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  graph-benchmark:
    name: graph-benchmark (TinkerGraph baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-read-only: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run JMH benchmarks
        run: ./gradlew :graph-benchmark:benchmark

      - name: Locate JMH JSON results
        run: |
          find benchmark/graph-benchmark/build/reports/benchmarks -name 'main.json' | sort > benchmark-json-files.txt
          if [ ! -s benchmark-json-files.txt ]; then
            echo "ERROR: JMH JSON results not found" >&2
            exit 1
          fi
          cat benchmark-json-files.txt

      - name: Render SVG charts
        run: |
          while IFS= read -r json_path; do
            result_name="$(basename "$(dirname "$json_path")")"
            safe_name="$(printf '%s' "$result_name" | tr -c 'A-Za-z0-9._-' '-')"
            BENCHMARK_CHART_PREFIX="${safe_name}-" python3 benchmark/scripts/render_benchmark_svg.py "$json_path"
          done < benchmark-json-files.txt

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: graph-benchmark-results
          path: |
            benchmark/graph-benchmark/build/reports/benchmarks/**/main.json
            docs/benchmark-results/*.svg
            docs/benchmark-results/*.png
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## graph-benchmark results"
            echo ""
            echo "### JMH JSON results"
            while IFS= read -r json_path; do
              echo "- \`$json_path\`"
            done < benchmark-json-files.txt
            echo ""
            echo "### Rendered SVG charts"
            for svg in docs/benchmark-results/*.svg; do
              [ -e "$svg" ] || continue
              echo "- \`$svg\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

jakarta-json-api = { module = "jakarta.json:jakarta.json-api", version = "2.1.3" }  # https://mvnrepository.com/artifact/jakarta.json/jakarta.json-api
jakarta-json-impl = { module = "org.glassfish:jakarta.json", version = "2.0.1" }  # https://mvnrepository.com/artifact/org.glassfish/jakarta.json

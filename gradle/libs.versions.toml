log4j-over-slf4j = { module = "org.slf4j:log4j-over-slf4j" }

# Logback
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }

findbugs = { module = "com.google.code.findbugs:jsr305", version = "3.0.2" }  # https://mvnrepository.com/artifact/com.google.code.findbugs/jsr305

kryo5 = { module = "com.esotericsoftware:kryo", version = "5.6.2" }  # https://mvnrepository.com/artifact/com.esotericsoftware/kryo

# Spring Boot
spring-boot4-dependencies = { module = "org.springframework.boot:spring-boot-dependencies" }

# OpenFeign
feign-bom = { module = "io.github.openfeign:feign-bom", version.ref = "feign" }

# OkHttp3
okhttp3-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp3" }

# Okio
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }

# Jackson 2
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom" }

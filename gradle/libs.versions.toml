# @formatter:off
# Gradle Version Catalog — migrated from buildSrc/src/main/kotlin/Libs.kt

[versions]
bluetape4k = "2.0.0-SNAPSHOT"  # https://mvnrepository.com/artifact/io.github.bluetape4k/bluetape4k-bom

# Versions that also exist in bt4k remain only for local plugin/library aliases
# that the central catalog does not expose in the shape this repository needs.
kotlinx-benchmark = "0.4.17"  # https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlinx-benchmark-runtime

# Local Spring Boot plugin and dependency aliases mirror bt4k catalog versions.

neo4j-bolt-connection = "11.0.2"  # https://mvnrepository.com/artifact/org.neo4j.bolt/neo4j-bolt-connection-bom

# Local Exposed aliases keep modules that are not exposed by the bt4k catalog.

# Local Okio/Jackson aliases keep graph-io-specific companion modules.





caffeine = "3.2.4"  # https://mvnrepository.com/artifact/com.github.ben-manes.caffeine/caffeine

junit-jupiter = "6.0.3"  # https://mvnrepository.com/artifact/org.junit/junit-bom
junit-platform = "6.0.3"  # https://mvnrepository.com/artifact/org.junit.platform/junit-platform-commons
# Local Testcontainers aliases keep module-level test fixtures not exposed by the bt4k catalog.


# Plugin versions
# Local Kover/Shadow/Gatling plugin aliases are not exposed by the bt4k catalog.

[plugins]


[libraries]

# bluetape4k

# kotlin
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test-api = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }

# kotlinx-coroutines
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom" }
kotlinx-coroutines-core-lib = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
kotlinx-coroutines-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm" }
kotlinx-coroutines-debug = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-debug" }
kotlinx-coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor" }
kotlinx-coroutines-slf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j" }
kotlinx-coroutines-test-lib = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
kotlinx-coroutines-test-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test-jvm" }


# Jakarta

# Apache Commons

# SLF4J
jcl-over-slf4j = { module = "org.slf4j:jcl-over-slf4j" }
jul-to-slf4j = { module = "org.slf4j:jul-to-slf4j" }
log4j-over-slf4j = { module = "org.slf4j:log4j-over-slf4j" }

# Logback



# Spring Boot
spring-boot4-dependencies = { module = "org.springframework.boot:spring-boot-dependencies" }

# OpenFeign

# OkHttp3

# Okio

# Jackson 2
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }  # version from bt4k catalog
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
jackson-module-blackbird = { module = "com.fasterxml.jackson.module:jackson-module-blackbird" }

# Jackson 3
jackson3-bom = { module = "tools.jackson:jackson-bom" }
jackson3-core = { module = "tools.jackson.core:jackson-core" }
jackson3-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
jackson3-module-blackbird = { module = "tools.jackson.module:jackson-module-blackbird" }

# JSON assertions

# Compression

# Ktor
ktor-server-core = { module = "io.ktor:ktor-server-core" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-serialization-jackson = { module = "io.ktor:ktor-serialization-jackson" }

# Micrometer

# Micrometer Tracing






# Exposed
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao" }

# Caffeine (caffeine-core avoids prefix/leaf conflict with caffeine-jcache)


# JUnit 5



# Testcontainers (testcontainers-core avoids prefix/leaf conflict)
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-neo4j = { module = "org.testcontainers:testcontainers-neo4j" }
# @formatter:on

# @formatter:off
# Gradle Version Catalog — migrated from buildSrc/src/main/kotlin/Libs.kt

[versions]
bluetape4k = "1.11.1-SNAPSHOT"  # https://mvnrepository.com/artifact/io.github.bluetape4k/bluetape4k-bom

# Versions that also exist in bt4k remain only for local plugin/library aliases
# that the central catalog does not expose in the shape this repository needs.
kotlinx-atomicfu = "0.32.1"  # https://mvnrepository.com/artifact/org.jetbrains.kotlinx/atomicfu
kotlinx-benchmark = "0.4.17"  # https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlinx-benchmark-runtime

# Local Spring Boot plugin and dependency aliases mirror bt4k catalog versions.

kotlinx-coroutines = "1.11.0"  # https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlinx-coroutines-core

neo4j-java-driver = "6.1.0"  # https://mvnrepository.com/artifact/org.neo4j.driver/neo4j-java-driver
neo4j-bolt-connection = "11.0.2"  # https://mvnrepository.com/artifact/org.neo4j.bolt/neo4j-bolt-connection-bom

# Local Exposed aliases keep modules that are not exposed by the bt4k catalog.

# Local Okio/Jackson aliases keep graph-io-specific companion modules.
okio = "3.17.0"  # https://mvnrepository.com/artifact/com.squareup.okio/okio-fakefilesystem
okhttp3 = "5.3.2"  # https://mvnrepository.com/artifact/com.squareup.okhttp3/okhttp-bom


feign = "13.12"  # https://mvnrepository.com/artifact/io.github.openfeign/feign-bom

logback = "1.5.32"  # https://mvnrepository.com/artifact/ch.qos.logback/logback-classic

micrometer = "1.16.5"  # https://mvnrepository.com/artifact/io.micrometer/micrometer-bom
micrometer-tracing = "1.6.5"  # https://mvnrepository.com/artifact/io.micrometer/micrometer-tracing-bom

caffeine = "3.2.4"  # https://mvnrepository.com/artifact/com.github.ben-manes.caffeine/caffeine

junit-jupiter = "6.0.3"  # https://mvnrepository.com/artifact/org.junit/junit-bom
junit-platform = "6.0.3"  # https://mvnrepository.com/artifact/org.junit.platform/junit-platform-commons
mockk = "1.14.9"  # https://mvnrepository.com/artifact/io.mockk/mockk
# Local Testcontainers aliases keep module-level test fixtures not exposed by the bt4k catalog.

datafaker = "2.5.4"  # https://mvnrepository.com/artifact/net.datafaker/datafaker

# Plugin versions
detekt = "2.0.0-alpha.3"  # https://plugins.gradle.org/plugin/dev.detekt
# Local Kover/Shadow/Gatling plugin aliases are not exposed by the bt4k catalog.
test-logger = "4.0.0"  # https://mvnrepository.com/artifact/com.adarshr/gradle-test-logger-plugin

[plugins]
kotlinx-atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "kotlinx-atomicfu" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinx-benchmark" }

detekt = { id = "dev.detekt", version.ref = "detekt" }
test-logger = { id = "com.adarshr.test-logger", version.ref = "test-logger" }

[libraries]
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.1.0" }  # https://mvnrepository.com/artifact/org.jetbrains/annotations

# bluetape4k

# kotlin
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test-api = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }

# kotlinx-coroutines
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom" }
kotlinx-coroutines-core-lib = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm" }
kotlinx-coroutines-debug = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-debug" }
kotlinx-coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor" }
kotlinx-coroutines-slf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j" }
kotlinx-coroutines-test-lib = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }

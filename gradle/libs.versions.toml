neo4j-java-driver = { module = "org.neo4j.driver:neo4j-java-driver", version.ref = "neo4j-java-driver" }
neo4j-bolt-connection-bom = { module = "org.neo4j.bolt:neo4j-bolt-connection-bom", version.ref = "neo4j-bolt-connection" }
